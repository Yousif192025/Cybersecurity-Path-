<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل المقررات | CyberPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #020617;
            --sidebar: #0f172a;
            --accent: #38bdf8;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body { 
            margin: 0; 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            overflow: hidden; 
        }

        /* الهيدر */
        .header { 
            height: 70px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 25px; 
            background: var(--sidebar);
            border-bottom: 1px solid #334155; 
        }

        .header h2 { color: var(--accent); font-size: 1.3rem; margin: 0; }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bar-bg { width: 150px; height: 8px; background: #334155; border-radius: 10px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: var(--accent); transition: 0.5s; }

        /* التقسيم الرئيسي */
        .main-layout { display: flex; height: calc(100vh - 70px); }

        /* المشغل */
        .player-area { 
            flex: 3; 
            background: #000; 
            display: flex; 
            flex-direction: column;
            padding: 20px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        /* القائمة الجانبية */
        .sidebar { 
            flex: 1; 
            background: var(--sidebar); 
            border-right: 1px solid #334155; 
            overflow-y: auto; 
            padding: 20px;
        }

        .sidebar h3 { font-size: 1.1rem; margin-bottom: 20px; color: #94a3b8; }

        .video-item { 
            padding: 15px; 
            background: var(--card); 
            margin-bottom: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .video-item:hover { border-color: var(--accent); background: #334155; }
        .video-item.active { background: #075985; border-color: var(--accent); }
        .video-item i { font-size: 0.9rem; color: var(--accent); }

        .btn-complete {
            background: #10b981; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-complete:hover { background: #059669; transform: scale(1.05); }

    </style>
</head>
<body>

<header class="header">
    <h2 id="course-title">جاري تحميل المقرر...</h2>
    
    <div class="progress-container">
        <span>تقدمك: <span id="percent-text">0%</span></span>
        <div class="bar-bg"><div id="bar-fill"></div></div>
        <button class="btn-complete" onclick="completeCourse()">إنهاء المقرر ✅</button>
    </div>
</header>

<div class="main-layout">
    <aside class="sidebar">
        <h3>قائمة الدروس</h3>
        <div id="video-list">جاري جلب القائمة...</div>
    </aside>

    <main class="player-area">
        <div class="video-wrapper">
            <iframe id="main-player" src="" allowfullscreen></iframe>
        </div>
        <div style="margin-top: 20px;">
            <h1 id="current-video-title" style="font-size: 1.4rem;">...</h1>
            <p style="color: #94a3b8;">تذكر تدوين ملاحظاتك أثناء المشاهدة لتعزيز تعلمك.</p>
        </div>
    </main>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let currentUser = null;
    let courseId = new URLSearchParams(window.location.search).get("course_id");

    async function init() {
        // 1. فحص الجلسة
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = "../login.html"; return; }
        currentUser = user;

        if (!courseId) { alert("المقرر غير محدد"); return; }

        // 2. جلب بيانات الكورس والفيديوهات
        const { data: course } = await supabase.from("courses").select("title").eq("course_id", courseId).single();
        if (course) document.getElementById("course-title").innerText = course.title;

        loadVideos();
        updateOverallProgress();
    }

    async function loadVideos() {
        const { data: videos } = await supabase
            .from("course_videos")
            .select("*")
            .eq("course_id", courseId)
            .order('created_at', { ascending: true });

        const container = document.getElementById("video-list");
        if (!videos || videos.length === 0) {
            container.innerHTML = "لا توجد فيديوهات مرفوعة حالياً.";
            return;
        }

        container.innerHTML = "";
        videos.forEach((v, index) => {
            const div = document.createElement("div");
            div.className = "video-item";
            div.id = `v-${v.videos_id}`;
            div.innerHTML = `<i class="fas fa-play-circle"></i> <span>${v.videos_title}</span>`;
            div.onclick = () => playVideo(v.videos_url, v.videos_title, v.videos_id);
            container.appendChild(div);

            // تشغيل الأول تلقائياً
            if(index === 0) playVideo(v.videos_url, v.videos_title, v.videos_id);
        });
    }

    window.playVideo = async function(url, title, videoId) {
        // تحديث المظهر
        document.querySelectorAll('.video-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`v-${videoId}`).classList.add('active');
        document.getElementById("current-video-title").innerText = title;

        // تحويل الرابط
        let finalUrl = url;
        if (url.includes("youtube.com") || url.includes("youtu.be")) {
            let id = url.includes("v=") ? url.split("v=")[1].split("&")[0] : url.split("/").pop();
            finalUrl = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        }
        document.getElementById("main-player").src = finalUrl;

        // تسجيل مشاهدة الدرس في learning_progress
        await supabase.from("learning_progress").upsert({
            user_id: currentUser.id,
            course_id: courseId,
            lesson_id: videoId, // نستخدم معرف الفيديو كمعرف للدرس
            completion_percentage: 100,
            last_accessed: new Date()
        });
        
        updateOverallProgress();
    };

    async function updateOverallProgress() {
        // حساب عدد الدروس الكلي مقابل المكتمل
        const { count: totalVideos } = await supabase.from("course_videos").select('*', { count: 'exact', head: true }).eq("course_id", courseId);
        const { count: completedVideos } = await supabase.from("learning_progress").select('*', { count: 'exact', head: true }).eq("user_id", currentUser.id).eq("course_id", courseId);

        let percent = totalVideos > 0 ? Math.round((completedVideos / totalVideos) * 100) : 0;
        
        document.getElementById("bar-fill").style.width = percent + "%";
        document.getElementById("percent-text").innerText = percent + "%";

        // تحديث جدول التسجيلات تلقائياً
        if (percent > 0) {
            await supabase.from("enrollments")
                .update({ completion_status: percent === 100 ? 'completed' : 'in_progress' })
                .eq("user_id", currentUser.id)
                .eq("course_id", courseId);
        }
    }

    window.completeCourse = async function() {
        if(!confirm("هل أنت متأكد من إنهاء هذا المقرر؟")) return;
        
        const { error } = await supabase.from("enrollments")
            .update({ completion_status: "completed" })
            .eq("user_id", currentUser.id)
            .eq("course_id", courseId);

        if (!error) {
            alert("تهانينا! تم إكمال المقرر بنجاح.");
            window.location.href = "student-dashboard.html";
        }
    };

    init();
</script>
</body>
</html>
