<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Course Player</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}

.container {
  display:flex;
  height:100vh;
}

.sidebar {
  width:300px;
  background:#1e293b;
  padding:20px;
  overflow-y:auto;
}

.lesson {
  padding:10px;
  margin-bottom:10px;
  cursor:pointer;
  background:#334155;
  border-radius:6px;
}

.lesson.active {
  background:#38bdf8;
  color:black;
}

.main {
  flex:1;
  padding:20px;
}

video {
  width:100%;
  border-radius:10px;
}

.controls {
  margin-top:10px;
  display:flex;
  gap:10px;
}

button {
  padding:10px;
  background:#38bdf8;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="container">

  <div class="sidebar" id="lessonsList"></div>

  <div class="main">
    <h2 id="title">Loading...</h2>
    <video id="video" controls></video>

    <div class="controls">
      <button onclick="prevLesson()">⬅ Prev</button>
      <button onclick="nextLesson()">Next ➡</button>
    </div>
  </div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://suvpaunulhqfoclepwoz.supabase.co",
  "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
);

let user, courseId, lessons = [], currentIndex = 0;

// 📌 قراءة course_id
const params = new URLSearchParams(window.location.search);
courseId = params.get("course_id");

// 🚀 INIT
async function init() {
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if (!user) {
    window.location.href = "../login.html";
    return;
  }

  await loadLessons();
  await loadLastProgress();
}

// 📚 تحميل الدروس
async function loadLessons() {
  const { data } = await supabase
    .from("lessons")
    .select("*")
    .eq("course_id", courseId)
    .order("lesson_order", { ascending: true });

  lessons = data;

  const container = document.getElementById("lessonsList");
  container.innerHTML = "";

  lessons.forEach((l, index) => {
    const div = document.createElement("div");
    div.className = "lesson";
    div.innerText = l.title;

    div.onclick = () => playLesson(index);

    container.appendChild(div);
  });
}

// 🔥 تحميل آخر تقدم
async function loadLastProgress() {
  const { data } = await supabase
    .from("learning_progress")
    .select("*")
    .eq("user_id", user.id)
    .eq("course_id", courseId)
    .order("last_accessed", { ascending: false })
    .limit(1);

  if (data && data.length > 0) {
    const lastLessonId = data[0].lesson_id;
    const index = lessons.findIndex(l => l.lesson_id === lastLessonId);

    if (index !== -1) {
      playLesson(index);
      return;
    }
  }

  playLesson(0);
}

// ▶ تشغيل درس
function playLesson(index) {
  currentIndex = index;

  const lesson = lessons[index];

  document.getElementById("title").innerText = lesson.title;

  // 👇 هنا ضع رابط الفيديو داخل content
  document.getElementById("video").src = lesson.content;

  // تحديث active
  document.querySelectorAll(".lesson").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".lesson")[index].classList.add("active");

  saveProgress(lesson.lesson_id);
}

// 💾 حفظ التقدم
async function saveProgress(lessonId) {
  await supabase.from("learning_progress").upsert({
    user_id: user.id,
    course_id: courseId,
    lesson_id: lessonId,
    last_accessed: new Date()
  });
}

// ⏭ التالي
function nextLesson() {
  if (currentIndex < lessons.length - 1) {
    playLesson(currentIndex + 1);
  }
}

// ⏮ السابق
function prevLesson() {
  if (currentIndex > 0) {
    playLesson(currentIndex - 1);
  }
}

init();
</script>

</body>
</html>
