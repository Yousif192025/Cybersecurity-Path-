<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player | CyberPath</title>
    <style>
        body { margin: 0; font-family: 'Inter', Arial, sans-serif; background: #020617; color: white; overflow: hidden; }
        .container { display: flex; height: calc(100vh - 80px); }
        .player { flex: 3; padding: 20px; background: #000; display: flex; align-items: center; justify-content: center; }
        .sidebar { flex: 1; border-left: 1px solid #334155; padding: 20px; overflow-y: auto; background: #0f172a; }
        .video-item { padding: 15px; margin-bottom: 10px; background: #1e293b; cursor: pointer; border-radius: 8px; transition: 0.2s; border: 1px solid transparent; }
        .video-item:hover { background: #334155; border-color: #38bdf8; }
        .header { height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid #334155; }
        h2 { color: #38bdf8; margin: 0; font-size: 1.5rem; }
        .btn-complete { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-complete:hover { background: #16a34a; }
        iframe { border-radius: 12px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
    </style>
</head>

<body>

<div class="header">
    <h2 id="course-title">Loading Course...</h2>
    <button class="btn-complete" onclick="completeCourse()">Mark as Completed ✅</button>
</div>

<div class="container">
    <div class="player">
        <iframe id="player" width="100%" height="90%" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="sidebar">
        <h3>Lessons List</h3>
        <div id="videos">Loading playlist...</div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    // ============================
    // 1. التحقق من الهوية والصلاحية (Role Check)
    // ============================
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
        console.error("No active session found.");
        window.location.href = "../login.html";
        throw new Error("Unauthorized");
    }

    // جلب البروفايل وفحص الرتبة
    const { data: profile, error: profileError } = await supabase
        .from("user_profile")
        .select("role")
        .eq("user_id", user.id)
        .single();

    // معالجة الرتبة بحساسية أقل (toLowerCase)
    const rawRole = profile?.role || "";
    const userRole = rawRole.toLowerCase().trim();

    console.log("Logged in user role:", userRole);

    if (profileError || !profile || (userRole !== "student" && userRole !== "admin")) {
        alert("Access Denied: Your registered role is [" + (rawRole || "None") + "]. Only Students can access the player.");
        window.location.href = "../login.html";
        throw new Error("Access Denied");
    }

    // ============================
    // 2. قراءة بيانات الكورس من الرابط
    // ============================
    const params = new URLSearchParams(window.location.search);
    const courseId = params.get("course_id");

    if (!courseId) {
        alert("Please select a course first.");
        window.location.href = "../dashboards/student.html";
        throw new Error("Missing course_id");
    }

    // التحقق من التسجيل (إلا إذا كان أدمن)
    const { data: enroll } = await supabase
        .from("enrollments")
        .select("*")
        .eq("user_id", user.id)
        .eq("course_id", courseId)
        .maybeSingle();

    if (!enroll && userRole !== "admin") {
        alert("You must enroll in this course to view the content!");
        window.location.href = "../dashboards/student.html";
        throw new Error("User not enrolled");
    }

    // ============================
    // 3. تحميل البيانات وتشغيل المشغل
    // ============================
    async function initPlayer() {
        // جلب تفاصيل الكورس
        const { data: course } = await supabase.from("courses").select("title").eq("course_id", courseId).single();
        if (course) document.getElementById("course-title").innerText = course.title;

        // جلب الفيديوهات
        const { data: videos, error } = await supabase
            .from("course_videos")
            .select("*")
            .eq("course_id", courseId)
            .order('video_id', { ascending: true });

        const videoContainer = document.getElementById("videos");
        
        if (error || !videos || videos.length === 0) {
            videoContainer.innerHTML = "<p style='color:#94a3b8'>No videos uploaded for this course yet.</p>";
            return;
        }

        videoContainer.innerHTML = "";
        videos.forEach((v) => {
            const div = document.createElement('div');
            div.className = 'video-item';
            div.innerHTML = `▶ ${v.video_title}`;
            div.onclick = () => playVideo(v.video_url);
            videoContainer.appendChild(div);
        });

        // تشغيل الفيديو الأول تلقائياً
        playVideo(videos[0].video_url);
    }

    // ============================
    // 4. وظيفة تشغيل الفيديو (YouTube & Others)
    // ============================
    window.playVideo = function(url) {
        let finalUrl = url;
        // تحويل روابط يوتيوب العادية لروابط Embed لتعمل داخل iframe
        if (url.includes("youtube.com") || url.includes("youtu.be")) {
            let videoId = "";
            if (url.includes("v=")) {
                videoId = url.split("v=")[1].split("&")[0];
            } else {
                videoId = url.split("/").pop();
            }
            finalUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        }
        document.getElementById("player").src = finalUrl;
    };

    // ============================
    // 5. إنهاء الكورس وتحديث النسبة
    // ============================
    window.completeCourse = async function() {
        const { error } = await supabase
            .from("enrollments")
            .update({ 
                completion_status: "completed", 
                completion_percentage: 100 
            })
            .eq("user_id", user.id)
            .eq("course_id", courseId);

        if (!error) {
            alert("🎉 Awesome work! Course marked as completed.");
            window.location.href = "../dashboards/student.html";
        } else {
            alert("Error updating status: " + error.message);
        }
    };

    // تشغيل المحرك
    initPlayer();

</script>
</body>
</html>
