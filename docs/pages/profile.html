<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
  // 🔥 استخدم اسم مختلف لتجنب التعارض
  const sb = window.supabase.createClient(
    "https://suvpaunulhqfoclepwoz.supabase.co",
    "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
  );

  let user = null;

  async function init() {
    const { data } = await sb.auth.getUser();
    user = data.user;

    console.log("USER:", user);

    if (!user) {
      window.location.href = "/docs/login.html";
      return;
    }

    document.getElementById("email").innerText = user.email;

    await loadProfile();
    await loadCourses();
  }

  async function loadProfile() {
    const { data } = await sb
      .from("users_profile")
      .select("*")
      .eq("id", user.id)
      .single();

    console.log("PROFILE:", data);

    if (data) {
      document.getElementById("name").value = data.full_name || "";
    }
  }

  document.getElementById("saveBtn").onclick = async () => {
    const full_name = document.getElementById("name").value;

    await sb
      .from("users_profile")
      .update({ full_name })
      .eq("id", user.id);

    alert("Saved ✅");
  };

  async function loadCourses() {
    const { data: enrollments } = await sb
      .from("enrollments")
      .select("course_id, courses(title)")
      .eq("user_id", user.id);

    const container = document.getElementById("courses");
    container.innerHTML = "";

    if (!enrollments || enrollments.length === 0) {
      container.innerHTML = "<p>No courses yet</p>";
      return;
    }

    for (let e of enrollments) {
      const progress = await getProgress(e.course_id);

      const div = document.createElement("div");
      div.innerHTML = `
        <h4>${e.courses?.title || "Course"}</h4>
        <div style="background:#333;height:10px;">
          <div style="width:${progress}%;background:green;height:10px;"></div>
        </div>
        <p>${progress}%</p>
      `;

      container.appendChild(div);
    }
  }

  async function getProgress(courseId) {
    const { data } = await sb
      .from("video_progress")
      .select("is_completed")
      .eq("user_id", user.id)
      .eq("course_id", courseId);

    if (!data || data.length === 0) return 0;

    const completed = data.filter(v => v.is_completed).length;
    return Math.round((completed / data.length) * 100);
  }

  init();
</script>
