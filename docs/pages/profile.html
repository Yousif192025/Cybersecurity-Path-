<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CyberPath</title>
    <!-- مكتبة Supabase عبر CDN لضمان التوافق -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; }
        body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        h2 { color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        
        /* Profile Header */
        .top { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 2px solid var(--primary); }
        .user-meta p { margin: 5px 0; color: #94a3b8; }
        .role-badge { background: var(--primary); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        /* Inputs */
        label { display: block; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; }
        
        button { width: 100%; margin-top: 20px; padding: 12px; background: var(--primary); border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Courses List */
        .course-item { background: #161e2d; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .course-header { display: flex; justify-content: space-between; align-items: center; }
        .progress-bar { background: #334155; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; transition: 0.5s; }
        .course-link { color: var(--primary); text-decoration: none; font-size: 14px; font-weight: bold; }
        .course-link:hover { text-decoration: underline; }
        
        .back-link { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

<div class="container">
    <a href="../dashboards/student.html" class="back-link">← Back to Dashboard</a>
    <h2>👤 My Profile</h2>

    <!-- معلومات الحساب -->
    <div class="card">
        <div class="top">
            <div class="avatar" id="avatar">👤</div>
            <div class="user-meta">
                <p id="display-email">loading...</p>
                <span id="role-badge" class="role-badge">Student</span>
            </div>
        </div>
        
        <label>Full Name</label>
        <input type="text" id="full_name" placeholder="Enter your full name" />
        
        <button id="saveBtn">Save Profile Changes</button>
    </div>

    <!-- تقدم الكورسات -->
    <div class="card">
        <h3>📚 My Learning Progress</h3>
        <div id="courses-container">Loading your progress...</div>
    </div>
</div>

<script>
    // تهيئة Supabase (تم تعديل الاستدعاء ليتوافق مع V2)
    const { createClient } = supabase;
    const _supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let currentUser = null;

    async function init() {
        const { data: { user }, error } = await _supabase.auth.getUser();

        if (error || !user) {
            window.location.href = "../login.html";
            return;
        }

        currentUser = user;
        document.getElementById("display-email").innerText = user.email;

        await loadProfileData();
        await loadEnrolledCourses();
    }

    // تحميل بيانات البروفايل من جدول user_profile
    async function loadProfileData() {
        const { data, error } = await _supabase
            .from("user_profile")
            .select("*")
            .eq("user_id", currentUser.id)
            .single();

        if (data) {
            document.getElementById("full_name").value = data.first_name || ""; // استخدمنا first_name كما في الجداول السابقة
            document.getElementById("role-badge").innerText = data.role || "Student";
        }
    }

    // حفظ التعديلات
    document.getElementById("saveBtn").onclick = async () => {
        const nameValue = document.getElementById("full_name").value;

        const { error } = await _supabase
            .from("user_profile")
            .update({ first_name: nameValue }) // نحدث الحقل الموجود في قاعدة بياناتك
            .eq("user_id", currentUser.id);

        if (error) {
            alert("Error updating profile: " + error.message);
        } else {
            alert("Profile Updated Successfully! ✅");
        }
    };

    // تحميل الكورسات والتقدم
    async function loadEnrolledCourses() {
        const container = document.getElementById("courses-container");

        const { data: enrollments, error } = await _supabase
            .from("enrollments")
            .select(`
                completion_percentage,
                courses (
                    course_id,
                    title
                )
            `)
            .eq("user_id", currentUser.id);

        if (error || !enrollments || enrollments.length === 0) {
            container.innerHTML = "<p style='color:#94a3b8'>You are not enrolled in any courses yet.</p>";
            return;
        }

        container.innerHTML = "";
        enrollments.forEach(item => {
            const course = item.courses;
            const progress = item.completion_percentage || 0;

            const div = document.createElement("div");
            div.className = "course-item";
            div.innerHTML = `
                <div class="course-header">
                    <strong>${course.title}</strong>
                    <span>${progress}%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%"></div>
                </div>
                <a href="course-player.html?course_id=${course.course_id}" class="course-link">Continue Lessons →</a>
            `;
            container.appendChild(div);
        });
    }

    init();
</script>
</body>
</html>
