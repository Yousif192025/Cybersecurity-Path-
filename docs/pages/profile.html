<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }

    .progress-bar {
      background: #334155;
      height: 10px;
      border-radius: 5px;
      margin-top: 5px;
    }

    .progress {
      background: #22c55e;
      height: 100%;
      border-radius: 5px;
    }

    .course {
      margin-bottom: 15px;
    }

    .top {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

  </style>
</head>

<body>
  <div class="container">

    <h2>👤 My Profile</h2>

    <!-- Profile Info -->
    <div class="card">
      <div class="top">
        <div class="avatar" id="avatar">👤</div>
        <div>
          <p id="email"></p>
        </div>
      </div>

      <input type="text" id="name" placeholder="Full Name" />

      <button id="saveBtn">Save Changes</button>
    </div>

    <!-- Courses Progress -->
    <div class="card">
      <h3>📚 My Courses</h3>
      <div id="courses"></div>
    </div>

  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://suvpaunulhqfoclepwoz.supabase.co",
      "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let user;

    async function init() {
      const res = await supabase.auth.getUser();
      user = res.data.user;

      if (!user) {
        window.location.href = "/docs/login.html";
        return;
      }

      document.getElementById("email").innerText = user.email;

      loadProfile();
      loadCourses();
    }

    async function loadProfile() {
      const { data } = await supabase
        .from("users_profile")
        .select("*")
        .eq("id", user.id)
        .single();

      if (data) {
        document.getElementById("name").value = data.full_name || "";
      }
    }

    document.getElementById("saveBtn").onclick = async () => {
      const full_name = document.getElementById("name").value;

      await supabase
        .from("users_profile")
        .update({ full_name })
        .eq("id", user.id);

      alert("Saved ✅");
    };

    async function loadCourses() {
      const { data: enrollments } = await supabase
        .from("enrollments")
        .select("course_id, courses(title)")
        .eq("user_id", user.id);

      const container = document.getElementById("courses");
      container.innerHTML = "";

      for (let e of enrollments) {
        const progress = await getProgress(e.course_id);

        const div = document.createElement("div");
        div.className = "course";

        div.innerHTML = `
          <h4>${e.courses.title}</h4>

          <div class="progress-bar">
            <div class="progress" style="width:${progress}%"></div>
          </div>

          <p>${progress}%</p>

          <a href="/docs/pages/course-player.html?course_id=${e.course_id}">
            Continue Learning →
          </a>
        `;

        container.appendChild(div);
      }
    }

    async function getProgress(courseId) {
      const { data } = await supabase
        .from("video_progress")
        .select("is_completed")
        .eq("user_id", user.id)
        .eq("course_id", courseId);

      if (!data || data.length === 0) return 0;

      const completed = data.filter(v => v.is_completed).length;

      return Math.round((completed / data.length) * 100);
    }

    init();
  </script>
</body>
</html>
