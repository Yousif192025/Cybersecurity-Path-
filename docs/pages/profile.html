<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }

    .progress-bar {
      background: #334155;
      height: 10px;
      border-radius: 5px;
      margin-top: 5px;
    }

    .progress {
      background: #22c55e;
      height: 100%;
      border-radius: 5px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    #error {
      color: red;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>👤 My Profile</h2>

    <div id="error"></div>

    <!-- Profile -->
    <div class="card">
      <div style="display:flex;gap:20px;align-items:center;">
        <div class="avatar">👤</div>
        <div><p id="email"></p></div>
      </div>

      <input type="text" id="name" placeholder="Full Name" />
      <button id="saveBtn">Save Changes</button>
    </div>

    <!-- Courses -->
    <div class="card">
      <h3>📚 My Courses</h3>
      <div id="courses"></div>
    </div>

  </div>

  <script>
    // 🔥 لا تستخدم اسم supabase لتجنب التعارض
    const client = window.supabase.createClient(
      "https://suvpaunulhqfoclepwoz.supabase.co",
      "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let user = null;

    function showError(msg) {
      document.getElementById("error").innerText = msg;
      console.error(msg);
    }

    async function init() {
      try {
        const { data, error } = await client.auth.getUser();

        if (error) throw error;

        user = data.user;

        if (!user) {
          showError("❌ User not logged in");
          return;
        }

        document.getElementById("email").innerText = user.email;

        await loadProfile();
        await loadCourses();

      } catch (err) {
        showError("INIT ERROR: " + err.message);
      }
    }

    async function loadProfile() {
      try {
        const { data, error } = await client
          .from("users_profile")
          .select("*")
          .eq("id", user.id)
          .single();

        if (error) throw error;

        if (data) {
          document.getElementById("name").value = data.full_name || "";
        }

      } catch (err) {
        showError("PROFILE ERROR: " + err.message);
      }
    }

    document.getElementById("saveBtn").onclick = async () => {
      try {
        const full_name = document.getElementById("name").value;

        const { error } = await client
          .from("users_profile")
          .update({ full_name })
          .eq("id", user.id);

        if (error) throw error;

        alert("Saved ✅");

      } catch (err) {
        showError("SAVE ERROR: " + err.message);
      }
    };

    async function loadCourses() {
      try {
        const { data: enrollments, error } = await client
          .from("enrollments")
          .select("course_id, courses(title)")
          .eq("user_id", user.id);

        if (error) throw error;

        const container = document.getElementById("courses");
        container.innerHTML = "";

        if (!enrollments || enrollments.length === 0) {
          container.innerHTML = "<p>No courses yet</p>";
          return;
        }

        for (let e of enrollments) {
          const progress = await getProgress(e.course_id);

          const div = document.createElement("div");
          div.innerHTML = `
            <h4>${e.courses?.title || "Course"}</h4>
            <div class="progress-bar">
              <div class="progress" style="width:${progress}%"></div>
            </div>
            <p>${progress}%</p>
          `;

          container.appendChild(div);
        }

      } catch (err) {
        showError("COURSES ERROR: " + err.message);
      }
    }

    async function getProgress(courseId) {
      const { data } = await client
        .from("video_progress")
        .select("is_completed")
        .eq("user_id", user.id)
        .eq("course_id", courseId);

      if (!data || data.length === 0) return 0;

      const completed = data.filter(v => v.is_completed).length;
      return Math.round((completed / data.length) * 100);
    }

    init();
  </script>
</body>
</html>
