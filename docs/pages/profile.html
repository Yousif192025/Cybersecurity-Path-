<script>
  // ✅ منع تكرار تعريف supabase
  let supabaseClient;

  if (!window.supabaseClient) {
    supabaseClient = window.supabase.createClient(
      "https://suvpaunulhqfoclepwoz.supabase.co",
      "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    window.supabaseClient = supabaseClient;
  } else {
    supabaseClient = window.supabaseClient;
  }

  const supabase = supabaseClient;

  let user;

  async function init() {
    const res = await supabase.auth.getUser();
    user = res.data.user;

    console.log("USER:", user);

    if (!user) {
      window.location.href = "/docs/login.html";
      return;
    }

    document.getElementById("email").innerText = user.email;

    await loadProfile();
    await loadCourses();
  }

  async function loadProfile() {
    const { data, error } = await supabase
      .from("users_profile")
      .select("*")
      .eq("id", user.id)
      .single();

    console.log("PROFILE:", data, error);

    if (data) {
      document.getElementById("name").value = data.full_name || "";
    }
  }

  document.getElementById("saveBtn").onclick = async () => {
    const full_name = document.getElementById("name").value;

    const { error } = await supabase
      .from("users_profile")
      .update({ full_name })
      .eq("id", user.id);

    if (!error) {
      alert("Saved ✅");
    }
  };

  async function loadCourses() {
    const { data: enrollments, error } = await supabase
      .from("enrollments")
      .select("course_id, courses(title)")
      .eq("user_id", user.id);

    console.log("COURSES:", enrollments, error);

    const container = document.getElementById("courses");
    container.innerHTML = "";

    if (!enrollments || enrollments.length === 0) {
      container.innerHTML = "<p>No courses yet</p>";
      return;
    }

    for (let e of enrollments) {
      const progress = await getProgress(e.course_id);

      const div = document.createElement("div");
      div.className = "course";

      div.innerHTML = `
        <h4>${e.courses?.title || "Course"}</h4>

        <div class="progress-bar">
          <div class="progress" style="width:${progress}%"></div>
        </div>

        <p>${progress}%</p>

        <a href="/docs/pages/course-player.html?course_id=${e.course_id}">
          Continue Learning →
        </a>
      `;

      container.appendChild(div);
    }
  }

  async function getProgress(courseId) {
    const { data } = await supabase
      .from("video_progress")
      .select("is_completed")
      .eq("user_id", user.id)
      .eq("course_id", courseId);

    if (!data || data.length === 0) return 0;

    const completed = data.filter(v => v.is_completed).length;

    return Math.round((completed / data.length) * 100);
  }

  init();
</script>
