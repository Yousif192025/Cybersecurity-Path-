<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CyberPath</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 25px; }
        
        .top { display: flex; gap: 20px; align-items: center; margin-bottom: 25px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: #334155; border: 3px solid var(--primary); object-fit: cover; }
        
        label { display: block; margin-top: 15px; font-size: 13px; color: #94a3b8; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .role-badge { background: var(--primary); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        button { width: 100%; margin-top: 25px; padding: 14px; background: var(--primary); border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .course-item { background: #161e2d; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
        .progress-bar { background: #334155; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; transition: 0.5s; }
        .back-link { color: #94a3b8; text-decoration: none; font-size: 14px; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <a href="../dashboards/student.html" class="back-link">← Back to Dashboard</a>
    
    <div class="card">
        <div class="top">
            <img id="profile_img" src="https://via.placeholder.com/90" class="avatar" alt="Profile Picture">
            <div>
                <h2 id="display_role" style="margin:0; color:var(--primary); font-size: 1.2rem;">Loading...</h2>
                <p id="display_email" style="color:#94a3b8; margin:5px 0;"></p>
                <span id="role_label" class="role-badge">Student</span>
            </div>
        </div>

        <div class="row">
            <div>
                <label>Phone Number</label>
                <input type="text" id="phone_number" placeholder="+249...">
            </div>
            <div>
                <label>Address</label>
                <input type="text" id="address" placeholder="City, Country">
            </div>
        </div>

        <label>Bio (About Me)</label>
        <textarea id="bio" placeholder="Tell us about yourself..."></textarea>

        <label>Profile Picture URL</label>
        <input type="url" id="profile_picture_url" placeholder="https://image-link.com/photo.jpg">

        <button id="saveBtn">Update Profile</button>
    </div>

    <div class="card">
        <h3>📚 My Courses</h3>
        <div id="courses-container">Loading progress...</div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let user = null;

    async function init() {
        const { data: { user: activeUser } } = await supabase.auth.getUser();
        if (!activeUser) { window.location.href = "../login.html"; return; }
        user = activeUser;
        document.getElementById("display_email").innerText = user.email;

        await loadProfile();
        await loadCourses();
    }

    async function loadProfile() {
        const { data, error } = await supabase
            .from("user_profile")
            .select("phone_number, address, bio, profile_picture_url, role")
            .eq("user_id", user.id)
            .single();

        if (data) {
            document.getElementById("phone_number").value = data.phone_number || "";
            document.getElementById("address").value = data.address || "";
            document.getElementById("bio").value = data.bio || "";
            document.getElementById("profile_picture_url").value = data.profile_picture_url || "";
            document.getElementById("role_label").innerText = data.role || "User";
            document.getElementById("display_role").innerText = (data.role || "User").toUpperCase();
            
            if (data.profile_picture_url) {
                document.getElementById("profile_img").src = data.profile_picture_url;
            }
        }
    }

    document.getElementById("saveBtn").onclick = async () => {
        const updates = {
            phone_number: document.getElementById("phone_number").value,
            address: document.getElementById("address").value,
            bio: document.getElementById("bio").value,
            profile_picture_url: document.getElementById("profile_picture_url").value,
            updated_at: new Date()
        };

        const { error } = await supabase
            .from("user_profile")
            .update(updates)
            .eq("user_id", user.id);

        if (error) {
            alert("Update Error: " + error.message);
        } else {
            alert("Profile saved! ✅");
            if (updates.profile_picture_url) document.getElementById("profile_img").src = updates.profile_picture_url;
        }
    };

    async function loadCourses() {
        const container = document.getElementById("courses-container");
        const { data: enrollments } = await supabase
            .from("enrollments")
            .select(`completion_percentage, courses(title, course_id)`)
            .eq("user_id", user.id);

        if (!enrollments || enrollments.length === 0) {
            container.innerHTML = "<p>Not enrolled in any courses.</p>";
            return;
        }

        container.innerHTML = enrollments.map(e => `
            <div class="course-item">
                <div style="display:flex; justify-content:space-between">
                    <strong>${e.courses.title}</strong>
                    <span>${e.completion_percentage || 0}%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${e.completion_percentage || 0}%"></div>
                </div>
                <a href="course-player.html?course_id=${e.courses.course_id}" style="color:var(--primary); font-size:12px; text-decoration:none;">Resume Learning →</a>
            </div>
        `).join('');
    }

    init();
</script>
</body>
</html>
