<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة CyberPath | التحكم الأكاديمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af; --success: #059669; --warning: #d97706;
            --danger: #94a3b8; --bg: #f8fafc; --border: #cbd5e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        .card { background: white; padding: 25px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; }

        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: #475569; }
        select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; background-color: #fff; }

        .batch-panel { margin-top: 25px; padding: 20px; background: #eff6ff; border-radius: 12px; border: 1px dashed var(--primary); display: flex; align-items: flex-end; gap: 15px; }
        
        .table-container { background: white; border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f8fafc; padding: 15px; font-size: 0.9rem; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-update { background: var(--primary); color: white; width: 100%; justify-content: center; }
        .btn-s { padding: 6px 12px; font-size: 0.8rem; color: white; margin-left: 5px; }
        .bg-success { background: var(--success); }
        .bg-warning { background: var(--warning); }
        .bg-danger { background: var(--danger); }
        
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i class="fas fa-user-shield"></i> لوحة التحكم في مسارات المتدربين</h2>
        
        <div class="filter-grid">
            <div>
                <label>المسار التخصصي:</label>
                <select id="select-track">
                    <option value="all">-- عرض جميع المسارات --</option>
                    <option value="الأمن">دبلوم الأمن السيبراني</option>
                    <option value="حاسب">دبلوم علوم الحاسب التطبيقي</option>
                </select>
            </div>
            <div>
                <label>المجموعة:</label>
                <select id="select-group">
                    <option value="">-- اختر المجموعة --</option>
                    <script>for(let i=1; i<=10; i++) document.write(`<option value="Group -${i}">Group -${i}</option>`);</script>
                </select>
            </div>
            <div>
                <label>المقرر التدريبي:</label>
                <select id="select-course-db"><option value="">جاري تحميل المقررات...</option></select>
            </div>
        </div>

        <div class="batch-panel">
            <div style="flex: 1;">
                <label>تحديث جماعي للمجموعة المختارة:</label>
                <select id="batch-status">
                    <option value="completed">مكتمل ✅</option>
                    <option value="in_progress">قيد الدراسة 🔄</option>
                    <option value="not_started">لم يبدأ بعد ⚪</option>
                </select>
            </div>
            <div style="flex: 1;">
                <button class="btn btn-update" onclick="applyBatchUpdate()">
                    <i class="fas fa-sync-alt"></i> تنفيذ التحديث الجماعي
                </button>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم المتدرب</th>
                    <th>المسار المسجل</th>
                    <th>تحديث الحالة الفردية (للمقرر المختار)</th>
                </tr>
            </thead>
            <tbody id="students-list">
                <tr><td colspan="3" style="text-align: center; padding: 40px; color: #64748b;">يرجى اختيار مجموعة لتحميل المتدربين</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let currentStudents = [];

    // 1. جلب المقررات مع تصفية حسب المسار
    async function fetchCourses() {
        const trackKeyword = document.getElementById('select-track').value;
        let query = supabase.from('courses').select('course_id, title');
        
        if(trackKeyword !== 'all') {
            query = query.ilike('title', `%${trackKeyword}%`);
        }
        
        const { data, error } = await query.order('title');
        if (data) {
            const select = document.getElementById('select-course-db');
            select.innerHTML = data.map(c => `<option value="${c.course_id}">${c.title}</option>`).join('');
        }
    }

    // 2. جلب المتدربين مع تصفية المسار والمجموعة
    async function fetchStudents() {
        const group = document.getElementById('select-group').value;
        const trackKeyword = document.getElementById('select-track').value;
        
        if(!group) return;

        const { data, error } = await supabase.from('user_profile').select('*').eq('group_name', group);
        
        if (data) {
            // تصفية المتدربين برمجياً بناءً على المسار
            currentStudents = (trackKeyword === 'all') 
                ? data 
                : data.filter(s => s.track && s.track.includes(trackKeyword));
            
            const body = document.getElementById('students-list');
            if(currentStudents.length === 0) {
                body.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">لا يوجد متدربين في هذا المسار لهذه المجموعة</td></tr>';
                return;
            }

            body.innerHTML = currentStudents.map(s => `
                <tr>
                    <td><b>${s.full_name}</b></td>
                    <td><span style="font-size:0.8rem; color:#64748b;">${s.track || 'غير محدد'}</span></td>
                    <td>
                        <button class="btn btn-s bg-success" onclick="updateStatus('${s.user_id}', 'completed')">مكتمل</button>
                        <button class="btn btn-s bg-warning" onclick="updateStatus('${s.user_id}', 'in_progress')">دراسة</button>
                        <button class="btn btn-s bg-danger" onclick="updateStatus('${s.user_id}', 'not_started')">لم يبدأ</button>
                    </td>
                </tr>
            `).join('');
        }
    }

    // 3. دالة التحديث (UPSERT)
    window.updateStatus = async function(userId, status) {
        const courseId = document.getElementById('select-course-db').value;
        if (!courseId) return alert("❌ الرجاء اختيار المقرر أولاً");

        const percentage = status === 'completed' ? 100 : (status === 'in_progress' ? 50 : 0);

        const { error } = await supabase.from('enrollments').upsert({
            user_id: userId,
            course_id: courseId,
            completion_status: status,
            completion_percentage: percentage
        }, { onConflict: 'user_id,course_id' });

        if (!error) {
            alert("✅ تم التحديث بنجاح");
        } else {
            console.error(error);
            alert("❌ خطأ: " + error.message);
        }
    }

    // 4. التحديث الجماعي
    window.applyBatchUpdate = async function() {
        const courseId = document.getElementById('select-course-db').value;
        const status = document.getElementById('batch-status').value;

        if (!courseId) return alert("❌ يرجى اختيار المقرر");
        if (currentStudents.length === 0) return alert("❌ القائمة فارغة");

        const percentage = status === 'completed' ? 100 : (status === 'in_progress' ? 50 : 0);

        const updates = currentStudents.map(s => ({
            user_id: s.user_id,
            course_id: courseId,
            completion_status: status,
            completion_percentage: percentage
        }));

        if (!confirm(`هل أنت متأكد من تحديث ${currentStudents.length} متدرب دفعة واحدة؟`)) return;

        const { error } = await supabase.from('enrollments').upsert(updates, { onConflict: 'user_id,course_id' });
        
        if (!error) {
            alert("✅ تم تحديث المجموعة بالكامل بنجاح!");
        } else {
            alert("❌ فشل التحديث الجماعي: " + error.message);
        }
    }

    // ربط الفلاتر بالأحداث
    document.getElementById('select-track').addEventListener('change', () => {
        fetchCourses();
        fetchStudents();
    });
    
    document.getElementById('select-group').addEventListener('change', fetchStudents);
    
    // التشغيل الأولي عند فتح الصفحة
    fetchCourses();
</script>
</body>
</html>
