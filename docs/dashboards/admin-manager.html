<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة CyberPath | التحكم الأكاديمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f4f7f9; direction: rtl; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .grid-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #334155; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-family: inherit; }
        .batch-action { background: #eff6ff; border: 1px solid #2563eb; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        th { background: #f8fafc; color: #64748b; }
        .btn { padding: 9px 15px; border-radius: 6px; border: none; cursor: pointer; color: white; font-weight: bold; margin: 2px; font-size: 0.85rem; }
        .btn-success { background: #10b981; } .btn-warning { background: #f59e0b; } .btn-danger { background: #94a3b8; }
        .btn-primary { background: #2563eb; padding: 12px 25px; width: 100%; margin-top: 10px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #1e3a8a; border-bottom: 2px solid #2563eb; padding-bottom: 10px; margin-bottom: 20px;">⚙️ لوحة التحكم في المتدربين والمقررات</h2>

    <div class="grid-filters">
        <div>
            <label>1. المسار (للفلترة والبحث):</label>
            <select id="path-name">
                <option value="الأمن">دبلوم الأمن السيبراني</option>
                <option value="حاسب">دبلوم علوم الحاسب التطبيقي</option>
                <option value="الحرة">الدورات الحرة والتخصصية</option>
            </select>
        </div>
        <div>
            <label>2. المجموعة:</label>
            <select id="group-name" onchange="loadData()">
                <option value="">-- اختر المجموعة --</option>
                <script>for(let i=1; i<=10; i++) document.write(`<option value="Group -${i}">Group -${i}</option>`);</script>
            </select>
        </div>
        <div>
            <label>3. المقرر التدريبي:</label>
            <select id="course-list"><option value="">جاري جلب المقررات...</option></select>
        </div>
    </div>

    <div class="batch-action">
        <strong>تحديث جماعي للمجموعة الظاهرة:</strong>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <select id="batch-status" style="flex: 2;">
                <option value="completed">مكتمل ✅</option>
                <option value="in_progress">قيد الدراسة 🔄</option>
                <option value="not_started">لم يبدأ بعد ⚪</option>
            </select>
            <button class="btn btn-primary" style="flex: 1; margin:0;" onclick="batchUpdate()">تحديث الكل</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>اسم المتدرب</th>
                <th>المسار</th>
                <th>تعديل الحالة الفردية</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="3" style="text-align: center; padding: 30px;">يرجى اختيار المجموعة</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    const supabase = createClient("https://suvpaunulhqfoclepwoz.supabase.co", "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b");

    let currentStudents = [];

    // 1. جلب المقررات (بالبحث عن النص لضمان الظهور)
    async function fetchCourses() {
        const pName = document.getElementById('path-name').value;
        const { data } = await supabase.from('courses').select('course_id, title').ilike('title', `%${pName}%`);
        const select = document.getElementById('course-list');
        if (data && data.length > 0) {
            select.innerHTML = data.map(c => `<option value="${c.course_id}">${c.title}</option>`).join('');
        } else {
            // إذا لم يجد بفلترة المسار، اجلب كل المقررات لكي لا يتعطل العمل
            const { data: all } = await supabase.from('courses').select('course_id, title').limit(20);
            select.innerHTML = all.map(c => `<option value="${c.course_id}">${c.title}</option>`).join('');
        }
    }

    // 2. جلب الطلاب وعرضهم
    window.loadData = async function() {
        const group = document.getElementById('group-name').value;
        const track = document.getElementById('path-name').value;
        if (!group) return;

        const { data } = await supabase.from('user_profile').select('*').eq('group_name', group);
        
        if (data) {
            // فلترة المتدربين برمجياً لضمان عدم اختفائهم إذا كان هناك اختلاف بسيط في المسميات
            currentStudents = data.filter(s => s.track && s.track.includes(track));
            const tbody = document.getElementById('table-body');
            
            if (currentStudents.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">لم يتم العثور على متدربين لهذا المسار في هذه المجموعة</td></tr>';
            } else {
                tbody.innerHTML = currentStudents.map(s => `
                    <tr>
                        <td><b>${s.full_name}</b></td>
                        <td>${s.track}</td>
                        <td>
                            <button class="btn btn-success" onclick="update('${s.user_id}', 'completed')">مكتمل</button>
                            <button class="btn btn-warning" onclick="update('${s.user_id}', 'in_progress')">دراسة</button>
                            <button class="btn btn-danger" onclick="update('${s.user_id}', 'not_started')">لم يبدأ</button>
                        </td>
                    </tr>
                `).join('');
            }
        }
    }

    // 3. التحديث الفردي والجماعي
    window.update = async function(uid, status) {
        const cid = document.getElementById('course-list').value;
        if (!cid) return alert("اختر المقرر");
        const perc = status === 'completed' ? 100 : (status === 'in_progress' ? 50 : 0);

        const { error } = await supabase.from('enrollments').upsert({
            user_id: uid, course_id: cid, completion_status: status, completion_percentage: perc
        }, { onConflict: 'user_id,course_id' });

        if (!error) alert("✅ تم");
        else alert("خطأ: " + error.message);
    }

    window.batchUpdate = async function() {
        const cid = document.getElementById('course-list').value;
        const status = document.getElementById('batch-status').value;
        if (!cid || currentStudents.length === 0) return alert("البيانات غير مكتملة");

        const perc = status === 'completed' ? 100 : (status === 'in_progress' ? 50 : 0);
        const updates = currentStudents.map(s => ({
            user_id: s.user_id, course_id: cid, completion_status: status, completion_percentage: perc
        }));

        const { error } = await supabase.from('enrollments').upsert(updates, { onConflict: 'user_id,course_id' });
        if (!error) alert("✅ تم تحديث المجموعة");
    }

    document.getElementById('path-name').addEventListener('change', () => { fetchCourses(); loadData(); });
    fetchCourses();
</script>
</body>
</html>
