<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة CyberPath الأكاديمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e40af; --success: #059669; --warning: #d97706; --danger: #dc2626; --bg: #f1f5f9; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); padding: 20px; direction: rtl; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th { background: #f8fafc; padding: 15px; border-bottom: 2px solid #e2e8f0; text-align: right; }
        td { padding: 15px; border-bottom: 1px solid #e2e8f0; }
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; color: white; font-weight: bold; font-size: 0.8rem; }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); }
        .btn-danger { background: #94a3b8; } /* رمادي للحالة التي لم تبدأ */
        .btn-batch { background: var(--primary); width: 100%; padding: 12px; font-size: 1rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2><i class="fas fa-university"></i> فصل المسارات والتحكم الأكاديمي</h2>
    <div class="filter-grid">
        <div>
            <label>1. اختر المسار التخصصي:</label>
            <select id="select-track">
                <option value="all">-- كل المسارات --</option>
                <option value="الأمن">دبلوم الأمن السيبراني</option>
                <option value="حاسب">دبلوم علوم الحاسب التطبيقي</option>
            </select>
        </div>
        <div>
            <label>2. اختر المجموعة:</label>
            <select id="select-group">
                <script>for(let i=1; i<=10; i++) document.write(`<option value="Group -${i}">Group -${i}</option>`);</script>
            </select>
        </div>
        <div>
            <label>3. اختر المقرر:</label>
            <select id="select-course-db"><option value="">جاري جلب المقررات...</option></select>
        </div>
    </div>

    <div style="margin-top: 20px; padding: 15px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px;">
        <strong>تحديث جماعي للمجموعة:</strong>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <select id="batch-status" style="flex: 1;">
                <option value="completed">مكتمل ✅</option>
                <option value="in_progress">قيد الدراسة 🔄</option>
                <option value="not_started">لم يبدأ بعد ⚪</option>
            </select>
            <button class="btn btn-batch" onclick="applyBatchUpdate()">تحديث كل طلاب المجموعة</button>
        </div>
    </div>
</div>

<div class="card" style="padding:0; overflow: hidden;">
    <table>
        <thead>
            <tr>
                <th>اسم المتدرب</th>
                <th>المسار</th>
                <th>تحديث فردي للمقرر المختار</th>
            </tr>
        </thead>
        <tbody id="students-list"></tbody>
    </table>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    // استخدام مفتاح الخدمة (Service Role) إذا كان متاحاً لديك سيحل مشكلة RLS تماماً، 
    // ولكن هنا سنستخدم المفتاح العام ونحاول معالجة البيانات بما يتوافق مع السياسات.
    const supabase = createClient("https://suvpaunulhqfoclepwoz.supabase.co", "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b");

    let currentStudents = [];

    // جلب المقررات وفلترتها حسب المسار المختار
    async function fetchCourses() {
        const track = document.getElementById('select-track').value;
        let query = supabase.from('courses').select('course_id, title');
        
        if(track !== 'all') query = query.ilike('title', `%${track}%`);
        
        const { data } = await query.order('title');
        if (data) {
            document.getElementById('select-course-db').innerHTML = data.map(c => 
                `<option value="${c.course_id}">${c.title}</option>`).join('');
        }
    }

    // جلب الطلاب مع فلترة المسار
    async function fetchStudents() {
        const group = document.getElementById('select-group').value;
        const track = document.getElementById('select-track').value;

        const { data } = await supabase.from('user_profile').select('*').eq('group_name', group);
        
        if (data) {
            currentStudents = (track === 'all') ? data : data.filter(s => s.track && s.track.includes(track));
            
            document.getElementById('students-list').innerHTML = currentStudents.map(s => `
                <tr>
                    <td><b>${s.full_name}</b></td>
                    <td>${s.track || '---'}</td>
                    <td>
                        <button class="btn btn-success" onclick="updateStatus('${s.user_id}', 'completed')">مكتمل</button>
                        <button class="btn btn-warning" onclick="updateStatus('${s.user_id}', 'in_progress')">دراسة</button>
                        <button class="btn btn-danger" onclick="updateStatus('${s.user_id}', 'not_started')">لم يبدأ</button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center">لا يوجد طلاب مطابقين</td></tr>';
        }
    }

    window.updateStatus = async function(userId, status) {
        const courseId = document.getElementById('select-course-db').value;
        if (!courseId) return alert("اختر المقرر أولاً");

        // الحل لمشكلة RLS: التأكد من إرسال الحقول الأساسية وتجنب إرسال قيم فارغة
        const { error } = await supabase.from('enrollments').upsert({
            user_id: userId,
            course_id: courseId,
            completion_status: status,
            completion_percentage: status === 'completed' ? 100 : (status === 'in_progress' ? 50 : 0),
            last_accessed: new Date().toISOString()
        }, { onConflict: 'user_id,course_id' });

        if (!error) alert("✅ تم التحديث");
        else {
            console.error(error);
            alert("❌ خطأ صلاحيات: تأكد من تفعيل صلاحية Insert/Update لجدول enrollments في Supabase Dashboard");
        }
    }

    window.applyBatchUpdate = async function() {
        const courseId = document.getElementById('select-course-db').value;
        const status = document.getElementById('batch-status').value;

        if (!courseId || currentStudents.length === 0) return alert("بيانات ناقصة");

        const updates = currentStudents.map(s => ({
            user_id: s.user_id,
            course_id: courseId,
            completion_status: status,
            completion_percentage: status === 'completed' ? 100 : (status === 'in_progress' ? 50 : 0),
            last_accessed: new Date().toISOString()
        }));

        const { error } = await supabase.from('enrollments').upsert(updates, { onConflict: 'user_id,course_id' });
        
        if (!error) alert("✅ تم تحديث المجموعة");
        else alert("❌ خطأ في التحديث الجماعي: " + error.message);
    }

    document.getElementById('select-track').addEventListener('change', () => { fetchCourses(); fetchStudents(); });
    document.getElementById('select-group').addEventListener('change', fetchStudents);
    
    fetchCourses();
    fetchStudents();
</script>
</body>
</html>
