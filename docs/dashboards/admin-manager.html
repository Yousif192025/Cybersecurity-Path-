<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة CyberPath | التحكم الأكاديمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e40af; --success: #059669; --bg: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 20px; direction: rtl; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        th { background: #f1f5f9; padding: 12px; text-align: right; border-bottom: 2px solid #cbd5e1; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .btn { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; color: white; }
        .btn-group { background: var(--primary); }
        .btn-indiv { background: var(--success); font-size: 0.8rem; margin-left: 5px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>

<div class="card">
    <h2><i class="fas fa-users-cog"></i> الإدارة الأكاديمية للمجموعات</h2>
    <div class="grid">
        <div>
            <label>المسار التدريبي</label>
            <select id="select-track">
                <option value="الأمن">دبلوم الأمن السيبراني</option>
                <option value="حاسب">دبلوم علوم الحاسب التطبيقي</option>
            </select>
        </div>
        <div>
            <label>المجموعة</label>
            <select id="select-group">
                <script>for(let i=1; i<=10; i++) document.write(`<option value="Group -${i}">Group -${i}</option>`);</script>
            </select>
        </div>
        <div>
            <label>المقرر المستهدف</label>
            <select id="select-course-db"><option>جاري تحميل المقررات...</option></select>
        </div>
    </div>

    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
        <strong>تحديث جماعي للمجموعة:</strong>
        <select id="batch-status" style="width: 150px; display: inline-block;">
            <option value="completed">مكتمل ✅</option>
            <option value="in_progress">قيد الدراسة 🔄</option>
        </select>
        <button class="btn btn-group" onclick="applyBatchUpdate()">تحديث المجموعة كاملة</button>
    </div>
</div>

<div class="card" style="padding:0">
    <table>
        <thead>
            <tr>
                <th>اسم المتدرب</th>
                <th>المجموعة</th>
                <th>تحديث الحالة (للمقرر المختار أعلاه)</th>
            </tr>
        </thead>
        <tbody id="students-list"></tbody>
    </table>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient("https://suvpaunulhqfoclepwoz.supabase.co", "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b");

    let currentStudents = [];

    // 1. جلب المقررات مباشرة من قاعدة البيانات بناءً على التخصص المختار
    async function loadCoursesFromDB() {
        const trackKeyword = document.getElementById('select-track').value;
        const { data, error } = await supabase
            .from('courses')
            .select('course_id, title')
            .ilike('title', `%${trackKeyword}%`);

        const select = document.getElementById('select-course-db');
        if (data) {
            select.innerHTML = data.map(c => `<option value="${c.course_id}">${c.title}</option>`).join('');
        }
    }

    // 2. جلب الطلاب بناءً على المجموعة والتخصص
    async function loadStudents() {
        const group = document.getElementById('select-group').value;
        const trackKeyword = document.getElementById('select-track').value;

        const { data } = await supabase.from('user_profile').select('*').eq('group_name', group);
        
        if (data) {
            currentStudents = data.filter(s => s.track && s.track.includes(trackKeyword));
            const body = document.getElementById('students-list');
            body.innerHTML = currentStudents.map(s => `
                <tr>
                    <td><b>${s.full_name}</b></td>
                    <td>${s.group_name}</td>
                    <td>
                        <button class="btn btn-indiv" onclick="window.updateStatus('${s.user_id}', 'completed')">اجتياز ✅</button>
                        <button class="btn btn-indiv" style="background:#d97706" onclick="window.updateStatus('${s.user_id}', 'in_progress')">دراسة 🔄</button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center">لا يوجد طلاب</td></tr>';
        }
    }

    // 3. دالة التحديث (فردي وجماعي تستخدم نفس المنطق)
    window.updateStatus = async function(userId, status) {
        const courseId = document.getElementById('select-course-db').value;
        if (!courseId || courseId === "undefined") return alert("يرجى اختيار مقرر أولاً");

        const { error } = await supabase.from('enrollments').upsert({
            user_id: userId,
            course_id: courseId,
            completion_status: status,
            completion_percentage: status === 'completed' ? 100 : 50,
            updated_at: new Date()
        }, { onConflict: 'user_id,course_id' });

        if (!error) alert("تم التحديث بنجاح");
        else alert("خطأ: " + error.message);
    }

    window.applyBatchUpdate = async function() {
        const courseId = document.getElementById('select-course-db').value;
        const status = document.getElementById('batch-status').value;

        if (currentStudents.length === 0) return alert("لا يوجد طلاب لتحديثهم");
        if (!confirm("هل أنت متأكد من تحديث المجموعة كاملة؟")) return;

        const updates = currentStudents.map(s => ({
            user_id: s.user_id,
            course_id: courseId,
            completion_status: status,
            completion_percentage: status === 'completed' ? 100 : 50
        }));

        const { error } = await supabase.from('enrollments').upsert(updates, { onConflict: 'user_id,course_id' });
        if (!error) alert("تم تحديث المجموعة بنجاح!");
        else alert("خطأ: " + error.message);
    }

    // أحداث التغيير
    document.getElementById('select-track').addEventListener('change', () => { loadCoursesFromDB(); loadStudents(); });
    document.getElementById('select-group').addEventListener('change', loadStudents);

    // تشغيل أولي
    loadCoursesFromDB();
    loadStudents();
</script>
</body>
</html>
