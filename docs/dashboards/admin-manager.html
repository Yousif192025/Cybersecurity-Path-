<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة CyberPath | التحكم المركزي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af; --secondary: #0f172a; --accent: #3b82f6;
            --success: #059669; --warning: #d97706; --danger: #dc2626;
            --bg: #f8fafc; --border: #cbd5e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 20px; color: var(--secondary); }
        .admin-container { max-width: 1400px; margin: 0 auto; }
        .main-header {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white; padding: 25px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .control-panel { background: white; padding: 25px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 25px; }
        .control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .control-item label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; }
        .control-item select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
        .batch-actions { margin-top: 20px; padding: 20px; background: #f0f7ff; border-radius: 12px; display: flex; align-items: center; gap: 15px; border: 1px dashed var(--accent); }
        .table-section { background: white; border-radius: 15px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f8fafc; padding: 15px; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .btn-success { background: var(--success); color: white; padding: 10px 25px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; width: 100%; }
    </style>
</head>
<body>

<div class="admin-container">
    <header class="main-header">
        <div>
            <h1><i class="fas fa-tasks"></i> إدارة شؤون المتدربين</h1>
            <p id="stats-summary">يرجى اختيار المجموعة لبدء الإدارة</p>
        </div>
        <div id="current-time"></div>
    </header>

    <div class="control-panel">
        <div class="control-grid">
            <div class="control-item">
                <label>نوع الدبلوم (المسار)</label>
                <select id="select-track">
                    <option value="دبلوم الأمن السيبراني">دبلوم الأمن السيبراني</option>
                    <option value="دبلوم علوم الحاسب التطبيقي">دبلوم علوم الحاسب التطبيقي</option>
                </select>
            </div>
            <div class="control-item">
                <label>المجموعة</label>
                <select id="select-group">
                    <option value="all">جميع المجموعات</option>
                    <script>
                        for(let i=1; i<=10; i++) document.write(`<option value="Group -${i}">Group -${i}</option>`);
                    </script>
                </select>
            </div>
            <div class="control-item">
                <label>الفصل التدريبي</label>
                <select id="select-semester">
                    <option value="1">الفصل الأول</option>
                    <option value="2">الفصل الثاني</option>
                    <option value="3">الفصل الثالث</option>
                    <option value="4">الفصل الرابع</option>
                    <option value="5">الفصل الخامس</option>
                </select>
            </div>
            <div class="control-item">
                <label>المقرر</label>
                <select id="select-course"></select>
            </div>
        </div>

        <div class="batch-actions">
            <div style="flex-grow: 1;">
                <select id="target-status" style="padding: 8px; width: 200px; border-radius: 8px;">
                    <option value="in_progress">قيد الدراسة (🔄)</option>
                    <option value="completed">مكتمل (✅)</option>
                    <option value="not_started">لم يبدأ بعد (⚪)</option>
                </select>
            </div>
            <button class="btn-success" onclick="updateBatchStatus()">تحديث حالة المقرر للطلاب المختارين</button>
        </div>
    </div>

    <div class="table-section">
        <table>
            <thead>
                <tr>
                    <th>اسم المتدرب</th>
                    <th>الهوية/الهاتف</th>
                    <th>المسار المسجل</th>
                    <th>المجموعة</th>
                </tr>
            </thead>
            <tbody id="students-table-body">
                <tr><td colspan="4" style="text-align: center;">جاري جلب البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    const curriculum = {
        "دبلوم علوم الحاسب التطبيقي": {
            1: ["التوجيه المهني والتميز", "مقدمة تطبيقات الحاسب", "تجميع الحاسب وتشغيله", "الرياضيات", "برمجة الحاسب", "لغة إنجليزية (1)"],
            2: ["لغة إنجليزية (2)", "نظم تشغيل", "تطبيقات الحاسب المتقدمة", "شبكات الحاسب", "الكتابة الفنية", "الفيزياء"],
            3: ["لغة إنجليزية (3)", "تحليل وتصميم النظم", "مبادئ قواعد البيانات", "أساسيات تقنية المعلومات", "مهارات التعلم", "تقنيات الإنترنت المتقدمة"],
            4: ["أمن الشبكات", "أخلاقيات نظم وتقنية المعلومات", "مهارات الدعم الفني", "تطوير وإدارة المواقع", "الذكاء الاصطناعي", "مشروع"],
            5: ["التدريب التعاوني -1", "التدريب التعاوني -2"]
        },
        "دبلوم الأمن السيبراني": {
            1: ["التوجيه المهني والتميز", "مقدمة تطبيقات الحاسب", "مبادئ شبكات الحاسب", "الرياضيات", "أساسيات الأمن السيبراني", "لغة إنجليزية - 1"],
            2: ["لغة إنجليزية - 2", "نظم تشغيل", "تطبيقات الحاسب المتقدمة", "برمجة الحاسب", "إدارة أمن المعلومات", "لغة إنجليزية - 3"],
            3: ["أمن أنظمة التشغيل", "السلوك الوظيفي ومهارات الاتصال", "تطوير البرمجيات الآمنة", "مهارات التعلم", "أمن الشبكات والاتصالات", "اختبار الاختراق", "الدراسات الإسلامية"],
            4: ["التشفير التطبيقي", "إنترنت الأشياء الآمنة", "إدارة المخاطر", "الجرائم الإلكترونية", "الحوسبة السحابية", "مشروع التخرج"],
            5: ["التدريب التعاوني", "التدريب التعاوني -2"]
        }
    };

    let currentStudents = [];

    async function loadStudents() {
        const group = document.getElementById('select-group').value;
        const trackName = document.getElementById('select-track').value;
        
        let query = supabase.from('user_profile').select('*');
        if(group !== 'all') query = query.eq('group_name', group);

        const { data, error } = await query;
        if (data) {
            // فلترة ذكية: إذا كان المسار في قاعدة البيانات يحتوي على كلمات مفتاحية
            currentStudents = data.filter(s => {
                if(!s.track) return false;
                if(trackName.includes("الأمن") && (s.track.includes("الأمن") || s.track.includes("Cyber"))) return true;
                if(trackName.includes("علوم الحاسب") && (s.track.includes("علوم") || s.track.includes("Computer"))) return true;
                return false;
            });
            renderTable();
            document.getElementById('stats-summary').innerText = `المعروض: ${currentStudents.length} طالب`;
        }
    }

    function renderTable() {
        const body = document.getElementById('students-table-body');
        body.innerHTML = currentStudents.map(s => `
            <tr>
                <td><b>${s.full_name}</b></td>
                <td>${s.phone || s.national_id}</td>
                <td>${s.track}</td>
                <td>${s.group_name}</td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;">لا يوجد طلاب مطابقين لهذه الفلاتر</td></tr>';
    }

    function updateCourseList() {
        const track = document.getElementById('select-track').value;
        const sem = document.getElementById('select-semester').value;
        const courses = curriculum[track][sem] || [];
        document.getElementById('select-course').innerHTML = courses.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    window.updateBatchStatus = async function() {
        const courseName = document.getElementById('select-course').value;
        const status = document.getElementById('target-status').value;
        if(currentStudents.length === 0) return alert("لا يوجد طلاب محددين");

        const cleanName = courseName.split('(')[0].trim();
        const { data: course } = await supabase.from('courses').select('course_id').ilike('title', `%${cleanName}%`).limit(1).maybeSingle();

        if(!course) return alert("المقرر غير موجود في جدول courses بنفس الاسم.");

        const { error } = await supabase.from('enrollments')
            .update({ completion_status: status, completion_percentage: status === 'completed' ? 100 : 50 })
            .in('user_id', currentStudents.map(s => s.user_id))
            .eq('course_id', course.course_id);

        if(!error) alert("تم التحديث بنجاح!");
        else alert("خطأ: " + error.message);
    };

    document.getElementById('select-track').addEventListener('change', () => { updateCourseList(); loadStudents(); });
    document.getElementById('select-group').addEventListener('change', loadStudents);
    document.getElementById('select-semester').addEventListener('change', updateCourseList);

    updateCourseList();
    loadStudents();
</script>
</body>
</html>
