<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة CyberPath الأكاديمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f4f7f9; direction: rtl; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid #2563eb; margin-bottom: 20px; padding-bottom: 10px; color: #1e3a8a; }
        .grid-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #334155; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; }
        
        .batch-action { background: #eff6ff; border: 1px solid #2563eb; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .batch-grid { display: flex; gap: 15px; align-items: flex-end; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        th { background: #f8fafc; color: #64748b; font-size: 0.9rem; }
        
        .btn { padding: 9px 15px; border-radius: 6px; border: none; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; margin: 2px; font-size: 0.85rem; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; }
        .btn-danger { background: #94a3b8; }
        .btn-primary { background: #2563eb; padding: 12px 25px; font-size: 1rem; flex: 1; }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>⚙️ نظام التحكم الأكاديمي | CyberPath</h2>
    </div>

    <div class="grid-filters">
        <div>
            <label>1. المسار التعليمي:</label>
            <select id="path-selector">
                <option value="6b6c73af-9699-44e0-a9eb-fb8ad3a4b8a9">دبلوم الأمن السيبراني</option>
                <option value="e405540d-2471-406d-8011-c01bc408b53a">دبلوم علوم الحاسب التطبيقي</option>
                <option value="26ca24f8-8401-4e70-91d9-561174ce5417">الدورات الحرة والتخصصية</option>
            </select>
        </div>
        <div>
            <label>2. المجموعة:</label>
            <select id="group-selector">
                <option value="">-- اختر المجموعة --</option>
                <script>for(let i=1; i<=10; i++) document.write(`<option value="Group -${i}">Group -${i}</option>`);</script>
            </select>
        </div>
        <div>
            <label>3. المقرر التدريبي:</label>
            <select id="course-selector"><option value="">جاري تحميل المقررات...</option></select>
        </div>
    </div>

    <div class="batch-action">
        <label>إجراء جماعي لجميع المتدربين في المسار والمجموعة المختارة:</label>
        <div class="batch-grid">
            <select id="batch-status" style="flex: 2;">
                <option value="completed">تم الاجتياز بنجاح (مكتمل ✅)</option>
                <option value="in_progress">قيد الدراسة حالياً (🔄)</option>
                <option value="not_started">لم يبدأ بعد (⚪)</option>
            </select>
            <button class="btn btn-primary" onclick="handleBatchUpdate()">تحديث المجموعة كاملة</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>اسم المتدرب</th>
                <th>رقم المجموعة</th>
                <th>التحديث الفردي للمقرر المختار</th>
            </tr>
        </thead>
        <tbody id="data-table-body">
            <tr><td colspan="3" style="text-align: center; padding: 40px; color: #94a3b8;">يرجى اختيار المجموعة لإظهار القائمة</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient("https://suvpaunulhqfoclepwoz.supabase.co", "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b");

    let studentsInView = [];

    // جلب المقررات بناءً على المسار المختار
    async function loadCourses() {
        const pathId = document.getElementById('path-selector').value;
        const { data } = await supabase.from('courses').select('course_id, title').eq('path_id', pathId).order('title');
        
        const courseSelect = document.getElementById('course-selector');
        if (data && data.length > 0) {
            courseSelect.innerHTML = data.map(c => `<option value="${c.course_id}">${c.title}</option>`).join('');
        } else {
            courseSelect.innerHTML = '<option value="">لا توجد مقررات لهذا المسار</option>';
        }
    }

    // جلب الطلاب بناءً على المجموعة والمسار (الفصل التام)
    async function loadStudents() {
        const group = document.getElementById('group-selector').value;
        const pathId = document.getElementById('path-selector').value;
        if (!group) return;

        const { data } = await supabase.from('user_profile')
            .select('*')
            .eq('group_name', group)
            .eq('path_id', pathId); // فلترة دقيقة بـ UUID المسار
        
        const tbody = document.getElementById('data-table-body');
        if (data && data.length > 0) {
            studentsInView = data;
            tbody.innerHTML = data.map(s => `
                <tr>
                    <td><b>${s.full_name}</b></td>
                    <td>${s.group_name}</td>
                    <td>
                        <button class="btn btn-success" onclick="updateEntry('${s.user_id}', 'completed')">مكتمل</button>
                        <button class="btn btn-warning" onclick="updateEntry('${s.user_id}', 'in_progress')">دراسة</button>
                        <button class="btn btn-danger" onclick="updateEntry('${s.user_id}', 'not_started')">لم يبدأ</button>
                    </td>
                </tr>
            `).join('');
        } else {
            studentsInView = [];
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 20px;">لا يوجد متدربين مسجلين في هذا المسار لهذه المجموعة</td></tr>';
        }
    }

    // التحديث الفردي (UPSERT)
    window.updateEntry = async function(uid, status) {
        const cid = document.getElementById('course-selector').value;
        if (!cid) return alert("يرجى اختيار مقرر");

        const percentage = (status === 'completed') ? 100 : (status === 'in_progress' ? 50 : 0);

        const { error } = await supabase.from('enrollments').upsert({
            user_id: uid,
            course_id: cid,
            completion_status: status,
            completion_percentage: percentage
        }, { onConflict: 'user_id,course_id' });

        if (!error) alert("✅ تم تحديث الحالة");
        else alert("❌ خطأ: " + error.message);
    }

    // التحديث الجماعي
    window.handleBatchUpdate = async function() {
        const cid = document.getElementById('course-selector').value;
        const status = document.getElementById('batch-status').value;
        
        if (!cid || studentsInView.length === 0) return alert("لا توجد بيانات كافية للتحديث");

        const percentage = (status === 'completed') ? 100 : (status === 'in_progress' ? 50 : 0);
        const updates = studentsInView.map(s => ({
            user_id: s.user_id,
            course_id: cid,
            completion_status: status,
            completion_percentage: percentage
        }));

        if (!confirm(`هل أنت متأكد من تحديث ${studentsInView.length} متدرب دفعة واحدة؟`)) return;

        const { error } = await supabase.from('enrollments').upsert(updates, { onConflict: 'user_id,course_id' });
        if (!error) alert("✅ تم تحديث المسار للمجموعة بنجاح");
        else alert("❌ خطأ في التحديث الجماعي: " + error.message);
    }

    // ربط الأحداث
    document.getElementById('path-selector').addEventListener('change', () => { loadCourses(); loadStudents(); });
    document.getElementById('group-selector').addEventListener('change', loadStudents);

    // التحميل المبدئي للمقررات
    loadCourses();
</script>
</body>
</html>
