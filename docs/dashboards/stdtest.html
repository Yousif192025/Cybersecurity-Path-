<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | CyberPath</title>
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        #profile h2 { margin: 0; color: #38bdf8; }
        .logout-btn { background: #f87171; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .tabs { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 15px; background:#1e293b; border-radius:5px; cursor:pointer; border: 1px solid transparent; transition: 0.3s; }
        .tab.active { background:#38bdf8; color:black; font-weight: bold; }

        .tab-content { margin-top:20px; min-height: 400px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }

        .card { background:#1e293b; padding:20px; border-radius:10px; border:1px solid #334155; position: relative; }
        .card h3 { margin:0 0 10px 0; color: #38bdf8; }
        .card p { font-size:0.9rem; color:#94a3b8; line-height: 1.5; }

        input[type="text"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; margin-top: 10px; box-sizing: border-box; }
        button { width:100%; padding:10px; margin-top:10px; background:#38bdf8; border:none; color:black; font-weight:bold; border-radius:5px; cursor:pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button.secondary { background: #22c55e; color: white; }

        .progress-bar { background:#334155; height:10px; border-radius:5px; margin-top:10px; overflow: hidden; }
        .progress-fill { background:#38bdf8; height:100%; transition: 0.5s; }
        .status { font-size:0.8rem; color:#38bdf8; font-weight:bold; margin-top:5px; }

        /* Quiz Styles */
        .quiz-question { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; }
        .quiz-option { display: block; padding: 10px; background: #0f172a; margin-top: 5px; border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
        .quiz-option:hover { border-color: #38bdf8; }
        input[type="radio"] { margin-right: 10px; }
    </style>
</head>

<body>

<div class="container">
    <div class="header">
        <div id="profile">Loading profile...</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="courses">📚 Available Courses</div>
        <div class="tab" data-tab="progress">📊 My Progress</div>
        <div class="tab" data-tab="assignments">📝 Assignments</div>
        <div class="tab" data-tab="quizzes">❓ Quizzes</div>
        <div class="tab" data-tab="certificates">🏆 Certificates</div>
        <div class="tab" data-tab="notifications">🔔 Alerts</div>
    </div>

    <div class="tab-content" id="tab-content"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
    "https://suvpaunulhqfoclepwoz.supabase.co",
    "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
);

let user = null;

// --- Auth Check ---
const { data: userData } = await supabase.auth.getUser();
if(!userData.user) {
    window.location.href="../login.html";
} else {
    user = userData.user;
}

// --- Load Profile ---
async function loadProfile() {
    const { data: profile } = await supabase
        .from("user_profile")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

    document.getElementById("profile").innerHTML = `
        <h2>Welcome, ${profile?.first_name || user.email.split('@')[0]} 👋</h2>
        <span class="status">Role: Student</span>
    `;
}

// --- Tab Controller ---
async function loadTab(tab) {
    document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
    const activeTab = document.querySelector(`.tab[data-tab="${tab}"]`);
    if(activeTab) activeTab.classList.add('active');

    const container = document.getElementById('tab-content');
    container.innerHTML = '<p style="text-align:center">Loading content...</p>';

    switch(tab) {
        case 'courses': await loadCourses(container); break;
        case 'progress': await loadProgress(container); break;
        case 'assignments': await loadAssignments(container); break;
        case 'quizzes': await loadQuizzes(container); break;
        case 'certificates': container.innerHTML = '<div class="card"><h3>No certificates yet.</h3></div>'; break;
        case 'notifications': container.innerHTML = '<div class="card"><h3>No notifications.</h3></div>'; break;
    }
}

// --- 📚 Courses Section ---
async function loadCourses(container){
    const { data: allCourses } = await supabase.from("courses").select("*");
    const { data: myEnrolls } = await supabase.from("enrollments").select("course_id").eq("user_id", user.id);
    const enrolledIds = myEnrolls?.map(e => e.course_id) || [];

    container.innerHTML = '<div class="grid"></div>';
    const grid = container.querySelector('.grid');

    allCourses.forEach(c => {
        const isEnrolled = enrolledIds.includes(c.course_id);
        const div = document.createElement('div');
        div.className='card';
        div.innerHTML = `
            <h3>${c.title}</h3>
            <p>${c.description || 'No description provided.'}</p>
            ${isEnrolled 
                ? `<button class="secondary" onclick="goToPlayer('${c.course_id}')">▶ Continue Learning</button>` 
                : `<button onclick="enroll('${c.course_id}')">Enroll</button>`}
        `;
        grid.appendChild(div);
    });
}

// --- 📊 Progress Section ---
async function loadProgress(container){
    const { data: enrollments } = await supabase.from("enrollments").select(`courses(title, course_id)`).eq("user_id", user.id);
    if(!enrollments?.length) {
        container.innerHTML = '<div class="card"><h3>You are not enrolled in any courses.</h3></div>';
        return;
    }

    container.innerHTML = '<div class="grid"></div>';
    const grid = container.querySelector('.grid');

    for (let e of enrollments) {
        const progress = await getCourseProgress(e.courses.course_id);
        const div = document.createElement('div');
        div.className='card';
        div.innerHTML = `
            <h3>${e.courses.title}</h3>
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="status">Progress: ${progress}%</div>
            <button onclick="goToPlayer('${e.courses.course_id}')">▶ Resume Lessons</button>
        `;
        grid.appendChild(div);
    }
}

async function getCourseProgress(courseId) {
    const { count: totalLessons } = await supabase.from("lessons").select("*", { count: "exact", head: true }).eq("course_id", courseId);
    const { data: progressRows } = await supabase.from("learning_progress").select("lesson_id").eq("user_id", user.id).eq("course_id", courseId);
    const completed = progressRows?.length || 0;
    return totalLessons ? Math.round((completed / totalLessons) * 100) : 0;
}

// --- 📝 Assignments Section ---
async function loadAssignments(container) {
    const { data: assignments } = await supabase.from("assignments").select("*, courses(title)");
    const { data: submissions } = await supabase.from("assignment_submissions").select("*").eq("user_id", user.id);

    container.innerHTML = '<div class="grid"></div>';
    const grid = container.querySelector('.grid');

    assignments?.forEach(a => {
        const submitted = submissions?.find(s => s.assignment_id === a.assignment_id);
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <span class="status">${a.courses?.title || 'Course'}</span>
            <h3>${a.title}</h3>
            <p>${a.description || ''}</p>
            <p style="font-size:0.8rem; color:#f87171">Due: ${a.due_date ? new Date(a.due_date).toLocaleDateString() : 'No deadline'}</p>
            ${submitted 
                ? `<div class="status" style="color:#22c55e">Submitted ✅ (Grade: ${submitted.grade || 'Pending'})</div>` 
                : `<input type="text" placeholder="Paste link (Google Drive/Github)" id="file-${a.assignment_id}">
                   <button onclick="submitAssignment('${a.assignment_id}')">Submit Work</button>`}
        `;
        grid.appendChild(div);
    });
}

window.submitAssignment = async function(assignmentId) {
    const fileUrl = document.getElementById(`file-${assignmentId}`).value;
    if (!fileUrl) return alert("Please enter a URL for your submission.");

    const { error } = await supabase.from("assignment_submissions").insert({
        assignment_id: assignmentId,
        user_id: user.id,
        file_url: fileUrl
    });

    if (error) alert(error.message);
    else { alert("Assignment Submitted! ✅"); loadTab('assignments'); }
}

// --- ❓ Quizzes Section ---
async function loadQuizzes(container) {
    const { data: quizzes } = await supabase.from("quizzes").select("*, courses(title)");
    const { data: submissions } = await supabase.from("quiz_submissions").select("*").eq("user_id", user.id);

    container.innerHTML = '<div class="grid"></div>';
    const grid = container.querySelector('.grid');

    quizzes?.forEach(q => {
        const submitted = submissions?.find(s => s.quiz_id === q.quiz_id);
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <span class="status">${q.courses?.title || 'Course'}</span>
            <h3>${q.title}</h3>
            <p>${q.description || ''}</p>
            ${submitted 
                ? `<div class="status" style="color:#22c55e">Final Score: ${submitted.score}</div>` 
                : `<button onclick="startQuiz('${q.quiz_id}')">Start Quiz Now</button>`}
        `;
        grid.appendChild(div);
    });
}

window.startQuiz = async function(quizId) {
    const container = document.getElementById("tab-content");
    container.innerHTML = '<p>Loading quiz questions...</p>';

    const { data: questions } = await supabase.from("quiz_questions").select("*").eq("quiz_id", quizId);
    
    container.innerHTML = `<h2 style="color:#38bdf8">Quiz Attempt</h2>`;

    for (let q of questions) {
        const { data: answers } = await supabase.from("quiz_answers").select("*").eq("question_id", q.question_id);
        const div = document.createElement("div");
        div.className = "quiz-question";
        div.innerHTML = `
            <p><strong>${q.question_text}</strong></p>
            ${answers.map(a => `
                <label class="quiz-option">
                    <input type="radio" name="${q.question_id}" value="${a.answer_id}">
                    ${a.answer_text}
                </label>
            `).join("")}
        `;
        container.appendChild(div);
    }

    const submitBtn = document.createElement("button");
    submitBtn.innerText = "Finish & Submit Quiz";
    submitBtn.onclick = () => submitQuiz(quizId, questions);
    container.appendChild(submitBtn);
}

async function submitQuiz(quizId, questions) {
    let score = 0;
    // التحقق من صحة الإجابات عبر مقارنة معرف الإجابة في جدول quiz_answers
    for (let q of questions) {
        const selected = document.querySelector(`input[name="${q.question_id}"]:checked`);
        if (!selected) continue;

        const { data } = await supabase.from("quiz_answers").select("is_correct").eq("answer_id", selected.value).single();
        if (data?.is_correct) score++;
    }

    await supabase.from("quiz_submissions").insert({ quiz_id: quizId, user_id: user.id, score: score });
    alert("Quiz Completed! Your Score: " + score);
    loadTab('quizzes');
}

// --- Shared Functions ---
window.enroll = async function(courseId){
    await supabase.from("enrollments").insert({ user_id: user.id, course_id: courseId, completion_status: 'in_progress' });
    alert("Enrolled Successfully! ✅");
    loadTab('progress');
}

window.goToPlayer = (courseId) => window.location.href = `../pages/course-player.html?course_id=${courseId}`;

window.logout = async () => {
    await supabase.auth.signOut();
    window.location.href = "../login.html";
}

// --- Event Listeners ---
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => loadTab(tab.dataset.tab));
});

// --- Initialization ---
await loadProfile();
await loadTab('courses');

</script>
</body>
</html>
