<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPath | Advanced Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* (احتفظت بنفس التنسيقات السابقة مع إضافة لمسات بسيطة) */
        :root {
            --bg-dark: #0f172a; --card-dark: #1e293b;
            --primary: #3b82f6; --accent: #8b5cf6;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #334155; --success: #10b981; --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-dark); color: var(--text-main); }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--card-dark); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; color: var(--text-muted); margin-bottom: 5px; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .main-content { flex: 1; padding: 30px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--card-dark); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        
        /* Search & Actions */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; }
        
        /* Table Styles */
        .data-table-container { background: var(--card-dark); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #1e293b; padding: 15px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; }
        .badge-admin { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-instructor { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-student { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><i class="fas fa-shield-halved"></i> CyberPath</div>
        <ul class="nav-menu" id="dynamic-menu"></ul>
        <div class="nav-item" onclick="handleLogout()" style="margin-top: auto; color: var(--danger);">
            <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h2 id="role-title">جاري التحميل...</h2>
                <p id="user-welcome" style="color: var(--text-muted); font-size: 0.9rem;"></p>
            </div>
            <div id="user-info" style="display: flex; align-items: center; gap: 15px;">
                <span id="user-name"></span>
                <div style="width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-user-shield"></i>
                </div>
            </div>
        </header>

        <!-- خاص بالأدمن: البحث بالهوية الوطنية -->
        <section id="admin-actions" class="hidden">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="البحث بالرقم الوطني أو الاسم...">
                <button onclick="fetchAdminData()" style="padding: 10px 25px; border-radius: 8px; background: var(--primary); border: none; color: white; cursor: pointer;">بحث</button>
            </div>
        </section>

        <div class="data-table-container">
            <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
                <h3 id="table-title">قائمة المستخدمين</h3>
            </div>
            <table>
                <thead><tr id="table-head"></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <!-- سجل العمليات للأدمن فقط -->
        <div id="logs-container" class="data-table-container hidden" style="margin-top: 40px;">
            <div style="padding: 20px; border-bottom: 1px solid var(--border);">
                <h3><i class="fas fa-history"></i> آخر العمليات الإدارية</h3>
            </div>
            <table id="logs-table">
                <thead><tr><th>المشرف</th><th>العملية</th><th>التفاصيل</th><th>التاريخ</th></tr></thead>
                <tbody id="logs-body"></tbody>
            </table>
        </div>
    </main>
</div>

<script type="module">
    // تهيئة سوبابيز (استبدل YOUR_KEY بمفتاحك الحقيقي)
    const supabaseClient = supabase.createClient("https://suvpaunulhqfoclepwoz.supabase.co", "YOUR_KEY");

    async function checkAuth() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = '/login'; return; }

        const { data: profile } = await supabaseClient
            .from('user_profile')
            .select('*')
            .eq('user_id', user.id)
            .single();

        if (profile) initDashboard(profile);
    }

    function initDashboard(profile) {
        document.getElementById('user-name').innerText = profile.full_name;
        document.getElementById('user-welcome').innerText = `مرحباً، ${profile.full_name} (${profile.national_id})`;
        
        const menu = document.getElementById('dynamic-menu');
        
        if (profile.role === 'admin') {
            document.getElementById('role-title').innerText = "لوحة تحكم الإدارة";
            document.getElementById('admin-actions').classList.remove('hidden');
            document.getElementById('logs-container').classList.remove('hidden');
            menu.innerHTML = `
                <li class="nav-item active"><i class="fas fa-users-cog"></i> الإدارة العامة</li>
                <li class="nav-item"><i class="fas fa-database"></i> السجلات</li>
            `;
            fetchAdminData();
            fetchAdminLogs();
        } else {
            document.getElementById('role-title').innerText = "لوحة الطالب";
            renderStudentView();
        }
    }

    // جلب بيانات المستخدمين مع دعم البحث
    window.fetchAdminData = async () => {
        const search = document.getElementById('search-input').value;
        let query = supabaseClient.from('user_profile').select('*');
        
        if (search) {
            query = query.or(`national_id.ilike.%${search}%,full_name.ilike.%${search}%`);
        }

        const { data: users } = await query.limit(10);
        const head = document.getElementById('table-head');
        const body = document.getElementById('table-body');

        head.innerHTML = `<tr><th>الاسم</th><th>الهوية الوطنية</th><th>الدور</th><th>الإجراء</th></tr>`;
        body.innerHTML = users.map(u => `
            <tr>
                <td>${u.full_name}</td>
                <td>${u.national_id}</td>
                <td><span class="badge badge-${u.role}">${u.role}</span></td>
                <td>
                    <select onchange="changeUserRole('${u.user_id}', this.value)" style="background:#0f172a; color:white; border:1px solid var(--border); padding:5px; border-radius:5px;">
                        <option value="">تغيير الدور...</option>
                        <option value="admin">Admin</option>
                        <option value="instructor">Instructor</option>
                        <option value="student">Student</option>
                    </select>
                </td>
            </tr>
        `).join('');
    };

    // تحديث الدور (سيقوم الـ Trigger بتسجيلها في admin_logs تلقائياً)
    window.changeUserRole = async (userId, newRole) => {
        if (!newRole) return;
        const { error } = await supabaseClient
            .from('user_profile')
            .update({ role: newRole })
            .eq('user_id', userId);

        if (!error) {
            alert("تم تحديث الصلاحيات بنجاح");
            fetchAdminData();
            fetchAdminLogs();
        } else {
            alert("فشل التحديث: " + error.message);
        }
    };

    // جلب سجلات المراقبة
    async function fetchAdminLogs() {
        const { data: logs } = await supabaseClient
            .from('admin_logs')
            .select('*')
            .order('action_date', { ascending: false })
            .limit(5);

        const body = document.getElementById('logs-body');
        body.innerHTML = logs.map(l => `
            <tr style="font-size:0.8rem; color:var(--text-muted);">
                <td>النظام</td>
                <td>${l.action}</td>
                <td>${JSON.stringify(l.details)}</td>
                <td>${new Date(l.action_date).toLocaleString('ar-EG')}</td>
            </tr>
        `).join('');
    }

    window.handleLogout = async () => {
        await supabaseClient.auth.signOut();
        window.location.reload();
    };

    checkAuth();
</script>
</body>
</html>
