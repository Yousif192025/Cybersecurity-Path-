<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CyberPath | نظام التحضير الإلكتروني للمحاضرات - الخطة الدراسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #0f172a;
            --accent: #3b82f6;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --info: #0891b2;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); padding: 12px; min-height: 100vh; }
        .container { max-width: 1600px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 45px; height: 45px;
            background: white; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        .title h1 { font-size: 1.2rem; }
        .title p { font-size: 0.7rem; opacity: 0.9; }

        .nav-cards {
            display: flex;
            gap: 10px;
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .nav-card {
            flex: 1;
            min-width: 120px;
            text-align: center;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-card.active { background: var(--primary); color: white; }
        .nav-card i { font-size: 1.2rem; display: block; margin-bottom: 5px; }

        /* فلتر متقدم مع المجموعة */
        .filter-bar {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        .filter-group {
            flex: 1;
            min-width: 150px;
        }
        .filter-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #475569;
        }
        .filter-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            background: white;
        }
        .btn-filter {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-reset {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 5px;
            background: white;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .tab.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }
        .stat-icon {
            width: 45px; height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .lectures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .lecture-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border: 1px solid var(--border);
        }
        .lecture-card:hover { transform: translateY(-3px); }
        .lecture-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 15px;
        }
        .lecture-header h3 { font-size: 0.9rem; }
        .lecture-header .week { font-size: 0.65rem; opacity: 0.9; }
        .lecture-body { padding: 15px; }
        .lecture-info { margin-bottom: 8px; font-size: 0.8rem; }
        .lecture-info i { width: 22px; color: var(--primary); }
        .prep-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-done { background: #d1fae5; color: #065f46; }
        .status-pending { background: #fed7aa; color: #9a3412; }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.7rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 1px solid var(--border); }

        .prep-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.8rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }

        .attendance-table {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            margin-top: 20px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 10px; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.75rem; }
        th { background: #f1f5f9; font-weight: 700; }
        .attendance-btn {
            padding: 4px 8px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 0.65rem;
            margin: 0 2px;
        }
        .present { background: var(--success); color: white; }
        .absent { background: var(--danger); color: white; }
        .late { background: var(--warning); color: white; }
        .group-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.6rem;
            background: #e2e8f0;
        }

        @media (max-width: 640px) {
            .lectures-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .filter-bar { flex-direction: column; }
            .filter-group { width: 100%; }
            .btn-filter, .btn-reset { width: 100%; }
            .nav-cards { flex-direction: column; }
            .nav-card { min-width: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <div class="logo">
                <img src="./assets/images/logos/cYSGUIDE.png" alt="شعار المنصة" onerror="this.src='https://placehold.co/45x45/1e40af/white?text=CP'">
            </div>
            <div class="title">
                <h1>نظام التحضير الإلكتروني للمحاضرات</h1>
                <p>علوم الحاسب | الأمن السيبراني | 12 أسبوع | حسب المجموعات</p>
            </div>
        </div>
        <div><i class="far fa-calendar-alt"></i> <span id="current-date"></span></div>
    </div>

    <!-- التنقل السريع بين التخصصات -->
    <div class="nav-cards">
        <div class="nav-card" data-track="cs" onclick="switchTrack('cs')">
            <i class="fas fa-laptop-code"></i> علوم الحاسب
        </div>
        <div class="nav-card" data-track="cyber" onclick="switchTrack('cyber')">
            <i class="fas fa-shield-halved"></i> الأمن السيبراني
        </div>
    </div>

    <!-- الفلاتر المتقدمة (مع فلتر المجموعة) -->
    <div class="filter-bar">
        <div class="filter-group">
            <label><i class="fas fa-users"></i> المجموعة</label>
            <select id="filter-group">
                <option value="">جميع المجموعات</option>
            </select>
        </div>
        <div class="filter-group">
            <label><i class="fas fa-layer-group"></i> الفصل التدريبي</label>
            <select id="filter-semester">
                <option value="">جميع الفصول</option>
            </select>
        </div>
        <div class="filter-group">
            <label><i class="fas fa-book"></i> المقرر</label>
            <select id="filter-course">
                <option value="">جميع المقررات</option>
            </select>
        </div>
        <div class="filter-group">
            <label><i class="fas fa-calendar-week"></i> الأسبوع</label>
            <select id="filter-week">
                <option value="">جميع الأسابيع</option>
                <option value="1">الأسبوع 1</option><option value="2">الأسبوع 2</option>
                <option value="3">الأسبوع 3</option><option value="4">الأسبوع 4</option>
                <option value="5">الأسبوع 5</option><option value="6">الأسبوع 6</option>
                <option value="7">الأسبوع 7</option><option value="8">الأسبوع 8</option>
                <option value="9">الأسبوع 9</option><option value="10">الأسبوع 10</option>
                <option value="11">الأسبوع 11</option><option value="12">الأسبوع 12</option>
            </select>
        </div>
        <button class="btn-filter" onclick="applyFilters()"><i class="fas fa-filter"></i> تطبيق</button>
        <button class="btn-reset" onclick="resetFilters()"><i class="fas fa-undo"></i> إعادة ضبط</button>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="dashboard">📊 لوحة التحكم</button>
        <button class="tab" data-tab="lectures">📚 المحاضرات</button>
        <button class="tab" data-tab="prep">✏️ تحضير المحاضرة</button>
        <button class="tab" data-tab="attendance">✅ تسجيل الحضور</button>
        <button class="tab" data-tab="reports">📈 التقارير</button>
    </div>

    <div id="dashboard" class="tab-content active">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon" style="background:#3b82f6;color:white;"><i class="fas fa-chalkboard-user"></i></div><div><h3>إجمالي المحاضرات</h3><h2 id="total-lectures">0</h2></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#10b981;color:white;"><i class="fas fa-check-circle"></i></div><div><h3>تم التحضير</h3><h2 id="prepared-lectures">0</h2></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#f59e0b;color:white;"><i class="fas fa-clock"></i></div><div><h3>قيد التحضير</h3><h2 id="pending-lectures">0</h2></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#8b5cf6;color:white;"><i class="fas fa-users"></i></div><div><h3>المتدربين</h3><h2 id="total-students">0</h2></div></div>
        </div>
        <h4 style="margin: 15px 0 5px;"><i class="fas fa-clock"></i> محاضرات تحتاج تحضير</h4>
        <div class="lectures-grid" id="upcoming-lectures"></div>
    </div>

    <div id="lectures" class="tab-content">
        <div class="lectures-grid" id="all-lectures"></div>
    </div>

    <div id="prep" class="tab-content">
        <div class="prep-form">
            <h3 style="margin-bottom: 15px;"><i class="fas fa-edit"></i> تحضير المحاضرة</h3>
            <div class="form-group">
                <label>اختر المحاضرة</label>
                <select id="lecture-select"></select>
            </div>
            <div class="form-group">
                <label>عنوان المحاضرة</label>
                <input type="text" id="lecture-title" placeholder="عنوان المحاضرة">
            </div>
            <div class="form-group">
                <label>أهداف المحاضرة</label>
                <textarea id="lecture-objectives" placeholder="أهداف التعلم..."></textarea>
            </div>
            <div class="form-group">
                <label>المحتوى الرئيسي</label>
                <textarea id="lecture-content" placeholder="المحاور الرئيسية..."></textarea>
            </div>
            <div class="form-group">
                <label>المراجع والمصادر</label>
                <textarea id="lecture-resources" placeholder="المراجع..."></textarea>
            </div>
            <div class="form-group">
                <label>الأنشطة والتمارين</label>
                <textarea id="lecture-activities" placeholder="الأنشطة..."></textarea>
            </div>
            <button onclick="saveLecturePreparation()" class="btn-sm btn-primary" style="padding: 10px 20px;"><i class="fas fa-save"></i> حفظ التحضير</button>
        </div>
    </div>

    <div id="attendance" class="tab-content">
        <div class="prep-form">
            <div class="form-group">
                <label>اختر المحاضرة</label>
                <select id="attendance-lecture-select"></select>
            </div>
            <button onclick="loadAttendance()" class="btn-sm btn-primary"><i class="fas fa-search"></i> تحميل</button>
        </div>
        <div class="attendance-table" id="attendance-table-container" style="display:none;">
            <table>
                <thead><tr><th>المتدرب</th><th>الهوية</th><th>المجموعة</th><th>المقرر</th><th>الحضور</th></tr></thead>
                <tbody id="attendance-tbody"></tbody>
            </table>
            <div style="padding: 15px; text-align: center;">
                <button onclick="saveAttendance()" class="btn-sm btn-primary"><i class="fas fa-save"></i> حفظ الحضور</button>
            </div>
        </div>
    </div>

    <div id="reports" class="tab-content">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon" style="background:#10b981;"><i class="fas fa-chart-line"></i></div><div><h3>نسبة التحضير</h3><h2 id="prep-percent">0%</h2></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#3b82f6;"><i class="fas fa-calendar-check"></i></div><div><h3>متوسط الحضور</h3><h2 id="total-attendance">0%</h2></div></div>
        </div>
        <button onclick="exportReports()" class="btn-sm btn-primary" style="margin: 10px 0;"><i class="fas fa-download"></i> تصدير التقرير</button>
        <div id="report-details"></div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    // =============== الخطة الدراسية ===============
    const csCourses = {
        1: ["التوجيه المهني والتميز", "مقدمة تطبيقات الحاسب", "تجميع الحاسب وتشغيله", "الرياضيات", "برمجة الحاسب", "لغة إنجليزية 1"],
        2: ["لغة إنجليزية 2", "نظم تشغيل", "تطبيقات الحاسب المتقدمة", "شبكات الحاسب", "الكتابة الفنية", "الفيزياء"],
        3: ["لغة إنجليزية 3", "تحليل وتصميم النظم", "مبادئ قواعد البيانات", "أساسيات تقنية المعلومات", "مهارات التعلم", "السلوك الوظيفي", "تقنيات الإنترنت المتقدمة", "الدراسات الإسلامية"],
        4: ["أمن الشبكات", "أخلاقيات نظم وتقنية المعلومات", "مهارات الدعم الفني", "تطوير وإدارة المواقع", "التأهيل للشهادات الاحترافية", "الذكاء الاصطناعي", "مشروع"],
        5: ["التدريب التعاوني 1", "التدريب التعاوني 2"]
    };

    const cyberCourses = {
        1: ["التوجيه المهني والتميز", "مقدمة تطبيقات الحاسب", "مبادئ شبكات الحاسب", "الرياضيات", "أساسيات الأمن السيبراني", "لغة إنجليزية 1"],
        2: ["لغة إنجليزية 2", "نظم تشغيل", "تطبيقات الحاسب المتقدمة", "برمجة الحاسب", "الكتابة الفنية", "إدارة أمن المعلومات", "لغة إنجليزية 3"],
        3: ["أمن أنظمة التشغيل", "السلوك الوظيفي", "تطوير البرمجيات الآمنة", "مهارات التعلم", "أمن الشبكات والاتصالات", "اختبار الاختراق", "الدراسات الإسلامية"],
        4: ["التشفير التطبيقي", "إنترنت الأشياء الآمنة", "إدارة المخاطر", "الجرائم الإلكترونية", "الحوسبة السحابية", "مشروع التخرج"],
        5: ["التدريب التعاوني 1", "التدريب التعاوني 2"]
    };

    let currentTrack = 'cs';
    let students = [];
    let groups = [];
    let lectures = [];
    let preparations = {};
    let attendanceRecords = {};
    
    // الفلاتر الحالية
    let currentGroup = '';
    let currentSemester = '';
    let currentCourse = '';
    let currentWeek = '';

    // توليد المحاضرات لكل مجموعة على حدة
    function generateLectures() {
        lectures = [];
        let id = 1;
        const coursesData = currentTrack === 'cs' ? csCourses : cyberCourses;
        
        // إذا لم توجد مجموعات، ننشئ مجموعة افتراضية
        const activeGroups = groups.length > 0 ? groups : [{ group_name: "عام", track: currentTrack === 'cs' ? "علوم حاسب" : "أمن سيبراني" }];
        
        for (let groupInfo of activeGroups) {
            const groupName = groupInfo.group_name;
            for (let [semester, courses] of Object.entries(coursesData)) {
                for (let course of courses) {
                    for (let week = 1; week <= 12; week++) {
                        lectures.push({
                            id: id++,
                            track: currentTrack,
                            group: groupName,
                            semester: parseInt(semester),
                            courseName: course,
                            week: week,
                            weekName: `الأسبوع ${week}`,
                            title: `${course} - الأسبوع ${week}`,
                            hours: 2,
                            status: 'pending'
                        });
                    }
                }
            }
        }
        
        // تحميل التحضيرات المحفوظة
        const savedPreps = localStorage.getItem(`preparations_${currentTrack}`);
        if (savedPreps) {
            preparations = JSON.parse(savedPreps);
            lectures.forEach(l => { if (preparations[l.id]) l.status = 'prepared'; });
        } else {
            preparations = {};
        }
        
        const savedAttendance = localStorage.getItem(`attendance_${currentTrack}`);
        if (savedAttendance) attendanceRecords = JSON.parse(savedAttendance);
        else attendanceRecords = {};
    }

    async function loadStudents() {
        try {
            const { data } = await supabase.from('user_profile').select('*').range(0, 999);
            if (data && data.length > 0) {
                students = data;
                // استخراج المجموعات الفريدة مع التخصص
                const groupsMap = new Map();
                students.forEach(s => {
                    const track = s.track || (currentTrack === 'cs' ? "علوم حاسب" : "أمن سيبراني");
                    const group = s.group_name || "عام";
                    const key = `${track}_${group}`;
                    if (!groupsMap.has(key)) {
                        groupsMap.set(key, { group_name: group, track: track });
                    }
                });
                groups = Array.from(groupsMap.values());
            } else {
                // بيانات تجريبية
                groups = [
                    { group_name: "CS-A", track: "علوم حاسب" },
                    { group_name: "CS-B", track: "علوم حاسب" },
                    { group_name: "CY-A", track: "أمن سيبراني" },
                    { group_name: "CY-B", track: "أمن سيبراني" }
                ];
                students = [
                    { full_name: "أحمد محمد", national_id: "1001", track: "علوم حاسب", group_name: "CS-A" },
                    { full_name: "سارة عبدالله", national_id: "1002", track: "علوم حاسب", group_name: "CS-A" },
                    { full_name: "خالد علي", national_id: "1003", track: "علوم حاسب", group_name: "CS-B" },
                    { full_name: "نورة سعد", national_id: "1004", track: "أمن سيبراني", group_name: "CY-A" },
                    { full_name: "عمر إبراهيم", national_id: "1005", track: "أمن سيبراني", group_name: "CY-A" },
                    { full_name: "منى خالد", national_id: "1006", track: "أمن سيبراني", group_name: "CY-B" }
                ];
            }
            
            // تعبئة فلتر المجموعات
            const groupSelect = document.getElementById('filter-group');
            const uniqueGroups = [...new Set(students.map(s => s.group_name || "عام"))];
            groupSelect.innerHTML = '<option value="">جميع المجموعات</option>' + 
                uniqueGroups.map(g => `<option value="${g}">${g}</option>`).join('');
            
            document.getElementById('total-students').innerText = students.length;
            initSystem();
        } catch(e) {
            console.error(e);
            groups = [{ group_name: "عام", track: "علوم حاسب" }];
            students = [
                { full_name: "أحمد محمد", national_id: "1001", track: "علوم حاسب", group_name: "عام" },
                { full_name: "سارة عبدالله", national_id: "1002", track: "علوم حاسب", group_name: "عام" },
            ];
            document.getElementById('total-students').innerText = students.length;
            initSystem();
        }
    }

    function initSystem() {
        generateLectures();
        updateFilters();
        applyFilters();
        populateLectureSelects();
    }

    function updateFilters() {
        const coursesData = currentTrack === 'cs' ? csCourses : cyberCourses;
        const semesterSelect = document.getElementById('filter-semester');
        semesterSelect.innerHTML = '<option value="">جميع الفصول</option>' + 
            Object.keys(coursesData).map(s => `<option value="${s}">الفصل التدريبي ${s}</option>`).join('');
        
        const courseSelect = document.getElementById('filter-course');
        let allCourses = [];
        for (let courses of Object.values(coursesData)) {
            allCourses.push(...courses);
        }
        courseSelect.innerHTML = '<option value="">جميع المقررات</option>' + 
            [...new Set(allCourses)].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function applyFilters() {
        currentGroup = document.getElementById('filter-group').value;
        currentSemester = document.getElementById('filter-semester').value;
        currentCourse = document.getElementById('filter-course').value;
        currentWeek = document.getElementById('filter-week').value;
        
        updateDashboard();
        renderAllLectures();
        populateLectureSelects();
    }

    function resetFilters() {
        document.getElementById('filter-group').value = '';
        document.getElementById('filter-semester').value = '';
        document.getElementById('filter-course').value = '';
        document.getElementById('filter-week').value = '';
        applyFilters();
    }

    function filterLectures(lectureList) {
        return lectureList.filter(l => {
            if (currentGroup && l.group !== currentGroup) return false;
            if (currentSemester && l.semester != currentSemester) return false;
            if (currentCourse && l.courseName !== currentCourse) return false;
            if (currentWeek && l.week != currentWeek) return false;
            return true;
        });
    }

    function renderAllLectures() {
        const filtered = filterLectures(lectures);
        const container = document.getElementById('all-lectures');
        if (filtered.length === 0) {
            container.innerHTML = '<div class="lecture-card"><div class="lecture-body" style="text-align:center;">📭 لا توجد محاضرات تطابق الفلتر</div></div>';
            return;
        }
        container.innerHTML = filtered.map(lecture => `
            <div class="lecture-card">
                <div class="lecture-header">
                    <h3>${lecture.title}</h3>
                    <div class="week">المجموعة: ${lecture.group} | الفصل ${lecture.semester} | ${lecture.hours} ساعة</div>
                </div>
                <div class="lecture-body">
                    <div class="lecture-info"><i class="fas fa-book"></i> ${lecture.courseName}</div>
                    <div class="lecture-info"><span class="prep-status ${lecture.status === 'prepared' ? 'status-done' : 'status-pending'}">${lecture.status === 'prepared' ? '✓ تم التحضير' : '⏳ قيد التحضير'}</span></div>
                    ${lecture.status === 'prepared' && preparations[lecture.id] ? 
                        `<button class="btn-sm btn-outline" onclick="window.showPreparationDetails(${lecture.id})"><i class="fas fa-eye"></i> عرض التفاصيل</button>` : 
                        `<button class="btn-sm btn-primary" onclick="window.prepareLecture(${lecture.id})"><i class="fas fa-edit"></i> تحضير المحاضرة</button>`
                    }
                </div>
            </div>
        `).join('');
    }

    function updateDashboard() {
        const filtered = filterLectures(lectures);
        const total = filtered.length;
        const prepared = filtered.filter(l => l.status === 'prepared').length;
        const pending = total - prepared;
        
        document.getElementById('total-lectures').innerText = total;
        document.getElementById('prepared-lectures').innerText = prepared;
        document.getElementById('pending-lectures').innerText = pending;
        
        const prepPercent = total > 0 ? Math.round((prepared / total) * 100) : 0;
        document.getElementById('prep-percent').innerText = prepPercent + '%';
        
        const pendingLectures = filtered.filter(l => l.status === 'pending').slice(0, 4);
        const upcomingContainer = document.getElementById('upcoming-lectures');
        if (pendingLectures.length > 0) {
            upcomingContainer.innerHTML = pendingLectures.map(lecture => `
                <div class="lecture-card">
                    <div class="lecture-header">
                        <h3>${lecture.title}</h3>
                        <div class="week">المجموعة: ${lecture.group} | الفصل ${lecture.semester}</div>
                    </div>
                    <div class="lecture-body">
                        <div class="lecture-info">${lecture.courseName}</div>
                        <button class="btn-sm btn-primary" onclick="window.prepareLecture(${lecture.id})"><i class="fas fa-edit"></i> تحضير الآن</button>
                    </div>
                </div>
            `).join('');
        } else {
            upcomingContainer.innerHTML = '<div class="lecture-card"><div class="lecture-body" style="text-align:center;">🎉 جميع المحاضرات محضرة!</div></div>';
        }
    }

    window.prepareLecture = function(lectureId) {
        const lecture = lectures.find(l => l.id === lectureId);
        if (!lecture) return;
        
        document.querySelector('[data-tab="prep"]').click();
        document.getElementById('lecture-select').value = lectureId;
        document.getElementById('lecture-title').value = lecture.title;
        
        if (preparations[lectureId]) {
            document.getElementById('lecture-objectives').value = preparations[lectureId].objectives || '';
            document.getElementById('lecture-content').value = preparations[lectureId].content || '';
            document.getElementById('lecture-resources').value = preparations[lectureId].resources || '';
            document.getElementById('lecture-activities').value = preparations[lectureId].activities || '';
        } else {
            document.getElementById('lecture-objectives').value = '';
            document.getElementById('lecture-content').value = '';
            document.getElementById('lecture-resources').value = '';
            document.getElementById('lecture-activities').value = '';
        }
    };

    window.saveLecturePreparation = function() {
        const lectureId = parseInt(document.getElementById('lecture-select').value);
        if (!lectureId) { alert("الرجاء اختيار المحاضرة"); return; }
        
        preparations[lectureId] = {
            title: document.getElementById('lecture-title').value,
            objectives: document.getElementById('lecture-objectives').value,
            content: document.getElementById('lecture-content').value,
            resources: document.getElementById('lecture-resources').value,
            activities: document.getElementById('lecture-activities').value,
            preparedAt: new Date().toISOString()
        };
        
        const lecture = lectures.find(l => l.id === lectureId);
        if (lecture) lecture.status = 'prepared';
        
        localStorage.setItem(`preparations_${currentTrack}`, JSON.stringify(preparations));
        alert("تم حفظ التحضير بنجاح!");
        updateDashboard();
        renderAllLectures();
        
        document.getElementById('lecture-title').value = '';
        document.getElementById('lecture-objectives').value = '';
        document.getElementById('lecture-content').value = '';
        document.getElementById('lecture-resources').value = '';
        document.getElementById('lecture-activities').value = '';
    };

    window.showPreparationDetails = function(lectureId) {
        const prep = preparations[lectureId];
        if (prep) {
            alert(`📚 ${prep.title}\n\n🎯 الأهداف:\n${prep.objectives}\n\n📖 المحتوى:\n${prep.content}\n\n📚 المراجع:\n${prep.resources}\n\n⚡ الأنشطة:\n${prep.activities}`);
        } else {
            alert("لا يوجد تحضير لهذه المحاضرة بعد");
        }
    };

    function populateLectureSelects() {
        const filtered = filterLectures(lectures);
        const options = filtered.map(l => `<option value="${l.id}">${l.title} (${l.group} - فصل ${l.semester})</option>`).join('');
        document.getElementById('lecture-select').innerHTML = '<option value="">-- اختر محاضرة --</option>' + options;
        document.getElementById('attendance-lecture-select').innerHTML = '<option value="">-- اختر محاضرة --</option>' + options;
    }

    window.loadAttendance = function() {
        const lectureId = document.getElementById('attendance-lecture-select').value;
        if (!lectureId) { alert("اختر محاضرة أولاً"); return; }
        
        const lecture = lectures.find(l => l.id == lectureId);
        if (!lecture) return;
        
        // فلترة المتدربين حسب المجموعة نفسها
        const groupStudents = students.filter(s => s.group_name === lecture.group);
        
        if (groupStudents.length === 0) {
            alert(`لا يوجد متدربين في المجموعة ${lecture.group}`);
            return;
        }
        
        const tbody = document.getElementById('attendance-tbody');
        tbody.innerHTML = groupStudents.map(student => {
            const key = `${lectureId}_${student.national_id}`;
            const status = attendanceRecords[key] || 'absent';
            return `
                <tr>
                    <td>${student.full_name}</td>
                    <td>${student.national_id}</td>
                    <td>${student.group_name || '-'}</td>
                    <td>${lecture.courseName}</td>
                    <td>
                        <button class="attendance-btn present" onclick="window.setAttendance(${lectureId}, '${student.national_id}', 'present')">✓ حاضر</button>
                        <button class="attendance-btn absent" onclick="window.setAttendance(${lectureId}, '${student.national_id}', 'absent')">✗ غائب</button>
                        <button class="attendance-btn late" onclick="window.setAttendance(${lectureId}, '${student.national_id}', 'late')">⌛ متأخر</button>
                        <span id="status-${lectureId}-${student.national_id}" style="margin-right:8px;">${status === 'present' ? '✓ حاضر' : status === 'late' ? '⌛ متأخر' : '✗ غائب'}</span>
                    </td>
                </tr>
            `;
        }).join('');
        
        document.getElementById('attendance-table-container').style.display = 'block';
    };

    window.setAttendance = function(lectureId, nationalId, status) {
        const key = `${lectureId}_${nationalId}`;
        attendanceRecords[key] = status;
        localStorage.setItem(`attendance_${currentTrack}`, JSON.stringify(attendanceRecords));
        document.getElementById(`status-${lectureId}-${nationalId}`).innerText = status === 'present' ? '✓ حاضر' : status === 'late' ? '⌛ متأخر' : '✗ غائب';
        updateAttendanceStats();
    };

    window.saveAttendance = function() {
        alert("✅ تم حفظ سجل الحضور بنجاح!");
        updateAttendanceStats();
    };

    function updateAttendanceStats() {
        const total = Object.keys(attendanceRecords).length;
        const present = Object.values(attendanceRecords).filter(s => s === 'present').length;
        const percent = total > 0 ? Math.round((present / total) * 100) : 0;
        document.getElementById('total-attendance').innerText = percent + '%';
    }

    window.exportReports = function() {
        const filtered = filterLectures(lectures);
        const prepared = filtered.filter(l => l.status === 'prepared').length;
        let report = `تقرير التحضير الإلكتروني\n`;
        report += "=".repeat(50) + "\n";
        report += `التخصص: ${currentTrack === 'cs' ? 'علوم الحاسب' : 'الأمن السيبراني'}\n`;
        report += `المجموعة: ${currentGroup || "الكل"}\n`;
        report += `الفصل: ${currentSemester || "الكل"}\n`;
        report += "-".repeat(50) + "\n";
        report += `إجمالي المحاضرات: ${filtered.length}\n`;
        report += `المحاضرات المحضرة: ${prepared}\n`;
        report += `نسبة التحضير: ${filtered.length > 0 ? Math.round((prepared / filtered.length) * 100) : 0}%\n`;
        report += `نسبة الحضور الإجمالية: ${document.getElementById('total-attendance').innerText}\n`;
        
        const blob = new Blob([report], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `تقرير_${currentTrack}_${currentGroup || 'الكل'}_${new Date().toLocaleDateString()}.txt`;
        link.click();
    };

    window.switchTrack = function(track) {
        currentTrack = track;
        document.querySelectorAll('.nav-card').forEach(card => {
            card.classList.toggle('active', card.dataset.track === track);
        });
        generateLectures();
        updateFilters();
        applyFilters();
        populateLectureSelects();
        updateAttendanceStats();
    };

    // التبويبات
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
            if (tab.dataset.tab === 'lectures') renderAllLectures();
            if (tab.dataset.tab === 'attendance') populateLectureSelects();
        });
    });

    document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-SA');
    
    // بدء التشغيل
    loadStudents();
</script>
</body>
</html>
