<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المتدربين | الفلاتر المتقدمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e40af; --bg: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 20px; }
        
        .admin-container { max-width: 1300px; margin: 0 auto; }
        .filter-card { background: white; padding: 25px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .filter-item label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #475569; }
        .filter-item select, .filter-item input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }

        .stats-bar { display: flex; gap: 20px; margin-bottom: 20px; font-weight: bold; }
        .stat-tag { background: #dbeafe; color: var(--primary); padding: 5px 15px; border-radius: 20px; }

        .table-container { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f1f5f9; padding: 15px; color: #475569; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
        tr:hover { background: #f8fafc; }

        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-withdrawn { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2><i class="fas fa-users-gear"></i> لوحة التحكم في المتدربين</h2>
    
    <div class="filter-card">
        <div class="filter-grid">
            <div class="filter-item">
                <label>التخصص</label>
                <select id="filter-track" onchange="fetchStudents()">
                    <option value="">الكل</option>
                    <option value="Cybersecurity">أمن سيبراني</option>
                    <option value="Computer Science">حاسب آلي</option>
                </select>
            </div>
            <div class="filter-item">
                <label>المجموعة</label>
                <select id="filter-group" onchange="fetchStudents()">
                    <option value="">الكل</option>
                    <option value="Group -10">مجموعة 10</option>
                </select>
            </div>
            <div class="filter-item">
                <label>نوع الدراسة</label>
                <select id="filter-mode" onchange="fetchStudents()">
                    <option value="">الكل</option>
                    <option value="حضوري">حضوري</option>
                    <option value="عن بعد">عن بعد</option>
                </select>
            </div>
            <div class="filter-item">
                <label>حالة المتدرب</label>
                <select id="filter-status" onchange="fetchStudents()">
                    <option value="">الكل</option>
                    <option value="منتظم">منتظم</option>
                    <option value="منسحب">منسحب</option>
                    <option value="مؤجل">مؤجل</option>
                </select>
            </div>
            <div class="filter-item">
                <label>البحث بالاسم</label>
                <input type="text" id="search-name" placeholder="اكتب اسم المتدرب..." oninput="fetchStudents()">
            </div>
        </div>
    </div>

    <div class="stats-bar">
        <span>إجمالي النتائج: <span id="count-result" class="stat-tag">0</span></span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>رقم الهوية</th>
                    <th>التخصص</th>
                    <th>المجموعة</th>
                    <th>الدراسة</th>
                    <th>الحالة</th>
                    <th>الفصل</th>
                </tr>
            </thead>
            <tbody id="students-table-body">
                </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    async function fetchStudents() {
        const track = document.getElementById('filter-track').value;
        const group = document.getElementById('filter-group').value;
        const mode = document.getElementById('filter-mode').value;
        const status = document.getElementById('filter-status').value;
        const name = document.getElementById('search-name').value;

        let query = supabase.from('user_profile').select('*');

        // تطبيق الفلاتر برمجياً
        if (track) query = query.eq('track', track);
        if (group) query = query.eq('group_name', group);
        if (mode) query = query.eq('study_mode', mode);
        if (status) query = query.like('status', `%${status}%`);
        if (name) query = query.ilike('full_name', `%${name}%`);

        const { data, error } = await query.order('full_name', { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        renderTable(data);
    }

    function renderTable(students) {
        const tbody = document.getElementById('students-table-body');
        document.getElementById('count-result').innerText = students.length;
        tbody.innerHTML = '';

        students.forEach(std => {
            const statusClass = std.status?.includes('منتظم') ? 'status-active' : 'status-withdrawn';
            tbody.innerHTML += `
                <tr>
                    <td><b>${std.full_name}</b></td>
                    <td>${std.national_id || '-'}</td>
                    <td>${std.track}</td>
                    <td>${std.group_name}</td>
                    <td>${std.study_mode}</td>
                    <td><span class="status-badge ${statusClass}">${std.status}</span></td>
                    <td>${std.semester}</td>
                </tr>
            `;
        });
    }

    // تحميل البيانات عند فتح الصفحة
    fetchStudents();
</script>

</body>
</html>
