<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المتدربين | العرض الكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e40af; --accent: #3b82f6; --bg: #f1f5f9; --text: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .admin-container { max-width: 1450px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .filter-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .filter-item label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 0.85rem; color: #64748b; }
        .filter-item select, .filter-item input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; transition: 0.3s; }
        .filter-item select:focus, .filter-item input:focus { border-color: var(--accent); }
        .stat-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; }
        .table-container { background: white; border-radius: 15px; overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; text-align: right; }
        th { background: #f8fafc; padding: 15px; color: #64748b; border-bottom: 2px solid #edf2f7; font-size: 0.9rem; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        tr:hover { background-color: #f8fafc; }
        .status-pill { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-other { background: #f1f5f9; color: #475569; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="page-header">
        <h2><i class="fas fa-users-viewfinder"></i> إدارة المتدربين (عرض الكل)</h2>
        <div>إجمالي السجلات المكتشفة: <span id="count-result" class="stat-badge">0</span></div>
    </div>

    <div class="filter-card">
        <div class="filter-grid">
            <div class="filter-item"><label>التخصص</label><select id="filter-track"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>المجموعة</label><select id="filter-group"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>نوع الدراسة</label><select id="filter-mode"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>حالة المتدرب</label><select id="filter-status"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>بحث (اسم/هوية)</label><input type="text" id="search-box" placeholder="اكتب للبحث..."></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>رقم الهوية</th>
                    <th>رقم المتدرب</th>
                    <th>التخصص</th>
                    <th>المجموعة</th>
                    <th>الدراسة</th>
                    <th>الحالة</th>
                    <th>الفصل</th>
                </tr>
            </thead>
            <tbody id="students-body">
                <tr><td colspan="8" style="text-align:center; padding:40px;">جاري تحميل 427 سجل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    // بناء الفلاتر من كل البيانات المتاحة
    async function initFilters() {
        const { data } = await supabase.from('user_profile').select('track, group_name, study_mode, status').range(0, 999);
        if (!data) return;

        const populate = (id, key) => {
            const items = [...new Set(data.map(i => i[key]).filter(Boolean))].sort();
            const el = document.getElementById(id);
            el.innerHTML = '<option value="">الكل</option>' + items.map(v => `<option value="${v}">${v}</option>`).join('');
        };

        populate('filter-track', 'track');
        populate('filter-group', 'group_name');
        populate('filter-mode', 'study_mode');
        populate('filter-status', 'status');
    }

    async function loadStudents() {
        const track = document.getElementById('filter-track').value;
        const group = document.getElementById('filter-group').value;
        const mode = document.getElementById('filter-mode').value;
        const status = document.getElementById('filter-status').value;
        const search = document.getElementById('search-box').value;

        // التعديل الجوهري: إضافة range لضمان جلب كافة الـ 427 سجلاً
        let query = supabase.from('user_profile').select('*').range(0, 999);

        if (track) query = query.eq('track', track);
        if (group) query = query.eq('group_name', group);
        if (mode) query = query.eq('study_mode', mode);
        if (status) query = query.eq('status', status);
        if (search) query = query.or(`full_name.ilike.%${search}%,national_id.ilike.%${search}%`);

        const { data, error } = await query.order('full_name', { ascending: true });

        if (error) { console.error(error); return; }

        const container = document.getElementById('students-body');
        document.getElementById('count-result').innerText = data.length;
        
        container.innerHTML = data.map(s => `
            <tr>
                <td><b>${s.full_name}</b></td>
                <td>${s.national_id || '-'}</td>
                <td><code>${s.student_number || '-'}</code></td>
                <td>${s.track || '-'}</td>
                <td>${s.group_name || '-'}</td>
                <td>${s.study_mode || '-'}</td>
                <td><span class="status-pill ${s.status?.includes('منتظم') ? 'status-active' : 'status-other'}">${s.status || '-'}</span></td>
                <td>${s.semester || '-'}</td>
            </tr>
        `).join('');
    }

    async function start() {
        await initFilters();
        await loadStudents();
        
        ['filter-track', 'filter-group', 'filter-mode', 'filter-status'].forEach(id => {
            document.getElementById(id).addEventListener('change', loadStudents);
        });
        document.getElementById('search-box').addEventListener('input', loadStudents);
    }

    start();
</script>
</body>
</html>
