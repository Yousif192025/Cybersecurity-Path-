<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>منصة CyberPath | إدارة شؤون المتدربين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #0f172a;
            --accent: #3b82f6;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --info: #0891b2;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); padding: 12px; line-height: 1.5; min-height: 100vh; }
        .admin-container { max-width: 1500px; margin: 0 auto; }

        /* الهيدر */
        .main-header {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .platform-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .logo-placeholder {
            width: 45px; 
            height: 45px; 
            background: white; 
            border-radius: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            flex-shrink: 0;
        }
        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .platform-name h1 { font-size: 1.2rem; margin-bottom: 2px; }
        .platform-name p { font-size: 0.7rem; opacity: 0.9; }

        /* شريط الإجراءات */
        .action-bar {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* بطاقات الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: white;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid var(--border);
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .stat-info h3 { font-size: 0.7rem; margin-bottom: 4px; }
        .stat-number { font-size: 1.3rem; font-weight: 700; }

        /* شريط التقدم */
        .progress-bar-container {
            background: white;
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 12px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.75rem;
        }
        .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* الفلاتر */
        .filter-section { background: white; padding: 16px; border-bottom: 1px solid var(--border); }
        .filter-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 12px; 
        }
        .filter-item label { font-size: 0.7rem; margin-bottom: 4px; }
        .filter-item select, .filter-item input { 
            padding: 6px 10px; 
            font-size: 0.8rem; 
        }

        /* الجدول - متجاوب مع الجوال */
        .table-container { 
            background: white; 
            overflow-x: auto; 
            border-radius: 12px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: right; 
            min-width: 600px; /* يسمح بالتمرير الأفقي */
        }
        th { 
            background: #f1f5f9;
            padding: 10px 8px; 
            font-size: 0.75rem; 
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        td { 
            padding: 8px 8px; 
            border-bottom: 1px solid #e2e8f0; 
            font-size: 0.75rem;
            white-space: nowrap;
        }
        
        /* شارات الحالة */
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-inactive { background: #fee2e2; color: #991b1b; }
        .status-graduated { background: #dbeafe; color: #1e40af; }

        /* الفوتر */
        .main-footer {
            background: white;
            padding: 12px 16px;
            border-radius: 0 0 15px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
        }

        /* أزرار */
        .btn { 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-size: 0.75rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
        }
        .btn-excel, .btn-print { color: white; }
        .btn-excel { background: var(--success); }
        .btn-print { background: var(--accent); }
        
        .stat-badge { 
            background: #e2e8f0; 
            padding: 4px 12px; 
            border-radius: 30px; 
            font-size: 0.75rem; 
        }

        .pagination-controls { display: flex; gap: 5px; flex-wrap: wrap; }
        .page-btn { 
            padding: 5px 10px; 
            border: 1px solid var(--border); 
            background: white; 
            border-radius: 6px; 
            font-size: 0.7rem;
        }
        .page-btn.active { background: var(--primary); color: white; }

        /* تحسينات الجوال */
        @media (max-width: 640px) {
            body { padding: 8px; }
            .main-header { flex-direction: column; text-align: center; }
            .platform-info { justify-content: center; }
            .action-bar { flex-direction: column; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .filter-grid { grid-template-columns: 1fr; }
            .main-footer { flex-direction: column; text-align: center; }
            .pagination-controls { justify-content: center; }
            .btn { width: 100%; justify-content: center; }
            .header-date { font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 10px; }
        }

        @media print {
            .filter-section, .btn, .pagination-controls, .stats-grid, .progress-bar-container { display: none; }
            body { padding: 0; background: white; }
            table { min-width: auto; }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <header class="main-header">
        <div class="platform-info">
            <div class="logo-placeholder">
                <img src="./assets/images/logos/cYSGUIDE.png" alt="شعار المنصة" onerror="this.onerror=null; this.src='https://placehold.co/50x50/1e40af/white?text=CY'">
            </div>
            <div class="platform-name">
                <h1>CyberPath</h1>
                <p>نظام إدارة علوم الحاسب والأمن السيبراني</p>
            </div>
        </div>
        <div class="header-date">
            <i class="far fa-calendar-alt"></i> <span id="current-date"></span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card" data-status="all">
            <div class="stat-icon" style="background: linear-gradient(135deg, #3b82f6, #1e40af); color: white;">
                <i class="fas fa-users"></i>
            </div>
            <div class="stat-info">
                <h3>إجمالي المتدربين</h3>
                <div class="stat-number" id="total-count">0</div>
            </div>
        </div>
        <div class="stat-card" data-status="نشط">
            <div class="stat-icon" style="background: linear-gradient(135deg, #10b981, #059669); color: white;">
                <i class="fas fa-user-check"></i>
            </div>
            <div class="stat-info">
                <h3>نشطين</h3>
                <div class="stat-number" id="active-count">0</div>
            </div>
        </div>
        <div class="stat-card" data-status="متخرج">
            <div class="stat-icon" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white;">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div class="stat-info">
                <h3>متخرجين</h3>
                <div class="stat-number" id="graduated-count">0</div>
            </div>
        </div>
        <div class="stat-card" data-status="موقوف">
            <div class="stat-icon" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: white;">
                <i class="fas fa-user-slash"></i>
            </div>
            <div class="stat-info">
                <h3>موقوفين</h3>
                <div class="stat-number" id="suspended-count">0</div>
            </div>
        </div>
    </div>

    <div class="progress-bar-container">
        <div class="progress-label">
            <span><i class="fas fa-chart-line"></i> نسبة اكتمال البيانات</span>
            <span id="completion-percent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
    </div>

    <div class="action-bar">
        <div>إجمالي المعروض: <span id="count-result" class="stat-badge">0</span></div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button onclick="exportToCSV()" class="btn btn-excel"><i class="fas fa-file-csv"></i> تصدير CSV</button>
            <button onclick="window.print()" class="btn btn-print"><i class="fas fa-print"></i> طباعة</button>
        </div>
    </div>

    <section class="filter-section">
        <div class="filter-grid">
            <div class="filter-item"><label>المسار</label><select id="filter-track"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>المجموعة</label><select id="filter-group"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>الحالة</label><select id="filter-status"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>عرض</label><select id="page-size"><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="all">الكل</option></select></div>
            <div class="filter-item"><label>بحث</label><input type="text" id="search-box" placeholder="اسم / هوية"></div>
        </div>
    </section>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>الاسم</th><th>الهوية</th><th>المسار</th><th>المجموعة</th><th>الدراسة</th><th>الحالة</th></tr>
            </thead>
            <tbody id="students-body"><tr><td colspan="6" style="text-align:center;">جاري التحميل...</td></tr></tbody>
        </table>
    </div>

    <footer class="main-footer">
        <div id="pagination-text">0 إلى 0 من 0</div>
        <div class="pagination-controls" id="pagination-btns"></div>
        <div><i class="fas fa-sync-alt"></i> CyberPath v2.0</div>
    </footer>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let allData = [], filteredData = [], currentPage = 1, currentFilterStatus = 'all';

    document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-SA');

    async function init() {
        const { data } = await supabase.from('user_profile').select('*').range(0, 999).order('full_name');
        if (data) { allData = data; updateStats(); setupFilters(); applyFilters(); }
    }

    function updateStats() {
        document.getElementById('total-count').innerText = allData.length;
        document.getElementById('active-count').innerText = allData.filter(s => s.status === 'نشط').length;
        document.getElementById('graduated-count').innerText = allData.filter(s => s.status === 'متخرج').length;
        document.getElementById('suspended-count').innerText = allData.filter(s => s.status === 'موقوف').length;
        let complete = allData.filter(s => s.full_name && s.national_id && s.track).length;
        let percent = Math.round((complete / allData.length) * 100) || 0;
        document.getElementById('completion-percent').innerText = percent + '%';
        document.getElementById('progress-fill').style.width = percent + '%';
    }

    function setupFilters() {
        let tracks = [...new Set(allData.map(i => i.track).filter(Boolean))].sort();
        let groups = [...new Set(allData.map(i => i.group_name).filter(Boolean))].sort();
        let statuses = [...new Set(allData.map(i => i.status).filter(Boolean))].sort();
        document.getElementById('filter-track').innerHTML = '<option value="">الكل</option>' + tracks.map(v => `<option value="${v}">${v}</option>`).join('');
        document.getElementById('filter-group').innerHTML = '<option value="">الكل</option>' + groups.map(v => `<option value="${v}">${v}</option>`).join('');
        document.getElementById('filter-status').innerHTML = '<option value="">الكل</option>' + statuses.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function applyFilters() {
        let track = document.getElementById('filter-track').value;
        let group = document.getElementById('filter-group').value;
        let status = currentFilterStatus !== 'all' ? currentFilterStatus : document.getElementById('filter-status').value;
        let search = document.getElementById('search-box').value.toLowerCase();
        filteredData = allData.filter(s => (!track || s.track === track) && (!group || s.group_name === group) && (!status || s.status === status) && (!search || s.full_name?.toLowerCase().includes(search) || s.national_id?.includes(search)));
        currentPage = 1; render();
    }

    function render() {
        let size = document.getElementById('page-size').value;
        let limit = size === 'all' ? filteredData.length : parseInt(size);
        let total = filteredData.length, totalPages = Math.ceil(total / limit) || 1;
        let start = (currentPage - 1) * limit, end = Math.min(start + limit, total);
        let items = filteredData.slice(start, end);
        document.getElementById('students-body').innerHTML = items.map(s => `<tr><td><b>${s.full_name || '-'}</b></td><td>${s.national_id || '-'}</td><td>${s.track || '-'}</td><td>${s.group_name || '-'}</td><td>${s.study_mode || '-'}</td><td><span class="status-badge ${s.status === 'نشط' ? 'status-active' : s.status === 'متخرج' ? 'status-graduated' : s.status === 'موقوف' ? 'status-inactive' : ''}">${s.status || '-'}</span></td></tr>`).join('');
        document.getElementById('count-result').innerText = total;
        document.getElementById('pagination-text').innerText = `${start+1} إلى ${end} من ${total}`;
        let btns = document.getElementById('pagination-btns');
        btns.innerHTML = '';
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage-1 && i <= currentPage+1)) {
                let btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; render(); };
                btns.appendChild(btn);
            }
        }
    }

    window.exportToCSV = function() {
        let head = ["الاسم","الهوية","المسار","المجموعة","الدراسة","الحالة"];
        let rows = filteredData.map(s => [s.full_name, s.national_id, s.track, s.group_name, s.study_mode, s.status]);
        let content = "\uFEFF" + [head, ...rows].map(e => e.join(",")).join("\n");
        let blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `تقرير_CyberPath_${new Date().toLocaleDateString()}.csv`;
        link.click();
    };

    document.querySelectorAll('.stat-card').forEach(c => c.addEventListener('click', () => {
        currentFilterStatus = c.getAttribute('data-status');
        document.getElementById('filter-status').value = currentFilterStatus === 'all' ? '' : currentFilterStatus;
        applyFilters();
        document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active'));
        c.classList.add('active');
    }));

    document.querySelectorAll('#filter-track, #filter-group, #filter-status').forEach(s => s.addEventListener('change', () => { currentFilterStatus = 'all'; document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active')); applyFilters(); }));
    document.getElementById('search-box').addEventListener('input', applyFilters);
    document.getElementById('page-size').addEventListener('change', () => { currentPage = 1; render(); });
    init();
</script>
</body>
</html>
