<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المتدربين | الحل النهائي للجلب الكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e40af; --accent: #3b82f6; --bg: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); padding: 20px; }
        .admin-container { max-width: 1450px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .filter-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .filter-item label { display: block; margin-bottom: 5px; font-weight: 700; color: #64748b; font-size: 0.85rem; }
        .filter-item select, .filter-item input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; }
        .stat-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 50px; }
        .table-container { background: white; border-radius: 15px; overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; text-align: right; }
        th { background: #f8fafc; padding: 15px; color: #64748b; border-bottom: 2px solid #edf2f7; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        tr:hover { background-color: #f8fafc; }
        .loading-overlay { text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="page-header">
        <h2><i class="fas fa-database"></i> السجلات المكتملة</h2>
        <div>إجمالي السجلات: <span id="count-result" class="stat-badge">جاري الجلب...</span></div>
    </div>

    <div class="filter-card">
        <div class="filter-grid">
            <div class="filter-item"><label>التخصص</label><select id="filter-track"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>المجموعة</label><select id="filter-group"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>نوع الدراسة</label><select id="filter-mode"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>حالة المتدرب</label><select id="filter-status"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>بحث سريع</label><input type="text" id="search-box" placeholder="اسم أو هوية..."></div>
        </div>
    </div>

    <div class="table-container">
        <div id="loader" class="loading-overlay" style="display:none;">جاري تجميع كافة السجلات من القاعدة...</div>
        <table>
            <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>رقم الهوية</th>
                    <th>التخصص</th>
                    <th>المجموعة</th>
                    <th>الدراسة</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="students-body"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let allData = []; // مخزن لكل السجلات (427)

    // دالة تجلب البيانات على دفعات لتخطي قيود الـ API
    async function fetchAllStudents() {
        document.getElementById('loader').style.display = 'block';
        allData = [];
        let page = 0;
        const pageSize = 200; // جلب 200 في كل مرة
        let keepFetching = true;

        while (keepFetching) {
            const { data, error } = await supabase
                .from('user_profile')
                .select('*')
                .range(page * pageSize, (page + 1) * pageSize - 1)
                .order('full_name', { ascending: true });

            if (error || !data || data.length === 0) {
                keepFetching = false;
            } else {
                allData = [...allData, ...data];
                page++;
                // إذا كان العدد المجلووب أقل من حجم الصفحة، يعني وصلنا للنهاية
                if (data.length < pageSize) keepFetching = false;
            }
        }
        
        document.getElementById('loader').style.display = 'none';
        initFilters();
        applyFilters();
    }

    // بناء الفلاتر من المخزن الكامل
    function initFilters() {
        const populate = (id, key) => {
            const items = [...new Set(allData.map(i => i[key]).filter(Boolean))].sort();
            document.getElementById(id).innerHTML = '<option value="">الكل</option>' + 
                items.map(v => `<option value="${v}">${v}</option>`).join('');
        };
        populate('filter-track', 'track');
        populate('filter-group', 'group_name');
        populate('filter-mode', 'study_mode');
        populate('filter-status', 'status');
    }

    // تصفية البيانات محلياً (أسرع وأدق)
    function applyFilters() {
        const track = document.getElementById('filter-track').value;
        const group = document.getElementById('filter-group').value;
        const mode = document.getElementById('filter-mode').value;
        const status = document.getElementById('filter-status').value;
        const search = document.getElementById('search-box').value.toLowerCase();

        const filtered = allData.filter(s => {
            return (!track || s.track === track) &&
                   (!group || s.group_name === group) &&
                   (!mode || s.study_mode === mode) &&
                   (!status || s.status === status) &&
                   (!search || (s.full_name?.toLowerCase().includes(search) || s.national_id?.includes(search)));
        });

        renderTable(filtered);
    }

    function renderTable(data) {
        const container = document.getElementById('students-body');
        document.getElementById('count-result').innerText = data.length;
        
        container.innerHTML = data.map(s => `
            <tr>
                <td><b>${s.full_name}</b></td>
                <td>${s.national_id || '-'}</td>
                <td>${s.track || '-'}</td>
                <td>${s.group_name || '-'}</td>
                <td>${s.study_mode || '-'}</td>
                <td>${s.status || '-'}</td>
            </tr>
        `).join('');
    }

    // ربط الأحداث
    ['filter-track', 'filter-group', 'filter-mode', 'filter-status'].forEach(id => {
        document.getElementById(id).addEventListener('change', applyFilters);
    });
    document.getElementById('search-box').addEventListener('input', applyFilters);

    // ابدأ الجلب
    fetchAllStudents();
</script>
</body>
</html>
