<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المتدربين المتطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e40af; --accent: #0891b2; --success: #059669; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: #1e293b; padding: 20px; }
        .admin-container { max-width: 1500px; margin: 0 auto; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .action-buttons { display: flex; gap: 10px; align-items: center; }

        .filter-card { background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .filter-item label { display: block; margin-bottom: 8px; font-weight: 700; color: #64748b; font-size: 0.85rem; }
        .filter-item select, .filter-item input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; }

        .table-container { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f1f5f9; padding: 15px; color: #475569; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

        /* تصفح الصفحات Pagination */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #fff; border-top: 1px solid #f1f5f9; }
        .pagination-info { font-size: 0.9rem; color: #64748b; }
        .pagination-buttons { display: flex; gap: 5px; }
        .page-btn { padding: 8px 14px; border: 1px solid #e2e8f0; background: white; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:disabled { cursor: not-allowed; opacity: 0.5; }

        .btn-action { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; color: white; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .btn-export { background: var(--success); }
        .btn-print { background: #6366f1; }

        @media print { .filter-card, .action-buttons, .pagination-bar { display: none !important; } }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="page-header">
        <h2>سجل المتدربين (427 سجل)</h2>
        <div class="action-buttons">
            <button onclick="exportToCSV()" class="btn-action btn-export"><i class="fas fa-file-excel"></i> Excel</button>
            <button onclick="window.print()" class="btn-action btn-print"><i class="fas fa-print"></i> PDF</button>
        </div>
    </div>

    <div class="filter-card">
        <div class="filter-grid">
            <div class="filter-item"><label>التخصص</label><select id="filter-track"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>المجموعة</label><select id="filter-group"><option value="">الكل</option></select></div>
            <div class="filter-item"><label>أظهر</label>
                <select id="page-size" onchange="currentPage=1; applyFilters();">
                    <option value="10">10 سجلات</option>
                    <option value="25">25 سجل</option>
                    <option value="50">50 سجل</option>
                    <option value="all">عرض الكل</option>
                </select>
            </div>
            <div class="filter-item"><label>بحث</label><input type="text" id="search-box" placeholder="اسم أو هوية..."></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>رقم الهوية</th>
                    <th>التخصص</th>
                    <th>المجموعة</th>
                    <th>الدراسة</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="students-body"></tbody>
        </table>

        <div class="pagination-bar">
            <div class="pagination-info" id="pagination-text">إظهار 0 إلى 0 من أصل 0 مدخل</div>
            <div class="pagination-buttons" id="pagination-btns"></div>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let allData = [];
    let filteredData = [];
    let currentPage = 1;

    async function fetchData() {
        let { data } = await supabase.from('user_profile').select('*').range(0, 999).order('full_name');
        allData = data || [];
        setupFilters();
        applyFilters();
    }

    function setupFilters() {
        const getUnique = (key) => [...new Set(allData.map(i => i[key]).filter(Boolean))].sort();
        const fill = (id, items) => document.getElementById(id).innerHTML = '<option value="">الكل</option>' + items.map(v => `<option value="${v}">${v}</option>`).join('');
        fill('filter-track', getUnique('track'));
        fill('filter-group', getUnique('group_name'));
    }

    window.applyFilters = function() {
        const track = document.getElementById('filter-track').value;
        const group = document.getElementById('filter-group').value;
        const search = document.getElementById('search-box').value.toLowerCase();

        filteredData = allData.filter(s => 
            (!track || s.track === track) &&
            (!group || s.group_name === group) &&
            (!search || s.full_name?.toLowerCase().includes(search) || s.national_id?.includes(search))
        );

        renderTable();
    }

    function renderTable() {
        const sizeVal = document.getElementById('page-size').value;
        const size = sizeVal === 'all' ? filteredData.length : parseInt(sizeVal);
        const total = filteredData.length;
        const totalPages = Math.ceil(total / size) || 1;
        
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * size;
        const end = Math.min(start + size, total);
        const pageItems = filteredData.slice(start, end);

        document.getElementById('students-body').innerHTML = pageItems.map(s => `
            <tr>
                <td><b>${s.full_name}</b></td>
                <td>${s.national_id || '-'}</td>
                <td>${s.track || '-'}</td>
                <td>${s.group_name || '-'}</td>
                <td>${s.study_mode || '-'}</td>
                <td>${s.status || '-'}</td>
            </tr>
        `).join('');

        updatePaginationUI(start + 1, end, total, totalPages);
    }

    function updatePaginationUI(start, end, total, totalPages) {
        document.getElementById('pagination-text').innerText = total > 0 ? `إظهار ${start} إلى ${end} من أصل ${total} مدخل` : 'لا توجد نتائج';
        
        const btnContainer = document.getElementById('pagination-btns');
        btnContainer.innerHTML = '';

        if (totalPages <= 1) return;

        // زر السابق
        const prev = document.createElement('button');
        prev.className = 'page-btn'; prev.innerText = 'السابق';
        prev.disabled = currentPage === 1;
        prev.onclick = () => { currentPage--; renderTable(); };
        btnContainer.appendChild(prev);

        // أرقام الصفحات (عرض محدود)
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; renderTable(); };
                btnContainer.appendChild(btn);
            }
        }

        // زر التالي
        const next = document.createElement('button');
        next.className = 'page-btn'; next.innerText = 'التالي';
        next.disabled = currentPage === totalPages;
        next.onclick = () => { currentPage++; renderTable(); };
        btnContainer.appendChild(next);
    }

    window.exportToCSV = function() {
        const rows = [["الاسم", "الهوية", "التخصص", "المجموعة", "الدراسة", "الحالة"]];
        filteredData.forEach(s => rows.push([s.full_name, s.national_id, s.track, s.group_name, s.study_mode, s.status]));
        const blob = new Blob(["\uFEFF" + rows.map(r => r.join(",")).join("\n")], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "سجل_المتدربين.csv"; link.click();
    };

    document.querySelectorAll('select, input').forEach(el => el.addEventListener('change', () => { currentPage = 1; applyFilters(); }));
    document.getElementById('search-box').addEventListener('input', () => { currentPage = 1; applyFilters(); });

    fetchData();
</script>
</body>
</html>
