<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة CyberPath | إدارة شؤون المتدربين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #0f172a;
            --accent: #3b82f6;
            --success: #059669;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: #1e293b; padding: 20px; line-height: 1.6; }
        .admin-container { max-width: 1500px; margin: 0 auto; }

        /* الهيدر الجديد المطور */
        .main-header {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .platform-info { display: flex; align-items: center; gap: 15px; }
        .logo-placeholder {
            width: 50px; height: 50px; background: white; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 24px;
        }
        .platform-name h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 2px; }
        .platform-name p { font-size: 0.8rem; opacity: 0.9; }

        /* شريط الإجراءات */
        .action-bar {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* الكروت والفلاتر */
        .filter-section { background: white; padding: 20px; border-bottom: 1px solid var(--border); }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
        .filter-item label { display: block; margin-bottom: 6px; font-weight: 700; color: #475569; font-size: 0.8rem; }
        .filter-item select, .filter-item input { 
            width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; 
            outline: none; font-size: 0.85rem; transition: 0.2s;
        }
        .filter-item select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }

        /* تنسيق الجدول الجديد */
        .table-container { background: white; overflow-x: auto; border-right: 1px solid var(--border); border-left: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: right; table-layout: fixed; }
        th { 
            background: #f1f5f9; padding: 12px 10px; color: #334155; 
            font-weight: 700; font-size: 0.85rem; border: 1px solid var(--border);
        }
        td { 
            padding: 8px 10px; border: 1px solid var(--border); 
            font-size: 0.8rem; /* تصغير حجم الخط كما طلبت */
            color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }

        /* التذييل الفوتر */
        .main-footer {
            background: white; padding: 15px 30px; border-radius: 0 0 15px 15px;
            border: 1px solid var(--border); border-top: none;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #64748b;
        }

        /* أزرار وتنبيهات */
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; color: white; transition: 0.2s; }
        .btn-excel { background: var(--success); }
        .btn-print { background: var(--accent); }
        .stat-badge { background: #e2e8f0; color: #475569; padding: 4px 12px; border-radius: 50px; font-weight: 700; }

        .pagination-controls { display: flex; gap: 5px; }
        .page-btn { padding: 5px 10px; border: 1px solid var(--border); background: white; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        @media print {
            .filter-section, .btn, .pagination-controls { display: none !important; }
            body { padding: 0; }
            .admin-container { max-width: 100%; }
            th, td { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <header class="main-header">
        <div class="platform-info">
            <div class="logo-placeholder">
                <i class="fas fa-shield-halved"></i>
            </div>
            <div class="platform-name">
                <h1>CyberPath</h1>
                <p>نظام إدارة التدريب التقني والأمن السيبراني</p>
            </div>
        </div>
        <div class="header-date">
            <i class="far fa-calendar-alt"></i> <span id="current-date"></span>
        </div>
    </header>

    <div class="action-bar">
        <div>
            إجمالي المتدربين: <span id="count-result" class="stat-badge">0</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="exportToCSV()" class="btn btn-excel"><i class="fas fa-file-csv"></i> تصدير البيانات</button>
            <button onclick="window.print()" class="btn btn-print"><i class="fas fa-print"></i> طباعة PDF</button>
        </div>
    </div>

    <section class="filter-section">
        <div class="filter-grid">
            <div class="filter-item">
                <label>المسار التدريبي</label>
                <select id="filter-track"><option value="">الكل</option></select>
            </div>
            <div class="filter-item">
                <label>المجموعة</label>
                <select id="filter-group"><option value="">الكل</option></select>
            </div>
            <div class="filter-item">
                <label>الحالة</label>
                <select id="filter-status"><option value="">الكل</option></select>
            </div>
            <div class="filter-item">
                <label>عرض السجلات</label>
                <select id="page-size">
                    <option value="10">10 سجلات</option>
                    <option value="25">25 سجل</option>
                    <option value="50">50 سجل</option>
                    <option value="all">الكل (427)</option>
                </select>
            </div>
            <div class="filter-item" style="grid-column: span 1;">
                <label>بحث سريع</label>
                <input type="text" id="search-box" placeholder="اسم / هوية...">
            </div>
        </div>
    </section>

    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th style="width: 25%;">اسم المتدرب</th>
                    <th style="width: 15%;">رقم الهوية</th>
                    <th style="width: 15%;">المسار</th>
                    <th style="width: 15%;">المجموعة</th>
                    <th style="width: 15%;">نوع الدراسة</th>
                    <th style="width: 15%;">الحالة</th>
                </tr>
            </thead>
            <tbody id="students-body">
                <tr><td colspan="6" style="text-align:center; padding:30px;">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <footer class="main-footer">
        <div id="pagination-text">إظهار 0 إلى 0 من أصل 0</div>
        <div class="pagination-controls" id="pagination-btns"></div>
        <div>CyberPath v2.0 &copy; 2026</div>
    </footer>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let allData = [];
    let filteredData = [];
    let currentPage = 1;

    document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-SA');

    async function init() {
        const { data, error } = await supabase.from('user_profile').select('*').range(0, 999).order('full_name');
        if (data) {
            allData = data;
            setupDropdowns();
            applyFilters();
        }
    }

    function setupDropdowns() {
        const getUnique = (key) => [...new Set(allData.map(i => i[key]).filter(Boolean))].sort();
        const fill = (id, list) => {
            const el = document.getElementById(id);
            el.innerHTML = '<option value="">الكل</option>' + list.map(v => `<option value="${v}">${v}</option>`).join('');
        };
        fill('filter-track', getUnique('track'));
        fill('filter-group', getUnique('group_name'));
        fill('filter-status', getUnique('status'));
    }

    function applyFilters() {
        const track = document.getElementById('filter-track').value;
        const group = document.getElementById('filter-group').value;
        const status = document.getElementById('filter-status').value;
        const search = document.getElementById('search-box').value.toLowerCase();

        filteredData = allData.filter(s => 
            (!track || s.track === track) &&
            (!group || s.group_name === group) &&
            (!status || s.status === status) &&
            (!search || s.full_name?.toLowerCase().includes(search) || s.national_id?.includes(search))
        );
        currentPage = 1;
        render();
    }

    function render() {
        const sizeVal = document.getElementById('page-size').value;
        const size = sizeVal === 'all' ? filteredData.length : parseInt(sizeVal);
        const total = filteredData.length;
        const totalPages = Math.ceil(total / size) || 1;
        
        const start = (currentPage - 1) * size;
        const end = Math.min(start + size, total);
        const currentItems = filteredData.slice(start, end);

        document.getElementById('students-body').innerHTML = currentItems.map(s => `
            <tr>
                <td><b>${s.full_name}</b></td>
                <td>${s.national_id || '-'}</td>
                <td>${s.track || '-'}</td>
                <td>${s.group_name || '-'}</td>
                <td>${s.study_mode || '-'}</td>
                <td>${s.status || '-'}</td>
            </tr>
        `).join('');

        document.getElementById('count-result').innerText = total;
        document.getElementById('pagination-text').innerText = `إظهار ${start + 1} إلى ${end} من أصل ${total}`;
        
        renderPaginationButtons(totalPages);
    }

    function renderPaginationButtons(total) {
        const container = document.getElementById('pagination-btns');
        container.innerHTML = '';
        if (total <= 1) return;

        for (let i = 1; i <= total; i++) {
            if (i === 1 || i === total || (i >= currentPage - 1 && i <= currentPage + 1)) {
                const b = document.createElement('button');
                b.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                b.innerText = i;
                b.onclick = () => { currentPage = i; render(); };
                container.appendChild(b);
            }
        }
    }

    window.exportToCSV = function() {
        const head = ["الاسم", "الهوية", "المسار", "المجموعة", "الدراسة", "الحالة"];
        const rows = filteredData.map(s => [s.full_name, s.national_id, s.track, s.group_name, s.study_mode, s.status]);
        const content = "\uFEFF" + [head, ...rows].map(e => e.join(",")).join("\n");
        const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `تقرير_متدربي_CyberPath_${new Date().toLocaleDateString()}.csv`;
        link.click();
    };

    document.querySelectorAll('select').forEach(s => s.addEventListener('change', applyFilters));
    document.getElementById('search-box').addEventListener('input', applyFilters);

    init();
</script>
</body>
</html>
