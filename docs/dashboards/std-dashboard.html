<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الطالب الموحدة | CyberPath</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --border: #334155; --success: #22c55e;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; text-align: right; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .profile-info h2 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .logout-btn { background: #f87171; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab { padding: 12px 20px; background: var(--card-bg); border-radius: 8px; cursor: pointer; transition: 0.3s; border: 1px solid var(--border); font-size: 0.9rem; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .card h3 { margin: 0 0 10px 0; color: var(--accent); font-size: 1.1rem; }
        .card p { font-size: 0.85rem; color: #94a3b8; line-height: 1.6; min-height: 40px; }

        /* Buttons & Progress */
        .btn { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-family: inherit; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-success { background: var(--success); color: white; }
        .progress-container { background: #334155; height: 8px; border-radius: 10px; margin: 15px 0 5px; overflow: hidden; }
        .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: 0.5s; }
        .status-text { font-size: 0.75rem; color: var(--accent); }

        .loading { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="profile-info" id="profile-area">جاري تحميل الملف...</div>
        <button class="logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="courses">📚 المقررات المتاحة</div>
        <div class="tab" data-tab="my-plan">📊 خطتي الدراسية</div>
        <div class="tab" data-tab="assignments">📝 التكليفات</div>
        <div class="tab" data-tab="quizzes">❓ الاختبارات</div>
    </div>

    <div id="tab-content" class="tab-content">
        </div>
</div>

// ... (الجزء العلوي من HTML والـ CSS يبقى كما هو في كودك) ...

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let currentUserId = null;

    async function initDashboard() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = "login.html"; return; }
        
        currentUserId = user.id;
        document.getElementById('user-email').innerText = user.email;

        // 1. جلب بيانات البروفايل لمعرفة المسار (Track)
        const { data: profile } = await supabase
            .from('user_profile')
            .select('*')
            .eq('user_id', currentUserId)
            .maybeSingle();

        if (profile) {
            document.getElementById('user-name').innerText = profile.full_name;
            document.getElementById('user-track').innerText = profile.track || "غير محدد";
            
            // 2. تحميل الخطة بناءً على مسار المستخدم من جدول courses مباشرة
            await loadDynamicPlan(profile.track);
        }
    }

    async function loadDynamicPlan(userTrack) {
        const container = document.getElementById('plan-container');
        
        // جلب المقررات التي تنتمي لمسار المستخدم فقط
        // ملاحظة: نفترض وجود عمود 'track' وعمود 'semester' في جدول courses
        const { data: allCourses, error: courseError } = await supabase
            .from('courses')
            .select('*')
            .eq('track', userTrack) // فلترة حسب المسار
            .order('semester', { ascending: true });

        // جلب سجلات تقدم الطالب
        const { data: enrollments } = await supabase
            .from('enrollments')
            .select('course_id, completion_status')
            .eq('user_id', currentUserId);

        const enrollMap = {};
        enrollments?.forEach(e => enrollMap[e.course_id] = e.completion_status);

        if (courseError || !allCourses || allCourses.length === 0) {
            container.innerHTML = `<div class="empty-state">لا توجد مواد مسجلة لمسار ${userTrack} حالياً.</div>`;
            return;
        }

        renderPlan(allCourses, enrollMap);
    }

    function renderPlan(courses, enrollMap) {
        const container = document.getElementById('plan-container');
        container.innerHTML = '';
        
        // تجميع المواد حسب الفصل (Semester)
        const semesters = {};
        courses.forEach(c => {
            if (!semesters[c.semester]) semesters[c.semester] = [];
            semesters[c.semester].push(c);
        });

        let total = courses.length;
        let completed = 0;

        Object.keys(semesters).forEach(semNum => {
            const semesterSection = document.createElement('div');
            semesterSection.className = 'semester-section';
            
            const semCourses = semesters[semNum];
            const semCompleted = semCourses.filter(c => enrollMap[c.course_id] === 'completed').length;
            completed += semCompleted;

            semesterSection.innerHTML = `
                <button class="accordion-btn">
                    <span>📖 الفصل التدريبي ${semNum}</span>
                    <span style="font-size: 0.8rem;">${semCompleted}/${semCourses.length} مكتمل <i class="fas fa-chevron-down"></i></span>
                </button>
                <div class="panel">
                    ${semCourses.map(c => `
                        <div class="course-row status-${enrollMap[c.course_id] || 'not_started'}">
                            <div class="course-info">
                                <i class="${getStatusIcon(enrollMap[c.course_id])}"></i>
                                <span><strong>${c.title}</strong></span>
                            </div>
                            <div class="course-badge">${getStatusText(enrollMap[c.course_id])}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.appendChild(semesterSection);
        });

        // تفعيل الأكورديون
        document.querySelectorAll('.accordion-btn').forEach(btn => {
            btn.onclick = function() {
                this.classList.toggle('active');
                this.nextElementSibling.classList.toggle('show');
            };
        });

        updateProgressHeader(total, completed);
    }

    function getStatusIcon(status) {
        if (status === 'completed') return 'fas fa-check-circle';
        if (status === 'in_progress') return 'fas fa-spinner fa-spin';
        return 'far fa-circle';
    }

    function getStatusText(status) {
        const map = { 'completed': '✅ مكتمل', 'in_progress': '🔄 قيد الدراسة' };
        return map[status] || '⏳ لم يبدأ';
    }

    function updateProgressHeader(total, completed) {
        const percent = Math.round((completed / total) * 100);
        document.getElementById('total-courses').innerText = total;
        document.getElementById('completed-courses').innerText = completed;
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('progress-percent').innerText = `نسبة الإنجاز: ${percent}%`;
        document.getElementById('progress-summary').style.display = 'flex';
    }

    initDashboard();
</script>
</body>
</html>
