<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطالب | منصة الأمن السيبراني</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #1e40af;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --success: #10b981;
            --bg-light: #f8fafc;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--secondary); line-height: 1.6; }

        /* الهيدر */
        header {
            background: linear-gradient(90deg, var(--secondary) 0%, var(--primary) 100%);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .user-meta { display: flex; align-items: center; gap: 15px; }
        .logout-link { color: #fecaca; text-decoration: none; font-size: 0.9rem; border: 1px solid #fecaca; padding: 5px 12px; border-radius: 8px; transition: 0.3s; cursor: pointer; }
        .logout-link:hover { background: #fecaca; color: #7f1d1d; }

        /* الحاوية */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* بطاقة الترحيب */
        .welcome-section {
            background: white;
            padding: 35px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            border-right: 8px solid var(--accent);
        }
        .user-avatar { width: 80px; height: 80px; background: #dbeafe; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary); }

        /* الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: var(--card-shadow); border-bottom: 4px solid transparent; transition: 0.3s; }
        .stat-card:hover { border-bottom-color: var(--accent); }
        .stat-card i { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
        .stat-value { display: block; font-size: 2rem; font-weight: 700; color: var(--secondary); }

        /* التصميم الرئيسي */
        .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
        .content-card { background: white; padding: 30px; border-radius: 24px; box-shadow: var(--card-shadow); height: fit-content; }
        
        .track-box { background: #eff6ff; padding: 20px; border-radius: 15px; border: 1px dashed var(--accent); margin: 20px 0; text-align: center; }
        .btn-track { background: var(--primary); color: white; padding: 12px 25px; border-radius: 12px; text-decoration: none; display: inline-block; font-weight: 600; margin-top: 10px; transition: 0.3s; }
        .btn-track:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(30, 64, 175, 0.3); }

        /* النماذج */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn-save { width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.3s; }
        .btn-save:hover { opacity: 0.9; }

        /* الدورات */
        .courses-title { margin: 40px 0 20px; display: flex; align-items: center; gap: 10px; font-size: 1.4rem; color: var(--secondary); }
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .course-item { background: white; padding: 20px; border-radius: 18px; box-shadow: var(--card-shadow); border: 1px solid #f1f5f9; position: relative; }
        .course-item h4 { color: var(--primary); margin-bottom: 12px; font-size: 1.1rem; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); transition: width 0.5s ease; }

        @media (max-width: 992px) { .main-grid { grid-template-columns: 1fr; } }
        @media (max-width: 600px) { .welcome-section { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>

<header>
    <div><h2><i class="fas fa-shield-halved"></i> مركز الطالب</h2></div>
    <div class="user-meta">
        <span id="header-email">---</span>
        <a class="logout-link" onclick="handleLogout()">خروج</a>
    </div>
</header>

<div class="container">
    <section class="welcome-section">
        <div class="user-avatar"><i class="fas fa-user-graduate"></i></div>
        <div>
            <h1>مرحباً، <span id="display-name">...</span></h1>
            <p id="display-track" style="color: var(--accent); font-weight: 600;">جاري تحميل المسار الخاص بك...</p>
        </div>
    </section>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fas fa-book-open"></i>
            <span class="stat-value" id="stat-count">0</span>
            <p>دورات مسجلة</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-award"></i>
            <span class="stat-value" id="stat-certs">0</span>
            <p>شهادات مكتملة</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-chart-line"></i>
            <span class="stat-value" id="stat-avg">0%</span>
            <p>نسبة الإنجاز العامة</p>
        </div>
    </div>

    <div class="main-grid">
        <div class="content-card">
            <h3><i class="fas fa-route"></i> الخطة الدراسية</h3>
            <div class="track-box">
                <p id="track-intro">بناءً على تخصصك، إليك محتوى المسار:</p>
                <div id="track-action-btn"></div>
            </div>
            
            <div class="courses-title"><i class="fas fa-list-check"></i> سجل الدورات</div>
            <div id="courses-grid" class="courses-grid">
                <p style="text-align: center; grid-column: 1/-1; color: #94a3b8;">جاري جلب الدورات...</p>
            </div>
        </div>

        <div class="content-card">
            <h3><i class="fas fa-user-gear"></i> الملف الشخصي</h3>
            <div style="margin-top: 20px;">
                <div class="form-group">
                    <label>الاسم الكامل (بالعربي)</label>
                    <input type="text" id="input-name" placeholder="مثال: يوسف إبراهيم هاشم">
                </div>
                <div class="form-group">
                    <label>رقم الجوال</label>
                    <input type="text" id="input-phone" placeholder="05xxxxxxxx">
                </div>
                <button class="btn-save" id="btn-save" onclick="saveProfile()">تحديث البيانات</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const CONFIG = {
            url: "https://suvpaunulhqfoclepwoz.supabase.co",
            key: "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
        };

        // تهيئة العميل مع تمرير المفتاح في الـ Headers بشكل صريح
        const db = window.supabase.createClient(CONFIG.url, CONFIG.key, {
            global: {
                headers: { 'apikey': CONFIG.key }
            }
        });

        let currentUser = null;

        async function init() {
            const { data: { session }, error } = await db.auth.getSession();
            
            if (error || !session) {
                window.location.href = "temp-login.html";
                return;
            }

            currentUser = session.user;
            document.getElementById('header-email').innerText = currentUser.email;

            await loadProfile();
            await loadCourses();
        }

        async function loadProfile() {
            let { data: profile, error } = await db.from('user_profile').select('*').eq('user_id', currentUser.id).maybeSingle();

            if (error) {
                console.error("Profile Load Error:", error.message);
                return;
            }

            // إنشاء ملف إذا لم يوجد
            if (!profile) {
                const { data: newProfile } = await db.from('user_profile').insert([{
                    user_id: currentUser.id,
                    email: currentUser.email,
                    full_name: currentUser.email.split('@')[0],
                    track: 'مسار عام'
                }]).select().single();
                profile = newProfile;
            }

            if (profile) {
                document.getElementById('display-name').innerText = profile.full_name || 'طالب';
                document.getElementById('input-name').value = profile.full_name || '';
                document.getElementById('input-phone').value = profile.phone || '';
                document.getElementById('display-track').innerText = profile.track || 'مسار عام';
                renderTrackButton(profile.track);
            }
        }

        function renderTrackButton(trackName) {
            const container = document.getElementById('track-action-btn');
            const track = (trackName || "").toLowerCase();
            let url = "https://cyberpath.vercel.app/docs/pathways/index.html";
            let label = "المسار التعليمي الشامل";

            if (track.includes("حاسب")) {
                url = "https://cyberpath.vercel.app/docs/pathways/tvtc-cs-diploma.html";
                label = "فتح مسار دبلوم الحاسب";
            } else if (track.includes("أمن") || track.includes("security")) {
                url = "https://cyberpath.vercel.app/docs/pathways/tvtc-cs-security.html";
                label = "فتح مسار الأمن السيبراني";
            }
            container.innerHTML = `<a href="${url}" class="btn-track" target="_blank">${label}</a>`;
        }

        async function loadCourses() {
            const { data: items, error } = await db.from('user_courses').select('progress, completed, courses(title, slug)').eq('user_id', currentUser.id);
            const grid = document.getElementById('courses-grid');
            
            if (error || !items || items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 20px;">لم يتم العثور على دورات مسجلة.</p>';
                return;
            }

            let done = 0, totalP = 0;
            grid.innerHTML = '';

            items.forEach(item => {
                const c = item.courses;
                if (item.completed) done++;
                totalP += (item.progress || 0);

                grid.innerHTML += `
                    <div class="course-item">
                        <h4>${c ? c.title : 'دورة غير معرفة'}</h4>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${item.progress || 0}%"></div></div>
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                            <span>الإنجاز: ${item.progress || 0}%</span>
                            ${c ? `<a href="../courses/course-content.html?course=${c.slug}" style="color:var(--accent); text-decoration:none; font-weight:700;">دخول</a>` : ''}
                        </div>
                    </div>`;
            });

            document.getElementById('stat-count').innerText = items.length;
            document.getElementById('stat-certs').innerText = done;
            document.getElementById('stat-avg').innerText = Math.round(totalP / items.length) + "%";
        }

        window.saveProfile = async function() {
            const name = document.getElementById('input-name').value;
            const phone = document.getElementById('input-phone').value;
            const btn = document.getElementById('btn-save');

            if (!name) return Swal.fire('خطأ', 'الاسم مطلوب للشهادات', 'error');

            btn.disabled = true;
            btn.innerText = 'جاري الحفظ...';

            const { error } = await db.from('user_profile').update({ full_name: name, phone: phone }).eq('user_id', currentUser.id);

            if (!error) {
                Swal.fire('تم التحديث', 'تم حفظ بياناتك بنجاح', 'success');
                document.getElementById('display-name').innerText = name;
            } else {
                Swal.fire('خطأ في الاتصال', error.message, 'error');
            }
            btn.disabled = false;
            btn.innerText = 'تحديث البيانات';
        };

        window.handleLogout = async function() {
            await db.auth.signOut();
            window.location.href = "temp-login.html";
        };

        init();
    })();
</script>
</body>
</html>
