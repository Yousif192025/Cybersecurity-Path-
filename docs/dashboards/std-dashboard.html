<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الطالب - CyberPath</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); direction: rtl; margin: 20px; color: var(--text); }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        
        /* شريط التقدم */
        .progress-container { display: none; align-items: center; gap: 15px; background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        .progress-bar { flex-grow: 1; background: #eee; height: 12px; border-radius: 10px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.4s; }

        /* الأكورديون */
        .semester-section { border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; }
        .accordion-btn { width: 100%; padding: 15px; background: #f9f9f9; border: none; text-align: right; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; }
        .panel { display: none; padding: 15px; border-top: 1px solid #ddd; background: #fff; }
        .panel.show { display: block; }

        /* صفوف المواد */
        .course-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center; }
        .course-info { display: flex; align-items: center; gap: 10px; }
        .course-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #eee; }
        .status-completed { color: #28a745; }
        .status-in_progress { color: var(--primary); }
    </style>
</head>
<body>

<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>مرحباً، <span id="user-name">...</span></h2>
        <span id="user-track" style="background:#007bff; color:white; padding:5px 12px; border-radius:20px; font-size:0.9rem;">...</span>
    </div>
    <p id="user-email" style="color: #666; margin-bottom: 20px;"></p>

    <div id="progress-summary" class="progress-container">
        <div><span id="completed-courses">0</span> / <span id="total-courses">0</span> مكتمل</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div id="progress-percent">0%</div>
    </div>

    <div id="plan-container">
        <p style="text-align:center;">جاري تحميل الخطة الدراسية...</p>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let currentUserId = null;

    async function initDashboard() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = "login.html"; return; }
        
        currentUserId = user.id;
        document.getElementById('user-email').innerText = user.email;

        // 1. جلب بيانات البروفايل لمعرفة المسار (Track)
        const { data: profile } = await supabase
            .from('user_profile')
            .select('*')
            .eq('user_id', currentUserId)
            .maybeSingle();

        if (profile) {
            document.getElementById('user-name').innerText = profile.full_name;
            document.getElementById('user-track').innerText = profile.track || "غير محدد";
            await loadDynamicPlan(profile.track);
        }
    }

    async function loadDynamicPlan(userTrack) {
        const container = document.getElementById('plan-container');
        
        // جلب المقررات التي تنتمي لمسار المستخدم فقط
        const { data: allCourses, error: courseError } = await supabase
            .from('courses')
            .select('*')
            .eq('track', userTrack)
            .order('semester', { ascending: true });

        // جلب سجلات تقدم الطالب
        const { data: enrollments } = await supabase
            .from('enrollments')
            .select('course_id, completion_status')
            .eq('user_id', currentUserId);

        const enrollMap = {};
        enrollments?.forEach(e => enrollMap[e.course_id] = e.completion_status);

        if (courseError || !allCourses || allCourses.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px;">لا توجد مواد مسجلة لمسار ${userTrack} حالياً.</div>`;
            return;
        }

        renderPlan(allCourses, enrollMap);
    }

    function renderPlan(courses, enrollMap) {
        const container = document.getElementById('plan-container');
        container.innerHTML = '';
        
        const semesters = {};
        courses.forEach(c => {
            if (!semesters[c.semester]) semesters[c.semester] = [];
            semesters[c.semester].push(c);
        });

        let total = courses.length;
        let completed = 0;

        Object.keys(semesters).forEach(semNum => {
            const semCourses = semesters[semNum];
            const semCompleted = semCourses.filter(c => enrollMap[c.course_id] === 'completed').length;
            completed += semCompleted;

            const section = document.createElement('div');
            section.className = 'semester-section';
            section.innerHTML = `
                <button class="accordion-btn">
                    <span>📖 الفصل التدريبي ${semNum}</span>
                    <span>${semCompleted}/${semCourses.length} مكتمل <i class="fas fa-chevron-down"></i></span>
                </button>
                <div class="panel">
                    ${semCourses.map(c => `
                        <div class="course-row status-${enrollMap[c.course_id] || 'not_started'}">
                            <div class="course-info">
                                <i class="${getStatusIcon(enrollMap[c.course_id])}"></i>
                                <span><strong>${c.title}</strong></span>
                            </div>
                            <div class="course-badge">${getStatusText(enrollMap[c.course_id])}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(section);
        });

        document.querySelectorAll('.accordion-btn').forEach(btn => {
            btn.onclick = function() {
                this.nextElementSibling.classList.toggle('show');
            };
        });

        updateProgressHeader(total, completed);
    }

    function getStatusIcon(status) {
        if (status === 'completed') return 'fas fa-check-circle';
        if (status === 'in_progress') return 'fas fa-spinner fa-spin';
        return 'far fa-circle';
    }

    function getStatusText(status) {
        const map = { 'completed': '✅ مكتمل', 'in_progress': '🔄 قيد الدراسة' };
        return map[status] || '⏳ لم يبدأ';
    }

    function updateProgressHeader(total, completed) {
        const percent = Math.round((completed / total) * 100) || 0;
        document.getElementById('total-courses').innerText = total;
        document.getElementById('completed-courses').innerText = completed;
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('progress-percent').innerText = `${percent}%`;
        document.getElementById('progress-summary').style.display = 'flex';
    }

    initDashboard();
</script>
</body>
</html>
