<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطالب | منصة الأمن السيبراني</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #1e40af;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --success: #10b981;
            --bg-light: #f8fafc;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--secondary); }

        /* الهيدر */
        header {
            background: linear-gradient(90deg, var(--secondary) 0%, var(--primary) 100%);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .user-meta { display: flex; align-items: center; gap: 15px; }
        .logout-link { color: #fecaca; text-decoration: none; font-size: 0.9rem; border: 1px solid #fecaca; padding: 5px 12px; border-radius: 8px; transition: 0.3s; }
        .logout-link:hover { background: #fecaca; color: #7f1d1d; }

        /* الحاوية الرئيسية */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* بطاقة الترحيب */
        .welcome-section {
            background: white;
            padding: 40px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            border-right: 8px solid var(--accent);
        }
        .user-avatar { width: 100px; height: 100px; background: #dbeafe; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--primary); }

        /* الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: var(--card-shadow); }
        .stat-card i { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
        .stat-value { display: block; font-size: 2rem; font-weight: 700; color: var(--secondary); }

        /* محتوى المسار */
        .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
        .content-card { background: white; padding: 30px; border-radius: 24px; box-shadow: var(--card-shadow); height: fit-content; }
        
        .track-box { background: #eff6ff; padding: 20px; border-radius: 15px; border: 1px dashed var(--accent); margin: 20px 0; }
        .btn-track { background: var(--primary); color: white; padding: 12px 25px; border-radius: 12px; text-decoration: none; display: inline-block; font-weight: 600; margin-top: 15px; transition: 0.3s; }
        .btn-track:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(30, 64, 175, 0.3); }

        /* فورم البيانات */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
        .btn-save { width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1rem; }

        /* شبكة الدورات */
        .courses-title { margin: 40px 0 20px; display: flex; align-items: center; gap: 10px; font-size: 1.5rem; }
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .course-item { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--card-shadow); border: 1px solid #f1f5f9; transition: 0.3s; }
        .course-item:hover { border-color: var(--accent); }
        .course-item h4 { color: var(--primary); margin-bottom: 10px; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .welcome-section { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <h2><i class="fas fa-shield-halved"></i> مركز الطالب</h2>
    </div>
    <div class="user-meta">
        <span id="header-email">---</span>
        <a href="#" class="logout-link" onclick="handleLogout()">خروج</a>
    </div>
</header>

<div class="container">
    <section class="welcome-section">
        <div class="user-avatar"><i class="fas fa-user-graduate"></i></div>
        <div class="info">
            <h1>مرحباً، <span id="display-name">...</span></h1>
            <p id="display-track" style="color: var(--accent); font-weight: 600; margin-top: 5px;">جاري تحميل المسار...</p>
        </div>
    </section>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fas fa-book"></i>
            <span class="stat-value" id="stat-count">0</span>
            <p>دورات مسجلة</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-certificate"></i>
            <span class="stat-value" id="stat-certs">0</span>
            <p>شهادات مكتملة</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-bolt"></i>
            <span class="stat-value" id="stat-avg">0%</span>
            <p>معدل الإنجاز</p>
        </div>
    </div>

    <div class="main-grid">
        <div class="content-card">
            <h3><i class="fas fa-road"></i> خطتك الدراسية المخصصة</h3>
            <div class="track-box" id="track-container">
                <p id="track-intro">بناءً على ملفك، تم إعداد المنهج التالي لك:</p>
                <div id="track-action-btn"></div>
            </div>
            
            <div class="courses-title">
                <i class="fas fa-layer-group"></i> دوراتك الحالية
            </div>
            <div id="courses-grid" class="courses-grid">
                </div>
        </div>

        <div class="content-card">
            <h3><i class="fas fa-id-card"></i> بياناتي</h3>
            <div style="margin-top: 20px;">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="input-name" placeholder="أدخل اسمك كما في الهوية">
                </div>
                <div class="form-group">
                    <label>رقم الجوال</label>
                    <input type="text" id="input-phone" placeholder="05xxxxxxxx">
                </div>
                <button class="btn-save" id="btn-save" onclick="saveProfile()">حفظ البيانات</button>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * بروتوكول التشغيل النظيف:
     * نستخدم (IIFE) لتغليف الكود ومنع أي تضارب في المتغيرات.
     */
    (function() {
        // التحقق من وجود المتغيرات مسبقاً لمنع خطأ "already declared"
        const CONFIG = {
            url: "https://suvpaunulhqfoclepwoz.supabase.co",
            key: "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
        };

        if (typeof window.supabaseClient === 'undefined') {
            window.supabaseClient = window.supabase.createClient(CONFIG.url, CONFIG.key);
        }

        const db = window.supabaseClient;
        let currentUser = null;

        // 1. تشغيل التطبيق
        async function startApp() {
            const { data: { session } } = await db.auth.getSession();
            
            if (!session) {
                window.location.href = "temp-login.html";
                return;
            }

            currentUser = session.user;
            document.getElementById('header-email').innerText = currentUser.email;

            await loadProfileData();
            await loadCoursesData();
        }

        // 2. تحميل الملف الشخصي
        async function loadProfileData() {
            let { data: profile } = await db.from('user_profile').select('*').eq('user_id', currentUser.id).maybeSingle();

            if (!profile) {
                // محاولة الربط بالايميل في حال وجود بيانات سابقة
                const { data: existing } = await db.from('user_profile').select('*').eq('email', currentUser.email).maybeSingle();
                if (existing) {
                    await db.from('user_profile').update({ user_id: currentUser.id }).eq('email', currentUser.email);
                    profile = existing;
                } else {
                    const { data: inserted } = await db.from('user_profile').insert([{
                        user_id: currentUser.id,
                        email: currentUser.email,
                        full_name: currentUser.email.split('@')[0],
                        track: 'مسار عام'
                    }]).select().single();
                    profile = inserted;
                }
            }

            if (profile) {
                document.getElementById('display-name').innerText = profile.full_name || 'طالب';
                document.getElementById('input-name').value = profile.full_name || '';
                document.getElementById('input-phone').value = profile.phone || '';
                document.getElementById('display-track').innerText = profile.track || 'مسار عام';
                setupTrackLink(profile.track);
            }
        }

        // 3. روابط المسارات الذكية
        function setupTrackLink(trackName) {
            const btnArea = document.getElementById('track-action-btn');
            const lowerTrack = (trackName || "").toLowerCase();
            let link = "https://cyberpath.vercel.app/docs/pathways/index.html";
            let label = "استعراض المسار العام";

            if (lowerTrack.includes("حاسب")) {
                link = "https://cyberpath.vercel.app/docs/pathways/tvtc-cs-diploma.html";
                label = "🔓 الدخول لمسار دبلوم الحاسب";
            } else if (lowerTrack.includes("أمن") || lowerTrack.includes("security")) {
                link = "https://cyberpath.vercel.app/docs/pathways/tvtc-cs-security.html";
                label = "🔓 الدخول لمسار الأمن السيبراني";
            }

            btnArea.innerHTML = `<a href="${link}" class="btn-track" target="_blank">${label}</a>`;
        }

        // 4. تحميل الدورات والإحصائيات
        async function loadCoursesData() {
            const { data: userCourses } = await db.from('user_courses').select('progress, completed, courses(title, slug, description)').eq('user_id', currentUser.id);
            const grid = document.getElementById('courses-grid');
            
            if (!userCourses || userCourses.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 20px;">لا توجد دورات مسجلة حالياً.</p>';
                return;
            }

            let completedCount = 0;
            let totalProgress = 0;
            grid.innerHTML = '';

            userCourses.forEach(item => {
                const c = item.courses;
                if (item.completed) completedCount++;
                totalProgress += (item.progress || 0);

                grid.innerHTML += `
                    <div class="course-item">
                        <h4>${c.title}</h4>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${item.progress || 0}%"></div>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                            <span>نسبة الإنجاز: ${item.progress || 0}%</span>
                            <a href="../courses/course-content.html?course=${c.slug}" style="color: var(--accent); font-weight: 600; text-decoration: none;">متابعة</a>
                        </div>
                    </div>
                `;
            });

            document.getElementById('stat-count').innerText = userCourses.length;
            document.getElementById('stat-certs').innerText = completedCount;
            document.getElementById('stat-avg').innerText = Math.round(totalProgress / userCourses.length) + "%";
        }

        // 5. حفظ الملف الشخصي
        window.saveProfile = async function() {
            const newName = document.getElementById('input-name').value;
            const newPhone = document.getElementById('input-phone').value;
            const btn = document.getElementById('btn-save');

            if (!newName) return Swal.fire('تنبيه', 'الاسم مطلوب', 'warning');

            btn.disabled = true;
            btn.innerText = 'جاري الحفظ...';

            const { error } = await db.from('user_profile').update({
                full_name: newName,
                phone: newPhone
            }).eq('user_id', currentUser.id);

            if (!error) {
                Swal.fire('تم!', 'تم تحديث بياناتك بنجاح', 'success');
                document.getElementById('display-name').innerText = newName;
            } else {
                Swal.fire('خطأ', error.message, 'error');
            }
            
            btn.disabled = false;
            btn.innerText = 'حفظ البيانات';
        };

        // 6. تسجيل الخروج
        window.handleLogout = async function() {
            await db.auth.signOut();
            window.location.href = "temp-login.html";
        };

        // التشغيل عند الجاهزية
        startApp();
    })();
</script>

</body>
</html>
