<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الطالب الموحدة | CyberPath</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --border: #334155; --success: #22c55e;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; text-align: right; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .profile-info h2 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .logout-btn { background: #f87171; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab { padding: 12px 20px; background: var(--card-bg); border-radius: 8px; cursor: pointer; transition: 0.3s; border: 1px solid var(--border); font-size: 0.9rem; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .card h3 { margin: 0 0 10px 0; color: var(--accent); font-size: 1.1rem; }
        .card p { font-size: 0.85rem; color: #94a3b8; line-height: 1.6; min-height: 40px; }

        /* Buttons & Progress */
        .btn { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-family: inherit; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-success { background: var(--success); color: white; }
        .progress-container { background: #334155; height: 8px; border-radius: 10px; margin: 15px 0 5px; overflow: hidden; }
        .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: 0.5s; }
        .status-text { font-size: 0.75rem; color: var(--accent); }

        .loading { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="profile-info" id="profile-area">جاري تحميل الملف...</div>
        <button class="logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="courses">📚 المقررات المتاحة</div>
        <div class="tab" data-tab="my-plan">📊 خطتي الدراسية</div>
        <div class="tab" data-tab="assignments">📝 التكليفات</div>
        <div class="tab" data-tab="quizzes">❓ الاختبارات</div>
    </div>

    <div id="tab-content" class="tab-content">
        </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    );

    let user = null;

    // 1. التحقق من الهوية وتحميل البروفايل
    async function init() {
        const { data: userData } = await supabase.auth.getUser();
        if (!userData.user) {
            window.location.href = "../login.html";
            return;
        }
        user = userData.user;

        const { data: profile } = await supabase.from("user_profile").select("*").eq("user_id", user.id).maybeSingle();
        
        document.getElementById("profile-area").innerHTML = `
            <h2>أهلاً، ${profile?.full_name || user.email.split('@')[0]} 👋</h2>
            <span class="status-text">المسار التدريبي: ${profile?.track || 'غير محدد'}</span>
        `;

        loadTab('courses'); // تحميل التبويب الافتراضي
    }

    // 2. متحكم التبويبات
    async function loadTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

        const container = document.getElementById('tab-content');
        container.innerHTML = '<div class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري التحميل...</div>';

        if (tabName === 'courses') await renderAllCourses(container);
        else if (tabName === 'my-plan') await renderMyProgress(container);
        else if (tabName === 'assignments') container.innerHTML = '<div class="card"><h3>قريباً.. قسم التكليفات</h3></div>';
        else if (tabName === 'quizzes') container.innerHTML = '<div class="card"><h3>قريباً.. قسم الاختبارات</h3></div>';
    }

    // 3. عرض كل المقررات (من منطق كودك السابق)
    async function renderAllCourses(container) {
        const { data: allCourses } = await supabase.from("courses").select("course_id, title, description");
        const { data: myEnrolls } = await supabase.from("enrollments").select("course_id").eq("user_id", user.id);
        const enrolledIds = myEnrolls?.map(e => e.course_id) || [];

        let html = '<div class="grid">';
        allCourses.forEach(c => {
            const isEnrolled = enrolledIds.includes(c.course_id);
            html += `
                <div class="card">
                    <h3>${c.title}</h3>
                    <p>${c.description || 'لا يوجد وصف متاح لهذا المقرر حالياً.'}</p>
                    ${isEnrolled 
                        ? `<button class="btn btn-success" onclick="window.location.href='../pages/course-player.html?course_id=${c.course_id}'">▶ استكمال التعلم</button>` 
                        : `<button class="btn btn-primary" onclick="enroll('${c.course_id}')">تسجيل في المقرر</button>`}
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
    }

    // 4. عرض خطتي الدراسية (التقدم)
    async function renderMyProgress(container) {
        const { data: enrollments } = await supabase
            .from("enrollments")
            .select(`course_id, courses(title, description)`)
            .eq("user_id", user.id);

        if (!enrollments || enrollments.length === 0) {
            container.innerHTML = '<div class="card"><h3>أنت غير مسجل في أي مقررات حالياً.</h3></div>';
            return;
        }

        let html = '<div class="grid">';
        for (const e of enrollments) {
            const progress = await calculateProgress(e.course_id);
            html += `
                <div class="card">
                    <h3>${e.courses.title}</h3>
                    <div class="progress-container"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <div class="status-text">نسبة الإنجاز: ${progress}%</div>
                    <button class="btn btn-primary" onclick="window.location.href='../pages/course-player.html?course_id=${e.course_id}'">فتح المحتوى</button>
                </div>
            `;
        }
        html += '</div>';
        container.innerHTML = html;
    }

    // 5. وظائف مساعدة
    async function calculateProgress(courseId) {
        const { count: total } = await supabase.from("lessons").select("*", { count: "exact", head: true }).eq("course_id", courseId);
        const { data: done } = await supabase.from("learning_progress").select("lesson_id").eq("user_id", user.id).eq("course_id", courseId);
        if (!total) return 0;
        return Math.round(((done?.length || 0) / total) * 100);
    }

    window.enroll = async (courseId) => {
        const { error } = await supabase.from("enrollments").insert({ user_id: user.id, course_id: courseId, completion_status: 'in_progress' });
        if (error) alert("خطأ في التسجيل: " + error.message);
        else { alert("تم التسجيل بنجاح! ✅"); loadTab('my-plan'); }
    };

    window.handleLogout = async () => {
        await supabase.auth.signOut();
        window.location.href = "../login.html";
    };

    // ربط مستمعي الأحداث للتبويبات
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => loadTab(tab.dataset.tab));
    });

    init();
</script>
</body>
</html>
