<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://suvpaunulhqfoclepwoz.supabase.co";
    const supabaseKey = "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let currentUserId = null;

    async function initDashboard() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = "temp-login.html"; return; }
        
        currentUserId = user.id;
        document.getElementById('user-email').innerText = user.email;

        // جلب بيانات البروفايل
        const { data: profile } = await supabase
            .from('user_profile')
            .select('*')
            .eq('user_id', currentUserId)
            .maybeSingle();

        if (profile) {
            document.getElementById('user-name').innerText = profile.full_name;
            document.getElementById('edit-name').value = profile.full_name;
            document.getElementById('edit-phone').value = profile.phone || "";
            document.getElementById('user-track').innerText = profile.track || "غير محدد";
            
            generateTrackLink(profile.track);
            
            // التحديث هنا: استدعاء الدالة المطورة للربط الديناميكي
            await loadStudentPlanWithProgress(profile.track);
        }
    }

    // الدالة المطورة للربط الديناميكي (التحديث الذي طلبته)
    async function loadStudentPlanWithProgress(userTrack) {
        const container = document.getElementById('plan-container');
        
        try {
            // جلب المواد بناءً على المسار مع حالة التسجيل لهذا المستخدم تحديداً
            // ملاحظة: نستخدم Inner Join لضمان جلب مواد المسار الصحيح
            const { data: courses, error } = await supabase
                .from('courses')
                .select(`
                    id, 
                    title, 
                    semester, 
                    credit_hours,
                    enrollments!left (
                        completion_status,
                        progress_percent
                    )
                `)
                .eq('track', userTrack) // فلترة المسار
                .order('semester', { ascending: true });

            if (error) throw error;

            if (!courses || courses.length === 0) {
                container.innerHTML = `<div class="empty-state">لا توجد مواد مسجلة لمسار ${userTrack}</div>`;
                return;
            }

            // تحويل البيانات لتناسب وظيفة الـ Render الموجودة في كودك الأصلي
            const formattedPlan = courses.map(c => ({
                semester: c.semester,
                course_id: c.id,
                courses: {
                    title: c.title,
                    credit_hours: c.credit_hours,
                    enrollments: c.enrollments // ستكون مصفوفة تحتوي على حالة المستخدم
                }
            }));

            renderEnhancedPlanUI(formattedPlan);

        } catch (err) {
            console.error("خطأ في الربط الديناميكي:", err.message);
            container.innerHTML = `<div class="empty-state">حدث خطأ أثناء تحميل الخطة الدراسية</div>`;
        }
    }

    // نستخدم نفس دالة الـ UI الخاصة بك لضمان بقاء المظهر كما هو
    function renderEnhancedPlanUI(plan) {
        const container = document.getElementById('plan-container');
        container.innerHTML = '';

        const semestersMap = new Map();
        let totalCourses = 0;
        let completedCount = 0;
        let inProgressCount = 0;
        
        plan.forEach(item => {
            const sem = item.semester;
            const enrollData = item.courses?.enrollments?.[0]; // نأخذ أول نتيجة تسجيل للمستخدم
            const status = enrollData?.completion_status || 'not_started';
            
            if (!semestersMap.has(sem)) semestersMap.set(sem, []);
            semestersMap.get(sem).push({ ...item, status });
            
            totalCourses++;
            if (status === 'completed') completedCount++;
            else if (status === 'in_progress') inProgressCount++;
        });
        
        updateProgressSummary(totalCourses, completedCount, inProgressCount);
        
        const sortedSemesters = Array.from(semestersMap.keys()).sort((a, b) => a - b);
        sortedSemesters.forEach(sem => {
            const semesterData = semestersMap.get(sem);
            const semesterSection = document.createElement('div');
            semesterSection.className = 'semester-section';
            
            const completedInSem = semesterData.filter(item => item.status === 'completed').length;
            
            const accordionBtn = document.createElement('button');
            accordionBtn.className = 'accordion-btn';
            accordionBtn.innerHTML = `
                <span>📖 الفصل التدريبي ${sem}</span>
                <span style="font-size: 0.8rem; background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 20px;">
                    ${completedInSem}/${semesterData.length} مكتمل
                    <i class="fas fa-chevron-down" style="margin-right: 10px;"></i>
                </span>
            `;
            
            const panel = document.createElement('div');
            panel.className = 'panel';
            
            semesterData.forEach(item => {
                const status = item.status;
                const courseRow = document.createElement('div');
                courseRow.className = `course-row status-${status}`;
                courseRow.innerHTML = `
                    <div class="course-info">
                        <i class="${getStatusIcon(status)}"></i>
                        <span><strong>${item.courses.title}</strong></span>
                        <span class="course-hours">${item.courses.credit_hours} ساعة</span>
                    </div>
                    <div class="course-badge">${getStatusText(status)}</div>
                `;
                panel.appendChild(courseRow);
            });
            
            accordionBtn.addEventListener('click', function() {
                this.classList.toggle('active');
                panel.classList.toggle('show');
            });
            
            semesterSection.appendChild(accordionBtn);
            semesterSection.appendChild(panel);
            container.appendChild(semesterSection);
        });
    }

    // الدوال المساعدة (تبقى كما هي في كودك الأصلي لضمان الاستمرارية)
    function updateProgressSummary(total, completed, inProgress) {
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById('total-courses').innerText = total;
        document.getElementById('completed-courses').innerText = completed;
        document.getElementById('in-progress-courses').innerText = inProgress;
        document.getElementById('progress-fill').style.width = `${percent}%`;
        document.getElementById('progress-percent').innerHTML = `نسبة الإنجاز: ${percent}%`;
        document.getElementById('progress-summary').style.display = 'flex';
    }

    function getStatusIcon(status) {
        if (status === 'completed') return 'fas fa-check-circle';
        if (status === 'in_progress') return 'fas fa-spinner fa-pulse';
        return 'far fa-circle';
    }

    function getStatusText(status) {
        const map = { 'completed': '✅ مكتمل', 'in_progress': '🔄 قيد الدراسة', 'not_started': '⏳ لم يبدأ بعد' };
        return map[status] || '⏳ لم يبدأ بعد';
    }

    // بقية دوال الـ Profile والـ Logout تبقى كما هي في ملفك...
    window.handleLogout = async function() { ... };
    window.updateProfile = async function() { ... };
    function generateTrackLink(track) { ... };

    initDashboard();
</script>
