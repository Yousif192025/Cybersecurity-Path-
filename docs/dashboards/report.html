<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير المتدرب الأكاديمي | CyberPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --secondary: #2563eb; --success: #10b981; --warning: #f59e0b; --gray: #64748b; --light: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; padding: 20px; direction: rtl; color: #1e293b; }
        .container { max-width: 900px; margin: auto; }
        
        .search-box { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; }
        .btn-search { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .report-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); display: none; border: 1px solid #e2e8f0; }
        .report-header { background: var(--primary); color: white; padding: 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--success); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .stat-btn { border: none; padding: 20px; border-radius: 12px; cursor: pointer; transition: 0.2s; color: white; text-align: center; }
        .stat-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .stat-completed { background: var(--success); }
        .stat-progress { background: var(--warning); }
        .stat-pending { background: var(--gray); }
        .stat-value { font-size: 2rem; font-weight: bold; display: block; }

        .progress-section { padding: 20px; background: var(--light); border-bottom: 1px solid #e2e8f0; }
        .progress-bar-bg { background: #e2e8f0; height: 12px; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar-fill { background: var(--success); height: 100%; transition: width 1s ease; }

        .table-container { padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 0.85rem; text-align: right; }
        td { padding: 15px 12px; border-bottom: 1px solid #f1f5f9; }
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .pill-done { background: #dcfce7; color: #166534; }
        .pill-ongoing { background: #fef3c7; color: #92400e; }
        .pill-todo { background: #f1f5f9; color: #475569; }

        @media print {
            .search-box, .btn-print { display: none !important; }
            body { background: white; padding: 0; }
            .report-card { box-shadow: none; border: 1px solid #eee; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <input type="text" id="student-query" placeholder="أدخل رقم الهوية أو الاسم الكامل للمتدرب...">
        <button class="btn-search" onclick="fetchStudentReport()">عرض التقرير</button>
    </div>

    <div id="report-content" class="report-card">
        <div class="report-header">
            <div>
                <h2 id="rep-name">اسم المتدرب</h2>
                <p id="rep-track">المسار الدراسي</p>
                <p id="rep-id" style="font-size: 0.8rem; opacity: 0.8;"></p>
            </div>
            <div style="text-align: left;">
                <div id="rep-percent" style="font-size: 2.5rem; font-weight: bold;">0%</div>
                <span>نسبة الإنجاز</span>
            </div>
        </div>

        <div class="stats-grid">
            <button class="stat-btn stat-completed" onclick="filterTable('completed')">
                <span class="stat-value" id="count-done">0</span>
                <span>مكتملة ✅</span>
            </button>
            <button class="stat-btn stat-progress" onclick="filterTable('in_progress')">
                <span class="stat-value" id="count-ongoing">0</span>
                <span>قيد الدراسة 🔄</span>
            </button>
            <button class="stat-btn stat-pending" onclick="filterTable('pending')">
                <span class="stat-value" id="count-left">0</span>
                <span>متبقية ⚪</span>
            </button>
        </div>

        <div class="progress-section">
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold;">
                <span id="progress-text">0 / 0 مقرر</span>
                <span id="rep-group">المجموعة</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar-fill" style="width: 0%;"></div></div>
        </div>

        <div class="table-container">
            <h3 id="view-title" style="margin-bottom: 15px; font-size: 1.1rem;">خطة المقررات</h3>
            <table>
                <thead>
                    <tr><th>اسم المقرر</th><th>الحالة</th><th>النسبة</th></tr>
                </thead>
                <tbody id="rep-table"></tbody>
            </table>
        </div>
        
        <div style="padding: 20px; text-align: center;" class="btn-print">
            <button onclick="window.print()" style="padding: 10px 20px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc;">🖨️ طباعة أو حفظ PDF</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    const supabase = createClient("https://suvpaunulhqfoclepwoz.supabase.co", "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b");

    let allSystemCourses = [];
    let studentEnrollments = [];
    let isCyber = false;

    async function init() {
        const { data } = await supabase.from('courses').select('course_id, title');
        allSystemCourses = data || [];
    }

    window.fetchStudentReport = async function() {
        const queryText = document.getElementById('student-query').value.trim();
        if (!queryText) return;

        const { data: users } = await supabase.from('user_profile').select('*')
            .or(`national_id.eq."${queryText}",full_name.ilike.%${queryText}%`);

        if (!users || users.length === 0) return alert("المتدرب غير موجود");
        
        const user = users[0];
        isCyber = (user.track || "").includes("امن") || (user.track || "").includes("Cyber");

        const { data: enrolls } = await supabase.from('enrollments').select('*, courses(title)').eq('user_id', user.user_id);
        studentEnrollments = enrolls || [];

        renderDashboard(user);
    }

    function renderDashboard(user) {
        const totalReq = isCyber ? 28 : 29;
        
        // تصفية المقررات المتاحة للمسار
        const eligibleCourses = allSystemCourses.filter(c => {
            if (!isCyber && c.title.includes("أمن الشبكات والاتصالات")) return false;
            return true;
        });

        // المقررات المكتملة وقيد الدراسة
        const done = studentEnrollments.filter(e => e.completion_status === 'completed').length;
        const ongoing = studentEnrollments.filter(e => e.completion_status === 'in_progress').length;
        const left = totalReq - (done + ongoing);
        const perc = Math.round((done / totalReq) * 100);

        document.getElementById('report-content').style.display = 'block';
        document.getElementById('rep-name').innerText = user.full_name;
        document.getElementById('rep-track').innerText = user.track;
        document.getElementById('rep-id').innerText = "هوية: " + user.national_id;
        document.getElementById('rep-group').innerText = "المجموعة: " + (user.group_name || "-");
        document.getElementById('count-done').innerText = done;
        document.getElementById('count-ongoing').innerText = ongoing;
        document.getElementById('count-left').innerText = left > 0 ? left : 0;
        document.getElementById('rep-percent').innerText = perc + "%";
        document.getElementById('bar-fill').style.width = perc + "%";
        document.getElementById('progress-text').innerText = `${done} من أصل ${totalReq} مقرر مكتمل`;

        filterTable('all');
    }

    window.filterTable = function(mode) {
        const tbody = document.getElementById('rep-table');
        const vTitle = document.getElementById('view-title');
        
        // جلب المقررات المستحقة للمسار فقط
        let eligible = allSystemCourses.filter(c => {
            if (!isCyber && c.title.includes("أمن الشبكات والاتصالات")) return false;
            return true;
        });

        let html = "";

        eligible.forEach(course => {
            const enroll = studentEnrollments.find(e => e.course_id === course.course_id);
            const status = enroll ? enroll.completion_status : 'not_started';
            const percentage = enroll ? enroll.completion_percentage : 0;

            const row = `<tr>
                <td style="font-weight:bold;">${course.title}</td>
                <td><span class="status-pill ${status === 'completed' ? 'pill-done' : (status === 'in_progress' ? 'pill-ongoing' : 'pill-todo')}">
                    ${status === 'completed' ? 'مكتمل ✅' : (status === 'in_progress' ? 'قيد الدراسة 🔄' : 'متبقية ⚪')}
                </span></td>
                <td>${percentage}%</td>
            </tr>`;

            if (mode === 'all') html += row;
            else if (mode === 'completed' && status === 'completed') html += row;
            else if (mode === 'in_progress' && status === 'in_progress') html += row;
            else if (mode === 'pending' && (status === 'not_started' || status === 'pending')) html += row;
        });

        vTitle.innerText = mode === 'all' ? "خطة المقررات الكاملة" : 
                         mode === 'completed' ? "المقررات المكتملة" : 
                         mode === 'in_progress' ? "المقررات قيد الدراسة" : "المقررات المتبقية";
        
        tbody.innerHTML = html || '<tr><td colspan="3" style="text-align:center; padding:20px; color:#94a3b8;">لا توجد بيانات لهذا الفلتر</td></tr>';
    }

    init();
</script>
</body>
</html>
