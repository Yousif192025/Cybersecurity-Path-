<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير المتدرب الأكاديمي | CyberPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #1e3a8a; 
            --secondary: #2563eb; 
            --success: #10b981; 
            --warning: #f59e0b; 
            --gray-text: #475569;
            --border-color: #e2e8f0;
            --bg-light: #f8fafc;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #f1f5f9; 
            padding: 40px 20px; 
            direction: rtl; 
            color: #1e293b; 
            line-height: 1.6;
        }

        .container { max-width: 950px; margin: auto; }
        
        /* مربع البحث - تباعد مريح */
        .search-box { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            display: flex; 
            gap: 15px; 
            align-items: center;
        }
        input { 
            flex: 1; 
            padding: 14px 18px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            font-family: inherit; 
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--secondary); }
        .btn-search { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px 30px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 1rem;
        }

        /* بطاقة التقرير - تنظيم المساحات */
        .report-card { 
            background: white; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            display: none; 
            border: 1px solid var(--border-color);
        }

        /* رأس التقرير */
        .report-header { 
            background: var(--primary); 
            color: white; 
            padding: 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .report-header h2 { margin: 0 0 10px 0; font-size: 2rem; letter-spacing: -0.5px; }
        .report-header p { margin: 4px 0; opacity: 0.9; font-size: 1.1rem; }

        /* البطاقات الإحصائية - تباعد متساوٍ */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            padding: 30px; 
            background: white;
        }
        .stat-btn { 
            border: none; 
            padding: 25px 15px; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            color: white; 
            text-align: center;
        }
        .stat-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .stat-completed { background: var(--success); }
        .stat-progress { background: var(--warning); }
        .stat-pending { background: #64748b; }
        .stat-value { font-size: 2.2rem; font-weight: 700; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 1rem; font-weight: 500; }

        /* شريط الإنجاز */
        .progress-section { 
            padding: 0 30px 30px 30px; 
            background: white;
        }
        .progress-info {
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 12px; 
            font-weight: 600;
            color: var(--gray-text);
        }
        .progress-bar-bg { 
            background: #f1f5f9; 
            height: 16px; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid #e2e8f0;
        }
        .progress-bar-fill { 
            background: linear-gradient(90deg, var(--success), #34d399); 
            height: 100%; 
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* الجدول - تباعد مريح للأسطر */
        .table-container { padding: 30px; border-top: 1px solid #f1f5f9; }
        .table-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        table { width: 100%; border-collapse: collapse; }
        th { 
            background: var(--bg-light); 
            padding: 15px; 
            border-bottom: 2px solid var(--border-color); 
            color: var(--gray-text);
            font-weight: 700;
            text-align: right;
        }
        td { 
            padding: 20px 15px; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 1.05rem;
            vertical-align: middle;
        }
        tr:hover { background-color: #fafafa; }

        .status-pill { 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: 700; 
        }
        .pill-done { background: #dcfce7; color: #15803d; }
        .pill-ongoing { background: #fef3c7; color: #92400e; }
        .pill-todo { background: #f1f5f9; color: #475569; }

        .btn-print-area { padding: 30px; text-align: center; background: var(--bg-light); }
        .btn-print {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-print:hover { background: #f8fafc; border-color: #94a3b8; }

        @media print {
            body { background: white; padding: 0; }
            .search-box, .btn-print-area { display: none !important; }
            .container { max-width: 100%; }
            .report-card { border: none; box-shadow: none; }
            .stat-btn { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <input type="text" id="student-query" placeholder="ابحث برقم الهوية الوطنية أو الاسم الكامل للمتدرب...">
        <button class="btn-search" onclick="fetchStudentReport()">عرض التقرير</button>
    </div>

    <div id="report-content" class="report-card">
        <div class="report-header">
            <div>
                <h2 id="rep-name">اسم المتدرب</h2>
                <p id="rep-track">المسار الدراسي</p>
                <p id="rep-id"></p>
            </div>
            <div style="text-align: left;">
                <div id="rep-percent" style="font-size: 3.5rem; font-weight: 800; line-height: 1;">0%</div>
                <div style="font-weight: 500; margin-top: 5px; opacity: 0.9;">معدل الإنجاز العام</div>
            </div>
        </div>

        <div class="stats-grid">
            <button class="stat-btn stat-completed" onclick="filterTable('completed')">
                <span class="stat-value" id="count-done">0</span>
                <span class="stat-label">مقررات مكتملة</span>
            </button>
            <button class="stat-btn stat-progress" onclick="filterTable('in_progress')">
                <span class="stat-value" id="count-ongoing">0</span>
                <span class="stat-label">قيد الدراسة</span>
            </button>
            <button class="stat-btn stat-pending" onclick="filterTable('pending')">
                <span class="stat-value" id="count-left">0</span>
                <span class="stat-label">مقررات متبقية</span>
            </button>
        </div>

        <div class="progress-section">
            <div class="progress-info">
                <span id="progress-text">0 / 0 مقرر مكتمل</span>
                <span id="rep-group" style="color: var(--primary);">المجموعة: -</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="bar-fill" style="width: 0%;"></div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header-flex">
                <h3 id="view-title" style="margin: 0; color: var(--primary);">خطة المقررات الكاملة</h3>
                <button onclick="filterTable('all')" style="cursor:pointer; background:none; border:1px solid #ccc; padding:5px 12px; border-radius:6px; font-family:inherit;">عرض الكل</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 50%;">اسم المقرر الدراسي</th>
                        <th style="width: 25%;">حالة الإنجاز</th>
                        <th style="width: 25%;">النسبة</th>
                    </tr>
                </thead>
                <tbody id="rep-table">
                    </tbody>
            </table>
        </div>
        
        <div class="btn-print-area">
            <button class="btn-print" onclick="window.print()">
                <span>🖨️ طباعة التقرير الرسمي أو حفظ بصيغة PDF</span>
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    const supabase = createClient("https://suvpaunulhqfoclepwoz.supabase.co", "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b");

    let allSystemCourses = [];
    let studentEnrollments = [];
    let isCyber = false;

    async function init() {
        const { data } = await supabase.from('courses').select('course_id, title');
        allSystemCourses = data || [];
    }

    window.fetchStudentReport = async function() {
        const queryText = document.getElementById('student-query').value.trim();
        if (!queryText) return alert("يرجى إدخال اسم أو رقم هوية");

        const { data: users } = await supabase.from('user_profile').select('*')
            .or(`national_id.eq."${queryText}",full_name.ilike.%${queryText}%`);

        if (!users || users.length === 0) return alert("عذراً، لم يتم العثور على متدرب بهذه البيانات");
        
        const user = users[0];
        isCyber = (user.track || "").includes("امن") || (user.track || "").includes("Cyber");

        const { data: enrolls } = await supabase.from('enrollments').select('*, courses(title)').eq('user_id', user.user_id);
        studentEnrollments = enrolls || [];

        renderDashboard(user);
    }

    function renderDashboard(user) {
        const totalReq = isCyber ? 28 : 29;
        
        const done = studentEnrollments.filter(e => e.completion_status === 'completed').length;
        const ongoing = studentEnrollments.filter(e => e.completion_status === 'in_progress').length;
        const left = totalReq - (done + ongoing);
        const perc = Math.round((done / totalReq) * 100);

        document.getElementById('report-content').style.display = 'block';
        document.getElementById('rep-name').innerText = user.full_name;
        document.getElementById('rep-track').innerText = "المسار: " + (user.track || "غير محدد");
        document.getElementById('rep-id').innerText = "رقم الهوية: " + (user.national_id || "-");
        document.getElementById('rep-group').innerText = "المجموعة: " + (user.group_name || "-");
        document.getElementById('count-done').innerText = done;
        document.getElementById('count-ongoing').innerText = ongoing;
        document.getElementById('count-left').innerText = left > 0 ? left : 0;
        document.getElementById('rep-percent').innerText = perc + "%";
        document.getElementById('bar-fill').style.width = perc + "%";
        document.getElementById('progress-text').innerText = `${done} من أصل ${totalReq} مقرر مكتمل`;

        filterTable('all');
    }

    window.filterTable = function(mode) {
        const tbody = document.getElementById('rep-table');
        const vTitle = document.getElementById('view-title');
        
        let eligible = allSystemCourses.filter(c => {
            if (!isCyber && c.title.includes("أمن الشبكات والاتصالات")) return false;
            return true;
        });

        let html = "";
        eligible.forEach(course => {
            const enroll = studentEnrollments.find(e => e.course_id === course.course_id);
            const status = enroll ? enroll.completion_status : 'not_started';
            const percentage = enroll ? enroll.completion_percentage : 0;

            const row = `<tr>
                <td style="font-weight:600; color:#1e293b;">${course.title}</td>
                <td><span class="status-pill ${status === 'completed' ? 'pill-done' : (status === 'in_progress' ? 'pill-ongoing' : 'pill-todo')}">
                    ${status === 'completed' ? 'مكتمل ✅' : (status === 'in_progress' ? 'قيد الدراسة 🔄' : 'متبقية ⚪')}
                </span></td>
                <td style="font-weight:bold; color:var(--gray-text);">${percentage}%</td>
            </tr>`;

            if (mode === 'all') html += row;
            else if (mode === 'completed' && status === 'completed') html += row;
            else if (mode === 'in_progress' && status === 'in_progress') html += row;
            else if (mode === 'pending' && status === 'not_started') html += row;
        });

        vTitle.innerText = mode === 'all' ? "خطة المقررات الكاملة" : 
                         mode === 'completed' ? "المقررات المكتملة" : 
                         mode === 'in_progress' ? "المقررات قيد الدراسة" : "المقررات المتبقية";
        
        tbody.innerHTML = html || '<tr><td colspan="3" style="text-align:center; padding:40px; color:#94a3b8;">لا توجد مقررات في هذا القسم حالياً</td></tr>';
    }

    init();
</script>
</body>
</html>
