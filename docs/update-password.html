<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | CyberPath</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .update-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h2 { text-align: center; margin-bottom: 25px; color: #38bdf8; }
        p { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #4ade80; /* لون أخضر للنجاح */
            border: none;
            color: #064e3b;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #22c55e; transform: translateY(-2px); }

        #message { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
        .error-msg { color: #f87171; }
        .success-msg { color: #4ade80; }
    </style>
</head>
<body>

<div class="update-box">
    <h2>New Password</h2>
    <p>Enter your new password below to regain access to your account.</p>
    
    <input id="new-password" type="password" placeholder="New Password (min 6 chars)">
    <input id="confirm-password" type="password" placeholder="Confirm New Password">
    
    <button onclick="updatePassword()">Update & Login</button>
    
    <p id="message"></p>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    )

    const message = document.getElementById("message");

    window.updatePassword = async function() {
        const password = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;

        // التحقق من المدخلات
        if (password.length < 6) {
            message.innerText = "Password must be at least 6 characters";
            message.className = "error-msg";
            return;
        }

        if (password !== confirm) {
            message.innerText = "Passwords do not match";
            message.className = "error-msg";
            return;
        }

        // تحديث كلمة المرور في Supabase
        const { data, error } = await supabase.auth.updateUser({
            password: password
        });

        if (error) {
            message.innerText = error.message;
            message.className = "error-msg";
        } else {
            message.className = "success-msg";
            message.innerText = "Password updated successfully! Redirecting...";
            
            // توجيه المستخدم لصفحة تسجيل الدخول بعد 2 ثانية
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        }
    }
</script>

</body>
</html>
