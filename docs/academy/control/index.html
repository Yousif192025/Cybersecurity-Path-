<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="robots" content="noindex, nofollow">
  <title>مركز التحكم | CyberPath</title>
  <link rel="stylesheet" href="./assets/css/control.css">
  <script type="module" src="./assets/js/control.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/academy/" aria-label="CyberPath - الصفحة الرئيسية">
      <span class="brand-mark">CP</span>
      <span>CyberPath</span>
    </a>
    <div class="topbar-actions">
      <a class="public-link" href="/academy/">الأكاديمية</a>
      <button id="logout-button" class="logout-button" type="button" hidden>
        تسجيل الخروج
      </button>
    </div>
  </header>

  <main class="page-shell">
    <section class="welcome-panel" aria-labelledby="page-title">
      <div class="eyebrow">CYBERPATH · CONTROL CENTER</div>
      <h1 id="page-title">مركز التحكم</h1>
      <p id="page-description">
        مساحة موحدة لإدارة تجربتك التعليمية وفق صلاحيات حسابك.
      </p>
    </section>

    <section id="status-panel" class="status-panel" aria-live="polite">
      <span class="loader" aria-hidden="true"></span>
      <p id="status-message">جارٍ التحقق من الجلسة والصلاحيات...</p>
    </section>

    <section id="control-content" class="control-content" aria-live="polite" hidden>
    </section>

    <footer class="page-footer">
      <span>CyberPath</span>
      <span>التعلم والأمن السيبراني في مساحة واحدة</span>
    </footer>
  </main>
</body>
</html>
