<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="مركز التحكم في أكاديمية CyberPath">
  <title>مركز التحكم | CyberPath</title>
  <link rel="stylesheet" href="/academy/control/assets/css/control.css">
  <script type="module" src="/academy/control/assets/js/control.js"></script>
</head>
<body>
  <div class="control-shell">
    <header class="control-topbar">
      <a class="control-brand" href="/academy/" aria-label="العودة إلى الأكاديمية">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>CyberPath</span>
      </a>

      <div class="topbar-actions">
        <a class="academy-link" href="/academy/">الأكاديمية</a>
        <button class="logout-button" id="logout-button" type="button">
          تسجيل الخروج
        </button>
      </div>
    </header>

    <div class="control-layout">
      <aside class="control-sidebar" aria-label="التنقل الرئيسي">
        <div class="sidebar-heading">
          <span class="sidebar-eyebrow">مساحة العمل</span>
          <h2>مركز التحكم</h2>
        </div>

        <nav class="control-nav">
          <a class="nav-link active" href="/academy/control/" aria-current="page">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>الرئيسية</span>
          </a>
          <a class="nav-link" href="/academy/traincourses/">
            <span class="nav-icon" aria-hidden="true">▤</span>
            <span>الدورات التدريبية</span>
          </a>
          <a class="nav-link" href="/academy/career-paths/">
            <span class="nav-icon" aria-hidden="true">◎</span>
            <span>المسارات المهنية</span>
          </a>
          <a class="nav-link" href="/academy/guidance/">
            <span class="nav-icon" aria-hidden="true">؟</span>
            <span>الدعم والإرشاد</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>بوابة الأكاديمية</span>
        </div>
      </aside>

      <main class="control-main">
        <div id="control-root" aria-live="polite" aria-busy="true">
          <p class="loading-message">جارٍ التحقق من الجلسة وتجهيز مساحة العمل...</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
