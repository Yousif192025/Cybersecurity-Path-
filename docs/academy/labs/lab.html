<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل مختبر | Labs Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/labs.css" />
</head>
<body class="labs-body">
  <div class="labs-shell">
    <div class="labs-topnav">
      <a class="labs-brand" href="/academy/labs/">CyberPath <span>Labs</span></a>
      <nav aria-label="تنقل مركز المختبرات">
        <a href="/academy/labs/">المركز</a>
        <a href="/academy/labs/lab.html" aria-current="page">التفاصيل</a>
        <a href="/academy/labs/run.html">التشغيل</a>
        <a href="/academy/labs/results.html">النتائج</a>
        <a href="/academy/">الأكاديمية</a>
      </nav>
    </div>
    <main>
      <p class="eyebrow" style="color:var(--labs-cyan);font-weight:700;font-size:0.85rem">Lab Details</p>
      <h1 id="lab-title" style="margin-top:0.25rem">تفاصيل المختبر</h1>
      <p id="lab-summary" class="section-desc"></p>
      <div class="labs-card" style="margin-top:1rem">
        <p>المعرف: <code id="lab-id-display">—</code></p>
        <div id="lab-meta-mount"><p class="section-desc">جاري التحميل…</p></div>
        <div class="labs-hero-actions" style="margin-top:1rem">
          <a class="btn-labs btn-labs-primary" id="link-run" href="/academy/labs/run.html">بدء المختبر</a>
          <a class="btn-labs btn-labs-ghost" id="link-workshop" href="#" hidden>ورشة مرتبطة (اختياري)</a>
          <a class="btn-labs btn-labs-ghost" href="/academy/labs/">العودة للمركز</a>
        </div>
      </div>
    </main>
    <footer class="labs-footer"><span>Labs Center</span><a href="/academy/labs/">الرئيسية</a></footer>
  </div>
  <script src="js/labs-data.js"></script>
  <script src="js/labs-router.js"></script>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("id") || "lab-soc-phishing-email-01";
      document.getElementById("lab-id-display").textContent = id;
      document.getElementById("link-run").href =
        LabsRouter.labRun(id, "simulation");
      LabsData.loadLabsIndex().then(function (index) {
        var lab = LabsData.getLabById(index, id);
        var mount = document.getElementById("lab-meta-mount");
        if (!lab) {
          mount.innerHTML = "<p>لا يوجد مختبر بهذا المعرف في السجل.</p>";
          return;
        }
        document.getElementById("lab-title").textContent = lab.title || id;
        document.getElementById("lab-summary").textContent = lab.summary || "";
        document.title = (lab.title || "مختبر") + " | Labs Center";
        mount.innerHTML =
          "<ul style='margin:0;padding-right:1.1rem'>" +
          "<li>المجال: " + (lab.domainLabel || lab.domain || "") + "</li>" +
          "<li>المستوى: " + (lab.levelLabel || lab.level || "") + "</li>" +
          "<li>النوع: " + (lab.type || "") + "</li>" +
          "<li>المدة التقديرية: " + (lab.durationMinutes || "—") + " دقيقة</li>" +
          "<li>الحالة: " + (lab.status || "") + "</li></ul>";
        if (lab.relatedWorkshop) {
          var w = document.getElementById("link-workshop");
          w.hidden = false;
          w.href = lab.relatedWorkshop;
        }
        if (lab.type) {
          document.getElementById("link-run").href = LabsRouter.labRun(
            id,
            LabsRouter.runnerForType(lab.type)
          );
        }
      }).catch(function () {
        document.getElementById("lab-meta-mount").innerHTML =
          "<p>تعذر تحميل البيانات.</p>";
      });
    })();
  </script>
</body>
</html>
