<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خدمات الحكومة الإلكترونية وتطبيقاتها: الاستخدام الآمن والوعي السيبراني</title>
<style>
:root{--bg:#f4f6fa;--sf:#fff;--tx:#14213d;--mu:#5b6578;--p:#0b2a5b;--m:#1f5fbf;--ac:#f2a900;--bd:#d9e0ec;--ok:#1b8a5a;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1424;--sf:#15203a;--tx:#e8eefb;--mu:#9fb0cf;--p:#7fb0ff;--m:#5b95ec;--bd:#2a3a5e}}
:root[data-theme="dark"]{--bg:#0c1424;--sf:#15203a;--tx:#e8eefb;--mu:#9fb0cf;--p:#7fb0ff;--m:#5b95ec;--bd:#2a3a5e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.9;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--p);color:#fff;flex-wrap:wrap}
header h1{font-size:15px;margin:0;flex:1;min-width:140px}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
header button.on{background:var(--ac);color:#14213d;border-color:var(--ac)}
#pb{height:5px;background:var(--bd)}#pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.w{flex:1;display:flex;min-height:0}
nav{width:250px;overflow:auto;background:var(--sf);border-inline-end:1px solid var(--bd);padding:8px}
nav button{display:block;width:100%;text-align:start;background:none;border:0;color:var(--tx);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
nav button.a{background:var(--m);color:#fff}nav button:hover:not(.a){background:var(--bg)}
main{flex:1;overflow:auto;padding:22px clamp(14px,4vw,48px)}
.sl{max-width:1000px;margin:auto;animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.tag{color:var(--m);font-weight:700;font-size:13px}
h2{font-size:clamp(22px,3.2vw,32px);color:var(--p);margin:2px 0 10px}
p{margin:8px 0}b.k{color:var(--m)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.cd{background:var(--sf);border:1px solid var(--bd);border-top:4px solid var(--m);border-radius:12px;padding:10px 12px;text-align:start;cursor:pointer;font:inherit;color:var(--tx);align-self:start}
.cd b{display:block;color:var(--p)}.cd b:after{content:" +";color:var(--ac)}.cd.o b:after{content:" −"}
.cd span{display:none;font-size:13.5px;color:var(--mu);margin-top:6px}.cd.o span{display:block}
.fl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.fl div{background:var(--p);color:#fff;padding:8px 14px;border-radius:30px;font-size:14px}
.fl em{color:var(--ac);font-style:normal;font-weight:700}
.fl .h{background:var(--ac);color:#14213d;font-weight:700}
.bx{background:var(--sf);border:1px solid var(--bd);border-inline-start:5px solid var(--ac);border-radius:10px;padding:10px 16px;margin:14px 0}
.cmp{width:100%;border-collapse:collapse;background:var(--sf);font-size:14px}.cmp td,.cmp th{border:1px solid var(--bd);padding:6px 10px;text-align:start}.cmp th{background:var(--p);color:#fff}
.qz{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:14px 0}
.qz .ops button{display:block;width:100%;text-align:start;margin:5px 0;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.ops button.ok{background:var(--ok);color:#fff}.ops button.no{background:var(--no);color:#fff}.ex{display:none;color:var(--mu);font-size:14px}
textarea{width:100%;min-height:50px;border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;background:var(--sf);color:var(--tx)}
.tn{display:none;background:#fff8e1;color:#4a3b00;border:2px dashed var(--ac);border-radius:12px;padding:8px 16px;margin-top:18px;font-size:14px}
body.tr .tn{display:block}.tn h4{margin:2px 0;color:#8a5a00}
.src{font-size:12px;color:var(--mu);margin-top:14px}
.big{background:linear-gradient(135deg,var(--p),var(--m));color:#fff;border-radius:18px;padding:clamp(18px,4vw,40px);text-align:center}
.big h2{color:#fff;font-size:clamp(26px,5vw,44px)}.big .lg{background:#fff;border-radius:10px;padding:6px 12px;display:inline-flex;gap:14px;align-items:center;margin:8px 0}.lg img{height:56px;max-width:44vw}
.big .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.meta span{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:13px}
.btn{background:var(--ac);color:#14213d;border:0;border-radius:10px;padding:10px 24px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--sf);border-top:1px solid var(--bd)}
footer button{background:var(--m);color:#fff;border:0;border-radius:8px;padding:8px 18px;font:inherit;cursor:pointer}footer button:disabled{opacity:.4}
#mn{display:none}
@media(max-width:800px){#mn{display:inline-block}nav{position:fixed;inset:0 auto 0 0;z-index:9;width:80%;transform:translateX(-100%);transition:.25s;padding-top:60px}nav.open{transform:none}}
button:focus-visible{outline:3px solid var(--ac)}
</style>
</head>

<h2>خدمات الحكومة الإلكترونية وتطبيقاتها</h2><p style="font-size:clamp(16px,2.4vw,24px)">الاستخدام الآمن والوعي السيبراني</p>
${F(['حكومة رقمية','خدمات إلكترونية','أمن سيبراني'],2).replace('class="fl"','class="fl" style="justify-content:center"')}
<div class="meta"><span>ورشة تدريبية — ثلاثة أيام</span><span>الفئة: طلاب جامعيون (أمن سيبراني، حاسب، تقنية ونظم معلومات)</span><span contenteditable>المدرب: ……</span><span>الجهة المنظمة: المعهد الأهلي العالي للتدريب</span><span contenteditable>التاريخ: ……</span></div>
<p style="margin-top:18px"><button class="btn" onclick="go(1)">ابدأ المقدمة ←</button></p></div>
<p class="src">يمكن تعديل اسم المدرب والتاريخ بالنقر عليهما. استخدم الأسهم ← → للتنقل.</p>`,t:`<div class="tn"><h4>🎙 ملاحظات المدرب — 3 دقائق</h4><p><b>الرسالة:</b> الورشة تربط ثلاثة عوالم: الحكومة الرقمية، الخدمة، الحماية.</p><p><b>سؤال:</b> ما أول ما يخطر ببالكم عند سماع «خدمة حكومية إلكترونية»؟</p><p><b>الانتقال:</b> دعونا نرى كيف ستسير رحلتنا.</p></div>`},
{n:'مرحبًا بكم',k:'ترحيب',b:`<p>أهلًا بكم في هذه الورشة. ليست غايتنا أن نعرّفكم بالخدمات الإلكترونية فقط، بل أن نأخذكم في رحلة تبدأ من سؤال بسيط: <b>كيف تصلني الخدمة؟</b> وتنتهي بسؤال أعمق: <b>كيف أحمي نفسي وبياناتي والخدمة نفسها؟</b></p>
${F(['الخدمة الرقمية','تجربة المستخدم','الاستخدام الآمن','الأمن السيبراني'],3)}
<p>كل محطة تبني على التي قبلها: لا نستطيع حماية ما لا نفهمه، ولا نفهم الخدمة جيدًا إن لم ننظر إليها بعين المستخدم.</p>${B('الخيط الذي يربط كل شيء: <b>كلما زاد اعتمادنا على الخدمات الرقمية زادت أهمية حمايتها، والمستخدم الواعي جزء من منظومة الحماية.</b>')}`,m:3,r:'الورشة رحلة متدرجة وليست محاضرة تعريفية.',q:'أين تتوقعون أن يبدأ الخطر في رحلة الخدمة؟',x:'من فتح تطبيق حكومي إلى استلام النتيجة: كل خطوة فيها بيانات.',nx:'لنفهم أولًا لماذا نحتاج هذه الورشة.'},
{n:'لماذا هذه الورشة؟',k:'الدافع',b:`<p>أصبحت الخدمات الحكومية جزءًا من يومنا: نحجز موعدًا، نجدد وثيقة، نراجع بياناتنا، ونتابع طلباتنا من الهاتف دون زيارة مكتب. اتجهت الجهات الحكومية إلى الخدمات الرقمية لأنها أسرع وأقل كلفة وأسهل في الوصول وتتيح الاستفادة من البيانات في تحسين الخدمة.</p>
<p>وبالمقابل صار المستخدم يعتمد على التطبيقات والمنصات، فصارت <b>هويته وبياناته</b> هي مفتاح الخدمة. وهنا يظهر الأمن السيبراني: فكل خدمة رقمية هدف محتمل لمن يريد سرقة الهوية أو الاحتيال.</p>
<p>وطالب الجامعة مستخدم دائم لهذه الخدمات، وربما يصبح غدًا مصممها أو مشغّلها أو حاميها؛ لذا يحتاج فهم العلاقة بين الخدمة وتجربتها وأمنها.</p>
${B('<b>فكر للحظة...</b><br>كم خدمة حكومية إلكترونية استخدمت خلال الشهر الماضي؟<br>هل فكرت يومًا في كمية البيانات التي تشاركها أثناء استخدام هذه الخدمات؟')}`,m:5,r:'الخدمة الرقمية تعني بيانات أكثر، وبيانات أكثر تعني مسؤولية حماية أكبر.',q:'ما الخدمة التي لا تتخيل الاستغناء عنها رقميًا؟',x:'تجديد وثيقة أو حجز موعد من الهاتف في دقائق.',nx:'لنبدأ بالتعريف: ما الخدمة الإلكترونية؟'},
{n:'الخدمات الإلكترونية',k:'e-Services',b:`<p><b>الخدمة الإلكترونية (Electronic Service / e-Service)</b> هي خدمة تُقدَّم وتُطلب وتُتابَع عبر وسائط رقمية (موقع، تطبيق، منصة) دون الحاجة غالبًا للحضور الشخصي.</p>
<table class="cmp"><tr><th>الخدمة التقليدية</th><th>الخدمة الإلكترونية</th></tr><tr><td>يحضر المستفيد ← يقدم الأوراق ← ينتظر ← يستلم النتيجة</td><td>يدخل المنصة ← يتحقق من هويته ← يقدم الطلب ← يرفع المستندات ← يتابع ← يحصل على النتيجة</td></tr></table>
${C([['المستخدم','يطلب الخدمة ويقدم بياناته ويتابع طلبه.'],['المنصة / التطبيق','الواجهة التي تعرض الخدمة وتستقبل الطلب.'],['البيانات والأنظمة الخلفية','قواعد بيانات وأنظمة تعالج الطلب وتتحقق وتحفظ النتيجة، ولا يراها المستخدم.']])}
<p>الخدمة الإلكترونية الجيدة ليست نموذجًا ورقيًا على الشاشة، بل منظومة تتكامل فيها هذه العناصر الثلاثة.</p>`,m:6,r:'الخدمة الإلكترونية = مستخدم + منصة + أنظمة خلفية.',q:'ما الذي يحدث «خلف الشاشة» عند إرسال طلبك؟',x:'طلب موعد: التطبيق يرسل، النظام يتحقق، قاعدة البيانات تحفظ، وإشعار يعود إليك.',nx:'وعندما تتكامل الخدمات داخل الدولة نصل إلى الحكومة الإلكترونية.'},
{n:'الحكومة الإلكترونية',k:'e-Government',b:`<p><b>الحكومة الإلكترونية (e-Government)</b> هي استخدام التقنيات الرقمية لتقديم الخدمات الحكومية وإدارة العمل الحكومي وتسهيل التواصل بين الحكومة والمستفيدين. ظهرت لأن حجم الخدمات وتوقعات المستفيدين زادا، ولأن التقنية أتاحت تقديم الخدمة بسرعة وشفافية أكبر.</p>
<p>وهي ليست مجرد موقع حكومي يعرض معلومات؛ فالموقع قد يكتفي بالنشر، أما الحكومة الإلكترونية فتنفّذ المعاملات وتربط الأنظمة. المستفيدون هم الأفراد والأعمال والجهات الحكومية والموظفون.</p>
${F(['جهة حكومية','منصة رقمية','خدمة','مستفيد'],1)}
<p>خلف هذا المسار: أنظمة وقواعد بيانات وهوية رقمية وتكامل بين جهات متعددة.</p><p class="src">المصدر: الأمم المتحدة، مسح الحكومة الإلكترونية (UN E-Government Survey)؛ هيئة الحكومة الرقمية (dga.gov.sa).</p>`,m:5,r:'الحكومة الإلكترونية منظومة، وليست موقعًا.',q:'ما الفرق بين موقع جهة تعرض معلومات وجهة تنفذ طلبك كاملًا؟',x:'عرض شروط خدمة مقابل تقديم الطلب ومتابعته.',nx:'ولكن هل التحول الرقمي هو نفسه؟'},
{n:'التحول الرقمي',k:'Digital Transformation',b:`<p><b>التحول الرقمي (Digital Transformation)</b> ليس تحويل المعاملة الورقية إلى نموذج إلكتروني، بل إعادة التفكير في طريقة تقديم الخدمة والعمل بالاعتماد على التقنية.</p>
${C([['الخدمات','هل نحتاج هذه الخدمة أصلًا؟ هل يمكن تقديمها استباقيًا؟'],['العمليات','حذف الخطوات الزائدة وأتمتة المتكرر.'],['البيانات','استخدام البيانات بدل طلبها مرارًا من المستفيد.'],['التقنية','منصات مرنة وقابلة للربط.'],['الموظفون','مهارات جديدة وأدوار جديدة.'],['تجربة المستفيد','تصميم الخدمة من منظوره.'],['التكامل','أنظمة تتبادل البيانات بأمان.'],['اتخاذ القرار','قرارات مبنية على بيانات.']])}
${B('<b>مثال:</b> تحويل نموذج ورقي إلى PDF يُملأ ويُرسل بالبريد ليس تحولًا كاملًا. أما أن يُملأ النموذج تلقائيًا من بياناتك الموثقة وتنتهي المعاملة دون أن تعيد إدخال شيء، فهذا قريب من التحول.')}`,m:5,r:'التحول الرقمي تغيير في طريقة العمل وليس في الشكل فقط.',q:'ما الذي يتغير داخل الجهة عندما تتحول فعلًا؟',x:'موظف ينتقل من إدخال الطلبات إلى تحليل الحالات المعقدة.',nx:'لنفرّق بين ثلاثة مصطلحات متقاربة.'},
{n:'الرقمنة والتحول',k:'Digitization / Digitalization / Transformation',b:`${C([['Digitization','تحويل المعلومات من شكل مادي إلى رقمي، مثل مسح ورقة ضوئيًا.'],['Digitalization','استخدام التقنية لتحسين العمليات، مثل نموذج إلكتروني يُرسل ويُتابع.'],['Digital Transformation','إعادة تصميم الخدمة والعمل اعتمادًا على التقنيات الرقمية، مثل خدمة تُنجز تلقائيًا من بيانات متكاملة.']])}
<p>مثال متسلسل واحد:</p>${F(['ورقة','PDF','نموذج إلكتروني','نظام متكامل','خدمة رقمية ذكية'],4)}
<p>الخطوتان الأولى والثانية رقمنة، والثالثة والرابعة تحسين للعمليات، والأخيرة تحول يغيّر تجربة الخدمة.</p>`,m:4,r:'ليست كل خطوة رقمية تحولًا.',q:'في أي مرحلة تقع خدمات جهة تعرفها؟',x:'مسح الأوراق ضوئيًا ليس تحولًا بحد ذاته.',nx:'ولنقارن الآن بين الحكومة الإلكترونية والتحول الرقمي.'},

${Q('صح أم خطأ: وجود موقع إلكتروني يعني أن الجهة حققت التحول الرقمي.',['صح','خطأ'],1,'<b>خطأ.</b> الموقع قد يكون مجرد واجهة نشر؛ التحول يتطلب تغيير العمليات والبيانات والتجربة.')}`,m:5,r:'الأول جزء من الثاني.',q:'هل يمكن أن تكون الحكومة إلكترونية دون تحول رقمي حقيقي؟',x:'موقع يسمح بتحميل نماذج ثم يطلب الحضور.',nx:'لنفهم ما الذي يدفع الحكومات لهذا الطريق.'},
{n:'دوافع التحول',k:'لماذا تتحول الحكومات؟',b:`${C([['تحسين تجربة المستفيد','خدمة أوضح وأسرع. مثال: تقديم طلب من الجوال.'],['تقليل الوقت والجهد','لا انتظار في طوابير. مثال: موعد إلكتروني.'],['تقليل الورق','حفظ أسهل وأقل كلفة. مثال: مستند رقمي بدل أصل ورقي.'],['رفع الكفاءة','أتمتة الإجراءات المتكررة.'],['تحسين الجودة','معايير موحدة وقياس للأداء.'],['تحسين الوصول','خدمة تصل من لا يستطيع الحضور.'],['التكامل بين الجهات','لا تُطلب نفس الوثيقة مرتين.'],['الاستفادة من البيانات','فهم الاحتياج وتحسين الخدمة.'],['دعم القرار','لوحات مؤشرات للمسؤول.'],['الخدمات الاستباقية','تنبيهك بتجديد وثيقة قبل انتهائها.']])}`,m:5,r:'الدافع هو القيمة للمستفيد وليس التقنية بحد ذاتها.',q:'أي دافع تراه الأهم لطالب جامعي؟',x:'تذكير تلقائي بانتهاء وثيقة قبل أن تضيع فرصة.',nx:'والخدمات تتنوع بحسب المستفيد.'},
{n:'أنواع الخدمات',k:'G2C • G2B • G2G • G2E',b:`<p>انقر على كل بطاقة:</p>${C([['G2C — حكومة إلى مواطن/مقيم','المستفيد: الأفراد. مثال: خدمات الأحوال والمرور عبر منصة أبشر. القيمة: توفير الوقت وسهولة الإجراء.'],['G2B — حكومة إلى أعمال','المستفيد: الشركات. مثال: تراخيص وسجلات تجارية إلكترونية. القيمة: بيئة أعمال أسرع.'],['G2G — حكومة إلى حكومة','المستفيد: جهات حكومية. مثال: تبادل بيانات بين جهتين لإنجاز طلب. القيمة: تكامل وكفاءة.'],['G2E — حكومة إلى موظف','المستفيد: موظفو الجهة. مثال: أنظمة الإجازات والرواتب. القيمة: رفع الإنتاجية.']])}`,m:4,r:'لكل مستفيد خدمة وتحدٍّ أمني مختلف.',q:'أي نوع تظنه الأكثر تعقيدًا أمنيًا؟',x:'في G2G تتبادل جهتان بيانات حساسة عبر واجهات برمجية.',nx:'وكيف تتطور الخدمة عبر الزمن؟'},
{n:'تطور الخدمة',k:'Timeline',b:`${C([['1. خدمة تقليدية','حضور شخصي وأوراق.'],['2. نشر المعلومات','موقع يعرض الشروط والنماذج.'],['3. التفاعل','إرسال استفسار أو تحميل نموذج ورفعه.'],['4. تنفيذ المعاملة','إتمام الطلب والدفع إلكترونيًا.'],['5. التكامل','ربط الجهات بحيث لا تُعاد البيانات.'],['6. الخدمات الذكية والاستباقية','الخدمة تأتي إليك قبل أن تطلبها، اعتمادًا على البيانات والتحليل.']])}

{n:'الفوائد',k:'القيمة',b:`${C([['للمواطن والمقيم','وقت وجهد أقل، توفر الخدمة على مدار اليوم، متابعة الطلب بوضوح، وشفافية أكبر.'],['للجهة الحكومية','كفاءة تشغيلية، تقليل الأخطاء اليدوية، بيانات تدعم التخطيط، وتكلفة أقل على المدى البعيد.'],['للمجتمع','تقليل الازدحام والأثر البيئي للورق، فرص عمل رقمية، وثقة أعلى بالمؤسسات.']])}

{n:'تجربة المستفيد',k:'User Experience – UX',b:`<p><b>تجربة المستفيد (User Experience – UX)</b> هي مجموع انطباعات المستخدم وما يواجهه عند حصوله على الخدمة. لا يكفي أن تكون الخدمة إلكترونية؛ فقد تكون موجودة ولا يستطيع أحد إنجازها.</p>
${C([['ما يسهّلها','خطوات قليلة، تعليمات واضحة، استجابة سريعة، وإشعارات متابعة.'],['ما يعقّدها','نماذج طويلة، مصطلحات غامضة، رسائل خطأ مبهمة، وغياب المتابعة.'],['عدد الخطوات','كل خطوة زائدة تضاعف احتمال التخلي أو الخطأ.'],['الاستجابة والإشعارات','الاطمئنان إلى أن الطلب وصل وإلى أين وصل.']])}

{n:'رحلة المستخدم',k:'User Journey',b:`<p><b>رحلة المستخدم (User Journey)</b> هي المسار الذي يمر به المستفيد من لحظة حاجته للخدمة حتى حصوله على النتيجة. انقر على كل مرحلة:</p>
${C([['1. البحث عن الخدمة','يبحث في محرك بحث أو يسأل أحدًا. خطر: الوصول إلى موقع مزيف.'],['2. الوصول للمنصة','يفتح الموقع أو التطبيق.'],['3. تسجيل الدخول','يستخدم حسابه.'],['4. التحقق من الهوية','رمز تحقق أو تطبيق هوية رقمية.'],['5. اختيار الخدمة','يحدد المطلوب.'],['6. إدخال البيانات','يملأ معلومات شخصية.'],['7. رفع المستندات','يرفع ملفات.'],['8. إرسال الطلب','ينتقل الطلب عبر الشبكة.'],['9. المتابعة','يتلقى حالة الطلب.'],['10. النتيجة','يستلم النتيجة.']])}`,m:5,r:'الرحلة هي أساس تحليل التجربة والأمن معًا.',q:'أين تتوقع أن يتعثر المستخدم؟',x:'يتعثر غالبًا عند التحقق من الهوية أو رفع الملفات.',nx:'وهنا يظهر الأمن السيبراني.'},
