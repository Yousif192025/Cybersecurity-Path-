<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المسؤول - منصة الأمن السيبراني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* أنماط CSS */
        :root {
            --primary-dark: #3700b3;
            --primary-blue: #6200ee;
            --accent-blue: #03dac6;
            --accent-green: #38a169;
            --white: #ffffff;
            --light-bg: #f7fafc;
            --text-dark: #2d3748;
            --text-medium: #4a5568;
            --border-light: #e2e8f0;
            --shadow-medium: rgba(0, 0, 0, 0.1);
            --error-red: #e53e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #4b0082 0%, #8a2be2 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-blue) 100%);
            color: var(--white);
            padding: 30px 20px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .login-header h1::before {
            content: "\f007";
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            margin-left: 10px;
        }

        .login-header p {
            opacity: 0.9;
        }

        .login-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.2);
        }

        .password-input {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-medium);
        }

        .btn-login {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-blue) 100%);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--text-medium);
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }

        .separator::before {
            margin-right: .5em;
        }

        .separator::after {
            margin-left: .5em;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .google {
            background-color: #DB4437;
        }

        .github {
            background-color: #333;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-medium);
        }

        .login-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #fed7d7;
            color: var(--error-red);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-message {
            background-color: #c6f6d5;
            color: var(--accent-green);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .back-to-home {
            margin-top: 30px;
            text-align: center;
        }

        .back-to-home a {
            color: var(--white);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-to-home a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 500px) {
            .login-container {
                border-radius: 10px;
            }
            
            .login-header {
                padding: 25px 15px;
            }
            
            .login-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>تسجيل دخول المسؤول</h1>
            <p>سجل الدخول للمتابعة إلى لوحة تحكم المسؤول</p>
        </div>
        
        <div class="login-form">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="password-input">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    <span class="toggle-password" id="togglePassword">
                        <i class="far fa-eye"></i>
                    </span>
                </div>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
            
            <div class="separator">أو</div>
            
            <div class="social-login">
                <div class="social-btn google" id="googleLogin">
                    <i class="fab fa-google"></i>
                </div>
                <div class="social-btn github" id="githubLogin">
                    <i class="fab fa-github"></i>
                </div>
            </div>
            
            <div class="login-footer">
                <p><a href="./forgot-password.html">نسيت كلمة المرور؟</a></p>
            </div>
        </div>
    </div>
    
    <div class="back-to-home">
        <a href="../index.html"><i class="fas fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // تهيئة Supabase
        const supabaseUrl = 'https://kjsggojrsratkwlblcqq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtqc2dnb2pyc3JhdGt3bGJsY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTgxNzQ0MjgsImV4cCI6MjAzMzc1MDQyOH0.abc123yourSupabaseAnonKeyHere';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', function() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const togglePassword = document.getElementById('togglePassword');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const googleLogin = document.getElementById('googleLogin');
            const githubLogin = document.getElementById('githubLogin');
            
            // إظهار/إخفاء كلمة المرور
            togglePassword.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePassword.innerHTML = '<i class="far fa-eye-slash"></i>';
                } else {
                    passwordInput.type = 'password';
                    togglePassword.innerHTML = '<i class="far fa-eye"></i>';
                }
            });
            
            // تسجيل الدخول
            loginBtn.addEventListener('click', async function() {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                
                if (!email || !password) {
                    showError('يرجى ملء جميع الحقول');
                    return;
                }
                
                if (!isValidEmail(email)) {
                    showError('يرجى إدخال بريد إلكتروني صحيح');
                    return;
                }
                
                try {
                    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الدخول...';
                    loginBtn.disabled = true;

                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    
                    if (error) {
                        throw error;
                    }
                    
                    const { data: profileData, error: profileError } = await supabase
                        .from('profiles')
                        .select('role')
                        .eq('id', data.user.id)
                        .single();

                    if (profileError || !profileData || profileData.role !== 'admin') {
                        await supabase.auth.signOut();
                        showError('ليس لديك صلاحية الوصول إلى هذه الصفحة.');
                        loginBtn.innerHTML = 'تسجيل الدخول';
                        loginBtn.disabled = false;
                        return;
                    }

                    showSuccess('تم تسجيل الدخول بنجاح! يتم توجيهك الآن...');
                    
                    setTimeout(() => {
                        window.location.href = './admin-dashboard.html';
                    }, 1500);
                    
                } catch (error) {
                    console.error('Error signing in:', error);
                    
                    if (error.message.includes('Invalid login credentials')) {
                        showError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
                    } else if (error.message.includes('Email not confirmed')) {
                        showError('يرجى تأكيد بريدك الإلكتروني أولاً');
                    } else {
                        showError('حدث خطأ أثناء تسجيل الدخول: ' + error.message);
                    }
                    
                    loginBtn.innerHTML = 'تسجيل الدخول';
                    loginBtn.disabled = false;
                }
            });

            // تسجيل الدخول باستخدام Google
            googleLogin.addEventListener('click', async function() {
                try {
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + '/admin-dashboard.html'
                        }
                    });
                    if (error) throw error;
                } catch (error) {
                    console.error('Error with Google login:', error);
                    showError('حدث خطأ أثناء تسجيل الدخول باستخدام Google: ' + error.message);
                }
            });
            
            // تسجيل الدخول باستخدام GitHub
            githubLogin.addEventListener('click', async function() {
                try {
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'github',
                        options: {
                            redirectTo: window.location.origin + '/admin-dashboard.html'
                        }
                    });
                    if (error) throw error;
                } catch (error) {
                    console.error('Error with GitHub login:', error);
                    showError('حدث خطأ أثناء تسجيل الدخول باستخدام GitHub: ' + error.message);
                }
            });
            
            // دالة للتحقق من صحة البريد الإلكتروني
            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            // دالة لعرض رسائل الخطأ
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }
            
            // دالة لعرض رسائل النجاح
            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            }
            
            // السماح بتسجيل الدخول عند الضغط على Enter
            emailInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
            
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
        });
    </script>
</body>
</html>
