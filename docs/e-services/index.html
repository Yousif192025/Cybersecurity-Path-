<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>الخدمات الإلكترونية | CyberPath - الأمن السيبراني</title>
    <!-- Font Awesome 6 (أيقونات احترافية) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Cairo (عربي + لاتيني) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, #0a0f1a 0%, #0c1220 100%);
            color: #eef2ff;
            line-height: 1.5;
            scroll-behavior: smooth;
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141b2b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2c6e9e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f8bcb;
        }

        /* الهيدر والتذييل بنفس هوية CyberPath */
        .header {
            background: rgba(6, 11, 22, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(46, 125, 160, 0.4);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 2.2rem;
            color: #2b9bff;
            filter: drop-shadow(0 0 6px rgba(43,155,255,0.4));
        }
        .logo-text h1 {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #7bc5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .logo-text span {
            font-size: 0.8rem;
            color: #9bb7d4;
            display: block;
        }
        .back-home {
            background: rgba(30, 50, 80, 0.6);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            transition: all 0.2s;
            border: 1px solid #2c6e9e;
            color: #c6e9ff;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .back-home:hover {
            background: #1e4a76;
            color: white;
            border-color: #5ab0ff;
            transform: translateY(-2px);
        }

        /* المحتوى الرئيسي */
        .main-wrapper {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.8rem;
        }

        /* عنوان الصفحة */
        .page-title {
            text-align: center;
            margin-bottom: 2rem;
        }
        .page-title h2 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(120deg, #fff, #8bcbff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        .page-title p {
            color: #a0bbdf;
            margin-top: 8px;
            font-size: 1.1rem;
        }

        /* أدوات البحث والفلتر */
        .controls-bar {
            background: rgba(18, 25, 45, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 0.7rem 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.2rem;
            border: 1px solid rgba(64, 128, 180, 0.3);
        }
        .search-box {
            flex: 2;
            min-width: 220px;
            position: relative;
        }
        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6f9fcf;
            font-size: 1.1rem;
        }
        .search-box input {
            width: 100%;
            padding: 0.9rem 3rem 0.9rem 1.2rem;
            background: #0f1625;
            border: 1px solid #2b4f73;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            color: #f0f4fc;
            transition: all 0.2s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #2b9bff;
            box-shadow: 0 0 0 2px rgba(43,155,255,0.3);
        }
        .search-box input::placeholder {
            color: #7089aa;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid #325c82;
            color: #c9e2ff;
            padding: 0.5rem 1.3rem;
            border-radius: 40px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .filter-btn i {
            margin-left: 6px;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #1b6b9e;
            border-color: #7bc5ff;
            color: white;
            box-shadow: 0 6px 12px rgba(0,30,60,0.4);
        }
        .results-counter {
            font-size: 0.85rem;
            background: #0e1624;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            color: #b8d0f0;
        }

        /* أقسام الخدمات */
        .section-category {
            margin-bottom: 3rem;
            animation: fadeUp 0.4s ease;
        }
        .category-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            border-right: 5px solid #2b9bff;
            padding-right: 1rem;
            margin-bottom: 1.5rem;
        }
        .category-header i {
            font-size: 2rem;
            color: #2b9bff;
        }
        .category-header h3 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .category-header span {
            background: #1e3857;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }
        /* بطاقة الخدمة */
        .service-card {
            background: rgba(12, 20, 32, 0.75);
            backdrop-filter: blur(2px);
            border-radius: 28px;
            padding: 1.5rem;
            border: 1px solid rgba(60, 120, 170, 0.4);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .service-card:hover {
            transform: translateY(-6px);
            border-color: #2b9bff;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.5);
            background: rgba(18, 30, 48, 0.85);
        }
        .card-icon {
            font-size: 2.8rem;
            color: #5fafff;
            margin-bottom: 1rem;
        }
        .service-card h4 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .service-desc {
            color: #c0d0ec;
            font-size: 0.9rem;
            margin: 0.5rem 0 1rem;
            line-height: 1.45;
            flex: 1;
        }
        .service-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .badge-category {
            font-size: 0.7rem;
            background: #142c40;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            color: #9cc9ff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .service-link {
            background: transparent;
            border: 1px solid #3478a5;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            color: #cae3ff;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .service-link:hover {
            background: #1e6a9a;
            border-color: #7ac3ff;
            color: white;
        }
        .no-results-msg {
            text-align: center;
            padding: 3rem;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            color: #aac9f0;
            font-size: 1.2rem;
        }

        /* Footer */
        .footer {
            margin-top: 4rem;
            background: #050a14;
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid #1f3f5c;
            color: #9bb7d4;
            font-size: 0.85rem;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* استجابة للشاشات الصغيرة */
        @media (max-width: 700px) {
            .main-wrapper {
                padding: 0 1rem;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 30px;
                padding: 1.2rem;
            }
            .filter-buttons {
                justify-content: center;
            }
            .category-header h3 {
                font-size: 1.4rem;
            }
            .service-card h4 {
                font-size: 1.3rem;
            }
            .page-title h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-container">
        <div class="logo-area">
            <i class="fas fa-shield-hooded logo-icon"></i>
            <div class="logo-text">
                <h1>CyberPath</h1>
                <span>مسار الأمن السيبراني</span>
            </div>
        </div>
        <a href="https://cyberpath.vercel.app/" class="back-home" target="_blank" rel="noopener">
            <i class="fas fa-arrow-right"></i> العودة للرئيسية
        </a>
    </div>
</header>

<main class="main-wrapper">
    <div class="page-title">
        <h2><i class="fas fa-digital-tiling"></i> الخدمات الإلكترونية</h2>
        <p>بوابتك لأدوات ومنصات وموارد الأمن السيبراني | أدوات متطورة، بيئات تدريب، ومصادر تعليمية</p>
    </div>

    <!-- شريط البحث والتصفية -->
    <div class="controls-bar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن خدمة بالاسم أو الوصف...">
        </div>
        <div class="filter-buttons" id="filterGroup">
            <button data-filter="all" class="filter-btn active"><i class="fas fa-border-all"></i> الكل</button>
            <button data-filter="tools" class="filter-btn"><i class="fas fa-tools"></i> أدوات</button>
            <button data-filter="platforms" class="filter-btn"><i class="fas fa-globe"></i> منصات</button>
            <button data-filter="resources" class="filter-btn"><i class="fas fa-graduation-cap"></i> موارد تعليمية</button>
        </div>
        <div class="results-counter" id="resultCounter">عرض جميع الخدمات</div>
    </div>

    <!-- حاوية الأقسام (سيتم ملؤها بواسطة JS) -->
    <div id="sectionsContainer"></div>
</main>

<footer class="footer">
    <p><i class="fas fa-lock"></i> CyberPath - رحلة متكاملة في الأمن السيبراني | جميع الخدمات والروابط لتعزيز المعرفة الرقمية</p>
</footer>

<script>
    // ---------- قاعدة بيانات الخدمات (أدوات، منصات، موارد تعليمية) ----------
    const servicesData = [
        // الأدوات (tools)
        { id: 1, name: "Wireshark", desc: "أداة تحليل حزم الشبكة مفتوحة المصدر، لالتقاط وتحليل حركة البيانات واكتشاف الثغرات.", category: "tools", url: "https://www.wireshark.org/", icon: "fas fa-network-wired" },
        { id: 2, name: "Nmap", desc: "ماسح شبكات قوي لتحديد الأجهزة والخدمات المكشوفة، أداة أساسية لاختبار الاختراق.", category: "tools", url: "https://nmap.org/", icon: "fas fa-map-marked-alt" },
        { id: 3, name: "Burp Suite", desc: "منصة متكاملة لاختبار أمان تطبيقات الويب، اعتراضي وتحليل الطلبات.", category: "tools", url: "https://portswigger.net/burp", icon: "fas fa-bug" },
        { id: 4, name: "Metasploit", desc: "إطار عمل متقدم لاختبار الاختراق وتطوير الـ exploits، يدعم محاكاة الهجمات.", category: "tools", url: "https://www.metasploit.com/", icon: "fas fa-skull-crossbones" },
        { id: 5, name: "John the Ripper", desc: "أداة فحص كلمات المرور القوية لاختبار قوة التشفير وكسر الهاشات.", category: "tools", url: "https://www.openwall.com/john/", icon: "fas fa-key" },
        // المنصات (platforms)
        { id: 6, name: "TryHackMe", desc: "منصة تفاعلية لتعلم الأمن السيبراني من خلال غرف افتراضية وتحديات واقعية.", category: "platforms", url: "https://tryhackme.com/", icon: "fas fa-gamepad" },
        { id: 7, name: "Hack The Box", desc: "بيئة اختراق قانونية مع أجهزة افتراضية وتحديات احترافية لصقل المهارات.", category: "platforms", url: "https://www.hackthebox.com/", icon: "fas fa-cube" },
        { id: 8, name: "CyberDefenders", desc: "منصة للدفاع السيبراني وتحديات تحليل التهديدات وBlue Team.", category: "platforms", url: "https://www.cyberdefenders.org/", icon: "fas fa-shield-virus" },
        { id: 9, name: "PicoCTF", desc: "مسابقات أمن سيبراني للمبتدئين والمحترفين من Carnegie Mellon University.", category: "platforms", url: "https://picoctf.org/", icon: "fas fa-flag-checkered" },
        // الموارد التعليمية (resources)
        { id: 10, name: "OWASP", desc: "مؤسسة غير ربحية تقدم أعلى المعايير والوثائق لأمن التطبيقات (OWASP Top 10).", category: "resources", url: "https://owasp.org/", icon: "fas fa-book-open" },
        { id: 11, name: "SANS Institute", desc: "أبحاث متقدمة ودورات تدريبية في الأمن السيبراني، تقارير وموارد مجانية.", category: "resources", url: "https://www.sans.org/", icon: "fas fa-chalkboard-user" },
        { id: 12, name: "PortSwigger Web Security", desc: "أكاديمية أمن الويب المجانية مع محتوى معمق عن ثغرات الويب وكيفية استغلالها.", category: "resources", url: "https://portswigger.net/web-security", icon: "fas fa-code" },
        { id: 13, name: "Cybrary", desc: "منصة تعليمية تضم آلاف الساعات من دورات الأمن السيبراني المجانية والمدفوعة.", category: "resources", url: "https://www.cybrary.it/", icon: "fas fa-video" },
        { id: 14, name: "Hacker101", desc: "دروس مجانية لاختبار الاختراق من HackerOne مع تحديات عملية.", category: "resources", url: "https://www.hacker101.com/", icon: "fas fa-laptop-code" }
    ];

    // تعريف الأقسام (الفئات وترجمتها للعرض)
    const sectionsMeta = {
        tools: { title: "أدوات الاختبار والتحليل", icon: "fas fa-screwdriver-wrench", arName: "أدوات" },
        platforms: { title: "منصات التدريب والهجمات القانونية", icon: "fas fa-cloud-upload-alt", arName: "منصات" },
        resources: { title: "موارد تعليمية ومراجع متخصصة", icon: "fas fa-graduation-cap", arName: "موارد تعليمية" }
    };

    let currentFilter = "all";     // all, tools, platforms, resources
    let currentSearch = "";

    // الحصول على العناصر
    const container = document.getElementById("sectionsContainer");
    const searchInput = document.getElementById("searchInput");
    const filterBtns = document.querySelectorAll(".filter-btn");
    const resultCounterSpan = document.getElementById("resultCounter");

    // وظيفة عرض الأقسام والخدمات وفق الفلتر والبحث
    function renderSections() {
        // تصفية الخدمات حسب البحث (اسم أو وصف)
        let filteredServices = servicesData.filter(service => {
            const matchSearch = currentSearch === "" || 
                service.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                service.desc.toLowerCase().includes(currentSearch.toLowerCase());
            return matchSearch;
        });

        // إذا كان الفلتر محدد بفئة معينة، نقوم بتصفية الفئة بشكل إضافي لعرض الأقسام المناسبة
        // لكن الأقسام تعرض فقط الفئة المحددة إذا لم يكن الكل
        let sectionsToShow = [];
        if (currentFilter === "all") {
            sectionsToShow = ["tools", "platforms", "resources"];
        } else {
            sectionsToShow = [currentFilter];
        }

        let totalVisibleCount = 0;
        let htmlString = "";

        // لكل قسم من الأقسام المطلوب عرضها
        for (let cat of sectionsToShow) {
            // الخدمات الخاصة بهذه الفئة (مع مراعاة البحث المسبق)
            const servicesForCat = filteredServices.filter(s => s.category === cat);
            totalVisibleCount += servicesForCat.length;

            if (servicesForCat.length === 0 && currentFilter === cat) {
                // إذا كان فلتر فئة معينة ولا يوجد خدمات مطابقة للبحث نعرض رسالة داخل القسم
                htmlString += `
                    <div class="section-category">
                        <div class="category-header">
                            <i class="${sectionsMeta[cat].icon}"></i>
                            <h3>${sectionsMeta[cat].title}</h3>
                            <span>${sectionsMeta[cat].arName}</span>
                        </div>
                        <div class="no-results-msg">
                            <i class="fas fa-filter-circle-xmark"></i> لا توجد خدمات تطابق بحثك في هذا القسم.
                        </div>
                    </div>
                `;
                continue;
            }
            else if (servicesForCat.length === 0) {
                // في حالة عدم وجود خدمات للقسم مع فلتر "الكل" ولا خدمات: لا نعرض القسم نهائياً
                continue;
            }

            // بناء بطاقات القسم
            let cardsHtml = `<div class="services-grid">`;
            for (let service of servicesForCat) {
                // اختيار أيقونة مميزة إضافية حسب الفئة إذا لزم الأمر
                let categoryLabel = "";
                if (service.category === "tools") categoryLabel = "أداة";
                else if (service.category === "platforms") categoryLabel = "منصة تدريب";
                else categoryLabel = "مورد تعليمي";

                cardsHtml += `
                    <div class="service-card">
                        <div class="card-icon"><i class="${service.icon}"></i></div>
                        <h4>${service.name}</h4>
                        <p class="service-desc">${service.desc}</p>
                        <div class="service-meta">
                            <span class="badge-category"><i class="fas fa-tag"></i> ${categoryLabel}</span>
                            <a href="${service.url}" target="_blank" rel="noopener noreferrer" class="service-link">
                                زيارة الخدمة <i class="fas fa-external-link-alt"></i>
                            </a>
                        </div>
                    </div>
                `;
            }
            cardsHtml += `</div>`;

            htmlString += `
                <div class="section-category">
                    <div class="category-header">
                        <i class="${sectionsMeta[cat].icon}"></i>
                        <h3>${sectionsMeta[cat].title}</h3>
                        <span>${servicesForCat.length} خدمة</span>
                    </div>
                    ${cardsHtml}
                </div>
            `;
        }

        // إذا لم يكن هناك أي خدمة على الإطلاق (نتيجة البحث أو التصنيف)
        if (totalVisibleCount === 0 && (currentFilter !== "all" || filteredServices.length === 0)) {
            htmlString = `
                <div class="no-results-msg" style="margin-top: 2rem;">
                    <i class="fas fa-face-frown"></i> لا توجد نتائج مطابقة لـ "${currentSearch}" 
                    ${currentFilter !== "all" ? `في قسم ${sectionsMeta[currentFilter]?.arName || ''}` : ''}
                    <br><button id="resetBtn" style="background: #1b6b9e; border:none; padding:8px 24px; border-radius:40px; color:white; margin-top:15px; cursor:pointer;">عرض جميع الخدمات</button>
                </div>
            `;
        }

        container.innerHTML = htmlString;
        // إذا ظهر زر إعادة ضبط (عند عدم وجود نتائج) نضيف له حدث
        const resetBtn = document.getElementById("resetBtn");
        if (resetBtn) {
            resetBtn.addEventListener("click", () => {
                currentFilter = "all";
                currentSearch = "";
                searchInput.value = "";
                updateActiveFilterUI("all");
                renderSections();
                resultCounterSpan.innerText = "عرض جميع الخدمات";
            });
        }

        // تحديث عداد النتائج
        if (totalVisibleCount > 0) {
            let filterText = "";
            if (currentFilter === "all") filterText = "جميع الأقسام";
            else if (currentFilter === "tools") filterText = "الأدوات";
            else if (currentFilter === "platforms") filterText = "المنصات";
            else filterText = "الموارد التعليمية";
            if (currentSearch !== "") {
                resultCounterSpan.innerText = `${totalVisibleCount} نتيجة مطابقة للبحث "${currentSearch}" في ${filterText}`;
            } else {
                resultCounterSpan.innerText = `${totalVisibleCount} خدمة متاحة في ${filterText}`;
            }
        } else {
            if (currentSearch !== "")
                resultCounterSpan.innerText = `لا توجد نتائج للبحث "${currentSearch}"`;
            else
                resultCounterSpan.innerText = `لا توجد خدمات في هذا التصنيف`;
        }
    }

    // تحديث حالة الأزرار النشطة
    function updateActiveFilterUI(activeFilter) {
        filterBtns.forEach(btn => {
            const btnFilter = btn.getAttribute("data-filter");
            if (btnFilter === activeFilter) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
    }

    // أحداث التصفية والبحث
    function handleFilterChange(filterValue) {
        currentFilter = filterValue;
        updateActiveFilterUI(currentFilter);
        renderSections();
    }

    function handleSearchChange() {
        currentSearch = searchInput.value.trim();
        renderSections();
    }

    // ربط الأحداث
    filterBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
            const filterVal = btn.getAttribute("data-filter");
            handleFilterChange(filterVal);
        });
    });

    searchInput.addEventListener("input", handleSearchChange);

    // تحميل أولي
    renderSections();
</script>
</body>
</html>
