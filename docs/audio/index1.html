<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ CyberTalks - بودكاست الأمن السيبراني | CyberPath</title>
    <meta name="description" content="استمع إلى حلقات CyberTalks القصيرة في الأمن السيبراني، محتوى قيم وخبرة عملية من منصة CyberPath.">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cyber-blue: #4361ee;
            --cyber-purple: #7209b7;
            --cyber-pink: #f72585;
            --dark-bg: #0d0d1a;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg), #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            scroll-behavior: smooth;
        }

        /* Header Styling */
        .cyber-header {
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            color: white;
            padding: 4rem 1rem;
            border-radius: 30px;
            margin-bottom: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .cyber-title {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px var(--cyber-pink);
        }

        /* Episode Cards */
        .episode-card {
            background: rgba(255, 255, 255, 0.98);
            color: #1a1a2e;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border-right: 6px solid var(--cyber-pink);
        }

        .episode-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(247,37,133,0.25);
        }

        .episode-number {
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            color: white;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .audio-player {
            width: 100%;
            margin: 15px 0;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        /* Buttons Custom */
        .btn-primary-cyber {
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-pink));
            border: none; color: white; padding: 10px 25px;
            border-radius: 50px; font-weight: 600; transition: 0.3s;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }

        .btn-primary-cyber:hover {
            transform: scale(1.05); color: white; opacity: 0.9;
        }

        .btn-outline-cyber {
            border: 2px solid var(--cyber-blue); color: var(--cyber-blue);
            padding: 10px 25px; border-radius: 50px; font-weight: 600;
            transition: 0.3s; text-decoration: none;
        }

        .btn-outline-cyber:hover {
            background: var(--cyber-blue); color: white;
        }

        /* Subscribe Section */
        .subscribe-section {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            margin: 50px 0;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .platform-card {
            background: white; color: #1a1a2e;
            padding: 20px; border-radius: 20px;
            text-decoration: none; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
        }

        .platform-card:hover {
            transform: translateY(-5px); color: var(--cyber-pink);
        }

        footer {
            text-align: center; padding: 40px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="cyber-header">
            <h1 class="cyber-title">🎙️ CyberTalks</h1>
            <p class="fs-4 fw-light">صوت الأمن السيبراني من منصة CyberPath</p>
            <div class="mt-4">
                <a href="#episode1" class="btn-primary-cyber"><i class="fas fa-play"></i> استمع الآن</a>
                <a href="#subscribe" class="btn btn-outline-light rounded-pill px-4 ms-2">اشترك في البودكاست</a>
            </div>
        </header>

        <div id="episodes-container">
            </div>

        <section class="subscribe-section" id="subscribe">
            <h2 class="fw-bold mb-3">انضم إلى مجتمعنا الرقمي</h2>
            <p class="opacity-75">تابع حلقاتنا الأسبوعية على منصتك المفضلة</p>
            <div class="platforms-grid">
                <a href="#" class="platform-card"><i class="fab fa-spotify fa-2x mb-2 text-success"></i>Spotify</a>
                <a href="#" class="platform-card"><i class="fab fa-apple fa-2x mb-2 text-dark"></i>Apple</a>
                <a href="#" class="platform-card"><i class="fab fa-youtube fa-2x mb-2 text-danger"></i>YouTube</a>
                <a href="#" class="platform-card"><i class="fas fa-rss fa-2x mb-2 text-warning"></i>RSS Feed</a>
            </div>
        </section>
    </div>

    <footer>
        <h4 class="fw-bold mb-3">CyberPath</h4>
        <div class="d-flex justify-content-center gap-3 mb-4">
            <a href="#" class="text-white fs-5"><i class="fab fa-linkedin"></i></a>
            <a href="#" class="text-white fs-5"><i class="fab fa-x-twitter"></i></a>
            <a href="#" class="text-white fs-5"><i class="fab fa-github"></i></a>
        </div>
        <p class="small opacity-50">© 2026 CyberTalks - جميع الحقوق محفوظة لصالح CyberPath</p>
    </footer>

    <script>
        // مصفوفة البيانات لإدارة المحتوى بسهولة
        const episodes = [
            {
                id: 1,
                title: "ما هو الأمن السيبراني؟",
                duration: "45 ثانية",
                stats: "1.2K استماع",
                audio: "audio/podcast/ep1.mp3",
                text: "مرحبًا بكم في CyberTalks، صوت الأمن السيبراني بين يديك. الأمن السيبراني هو حماية الأنظمة والشبكات والبيانات من الهجمات الرقمية. كل يوم تحدث آلاف محاولات الاختراق حول العالم، لذلك من المهم: استخدام كلمات مرور قوية، تحديث الأنظمة باستمرار، والحذر من الروابط المشبوهة. تذكر دائمًا: الوعي السيبراني هو خط الدفاع الأول. CyberTalks… نحو وعي سيبراني أفضل."
            },
            {
                id: 2,
                title: "كلمة المرور القوية",
                duration: "40 ثانية",
                stats: "980 استماع",
                audio: "audio/podcast/ep2.mp3",
                text: "مرحبًا بكم في CyberTalks. هل تعلم أن كلمة المرور الضعيفة هي السبب الأول لاختراق الحسابات؟ كلمة المرور القوية يجب أن تحتوي على: حروف كبيرة وصغيرة، أرقام، ورموز. مثال جيد: Secure@2026Pass. ولا تستخدم نفس كلمة المرور في أكثر من موقع. CyberTalks… لأن أمنك الرقمي مهم."
            },
            {
                id: 3,
                title: "التصيد الاحتيالي Phishing",
                duration: "50 ثانية",
                stats: "1.5K استماع",
                audio: "audio/podcast/ep3.mp3",
                text: "مرحبًا بكم في CyberTalks. التصيد الاحتيالي هو محاولة خداعك للحصول على معلوماتك الشخصية. قد تصلك رسالة تبدو من بنك أو شركة معروفة وتطلب منك الضغط على رابط. قبل أن تضغط أي رابط، تأكد من عنوان الموقع. تذكر: ليس كل ما يبدو رسميًا هو آمن. CyberTalks… وعيك يحميك."
            },
            {
                id: 4,
                title: "الهندسة الاجتماعية",
                duration: "45 ثانية",
                stats: "1.1K استماع",
                audio: "audio/podcast/ep4.mp3",
                text: "مرحبًا بكم في CyberTalks. الهندسة الاجتماعية هي خداع الإنسان بدلاً من اختراق النظام. قد يتصل بك شخص يدعي أنه من الدعم الفني ويطلب كلمة المرور. تذكر: لا تشارك كلمات المرور أو رموز التحقق مع أي شخص. وعند الشك… تحقق أولاً. CyberTalks."
            },
            {
                id: 5,
                title: "مخاطر Wi-Fi العام",
                duration: "40 ثانية",
                stats: "1.3K استماع",
                audio: "audio/podcast/ep5.mp3",
                text: "مرحبًا بكم في CyberTalks. استخدام شبكات Wi-Fi العامة قد يعرض بياناتك للخطر. تجنب تسجيل الدخول إلى حساباتك البنكية أو الحساسة أثناء استخدام الشبكات المفتوحة. وإذا أمكن، استخدم VPN لزيادة الأمان. ابقَ حذرًا… وابقَ آمنًا. CyberTalks."
            }
        ];

        // بناء الحلقات برمجياً
        const container = document.getElementById('episodes-container');
        
        episodes.forEach(ep => {
            container.innerHTML += `
                <div class="episode-card" id="episode${ep.id}">
                    <div class="episode-number">${ep.id.toString().padStart(2, '0')}</div>
                    <h3 class="fw-bold">${ep.title}</h3>
                    <div class="d-flex gap-3 text-muted mb-3 small">
                        <span><i class="far fa-clock"></i> ${ep.duration}</span>
                        <span><i class="fas fa-headphones"></i> ${ep.stats}</span>
                    </div>
                    <audio controls class="audio-player">
                        <source src="${ep.audio}" type="audio/mpeg">
                        متصفحك لا يدعم مشغل الصوت.
                    </audio>
                    <p class="mt-2 text-secondary">${ep.text}</p>
                    <div class="d-flex gap-2 mt-3">
                        <button class="btn-primary-cyber btn-sm" onclick="speakText('${ep.id}')">
                            <i class="fas fa-volume-up"></i> استمع للنص
                        </button>
                        <button class="btn-outline-cyber btn-sm" onclick="window.open('https://ttsfree.com/?text=' + encodeURIComponent('${ep.text}'), '_blank')">
                            <i class="fas fa-file-download"></i> تصدير MP3
                        </button>
                    </div>
                </div>
            `;
        });

        // وظيفة تحويل النص إلى كلام (TTS)
        function speakText(id) {
            const ep = episodes.find(e => e.id == id);
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(ep.text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
