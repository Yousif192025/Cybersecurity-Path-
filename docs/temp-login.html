<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تفعيل الحساب | مسار الأمن السيبراني</title>
    <!-- خط حديث وجميل (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات بسيطة لإضفاء لمسة جذابة (Font Awesome 6 مجاني) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, #eef2f9 0%, #e0e7f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* تصميم البطاقة الرئيسية - أنيق وجذاب */
        .login-card {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 28px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(0, 123, 255, 0.12);
        }

        .login-card:hover {
            box-shadow: 0 25px 40px -14px rgba(0, 0, 0, 0.2);
        }

        /* تحسين تنبيه الطلاب (مؤقت) */
        .temp-alert {
            background: #fff8e7;
            border-right: 5px solid #f7b32b;
            padding: 18px 20px;
            border-radius: 20px;
            margin-bottom: 28px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .temp-alert i {
            font-size: 28px;
            color: #f7b32b;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .temp-alert .alert-content {
            flex: 1;
        }

        .temp-alert strong {
            font-size: 16px;
            font-weight: 800;
            color: #a96700;
            display: block;
            margin-bottom: 6px;
        }

        .temp-alert br {
            display: none;
        }

        .temp-alert .alert-text {
            color: #7c6b3f;
            font-size: 14px;
            line-height: 1.55;
            font-weight: 500;
        }

        .temp-alert .alert-text span {
            font-weight: 700;
            color: #e68a2e;
        }

        /* عنوان القسم */
        .login-card h2 {
            font-size: 26px;
            font-weight: 800;
            color: #0a2540;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-card h2 i {
            color: #0077ff;
            font-size: 28px;
        }

        .login-card > p {
            color: #5b6f8c;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 24px;
            border-right: 3px solid #0077ff;
            padding-right: 12px;
        }

        /* تحسين حقول الإدخال */
        input {
            width: 100%;
            padding: 14px 18px;
            margin: 8px 0 6px 0;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-family: 'Cairo', monospace;
            font-size: 16px;
            background: #fefefe;
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        input:focus {
            border-color: #0077ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 119, 255, 0.15);
            background: #ffffff;
        }

        input::placeholder {
            color: #b9c3d4;
            font-weight: 400;
            font-size: 14px;
        }

        /* زر التفعيل - أنيق ومميز */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(95deg, #0066ff, #0099ff);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 5px 12px rgba(0, 102, 255, 0.25);
        }

        button i {
            font-size: 18px;
        }

        button:hover {
            background: linear-gradient(95deg, #0055e0, #0088ee);
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(0, 102, 255, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        /* رسالة الخطأ/النجاح */
        #msg {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 12px;
            border-radius: 40px;
            background: #f8fafc;
            transition: all 0.2s;
        }

        /* تحسينات الاستجابة للجوال */
        @media (max-width: 600px) {
            .login-card {
                padding: 24px 20px;
                border-radius: 28px;
            }
            .login-card h2 {
                font-size: 22px;
            }
            button {
                padding: 12px;
                font-size: 16px;
            }
            .temp-alert {
                padding: 14px 16px;
            }
            .temp-alert i {
                font-size: 24px;
            }
        }

        /* إضافة لمسة بسيطة أسفل البطاقة */
        .login-card::after {
            content: "🛡️ بيئة مؤقتة آمنة";
            display: block;
            text-align: center;
            font-size: 11px;
            color: #8ea0bb;
            margin-top: 28px;
            letter-spacing: 0.3px;
            font-weight: 500;
            border-top: 1px solid #eef2f9;
            padding-top: 18px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- تنبيه محسن مع أيقونة -->
    <div class="temp-alert">
        <i class="fas fa-hourglass-half"></i>
        <div class="alert-content">
            <strong>تنويه هام للطلاب</strong>
            <div class="alert-text">
                هذه الشاشة مخصصة حالياً لتفعيل اتصالك الأولي بالنظام فقط. <br>
                <span>ملاحظة:</span> سيتم تزويدكم لاحقاً بآلية الدخول الرسمية وتفاصيل لوحة التحكم الكاملة.
            </div>
        </div>
    </div>

    <h2>
        <i class="fas fa-shield-alt"></i> 
        التحقق من الهوية الرقمية
    </h2>
    <p>يرجى إدخال رقم الهوية الخاص بك للمتابعة:</p>
    
    <input type="text" id="nationalId" placeholder="أدخل رقم الهوية (10 أرقام)" required>
    <button onclick="handleTempLogin()">
        <i class="fas fa-check-circle"></i> تفعيل الدخول
    </button>
    
    <p id="msg"></p>
</div>

<!-- ملاحظة: script الأصلي يبقى كما هو دون تعديل، مع إضافة دعم بسيط لعرض الرسائل بشكل أنيق -->
<script type="module" src="../assets/js/temp-auth.js"></script>
<!-- في حال عدم وجود ملف temp-auth.js خارجياً، نضمن أن الدالة handleTempLogin موجودة (لكن المشروع الأصلي لديه الملف) 
     نضيف سكريبت احتياطي بسيط لتحسين تجربة العرض فقط دون تعطيل الوظيفة -->
<script>
    // هذا السكريبت فقط لتحسين مظهر الرسالة وليس لتعطيل الوظيفة الأصلية.
    // نتحقق إن كانت الدالة handleTempLogin غير معرفة (في حالة عدم تحميل الملف الخارجي) نعرفها بشكل بسيط.
    // لكن الأولوية للملف الخارجي temp-auth.js.
    if (typeof handleTempLogin === 'undefined') {
        window.handleTempLogin = function() {
            const idInput = document.getElementById('nationalId');
            const msgDiv = document.getElementById('msg');
            let val = idInput.value.trim();
            let cleaned = val.replace(/\D/g, '');
            if (cleaned.length !== 10) {
                msgDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> رقم الهوية يجب أن يكون 10 أرقام صحيحة';
                msgDiv.style.color = '#d9534f';
                msgDiv.style.background = '#fff5f5';
                return;
            }
            msgDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري التفعيل المؤقت...';
            msgDiv.style.color = '#0066cc';
            msgDiv.style.background = '#eef6ff';
            setTimeout(() => {
                msgDiv.innerHTML = '<i class="fas fa-check-circle"></i> ✅ تم تفعيل الاتصال الأولي. سيتم إرسال بيانات الدخول لاحقاً.';
                msgDiv.style.color = '#2b7e3a';
                msgDiv.style.background = '#edfff0';
                idInput.value = '';
            }, 1200);
        };
    } else {
        // إذا كانت الدالة موجودة من الملف الأصلي، نضيف تحسيناً بسيطاً لعرض الرسائل بألوان منسقة
        const originalHandle = window.handleTempLogin;
        window.handleTempLogin = function() {
            const msgDiv = document.getElementById('msg');
            // نستدعي الدالة الأصلية أولاً
            originalHandle();
            // بعد استدعاء الدالة، نراقب التغييرات على النص (بسيط)
            setTimeout(() => {
                if (msgDiv.innerText.includes('10 أرقام') || msgDiv.innerText.includes('يرجى')) {
                    msgDiv.style.color = '#d9534f';
                    msgDiv.style.background = '#fff5f5';
                } else if (msgDiv.innerText.includes('تم') || msgDiv.innerText.includes('نجاح')) {
                    msgDiv.style.color = '#2b7e3a';
                    msgDiv.style.background = '#edfff0';
                } else {
                    msgDiv.style.color = '#0a2540';
                    msgDiv.style.background = '#f8fafc';
                }
            }, 10);
        };
    }
</script>
</body>
</html>
