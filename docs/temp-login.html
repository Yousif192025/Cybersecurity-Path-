<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق الدخول - CyberPath</title>
    <link rel="stylesheet" href="../assets/css/style.css"> <style>
        .temp-alert { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffeeba; line-height: 1.6; }
        .login-card { max-width: 400 spared; margin: 50px auto; padding: 30px; border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        @media (max-width: 600px) {
    .success-card, .login-card {
        padding: 20px; /* تقليل المسافات الداخلية لتوفير مساحة للنص */
        margin: 20px auto; /* تقليل الهامش العلوي */
    }
    h2 { font-size: 20px; } /* تصغير العنوان قليلاً ليناسب الشاشة */
}
    </style>
</head>
<body>

<div class="login-card">
    <div class="temp-alert">
        <strong>تنويه هام للطلاب:</strong><br>
        هذه الشاشة مخصصة حالياً لتفعيل اتصالك الأولي بالنظام فقط. <br>
        <strong>ملاحظة:</strong> سيتم تزويدكم لاحقاً بآلية الدخول الرسمية وتفاصيل لوحة التحكم الكاملة.
    </div>

    <h2>التحقق من الهوية الرقمية</h2>
    <p>يرجى إدخال رقم الهوية الخاص بك للمتابعة:</p>
    
    <input type="text" id="nationalId" placeholder="أدخل رقم الهوية (10 أرقام)" required>
    <button onclick="handleTempLogin()">تفعيل الدخول</button>
    
    <p id="msg" style="margin-top:15px; color: #d9534f;"></p>
</div>

<script type="module" src="../assets/js/temp-auth.js"></script>
</body>
</html>
