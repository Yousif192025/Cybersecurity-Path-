<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberPath Admin Dashboard</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

.container{max-width:1200px;margin:auto;}

.header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #334155;
padding-bottom:20px;
}

h2{color:#38bdf8;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
border:1px solid #334155;
}

.table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

.table th,.table td{
border:1px solid #334155;
padding:10px;
}

button{
padding:8px 12px;
border:none;
border-radius:5px;
cursor:pointer;
background:#38bdf8;
}

.logout{background:#f87171;}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>CyberPath Admin</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<!-- Stats -->
<div class="grid">

<div class="card">
<h3>Total Users</h3>
<p id="users-count">...</p>
</div>

<div class="card">
<h3>Total Courses</h3>
<p id="courses-count">...</p>
</div>

<div class="card">
<h3>Total Enrollments</h3>
<p id="enrollments-count">...</p>
</div>

<div class="card">
<h3>Total Certificates</h3>
<p id="cert-count">...</p>
</div>

</div>

<!-- Courses -->
<h2>Courses</h2>

<table class="table">

<thead>
<tr>
<th>Title</th>
<th>Description</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="courses-table"></tbody>

</table>

<!-- Users -->
<h2>Users</h2>

<table class="table">

<thead>
<tr>
<th>User ID</th>
<th>Role</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="users-table"></tbody>

</table>

<!-- Enrollments -->
<h2>Enrollments</h2>

<table class="table">

<thead>
<tr>
<th>User</th>
<th>Course</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="enrollments-table"></tbody>

</table>

<!-- Certificates -->
<h2>Certificates</h2>

<table class="table">

<thead>
<tr>
<th>User</th>
<th>Course</th>
<th>Certificate</th>
</tr>
</thead>

<tbody id="cert-table"></tbody>

</table>

<!-- Instructor Ratings -->
<h2>Instructor Ratings</h2>

<table class="table">

<thead>
<tr>
<th>Instructor</th>
<th>User</th>
<th>Rating</th>
</tr>
</thead>

<tbody id="ratings-table"></tbody>

</table>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
"https://suvpaunulhqfoclepwoz.supabase.co",
"sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
)

const { data:{user} } = await supabase.auth.getUser()

if(!user) window.location.href="login.html"

async function loadStats(){

const { count:users } = await supabase.from("user_profile").select("*",{count:"exact",head:true})
const { count:courses } = await supabase.from("courses").select("*",{count:"exact",head:true})
const { count:enroll } = await supabase.from("enrollments").select("*",{count:"exact",head:true})
const { count:certs } = await supabase.from("certificates").select("*",{count:"exact",head:true})

document.getElementById("users-count").innerText=users
document.getElementById("courses-count").innerText=courses
document.getElementById("enrollments-count").innerText=enroll
document.getElementById("cert-count").innerText=certs

}

async function loadCourses(){

const { data:courses } = await supabase.from("courses").select("*")

const table=document.getElementById("courses-table")

table.innerHTML=""

courses.forEach(c=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${c.title}</td>
<td>${c.description||""}</td>

<td>
<button onclick="deleteCourse('${c.course_id}')">Delete</button>
</td>

`

table.appendChild(row)

})

}

window.deleteCourse = async function(id){

if(!confirm("Delete course?")) return

await supabase.from("courses").delete().eq("course_id",id)

loadCourses()

}

async function loadUsers(){

const { data:users } = await supabase.from("user_profile").select("*")

const table=document.getElementById("users-table")

table.innerHTML=""

users.forEach(u=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${u.user_id}</td>
<td>${u.role}</td>

<td>
<button onclick="changeRole('${u.user_id}')">Change Role</button>
</td>

`

table.appendChild(row)

})

}

window.changeRole = async function(id){

const role = prompt("Enter role (student / instructor / admin)")

if(!role) return

await supabase.from("user_profile").update({role}).eq("user_id",id)

loadUsers()

}

async function loadEnrollments(){

const { data:enroll } = await supabase.from("enrollments").select("*")

const table=document.getElementById("enrollments-table")

table.innerHTML=""

enroll.forEach(e=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${e.user_id}</td>
<td>${e.course_id}</td>
<td>${e.completion_status}</td>

<td>
<button onclick="deleteEnrollment('${e.enrollment_id}')">Delete</button>
</td>

`

table.appendChild(row)

})

}

window.deleteEnrollment = async function(id){

await supabase.from("enrollments").delete().eq("enrollment_id",id)

loadEnrollments()

}

async function loadCertificates(){

const { data:certs } = await supabase.from("certificates").select("*")

const table=document.getElementById("cert-table")

table.innerHTML=""

certs.forEach(c=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${c.user_id}</td>
<td>${c.course_id}</td>
<td><a href="${c.certificate_url}" target="_blank">View</a></td>

`

table.appendChild(row)

})

}

async function loadRatings(){

const { data:ratings } = await supabase.from("instructor_ratings").select("*")

const table=document.getElementById("ratings-table")

table.innerHTML=""

ratings.forEach(r=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${r.instructor_id}</td>
<td>${r.user_id}</td>
<td>${r.rating}</td>

`

table.appendChild(row)

})

}

window.logout = async function(){

await supabase.auth.signOut()

window.location.href="login.html"

}

loadStats()
loadCourses()
loadUsers()
loadEnrollments()
loadCertificates()
loadRatings()

</script>

</body>
</html>
