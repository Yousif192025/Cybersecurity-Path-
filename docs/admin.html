<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberPath Admin Dashboard</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:1300px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #334155;
padding-bottom:20px;
}

h2{color:#38bdf8;}

.section{
margin-top:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
border:1px solid #334155;
}

.table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

.table th,.table td{
border:1px solid #334155;
padding:10px;
}

input,textarea{
width:100%;
padding:8px;
margin-top:5px;
border-radius:5px;
border:none;
}

button{
padding:8px 12px;
margin-top:5px;
border:none;
border-radius:5px;
background:#38bdf8;
cursor:pointer;
}

.logout{
background:#f87171;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>CyberPath Admin</h2>

<button class="logout" onclick="logout()">Logout</button>

</div>


<!-- STATS -->

<div class="section">

<h3>Platform Statistics</h3>

<div class="grid">

<div class="card">
<h4>Users</h4>
<p id="users-count">...</p>
</div>

<div class="card">
<h4>Courses</h4>
<p id="courses-count">...</p>
</div>

<div class="card">
<h4>Enrollments</h4>
<p id="enroll-count">...</p>
</div>

<div class="card">
<h4>Certificates</h4>
<p id="cert-count">...</p>
</div>

</div>

</div>


<!-- COURSES -->

<div class="section">

<h3>Courses</h3>

<input id="course-title" placeholder="Course title">
<textarea id="course-desc" placeholder="Description"></textarea>

<button onclick="addCourse()">Add Course</button>

<table class="table">

<thead>
<tr>
<th>Title</th>
<th>Description</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="courses-table"></tbody>

</table>

</div>


<!-- USERS -->

<div class="section">

<h3>Users</h3>

<table class="table">

<thead>
<tr>
<th>User ID</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody id="users-table"></tbody>

</table>

</div>


<!-- ENROLLMENTS -->

<div class="section">

<h3>Enrollments</h3>

<table class="table">

<thead>
<tr>
<th>User</th>
<th>Course</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="enroll-table"></tbody>

</table>

</div>


<!-- CERTIFICATES -->

<div class="section">

<h3>Certificates</h3>

<table class="table">

<thead>
<tr>
<th>User</th>
<th>Course</th>
<th>Certificate</th>
</tr>
</thead>

<tbody id="cert-table"></tbody>

</table>

</div>


<!-- RATINGS -->

<div class="section">

<h3>Instructor Ratings</h3>

<table class="table">

<thead>
<tr>
<th>Instructor</th>
<th>User</th>
<th>Rating</th>
</tr>
</thead>

<tbody id="ratings-table"></tbody>

</table>

</div>

</div>


<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
"https://suvpaunulhqfoclepwoz.supabase.co",
"sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
)


// تحقق تسجيل الدخول

const { data:{user} } = await supabase.auth.getUser()

if(!user){

window.location.href="../login.html"

}


// تحقق Admin

const { data:profile } = await supabase
.from("user_profile")
.select("role")
.eq("user_id",user.id)
.single()

if(profile.role !== "admin"){

alert("Access denied")

window.location.href="../dashboard.html"

}


// =====================
// STATS
// =====================

async function loadStats(){

const {count:users} = await supabase.from("user_profile").select("*",{count:"exact",head:true})
const {count:courses} = await supabase.from("courses").select("*",{count:"exact",head:true})
const {count:enroll} = await supabase.from("enrollments").select("*",{count:"exact",head:true})
const {count:cert} = await supabase.from("certificates").select("*",{count:"exact",head:true})

document.getElementById("users-count").innerText=users
document.getElementById("courses-count").innerText=courses
document.getElementById("enroll-count").innerText=enroll
document.getElementById("cert-count").innerText=cert

}


// =====================
// COURSES
// =====================

async function loadCourses(){

const {data:courses} = await supabase.from("courses").select("*")

const table=document.getElementById("courses-table")

table.innerHTML=""

courses.forEach(c=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${c.title}</td>
<td>${c.description||""}</td>

<td>
<button onclick="deleteCourse('${c.course_id}')">Delete</button>
</td>
`

table.appendChild(row)

})

}

window.addCourse = async function(){

const title=document.getElementById("course-title").value
const desc=document.getElementById("course-desc").value

await supabase.from("courses").insert({title:title,description:desc})

loadCourses()
loadStats()

}

window.deleteCourse = async function(id){

await supabase.from("courses").delete().eq("course_id",id)

loadCourses()
loadStats()

}


// =====================
// USERS
// =====================

async function loadUsers(){

const {data:users} = await supabase.from("user_profile").select("*")

const table=document.getElementById("users-table")

table.innerHTML=""

users.forEach(u=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${u.user_id}</td>
<td>${u.role}</td>

<td>
<button onclick="deleteUser('${u.user_id}')">Delete</button>
</td>

`

table.appendChild(row)

})

}

window.deleteUser = async function(id){

await supabase.from("user_profile").delete().eq("user_id",id)

loadUsers()
loadStats()

}


// =====================
// ENROLLMENTS
// =====================

async function loadEnrollments(){

const {data:e} = await supabase.from("enrollments").select("*")

const table=document.getElementById("enroll-table")

table.innerHTML=""

e.forEach(x=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${x.user_id}</td>
<td>${x.course_id}</td>
<td>${x.completion_status}</td>

<td>
<button onclick="deleteEnroll('${x.enrollment_id}')">Delete</button>
</td>
`

table.appendChild(row)

})

}

window.deleteEnroll = async function(id){

await supabase.from("enrollments").delete().eq("enrollment_id",id)

loadEnrollments()
loadStats()

}


// =====================
// CERTIFICATES
// =====================

async function loadCertificates(){

const {data:c} = await supabase.from("certificates").select("*")

const table=document.getElementById("cert-table")

table.innerHTML=""

c.forEach(x=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${x.user_id}</td>
<td>${x.course_id}</td>
<td><a href="${x.certificate_url}" target="_blank">View</a></td>

`

table.appendChild(row)

})

}


// =====================
// RATINGS
// =====================

async function loadRatings(){

const {data:r} = await supabase.from("instructor_ratings").select("*")

const table=document.getElementById("ratings-table")

table.innerHTML=""

r.forEach(x=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${x.instructor_id}</td>
<td>${x.user_id}</td>
<td>${x.rating}</td>

`

table.appendChild(row)

})

}


// =====================

window.logout = async function(){

await supabase.auth.signOut()

window.location.href="../login.html"

}


// تشغيل الصفحة

loadStats()
loadCourses()
loadUsers()
loadEnrollments()
loadCertificates()
loadRatings()

</script>

</body>
</html>
