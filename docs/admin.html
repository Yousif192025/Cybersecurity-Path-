<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberPath Admin</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #334155;
padding-bottom:20px;
}

h2{color:#38bdf8;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
border:1px solid #334155;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:none;
}

button{
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
background:#38bdf8;
cursor:pointer;
}

.logout{
background:#f87171;
}

.table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

.table th,.table td{
border:1px solid #334155;
padding:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>CyberPath Admin</h2>

<button class="logout" onclick="logout()">Logout</button>

</div>

<!-- STATS -->

<div class="grid">

<div class="card">
<h3>Total Users</h3>
<p id="users-count">...</p>
</div>

<div class="card">
<h3>Total Courses</h3>
<p id="courses-count">...</p>
</div>

<div class="card">
<h3>Total Enrollments</h3>
<p id="enrollments-count">...</p>
</div>

</div>


<!-- ADD COURSE -->

<div class="card">

<h3>Create Course</h3>

<input id="course-title" placeholder="Course title">

<textarea id="course-desc" placeholder="Course description"></textarea>

<button onclick="createCourse()">Add Course</button>

</div>


<!-- COURSES TABLE -->

<h3>Courses</h3>

<table class="table">

<thead>
<tr>
<th>Title</th>
<th>Description</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="courses-table"></tbody>

</table>


<!-- USERS TABLE -->

<h3>Users</h3>

<table class="table">

<thead>
<tr>
<th>User ID</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody id="users-table"></tbody>

</table>


</div>


<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
"https://suvpaunulhqfoclepwoz.supabase.co",
"sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
)


// تحقق تسجيل الدخول

const { data:{user} } = await supabase.auth.getUser()

if(!user){

window.location.href="../login.html"

}


// تحقق صلاحية Admin

const { data:profile } = await supabase
.from("user_profile")
.select("role")
.eq("user_id", user.id)
.single()

if(profile.role !== "admin"){

alert("Access denied")

window.location.href="../dashboard.html"

}


// --------------------
// تحميل الإحصائيات
// --------------------

async function loadStats(){

const { count:users } = await supabase
.from("user_profile")
.select("*",{count:"exact",head:true})

const { count:courses } = await supabase
.from("courses")
.select("*",{count:"exact",head:true})

const { count:enrollments } = await supabase
.from("enrollments")
.select("*",{count:"exact",head:true})

document.getElementById("users-count").innerText=users
document.getElementById("courses-count").innerText=courses
document.getElementById("enrollments-count").innerText=enrollments

}


// --------------------
// تحميل الكورسات
// --------------------

async function loadCourses(){

const { data:courses } = await supabase
.from("courses")
.select("*")

const table=document.getElementById("courses-table")

table.innerHTML=""

courses.forEach(c=>{

const row=document.createElement("tr")

row.innerHTML=`

<td contenteditable="true" onblur="updateCourse('${c.course_id}',this.innerText,'title')">${c.title}</td>

<td contenteditable="true" onblur="updateCourse('${c.course_id}',this.innerText,'description')">${c.description||""}</td>

<td>
<button onclick="deleteCourse('${c.course_id}')">Delete</button>
</td>

`

table.appendChild(row)

})

}


// تعديل الكورس

window.updateCourse = async function(id,value,field){

await supabase
.from("courses")
.update({[field]:value})
.eq("course_id",id)

}


// حذف كورس

window.deleteCourse = async function(id){

if(!confirm("Delete course?")) return

await supabase
.from("courses")
.delete()
.eq("course_id",id)

loadCourses()
loadStats()

}


// إضافة كورس

window.createCourse = async function(){

const title=document.getElementById("course-title").value
const desc=document.getElementById("course-desc").value

if(!title){

alert("Enter course title")
return

}

await supabase
.from("courses")
.insert({
title:title,
description:desc
})

document.getElementById("course-title").value=""
document.getElementById("course-desc").value=""

loadCourses()
loadStats()

}


// --------------------
// المستخدمين
// --------------------

async function loadUsers(){

const { data:users } = await supabase
.from("user_profile")
.select("*")

const table=document.getElementById("users-table")

table.innerHTML=""

users.forEach(u=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${u.user_id}</td>

<td contenteditable="true" onblur="updateRole('${u.user_id}',this.innerText)">
${u.role}
</td>

<td>
<button onclick="deleteUser('${u.user_id}')">Delete</button>
</td>

`

table.appendChild(row)

})

}


// تغيير الدور

window.updateRole = async function(id,role){

await supabase
.from("user_profile")
.update({role})
.eq("user_id",id)

}


// حذف مستخدم

window.deleteUser = async function(id){

if(!confirm("Delete user?")) return

await supabase
.from("user_profile")
.delete()
.eq("user_id",id)

loadUsers()
loadStats()

}


// تسجيل الخروج

window.logout = async function(){

await supabase.auth.signOut()

window.location.href="../login.html"

}


// تشغيل الصفحة

loadStats()
loadCourses()
loadUsers()

</script>

</body>

</html>
