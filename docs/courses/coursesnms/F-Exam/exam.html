<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الاختبار الشامل - دبلوم علوم الحاسب</title>
    <style>
        :root {
            --primary: #1e3a5f;
            --primary-light: #2c5282;
            --accent: #38b2ac;
            --success: #2f855a;
            --danger: #c53030;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px 25px;
            text-align: center;
        }
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.9rem;
            opacity: 0.85;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #edf2f7;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-info {
            font-weight: 600;
            color: var(--primary);
        }
        .score-display {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .progress-bar {
            height: 6px;
            background: #cbd5e0;
            width: 100%;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .quiz-area {
            padding: 25px;
        }
        .section-tag {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            padding: 3px 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
            line-height: 1.8;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            background: #fafafa;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option:hover:not(.disabled) {
            border-color: var(--primary-light);
            background: #ebf8ff;
        }
        .option.selected {
            border-color: var(--primary);
            background: #ebf8ff;
        }
        .option.correct {
            border-color: var(--success);
            background: #f0fff4;
        }
        .option.wrong {
            border-color: var(--danger);
            background: #fff5f5;
        }
        .option.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .option .letter {
            font-weight: 700;
            color: var(--primary);
            min-width: 24px;
            text-align: center;
            background: #e2e8f0;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .feedback {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-weight: 600;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #f0fff4;
            color: var(--success);
            border-right: 4px solid var(--success);
        }
        .feedback.wrong {
            background: #fff5f5;
            color: var(--danger);
            border-right: 4px solid var(--danger);
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            padding: 20px 25px;
            border-top: 1px solid var(--border);
            background: #f7fafc;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            padding: 12px 28px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-light);
        }
        .btn-primary:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }
        .btn-secondary:hover:not(:disabled) {
            background: #cbd5e0;
        }
        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result-screen {
            display: none;
            padding: 40px 25px;
            text-align: center;
        }
        .result-screen.active {
            display: block;
        }
        .result-screen h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .result-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            margin: 10px 0;
        }
        .result-detail {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 25px;
        }
        .btn-restart {
            background: var(--accent);
            color: white;
            padding: 14px 40px;
            font-size: 1.1rem;
        }
        .btn-restart:hover {
            background: #319795;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .quiz-area { padding: 18px; }
            .question-text { font-size: 1.05rem; }
            .option { font-size: 0.95rem; padding: 12px 14px; }
            button { width: 100%; }
            .nav-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <header>
        <h1>محاكي الاختبار الشامل</h1>
        <p>دبلوم علوم الحاسب الآلي وتقنية المعلومات / الأمن السيبراني</p>
    </header>

    <div id="quizSection">
        <div class="status-bar">
            <span class="progress-info" id="progressText">السؤال 1 من 100</span>
            <span class="score-display" id="scoreText">النتيجة: 0</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-area">
            <span class="section-tag" id="sectionTag">البرمجة وهياكل البيانات</span>
            <div class="question-text" id="questionText">جارٍ تحميل السؤال...</div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedbackBox"></div>
        </div>

        <div class="nav-buttons">
            <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>السابق</button>
            <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">التالي</button>
        </div>
    </div>

    <div class="result-screen" id="resultScreen">
        <h2>انتهى الاختبار</h2>
        <div class="result-score" id="finalScore">0 / 100</div>
        <div class="result-detail" id="finalDetail"></div>
        <button class="btn-restart" onclick="restartQuiz()">إعادة الاختبار</button>
    </div>
</div>

<script>
    // ========== بنك الأسئلة (100 سؤال) ==========
    // تم استخراج الأسئلة من الملف المرفق وتنظيمها حسب المحاور.
    // كل كائن: { section, question, options: [], correct: index (0-based), type: 'mcq' | 'tf' }
    const allQuestions = [];

    // ---------- قسم البرمجة وهياكل البيانات (C++ & JavaScript) ----------
    const programmingQuestions = [
        { section: "البرمجة وهياكل البيانات", question: "الكود الصحيح لكتابة تعليق من سطر واحد في JavaScript و C++ هو:", options: ["<!-- تعليق -->", "// تعليق", "/* تعليق", "# تعليق"], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "كيف تقوم بإنشاء متغير عددي صحيح بقيمة 5 في لغة C++؟", options: ["int x = 5;", "num x = 5;", "var x = 5;", "x := 5;"], correct: 0, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "المعامل الصحيح للمقارنة بين قيمتين في C++ للتأكد من تساويهما هو:", options: ["=", "==", "===", "!="], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "ما هي الدالة المستخدمة لإيجاد القيمة الكبرى بين متغيرين x و y في C++؟", options: ["maximum(x, y)", "top(x, y)", "max(x, y)", "math.max(x, y)"], correct: 2, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "كيف تبدأ كتابة حلقة التكرار While في C++ بشكل صحيح؟", options: ["while x > y", "while (condition) { }", "while (condition) then", "do while (condition)"], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "سلسلة من الأوامر المكتوبة بأحد لغات البرمجة وتخزن في ملف قابل للتنفيذ تُسمى:", options: ["البرنامج (Program)", "الخوارزمية (Algorithm)", "المترجم (Compiler)", "المخطط الانسيابي (Flowchart)"], correct: 0, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "لإنهاء جملة برمجية في C++ يجب وضع:", options: ["نقطة .", "فاصلة ,", "فاصلة منقوطة ;", "نقطتان رأسيتان :"], correct: 2, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "أي من الكلمات التالية تُعد كلمة محجوزة في C++ للتعامل مع الشروط؟", options: ["if", "when", "check", "condition"], correct: 0, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "النوع الإرجاعي للدالة الرئيسية Main في C++ هو عادة:", options: ["void", "int", "string", "float"], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "الأمر المستخدم لطباعة نص على الشاشة في C++ هو:", options: ["cin", "cout", "printf", "write"], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "الأمر المستخدم لاستقبال المدخلات من المستخدم في C++ هو:", options: ["cout <<", "cin >>", "input()", "read()"], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "المصفوفة (Array) في لغات البرمجة هي:", options: ["مجموعة متغيرات ذات أنواع مختلفة", "مجموعة عناصر متتالية من نفس نوع البيانات مخزنة في الذاكرة", "دالة برمجية تنفذ مرة واحدة", "ملف نصي يخزن البيانات"], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "يبدأ ترقيم الفهرس (Index) لعناصر المصفوفة في C++ من الرقم:", options: ["1", "-1", "0", "2"], correct: 2, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "المعامل المبرمج للحصول على باقي القسمة الصحيحة في C++ هو:", options: ["/", "%", "\\", "div"], correct: 1, type: "mcq" },
        { section: "البرمجة وهياكل البيانات", question: "المكتبة الأساسية للإدخال والإخراج التي يتم تضمينها في رأس برنامج C++ هي:", options: ["<math.h>", "<iostream>", "<conio.h>", "<stdio.h>"], correct: 1, type: "mcq" }
    ];

    // ---------- قسم قواعد البيانات و SQL ----------
    const databaseQuestions = [
        { section: "قواعد البيانات و SQL", question: "العمود الفريد الذي لا يتكرر في الجدول بقاعدة البيانات مثل رقم الطالب يسمى:", options: ["المفتاح الأجنبي (Foreign Key)", "المفتاح الأساسي (Primary Key)", "المفتاح المركب (Composite Key)", "السجل (Record)"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "الأمر المستخدم لعرض جميع البيانات والصفوف من جدول باسم EMP هو:", options: ["SELECT ALL FROM EMP;", "SELECT * FROM EMP;", "SHOW TABLE EMP;", "GET * FROM EMP;"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "لإدخال صفوف جديدة من البيانات إلى الجدول في SQL نستخدم الأمر:", options: ["ADD RECORD", "INSERT INTO", "UPDATE", "CREATE ROW"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "لتعديل بيانات موجودة سابقاً في جدول نستخدم الأمر:", options: ["MODIFY", "UPDATE", "ALTER", "CHANGE"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "لحذف سجل (صف) معين من الجدول بناءً على شرط نستخدم الأمر:", options: ["DROP", "TRUNCATE", "DELETE FROM", "REMOVE"], correct: 2, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "الأمر المستخدم لحذف الجدول بالكامل مع هيكله من قاعدة البيانات هو:", options: ["DELETE TABLE", "DROP TABLE", "REMOVE TABLE", "CLEAR TABLE"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "يُستخدم المفتاح الأجنبي (Foreign Key) لـ:", options: ["منع تكرار البيانات في نفس الجدول", "ربط جدول بجدول آخر في قاعدة البيانات", "تشفير الحقول", "تسريع البحث فقط"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "للترتيب التصاعدي للنتائج في SQL نستخدم الكلمة المحجوزة:", options: ["DESC", "ASC", "ORDER", "SORT"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "الدالة لحساب عدد الصفوف في جدول SQL هي:", options: ["SUM()", "TOTAL()", "COUNT()", "NUMBER()"], correct: 2, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "الشرط المستخدم مع SELECT لتحديد معايير تصفية السجلات هو:", options: ["HAVING", "WHERE", "LIKE", "IF"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "المفهوم الذي يرمز له بـ RDBMS يعني:", options: ["نظام إدارة قواعد البيانات العلائقية", "نظام إدارة شبكات الحاسب", "معالج النصوص الرقمي", "ذاكرة الوصول العشوائي المباشر"], correct: 0, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "لإضافة عمود جديد إلى جدول قائم بالفعل نستخدم:", options: ["UPDATE TABLE ADD", "ALTER TABLE ADD", "MODIFY TABLE", "INSERT COLUMN"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "الصف الواحد داخل الجدول في قاعدة البيانات يطلق عليه تقنياً:", options: ["حقل (Field)", "سجل (Record / Tuple)", "خاصية (Attribute)", "استعلام (Query)"], correct: 1, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "العمود في جدول قاعدة البيانات يسمى:", options: ["حقل / خاصية (Field / Attribute)", "سجل", "كيان", "علاقة"], correct: 0, type: "mcq" },
        { section: "قواعد البيانات و SQL", question: "لدمج بيانات من جدولين أو أكثر استناداً إلى حقل مشترك نستخدم:", options: ["GROUP BY", "JOIN", "UNION", "CONNECT"], correct: 1, type: "mcq" }
    ];

    // ---------- قسم الشبكات وأنظمة التشغيل ----------
    const networkQuestions = [
        { section: "الشبكات وأنظمة التشغيل", question: "الرقم المنطقي الذي يُعرف ويُميز الجهاز داخل شبكة الحاسب يسمى:", options: ["MAC Address", "IP Address", "Port Number", "SSID"], correct: 1, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "ربط جهازين أو أكثر مع بعضهما البعض بهدف تبادل البيانات والموارد يُعرف بـ:", options: ["شبكة الحاسب الآلي (Computer Network)", "نظام التشغيل", "قاعدة البيانات", "البرمجيات الخبيثة"], correct: 0, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "الشبكة المحلية التي تغطي منطقة جغرافية محدودة كـ (مبنى أو مكتب) يرمز لها بـ:", options: ["WAN", "MAN", "LAN", "WLAN"], correct: 2, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "الأمر المستخدم لإظهار العنوان المنطقي (IP Address) وإعدادات الشبكة عبر موجه الأوامر CMD هو:", options: ["ping", "ipconfig", "tracert", "netstat"], correct: 1, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "اسم مستخدم مسؤول النظام الافتراضي ذو الصلاحيات الكاملة عند تثبيت Windows Server هو:", options: ["Root", "Admin", "Administrator", "Supervisor"], correct: 2, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "قاعدة البيانات الضخمة في نظام Windows Server والتي تحتوي على السياسات والحسابات والتحكم في البرامج تُسمى:", options: ["Active Directory", "Registry", "DNS Server", "DHCP"], correct: 0, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "البروتوكول المسؤول عن إعطاء عناوين IP بشكل آلي وتلقائي للأجهزة في الشبكة هو:", options: ["DNS", "DHCP", "FTP", "HTTP"], correct: 1, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "البروتوكول المسؤول عن ترجمة أسماء المواقع (مثل google.com) إلى عناوين IP هو:", options: ["HTTP", "DNS", "SMTP", "SNMP"], correct: 1, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "جهاز شبكي يعمل في الطبقة الثانية (Data Link Layer) ويقوم بربط الأجهزة بناءً على MAC Address هو:", options: ["الموجه (Router)", "المحول (Switch)", "المكرر (Repeater)", "الجدار الناري (Firewall)"], correct: 1, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "جهاز الشبكة المسؤول عن ربط شبكات مختلفة ببعضها وتوجيه الحزم بينها (مثل ربط LAN بـ Internet) هو:", options: ["Switch", "Hub", "Router", "Access Point"], correct: 2, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "الأمر المستخدم لاختبار حالة الاتصال وإمكانية الوصول لجهاز آخر في الشبكة هو:", options: ["ping", "cls", "dir", "cd"], correct: 0, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "العنوان الفيزيائي المحفور على بطاقة الشبكة من قبل الشركات المصنعة يسمى:", options: ["IP Address", "MAC Address", "Port Number", "Subnet Mask"], correct: 1, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "النموذج المرجعي لربط الأنظمة المفتوحة (OSI Model) يتكون من كم طبقة؟", options: ["4 طبقات", "5 طبقات", "7 طبقات", "6 طبقات"], correct: 2, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "أي بروتوكول من التالي يُستخدم لنقل الملفات بين العميل والخادم بشكل آمن؟", options: ["SFTP / FTP", "HTTP", "POP3", "ICMP"], correct: 0, type: "mcq" },
        { section: "الشبكات وأنظمة التشغيل", question: "المنفذ الافتراضي المخصص لبروتوكول تصفح المواقع الآمن HTTPS هو:", options: ["80", "21", "443", "25"], correct: 2, type: "mcq" }
    ];

    // ---------- قسم أساسيات الحاسب والعتاد ----------
    const hardwareQuestions = [

        { section: "أساسيات الحاسب والعتاد", question: "الوحدة الأساسية والأصغر لتمثيل البيانات الرقمية في الحاسب (0 أو 1) هي:", options: ["البايت (Byte)", "البت (Bit)", "الكيلو بايت", "النبل (Nibble)"], correct: 1, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "لغة الحاسب الآلي الأصلية التي يفهمها ويتعامل بها المعالج مباشرة تتكون من:", options: ["النظام العشري", "النظام الثنائي (Binary System - 0/1)", "النظام السادس عشر", "لغة C++"], correct: 1, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "القطعة الإلكترونية الأساسية التي تُربط عليها كافة المكونات وتنظم الاتصال بينها هي:", options: ["القرص الصلب", "لوحة النظام / اللوحة الأم (Motherboard)", "الذاكرة العشوائية", "كارت الشاشة"], correct: 1, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "الذاكرة المؤقتة المتطايرة التي تفقد بياناتها فور انقطاع التيار الكهربائي هي:", options: ["ROM", "RAM", "Hard Disk", "Flash Memory"], correct: 1, type: "mcq" },

        { section: "أساسيات الحاسب والعتاد", question: "تعتبر الطابعة والشاشة من وحدات:", options: ["الإدخال", "المعالجة", "الإخراج", "التخزين الثانوية"], correct: 2, type: "mcq" },

        { section: "أساسيات الحاسب والعتاد", question: "الوحدة المسؤولة عن إجراء العمليات الحسابية والمنطقية في الحاسب هي:", options: ["ALU (وحدة الحساب والمنطق)", "Control Unit", "Registers", "RAM"], correct: 0, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "أي مما يلي يُعد من وسائل التخزين الثانوية الدائمة؟", options: ["RAM", "Cache Memory", "القرص الصلب (Hard Disk / SSD)", "Registers"], correct: 2, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "تُقاس سرعة المعالج (CPU) الحديثة بـ:", options: ["الكيلوبايت", "الجيجاهرتز (GHz)", "البايت", "الميجابت"], correct: 1, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "من أسباب بطء الحاسب وتجمده أثناء تشغيل عدة برامج في نفس الوقت نقص سعة:", options: ["القرص الصلب", "ذاكرة الوصول العشوائي (RAM)", "اللوحة الأم", "الشاشة"], correct: 1, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "نظام العد السداسي عشر (Hexadecimal) يستند على الأساس:", options: ["2", "8", "10", "16"], correct: 3, type: "mcq" },
        { section: "أساسيات الحاسب والعتاد", question: "الذاكرة الدائمة الموجودة في اللوحة الأم وتحتوي على تعليمات بدء التشغيل (BIOS) هي:", options: ["RAM", "ROM", "NVRAM", "SRAM"], correct: 1, type: "mcq" }
    ];

    // ---------- قسم تطوير الويب والأمن والذكاء الاصطناعي ----------
    const webSecurityAIQuestions = [
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "لإدراج مربع خيار متعدد (Checkbox) في مستند HTML نستخدم الوسم:", options: ['<input type="radio">', '<input type="checkbox">', "<check>", "<option>"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "لإنشاء رابط تشعبي (Hyperlink) للانتقال لصفحة أخرى في HTML نستخدم الوسم:", options: ["<link>", '<a href="url">', "<url>", "<src>"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "النظام/الملف الذي يسجل ويحفظ كل الأنشطة والأحداث التي يقوم بها المستخدم على النظام يسمى:", options: ["Audit Logs / Activity Logs", "Firewall", "Antivirus", "Database Index"], correct: 0, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "أحد فروع الذكاء الاصطناعي يركز على تطوير خوارزميات تمكن الحاسب من التعلم من البيانات والتنبؤ بالنتائج:", options: ["التشفير التطبيقي", "تعلم الآلة (Machine Learning)", "معالجة الصور فقط", "قواعد البيانات العادية"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "إدراج زر اختيار واحد فقط من بين عدة خيارات متبادلة (Radio Button) في HTML يكون بـ:", options: ['<input type="button">', '<input type="radio">', "<select>", '<input type="text">'], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "الوسم المسؤول عن إضافة صورة في صفحة HTML هو:", options: ['<image src="...">', '<img src="...">', "<picture>", "<graphics>"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "لإنشاء نموذج إدخال بيانات في HTML يتم تغليف العناصر داخل الوسم:", options: ["<table>", "<form>", "<div>", "<section>"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "المحافظة على أسرار العمل وعدم استغلال الصلاحيات في تخريب البيانات يعتبر من:", options: ["أخلاقيات المهنة والأمن السيبراني", "مهام صيانة المكونات المادية", "وظيفة المترجم البرمجي", "بروتوكولات الشبكة"], correct: 0, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "المثلث الأساسي لأمن المعلومات (CIA Triad) يتكون من السرية والسلامة و:", options: ["السرعة", "التوافر (Availability)", "التكلفة", "التنسيق"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "نوع من البرمجيات الخبيثة يقوم بتشفير ملفات المستخدم ومطالبته بمبالغ مالية لفك التشفير:", options: ["برامج الفدية (Ransomware)", "التجسس (Spyware)", "الديدان (Worms)", "الإعلانات (Adware)"], correct: 0, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "الأسلوب القائم على خدع البشر وتضليلهم للحصول على بياناتهم السرية ككلمات المرور يسمى:", options: ["الهجوم المباشر", "الهندسة الاجتماعية (Social Engineering)", "الثغرات البرمجية", "التشفير العكسي"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "الهجوم الذي يهدف لإغراق خادم الشبكة بحركة مرور وهمية وتعطيله عن خدمة المستخدمين الحقيقيين:", options: ["Phishing", "DoS / DDoS (حجب الخدمة)", "Man-in-the-middle", "SQL Injection"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "عملية تحويل النص الأصلي الواضح إلى نص غير مفهوم باستخدام خوارزميات لحمايته تُسمى:", options: ["الضغط", "التشفير (Encryption)", "التجميع", "التحليل الجنائي"], correct: 1, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "أي من أساليب التشفير التالية يستخدم مفتاحاً واحداً سرياً للتشفير وفك التشفير؟", options: ["التشفير المتماثل (Symmetric Encryption)", "التشفير غير المتماثل (Asymmetric Encryption)", "المفتاح العام", "التوقيع الرقمي"], correct: 0, type: "mcq" },
        { section: "تطوير الويب والأمن والذكاء الاصطناعي", question: "التقنية التي توفر بيئة افتراضية تشبه جهاز حاسب مستقلاً داخل نظام تشغيل آخر تُسمى:", options: ["Virtualization (المحاكاة الافتراضية)", "Cloud Computing", "Containerization", "Multithreading"], correct: 0, type: "mcq" }
    ];

    // ---------- أسئلة صح / خطأ (25 سؤالاً) ----------
    const trueFalseQuestions = [
        { section: "صح / خطأ", question: "الذاكرة العشوائية (RAM) تفقد كافة محتوياتها فور انقطاع التيار الكهربائي.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "الكيلوبايت يساوي 1000 بايت تماماً في النظام الرقمي للحاسب.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "يستخدم المعامل = في لغة C++ للمقارنة الشروطية بين قيمتين.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "يمكنك إدراج تعليقات متعددة الأسطر في لغة C++ باستخدام /* ... */.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "المفتاح الأساسي (Primary Key) يسمح بتكرار القيم داخل نفس العمود في الجدول.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "الأمر SELECT * FROM EMP; يقوم بحذف جميع البيانات من جدول EMP.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "تُستخدم الشبكة المحلية LAN لربط أجهزة الحواسيب المنتشرة عبر دول وقارات مختلفة.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "الأمر ipconfig يُستخدم في بيئة سطر الأوامر CMD لعرض إعدادات وعنوان IP الخاص بالجهاز.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "نظام التشغيل Windows Server 2012 يأتي باسم المستخدم الافتراضي Root للمسؤول.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: 'يُستخدم الوسم <input type="checkbox"> لإدراج مربعات اختيار متعددة في صفحات HTML.', options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "تعلم الآلة (Machine Learning) هو أحد مجالات الذكاء الاصطناعي التي تمكن النظم من التنبؤ واستخلاص الأنماط من البيانات.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "بروتوكول DHCP مسؤول عن تحويل اسم الموقع الإلكتروني إلى عنوان IP.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "تعتبر الشاشة والطابعة من أهم وحدات الإدخال في الحاسب.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "اللوحة الأم (Motherboard) هي المكون الأساسي الذي يربط أجهزة وقطع الحاسب المختلفة ببعضها.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "يتكون البايت الواحد (Byte) من 5 بت.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "الأمر INSERT INTO في قواعد البيانات يُستخدم لتعديل صفوف البيانات الموجودة.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "الـ Active Directory في نظام Windows Server يُعد قاعدة بيانات مركزية للتحكم بالسياسات والمستخدمين.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "يبدأ تنفيذ الأوامر البرمجية في لغة C++ دائماً من دالة main().", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "عنوان الـ MAC Address هو عنوان منطقي يتغير بظروف الاتصال في الشبكة.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "يُستخدم الأمر DELETE لحذف الجدول بالكامل وهيكله من قاعدة البيانات.", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "المحافظة على أسرار وسجلات المنشأة تُعد جزءاً أساسياً من أمن المعلومات والأخلاقيات المهنية.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "لغة الحاسب التي يفهمها المعالج بشكل مباشر دون حاجة لمترجم هي لغة التجميع (Assembly).", options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: 'الوسم <a href="..."> يُستخدم لإضافة صورة في HTML.', options: ["صح", "خطأ"], correct: 1, type: "tf" },
        { section: "صح / خطأ", question: "هجمات التصيد الاحتيالي (Phishing) تحاول إغراء المستخدم بدخول مواقع مزيفة لسرقة بياناته.", options: ["صح", "خطأ"], correct: 0, type: "tf" },
        { section: "صح / خطأ", question: "في C++، تؤدي العبارة int x; إلى حجز مكان لمتغير نصي في الذاكرة.", options: ["صح", "خطأ"], correct: 1, type: "tf" }
    ];

    // دمج جميع الأسئلة
    allQuestions.push(...programmingQuestions, ...databaseQuestions, ...networkQuestions, ...hardwareQuestions, ...webSecurityAIQuestions, ...trueFalseQuestions);

    // ========== حالة التطبيق ==========
    let currentIndex = 0;
    let userAnswers = new Array(allQuestions.length).fill(null); // null: لم يجب, أو رقم الخيار المختار
    let score = 0;
    let answered = new Array(allQuestions.length).fill(false);

    // ========== دوال واجهة المستخدم ==========
    const questionTextEl = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const sectionTagEl = document.getElementById('sectionTag');
    const progressTextEl = document.getElementById('progressText');
    const scoreTextEl = document.getElementById('scoreText');
    const progressFillEl = document.getElementById('progressFill');
    const feedbackBox = document.getElementById('feedbackBox');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quizSection = document.getElementById('quizSection');
    const resultScreen = document.getElementById('resultScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const finalDetailEl = document.getElementById('finalDetail');

    function loadQuestion(index) {
        const q = allQuestions[index];
        sectionTagEl.textContent = q.section;
        questionTextEl.textContent = q.question;
        feedbackBox.className = 'feedback';
        feedbackBox.textContent = '';

        // تحديث شريط التقدم
        const total = allQuestions.length;
        progressTextEl.textContent = `السؤال ${index + 1} من ${total}`;
        progressFillEl.style.width = `${((index + 1) / total) * 100}%`;

        // عرض الخيارات
        optionsContainer.innerHTML = '';
        q.options.forEach((optText, i) => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option';
            if (answered[index]) {
                optDiv.classList.add('disabled');
                if (i === q.correct) optDiv.classList.add('correct');
                if (userAnswers[index] === i && i !== q.correct) optDiv.classList.add('wrong');
                if (userAnswers[index] === i) optDiv.classList.add('selected');
            }
            const letterSpan = document.createElement('span');
            letterSpan.className = 'letter';
            letterSpan.textContent = q.type === 'tf' ? (i === 0 ? 'ص' : 'خ') : String.fromCharCode(65 + i); // A,B,C,D أو ص/خ
            const textSpan = document.createElement('span');
            textSpan.textContent = optText;
            optDiv.appendChild(letterSpan);
            optDiv.appendChild(textSpan);
            optDiv.onclick = () => selectOption(i);
            optionsContainer.appendChild(optDiv);
        });

        // إظهار التغذية الراجعة إذا تمت الإجابة مسبقاً
        if (answered[index]) {
            const isCorrect = userAnswers[index] === q.correct;
            feedbackBox.classList.add('show', isCorrect ? 'correct' : 'wrong');
            feedbackBox.textContent = isCorrect ? '✅ إجابة صحيحة' : `❌ إجابة خاطئة. الإجابة الصحيحة: ${q.options[q.correct]}`;
        }

        // تحديث أزرار التنقل
        prevBtn.disabled = index === 0;
        nextBtn.textContent = index === allQuestions.length - 1 ? 'عرض النتيجة' : 'التالي';
    }

    function selectOption(optionIndex) {
        const index = currentIndex;
        if (answered[index]) return; // لا يمكن تغيير الإجابة بعد التثبيت

        const q = allQuestions[index];
        userAnswers[index] = optionIndex;
        answered[index] = true;

        const isCorrect = optionIndex === q.correct;
        if (isCorrect) {
            score++;
            scoreTextEl.textContent = `النتيجة: ${score}`;
        }

        // إعادة تحميل السؤال لتطبيق الأنماط
        loadQuestion(index);
    }

    function nextQuestion() {
        if (currentIndex < allQuestions.length - 1) {
            currentIndex++;
            loadQuestion(currentIndex);
        } else {
            showResult();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion(currentIndex);
        }
    }

    function showResult() {
        quizSection.style.display = 'none';
        resultScreen.classList.add('active');
        const total = allQuestions.length;
        finalScoreEl.textContent = `${score} / ${total}`;
        const percentage = Math.round((score / total) * 100);
        let message = '';
        if (percentage >= 85) message = 'ممتاز! أنت جاهز تماماً للاختبار الشامل.';
        else if (percentage >= 70) message = 'جيد جداً، راجع بعض النقاط لضمان الدرجة النهائية.';
        else if (percentage >= 50) message = 'مقبول، تحتاج إلى مراجعة إضافية لبعض المحاور.';
        else message = 'تحتاج إلى مراجعة شاملة لجميع المحاور قبل الاختبار.';
        finalDetailEl.textContent = `${message} (نسبة النجاح: ${percentage}%)`;
    }

    function restartQuiz() {
        currentIndex = 0;
        userAnswers = new Array(allQuestions.length).fill(null);
        answered = new Array(allQuestions.length).fill(false);
        score = 0;
        scoreTextEl.textContent = 'النتيجة: 0';
        resultScreen.classList.remove('active');
        quizSection.style.display = 'block';
        loadQuestion(0);
    }

    // تحميل أول سؤال عند فتح الصفحة
    window.onload = () => {
        loadQuestion(0);
    };
</script>
