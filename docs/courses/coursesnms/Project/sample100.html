    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a3a8f;
            --accent: #ff6b35;
            --bg: #f4f7f9;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); padding: 20px; color: #333; }
        
        .header-section {
            text-align: center;
            background: linear-gradient(135deg, var(--primary), #0d1b4c);
            color: white;
            padding: 40px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .search-container {
            max-width: 600px;
            margin: -30px auto 30px;
            padding: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            border-radius: 30px;
            border: 2px solid #ddd;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            outline: none;
            transition: 0.3s;
        }

        #searchInput:focus { border-color: var(--accent); }

        .container { max-width: 1100px; margin: 0 auto; }

        .category-title {
            background: var(--accent);
            color: white;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 5px;
            margin-top: 30px;
        }

        .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .idea-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-right: 5px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.3s;
            cursor: pointer;
        }

        .idea-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .idea-number {
            font-weight: bold;
            color: var(--accent);
            margin-left: 10px;
        }

        .footer { text-align: center; margin-top: 50px; color: #777; font-size: 14px; }

        @media (max-width: 600px) {
            .ideas-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        const container = document.getElementById('ideasContainer');
        
        function displayIdeas(filter = "") {
            container.innerHTML = "";
            let count = 1;
            
            const grid = document.createElement('div');
            grid.className = 'ideas-grid';

            allIdeas.forEach((idea) => {
                if (idea.toLowerCase().includes(filter.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = 'idea-card';
                    card.innerHTML = `<span class="idea-number">#${count}</span> ${idea}`;
                    grid.appendChild(card);
                    count++;
                }
            });
            container.appendChild(grid);
        }
