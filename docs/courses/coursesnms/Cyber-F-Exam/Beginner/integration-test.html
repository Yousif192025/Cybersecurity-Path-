<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تكامل مستوى Beginner - CyberPath Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .test-header {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 30px;
        }

        .test-header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a8d8ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .test-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            margin-top: 8px;
        }

        .test-header .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 12px;
        }

        .badge.running {
            background: rgba(253, 203, 110, 0.15);
            color: #fdcb6e;
            border: 1px solid rgba(253, 203, 110, 0.2);
        }

        .badge.pass {
            background: rgba(0, 184, 148, 0.15);
            color: #00b894;
            border: 1px solid rgba(0, 184, 148, 0.2);
        }

        .badge.fail {
            background: rgba(225, 112, 85, 0.15);
            color: #e17055;
            border: 1px solid rgba(225, 112, 85, 0.2);
        }

        /* Summary */
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .summary-card .number {
            font-size: 32px;
            font-weight: 800;
            display: block;
        }

        .summary-card .number.green { color: #00b894; }
        .summary-card .number.orange { color: #fdcb6e; }
        .summary-card .number.red { color: #e17055; }
        .summary-card .number.blue { color: #00d2ff; }

        .summary-card .label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        /* Progress */
        .progress-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Courses Grid */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .course-test-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .course-test-card:hover {
            border-color: rgba(0, 210, 255, 0.15);
        }

        .course-test-card .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .course-test-card .course-name {
            font-size: 16px;
            font-weight: 700;
        }

        .course-test-card .course-path {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 8px;
        }

        .course-test-card .course-status {
            font-size: 12px;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        .course-status.pass {
            background: rgba(0, 184, 148, 0.12);
            color: #00b894;
            border: 1px solid rgba(0, 184, 148, 0.15);
        }

        .course-status.warning {
            background: rgba(253, 203, 110, 0.12);
            color: #fdcb6e;
            border: 1px solid rgba(253, 203, 110, 0.15);
        }

        .course-status.fail {
            background: rgba(225, 112, 85, 0.12);
            color: #e17055;
            border: 1px solid rgba(225, 112, 85, 0.15);
        }

        .test-details {
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .test-details .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .test-details .detail-item:last-child {
            border-bottom: none;
        }

        .test-details .detail-item .icon {
            margin-left: 6px;
        }

        .test-details .detail-item .pass { color: #00b894; }
        .test-details .detail-item .fail { color: #e17055; }
        .test-details .detail-item .warning { color: #fdcb6e; }

        /* Verdict */
        .verdict {
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            margin-top: 20px;
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .verdict h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .verdict p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
        }

        .verdict.ready {
            border-color: rgba(0, 184, 148, 0.3);
            background: rgba(0, 184, 148, 0.05);
        }

        .verdict.ready h2 {
            color: #00b894;
        }

        .verdict.not-ready {
            border-color: rgba(225, 112, 85, 0.3);
            background: rgba(225, 112, 85, 0.05);
        }

        .verdict.not-ready h2 {
            color: #e17055;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00a86b);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .test-header h1 {
                font-size: 24px;
            }
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }
            .courses-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .summary {
                grid-template-columns: 1fr;
            }
            .actions .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ==========================================
        HEADER
        ========================================== -->
        <div class="test-header">
            <h1>🧪 اختبار تكامل مستوى Beginner</h1>
            <p>اختبار شامل للتحقق من سلامة روابط ووظائف مقررات المستوى المبتدئ</p>
            <span class="badge running" id="statusBadge">⚡ جاري التشغيل...</span>
        </div>

        <!-- ==========================================
        SUMMARY
        ========================================== -->
        <div class="summary" id="summary">
            <div class="summary-card">
                <span class="number blue" id="totalTests">0</span>
                <span class="label">📋 إجمالي الاختبارات</span>
            </div>
            <div class="summary-card">
                <span class="number green" id="passCount">0</span>
                <span class="label">✅ نجاح</span>
            </div>
            <div class="summary-card">
                <span class="number orange" id="warningCount">0</span>
                <span class="label">⚠️ تحذيرات</span>
            </div>
            <div class="summary-card">
                <span class="number red" id="failCount">0</span>
                <span class="label">❌ أخطاء</span>
            </div>
        </div>

        <!-- ==========================================
        PROGRESS
        ========================================== -->
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-labels">
                <span id="progressLabel">0% مكتمل</span>
                <span id="progressCount">0 / 0</span>
            </div>
        </div>

        <!-- ==========================================
        COURSES
        ========================================== -->
        <div class="courses-grid" id="coursesGrid">
            <!-- يتم تعبئتها بواسطة JavaScript -->
        </div>

        <!-- ==========================================
        VERDICT
        ========================================== -->
        <div class="verdict" id="verdict">
            <h2>⏳ جاري الاختبار...</h2>
            <p>الرجاء الانتظار حتى اكتمال اختبار التكامل.</p>
        </div>

        <!-- ==========================================
        ACTIONS
        ========================================== -->
        <div class="actions">
            <button class="btn btn-primary" onclick="runTests()">
                <i class="fas fa-sync-alt"></i>
                إعادة الاختبار
            </button>
            <a href="./" class="btn btn-secondary">
                <i class="fas fa-arrow-right"></i>
                العودة إلى Beginner
            </a>
            <a href="../" class="btn btn-secondary">
                <i class="fas fa-arrow-right"></i>
                العودة إلى الدليل
            </a>
            <a href="../../../../tvtc-tests/diagnostic-test.html" class="btn btn-secondary">
                <i class="fas fa-stethoscope"></i>
                اختبار تشخيصي
            </a>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const COURSES = [
            {
                name: 'مقدمة تطبيقات الحاسب',
                path: 'computer-applications/',
                icon: 'fa-laptop'
            },
            {
                name: 'مبادئ شبكات الحاسب',
                path: 'network-principles/',
                icon: 'fa-network-wired'
            },
            {
                name: 'أساسيات الأمن السيبراني',
                path: 'cyber-fundamentals/',
                icon: 'fa-shield-halved'
            },
            {
                name: 'نظم تشغيل',
                path: 'operating-systems/',
                icon: 'fa-desktop'
            },
            {
                name: 'تطبيقات الحاسب المتقدمة',
                path: 'advanced-computer-applications/',
                icon: 'fa-cogs'
            }
        ];

        const EXPECTED_QUESTIONS = 10;

        // ==========================================
        // STATE
        // ==========================================
        const results = {
            total: 0,
            pass: 0,
            warning: 0,
            fail: 0,
            details: []
        };

        let isRunning = false;

        // ==========================================
        // DOM REFS
        // ==========================================
        const statusBadge = document.getElementById('statusBadge');
        const totalTests = document.getElementById('totalTests');
        const passCount = document.getElementById('passCount');
        const warningCount = document.getElementById('warningCount');
        const failCount = document.getElementById('failCount');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const progressCount = document.getElementById('progressCount');
        const coursesGrid = document.getElementById('coursesGrid');
        const verdictDiv = document.getElementById('verdict');

        // ==========================================
        // TEST FUNCTIONS
        // ==========================================

        // Test 1: Check if page exists
        async function testPageExists(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                return { status: response.ok, statusCode: response.status };
            } catch (e) {
                return { status: false, statusCode: 0 };
            }
        }

        // Test 2: Check if JS loads (by checking for known variable)
        async function testJavaScriptLoad(url) {
            try {
                const response = await fetch(url);
                const content = await response.text();
                return { 
                    loaded: response.ok, 
                    hasQuestions: content.includes('COURSE_QUESTIONS') || content.includes('DIAGNOSTIC_QUESTIONS'),
                    hasStartFunction: content.includes('startExam') || content.includes('function startExam'),
                    size: content.length
                };
            } catch (e) {
                return { loaded: false, hasQuestions: false, hasStartFunction: false, size: 0 };
            }
        }

        // Test 3: Check for button functionality (onclick attributes)
        function checkButtons(html) {
            const hasStart = html.includes('onclick="startExam()"');
            const hasNext = html.includes('onclick="nextQuestion()"');
            const hasPrev = html.includes('onclick="prevQuestion()"');
            const hasFinish = html.includes('onclick="finishExam()"') || html.includes('onclick="submitExam()"');
            const hasRestart = html.includes('onclick="restartExam()"') || html.includes('onclick="retryExam()"');
            const hasReview = html.includes('onclick="toggleReview()"') || html.includes('onclick="showReview()"');
            
            return { hasStart, hasNext, hasPrev, hasFinish, hasRestart, hasReview };
        }

        // Test 4: Check for result calculation
        function checkResultFunctionality(html) {
            const hasCalculate = html.includes('calculateResults()') || html.includes('function calculateResults');
            const hasScore = html.includes('score') || html.includes('نتيجة');
            const hasReview = html.includes('review') || html.includes('مراجعة');
            
            return { hasCalculate, hasScore, hasReview };
        }

        // Test 5: Check for back links
        function checkBackLinks(html) {
            const hasBackToBeginner = html.includes('href="../"') || html.includes('href="./"') || html.includes('العودة إلى المستوى المبتدئ');
            const hasBackToGuide = html.includes('href="../../"') || html.includes('الدليل الشامل');
            
            return { hasBackToBeginner, hasBackToGuide };
        }

        // ==========================================
        // RUN TESTS FOR A COURSE
        // ==========================================
        async function runCourseTests(course) {
            const baseUrl = course.path + 'index.html';
            const results = [];

            // Test 1: Page exists
            const pageTest = await testPageExists(baseUrl);
            results.push({
                name: 'صفحة المقرر',
                passed: pageTest.status,
                details: pageTest.status ? `HTTP ${pageTest.statusCode}` : 'الصفحة غير موجودة (404)'
            });

            if (pageTest.status) {
                // Fetch the page content for further testing
                const pageResponse = await fetch(baseUrl);
                const html = await pageResponse.text();

                // Test 2: JavaScript functions
                const jsTest = checkButtons(html);
                results.push({
                    name: 'أزرار التنقل',
                    passed: jsTest.hasStart && jsTest.hasNext && jsTest.hasPrev,
                    details: `Start: ${jsTest.hasStart ? '✅' : '❌'}, Next: ${jsTest.hasNext ? '✅' : '❌'}, Prev: ${jsTest.hasPrev ? '✅' : '❌'}`
                });

                results.push({
                    name: 'إنهاء وإعادة الاختبار',
                    passed: jsTest.hasFinish && jsTest.hasRestart,
                    details: `Finish: ${jsTest.hasFinish ? '✅' : '❌'}, Restart: ${jsTest.hasRestart ? '✅' : '❌'}`
                });

                results.push({
                    name: 'مراجعة الإجابات',
                    passed: jsTest.hasReview,
                    details: jsTest.hasReview ? '✅ متاح' : '❌ غير موجود'
                });

                // Test 3: Result calculation
                const calcTest = checkResultFunctionality(html);
                results.push({
                    name: 'حساب النتيجة',
                    passed: calcTest.hasCalculate && calcTest.hasScore,
                    details: `Calculate: ${calcTest.hasCalculate ? '✅' : '❌'}, Score: ${calcTest.hasScore ? '✅' : '❌'}`
                });

                // Test 4: Back links
                const linkTest = checkBackLinks(html);
                results.push({
                    name: 'روابط العودة',
                    passed: linkTest.hasBackToBeginner && linkTest.hasBackToGuide,
                    details: `العودة للمستوى: ${linkTest.hasBackToBeginner ? '✅' : '❌'}, العودة للدليل: ${linkTest.hasBackToGuide ? '✅' : '❌'}`
                });

                // Test 5: Check for questions count (via JS)
                // We'll check for COURSE_QUESTIONS or DIAGNOSTIC_QUESTIONS
                const jsContent = html.match(/<script[^>]*>([\s\S]*?)<\/script>/g) || [];
                let hasQuestions = false;
                let questionCount = 0;
                
                for (const script of jsContent) {
                    if (script.includes('COURSE_QUESTIONS') || script.includes('DIAGNOSTIC_QUESTIONS')) {
                        hasQuestions = true;
                        // Try to count questions
                        const countMatch = script.match(/length[^;]*/g);
                        if (countMatch) {
                            // Try to find the actual count
                            const countRegex = /(\d+)\s*[;\s]/g;
                            const matches = script.match(countRegex);
                            if (matches) {
                                const nums = matches.map(m => parseInt(m)).filter(n => !isNaN(n) && n > 0);
                                if (nums.length > 0) {
                                    questionCount = Math.min(...nums);
                                }
                            }
                        }
                        break;
                    }
                }

                results.push({
                    name: 'بنك الأسئلة',
                    passed: hasQuestions,
                    details: hasQuestions ? `✅ ${questionCount || EXPECTED_QUESTIONS} سؤال` : '❌ لا توجد أسئلة'
                });

            } else {
                // Page not found - mark all tests as failed
                results.push({
                    name: 'أزرار التنقل',
                    passed: false,
                    details: '❌ الصفحة غير موجودة'
                });
                results.push({
                    name: 'إنهاء وإعادة الاختبار',
                    passed: false,
                    details: '❌ الصفحة غير موجودة'
                });
                results.push({
                    name: 'مراجعة الإجابات',
                    passed: false,
                    details: '❌ الصفحة غير موجودة'
                });
                results.push({
                    name: 'حساب النتيجة',
                    passed: false,
                    details: '❌ الصفحة غير موجودة'
                });
                results.push({
                    name: 'روابط العودة',
                    passed: false,
                    details: '❌ الصفحة غير موجودة'
                });
                results.push({
                    name: 'بنك الأسئلة',
                    passed: false,
                    details: '❌ الصفحة غير موجودة'
                });
            }

            return results;
        }

        // ==========================================
        // UPDATE UI
        // ==========================================
        function updateUI() {
            const total = results.total || 1;
            const pass = results.pass || 0;
            const warning = results.warning || 0;
            const fail = results.fail || 0;

            totalTests.textContent = total;
            passCount.textContent = pass;
            warningCount.textContent = warning;
            failCount.textContent = fail;

            const pct = Math.round((pass / total) * 100);
            progressFill.style.width = pct + '%';
            progressLabel.textContent = pct + '% مكتمل';
            progressCount.textContent = `${pass + fail} / ${total}`;

            // Update status badge
            if (fail === 0 && warning === 0) {
                statusBadge.className = 'badge pass';
                statusBadge.textContent = '✅ جميع الاختبارات ناجحة';
            } else if (fail === 0) {
                statusBadge.className = 'badge running';
                statusBadge.textContent = '⚠️ توجد تحذيرات';
            } else {
                statusBadge.className = 'badge fail';
                statusBadge.textContent = '❌ توجد أخطاء';
            }

            // Update verdict
            if (results.details.length > 0) {
                const allPassed = results.details.every(d => d.passed);
                const hasFail = results.details.some(d => !d.passed && d.critical !== false);
                
                if (allPassed) {
                    verdictDiv.className = 'verdict ready';
                    verdictDiv.innerHTML = `
                        <h2>🟢 Beginner جاهز للانتقال إلى Intermediate</h2>
                        <p>جميع المقررات الخمسة تعمل بشكل صحيح. يمكن البدء في بناء مستوى Intermediate.</p>
                    `;
                } else if (hasFail) {
                    verdictDiv.className = 'verdict not-ready';
                    verdictDiv.innerHTML = `
                        <h2>🔴 Beginner يحتاج إلى إصلاحات قبل الانتقال إلى Intermediate</h2>
                        <p>توجد أخطاء في بعض المقررات. يرجى إصلاحها قبل المتابعة.</p>
                    `;
                } else {
                    verdictDiv.className = 'verdict';
                    verdictDiv.innerHTML = `
                        <h2>🟡 Beginner يحتاج إلى تحسينات</h2>
                        <p>توجد تحذيرات يجب مراجعتها، لكن المقررات تعمل بشكل أساسي.</p>
                    `;
                }
            }
        }

        // ==========================================
        // RENDER COURSE CARDS
        // ==========================================
        function renderCourseCard(course, testResults) {
            const card = document.createElement('div');
            card.className = 'course-test-card';

            const hasFail = testResults.some(r => !r.passed);
            const hasWarning = testResults.some(r => r.warning);

            let statusClass = 'pass';
            let statusText = '✅ ناجح';
            if (hasFail) {
                statusClass = 'fail';
                statusText = '❌ فشل';
            } else if (hasWarning) {
                statusClass = 'warning';
                statusText = '⚠️ تحذير';
            }

            let detailsHtml = testResults.map(r => {
                const icon = r.passed ? '✅' : '❌';
                const cls = r.passed ? 'pass' : 'fail';
                return `
                    <div class="detail-item">
                        <span>${r.name}</span>
                        <span class="${cls}">${icon} ${r.details}</span>
                    </div>
                `;
            }).join('');

            card.innerHTML = `
                <div class="course-header">
                    <span class="course-name"><i class="fas ${course.icon}" style="color:#00d2ff;margin-left:8px;"></i>${course.name}</span>
                    <span class="course-status ${statusClass}">${statusText}</span>
                </div>
                <div class="course-path">${course.path}</div>
                <div class="test-details">
                    ${detailsHtml}
                </div>
            `;

            return card;
        }

        // ==========================================
        // RUN ALL TESTS
        // ==========================================
        async function runTests() {
            if (isRunning) return;
            isRunning = true;

            // Reset state
            results.total = 0;
            results.pass = 0;
            results.warning = 0;
            results.fail = 0;
            results.details = [];
            coursesGrid.innerHTML = '';

            statusBadge.className = 'badge running';
            statusBadge.textContent = '⚡ جاري التشغيل...';
            verdictDiv.className = 'verdict';
            verdictDiv.innerHTML = `<h2>⏳ جاري الاختبار...</h2><p>الرجاء الانتظار حتى اكتمال اختبار التكامل.</p>`;

            let totalTestsRun = 0;
            let totalPass = 0;
            let totalWarning = 0;
            let totalFail = 0;
            const allDetails = [];

            // Test Beginner/index.html first
            const indexTest = await testPageExists('./index.html');
            results.details.push({
                name: 'صفحة Beginner/index.html',
                passed: indexTest.status,
                critical: true
            });
            if (indexTest.status) totalPass++;
            else totalFail++;
            totalTestsRun++;

            // Test each course
            for (const course of COURSES) {
                const courseResults = await runCourseTests(course);
                const passed = courseResults.filter(r => r.passed).length;
                const failed = courseResults.filter(r => !r.passed).length;

                totalTestsRun += courseResults.length;
                totalPass += passed;
                totalFail += failed;

                // Store details
                courseResults.forEach(r => {
                    results.details.push({
                        name: `${course.name}: ${r.name}`,
                        passed: r.passed,
                        details: r.details,
                        critical: r.name.includes('صفحة المقرر')
                    });
                });

                // Render card
                const card = renderCourseCard(course, courseResults);
                coursesGrid.appendChild(card);
            }

            results.total = totalTestsRun;
            results.pass = totalPass;
            results.fail = totalFail;
            results.warning = totalWarning;

            updateUI();
            isRunning = false;
        }

        // ==========================================
        // INIT - Auto-run on load
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 بدء اختبار التكامل لمستوى Beginner...');
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
