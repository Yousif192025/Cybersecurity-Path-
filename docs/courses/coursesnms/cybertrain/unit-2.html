<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unit2 — الهاكر الأخلاقي والمختبر العملي | CyberPath</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a; --card:#0b1220; --accent:#06b6d4; --muted:#94a3b8; --white:#ffffff;
      --radius:12px; --gap:14px; --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
      --ethical-color:#10b981; --lab-color:#8b5cf6;
    }
    html,body{height:100%;margin:0;font-family: "Segoe UI", Tahoma, Arial, "Noto Naskh Arabic", sans-serif;background:linear-gradient(180deg,#071029 0%, #071b2e 100%);color:var(--white)}
    .app{display:flex;height:100vh;gap:var(--gap);padding:20px;box-sizing:border-box}
    .sidebar{width:320px;background:rgba(255,255,255,0.04);border-radius:12px;padding:16px;box-sizing:border-box;overflow:auto}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:8px}
    .logo{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700}
    h1{font-size:18px;margin:0}
    .slides-list{margin-top:14px}
    .slide-item{padding:10px;border-radius:8px;margin-bottom:8px;background:rgba(255,255,255,0.02);cursor:pointer;transition:all 0.3s ease}
    .slide-item:hover{background:rgba(255,255,255,0.05)}
    .slide-item.active{outline:2px solid rgba(6,182,212,0.15);background:rgba(6,182,212,0.06)}
    .controls{display:flex;gap:8px;margin-top:8px}
    .btn{background:var(--accent);color:#002;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all 0.3s ease}
    .btn:hover{opacity:0.9;transform:translateY(-1px)}
    .btn.ghost{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,0.06)}
    .btn.success{background:var(--success)}
    .btn.warning{background:var(--warning)}

    .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
    .slide-card{width:900px;max-width:calc(100% - 40px);min-height:540px;background:var(--card);border-radius:16px;padding:28px;box-sizing:border-box;box-shadow:0 10px 30px rgba(2,6,23,0.6);display:flex;flex-direction:column;gap:14px}
    .slide-header{display:flex;justify-content:space-between;align-items:center}
    .slide-title{font-size:26px;margin:0}
    .slide-content{background:rgba(255,255,255,0.02);padding:16px;border-radius:10px;flex:1;overflow:auto}
    .notes{background:#021226;padding:12px;border-radius:8px;color:var(--muted);font-size:14px}
    .resource-link{display:inline-flex;align-items:center;gap:6px;background:rgba(6,182,212,0.1);padding:6px 10px;border-radius:6px;margin:4px;text-decoration:none;color:var(--accent);font-size:14px}
    .resource-link:hover{background:rgba(6,182,212,0.2)}

    .toolbar{display:flex;gap:8px;align-items:center}
    .nav{display:flex;gap:6px}
    .small{padding:6px 8px;font-size:13px}

    /* content styling */
    .content-section{margin-bottom:20px}
    .content-title{color:var(--accent);font-size:18px;margin-bottom:10px}
    .content-list{padding-right:20px}
    .content-list li{margin-bottom:8px;line-height:1.6}
    .video-container{margin:15px 0;text-align:center}
    .ethical-card{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:8px;padding:15px;margin:10px 0}
    .ethical-card h4{color:var(--success);margin:0 0 10px 0}
    .methodology-card{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:8px;padding:15px;margin:10px 0}
    .methodology-card h4{color:#3b82f6;margin:0 0 10px 0}
    .tool-card{background:rgba(139,69,19,0.1);border:1px solid rgba(139,69,19,0.3);border-radius:8px;padding:15px;margin:10px 0}
    .tool-card h4{color:#8b4513;margin:0 0 10px 0}
    .lab-card{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:15px;margin:10px 0}
    .lab-card h4{color:var(--warning);margin:0 0 10px 0}
    .activity-card{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:15px;margin:10px 0}
    .activity-card h4{color:var(--danger);margin:0 0 10px 0}

    /* code styling */
    .code-block{background:#0b1220;color:#e6f1f8;padding:12px;border-radius:8px;overflow:auto;font-family:monospace;margin:10px 0}
    .code-comment{color:#94a3b8}
    .code-keyword{color:#f472b6}
    .code-string{color:#86efac}

    /* navigation buttons */
    .nav-buttons{display:flex;justify-content:space-between;margin-top:20px;padding:20px 0;border-top:1px solid rgba(255,255,255,0.1)}
    .nav-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--accent);color:white;text-decoration:none;border-radius:8px;transition:all 0.3s ease}
    .nav-btn:hover{background:var(--success);transform:translateY(-2px)}

    /* editable styling */
    [contenteditable]{outline:2px dashed transparent}
    [contenteditable]:focus{outline:2px dashed rgba(6,182,212,0.25)}

    @media print{
      body{background:#fff;color:#000}
      .app{padding:0}
      .sidebar{display:none}
      .slide-card{box-shadow:none;background:#fff;border-radius:0}
    }

    @media (max-width:1000px){.sidebar{display:none}.slide-card{width:100%}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo"><i class="fas fa-user-secret"></i></div>

      </div>

      <!-- Navigation Buttons -->
      <div class="nav-buttons">
        <a href="unit-1.html" class="nav-btn">
          <i class="fas fa-arrow-right"></i>
          <span>الوحدة الأولى</span>
        </a>
        <a href="unit-3.html" class="nav-btn">
          <span>الوحدة الثالثة</span>

    </aside>

    <main class="stage">
      <div class="slide-card">
        <div class="slide-header">
          <div>
            <h2 class="slide-title" id="slideTitle" contenteditable="false"></h2>
            <div style="color:var(--muted);font-size:13px" id="slideSubtitle"></div>
          </div>
          <div class="toolbar">
            <div class="nav">
              <button class="btn ghost small" id="prevBtn"><i class="fas fa-arrow-right"></i> السابق</button>
              <button class="btn ghost small" id="nextBtn">التالي <i class="fas fa-arrow-left"></i></button>
            </div>
            <button class="btn small" id="printBtn"><i class="fas fa-print"></i> طباعة</button>
          </div>
        </div>

        <div class="slide-content">
          <div id="slideBody" contenteditable="false" style="line-height:1.7;font-size:17px"></div>
        </div>

        <div class="notes" id="trainerNotes" contenteditable="false"></div>
      </div>
    </main>
  </div>

    // State
    let slides = loadSlides() || initialSlides;
    let currentIndex = 0;
    let editing = false;

    // DOM refs
    const slidesList = document.getElementById('slidesList');
    const slideTitle = document.getElementById('slideTitle');
    const slideSubtitle = document.getElementById('slideSubtitle');
    const slideBody = document.getElementById('slideBody');
    const trainerNotes = document.getElementById('trainerNotes');

    function renderList(){
      slidesList.innerHTML = '';
      slides.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'slide-item' + (i===currentIndex? ' active':'');
        el.dataset.index = i;
        el.innerHTML = `
          <div style="display:flex;align-items:flex-start;gap:8px">
            <div style="background:rgba(255,255,255,0.1);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${i+1}</div>
            <div>
              <strong>${escapeHtml(s.title)}</strong>
              <div style="color:var(--muted);font-size:13px;margin-top:4px">${escapeHtml(s.subtitle || '')}</div>
            </div>
          </div>
        `;
        el.addEventListener('click', ()=>{ currentIndex = i; render(); });
        slidesList.appendChild(el);
      });
    }

    function render(){
      const s = slides[currentIndex];
      slideTitle.innerHTML = s.title;
      slideSubtitle.innerHTML = s.subtitle || '';
      slideBody.innerHTML = s.body;
      trainerNotes.innerHTML = s.notes || '';
      renderList();
      saveSlides();
    }

    // Buttons
    document.getElementById('addSlide').addEventListener('click', ()=>{
      const newS = {
        id: crypto.randomUUID(), 
        title:'شريحة جديدة', 
        subtitle:'', 
        body:'<p>محتوى قابل للتعديل...</p>', 
        notes:'ملاحظة المدرب...'
      };
      slides.push(newS); 
      currentIndex = slides.length-1; 
      render();
    });

    document.getElementById('duplicateSlide').addEventListener('click', ()=>{
      const s = slides[currentIndex];
      const copy = JSON.parse(JSON.stringify(s)); 
      copy.id = crypto.randomUUID(); 
      copy.title += ' (نسخة)';
      slides.splice(currentIndex+1,0,copy); 
      currentIndex = currentIndex+1; 
      render();
    });

    document.getElementById('deleteSlide').addEventListener('click', ()=>{
      if(slides.length <= 1) {
        alert('لا يمكن حذف جميع الشرائح');
        return;
      }
      if(!confirm('هل تريد حذف الشريحة الحالية؟')) return;
      slides.splice(currentIndex,1);
      if(currentIndex>=slides.length) currentIndex = slides.length-1;
      render();
    });

    document.getElementById('prevBtn').addEventListener('click', ()=>{ 
      if(currentIndex>0) currentIndex--; 
      render(); 
    });
    
    document.getElementById('nextBtn').addEventListener('click', ()=>{ 
      if(currentIndex<slides.length-1) currentIndex++; 
      render(); 
    });

    // Toggle edit
    document.getElementById('toggleEdit').addEventListener('click', ()=>{
      editing = !editing;
      [slideTitle, slideBody, trainerNotes].forEach(el=> el.contentEditable = editing);
      document.getElementById('toggleEdit').innerHTML = editing ? 
        '<i class="fas fa-times"></i> إيقاف التحرير' : 
        '<i class="fas fa-edit"></i> تفعيل التحرير';
    });

    // Save to localStorage
    function saveSlides(){
      try{ 
        localStorage.setItem('unit2_slides', JSON.stringify(slides)); 
      }
      catch(e){ 
        console.warn('فشل في الحفظ', e); 
      }
    }
    
    function loadSlides(){
      try{ 
        const s = localStorage.getItem('unit2_slides'); 
        return s ? JSON.parse(s) : null; 
      }
      catch(e){ 
        return null; 
      }
    }

    });

    document.getElementById('exportHTML').addEventListener('click', ()=>{
      const html = buildExportHTML(slides);
      const blob = new Blob([html],{type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); 
      a.href = url; 
      a.download = 'unit2_slides.html'; 
      a.click(); 
      URL.revokeObjectURL(url);
    });

    // Print
    document.getElementById('printBtn').addEventListener('click', ()=> window.print() );

    // Export builder
    function buildExportHTML(slidesData){
      return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوحدة الثانية - الهاكر الأخلاقي والمختبر العملي | CyberPath</title><style>body{font-family:Arial,'Noto Naskh Arabic',sans-serif;padding:20px;background:#fff;color:#000} .slide{page-break-after:always;border:1px solid #ddd;padding:20px;margin-bottom:18px;border-radius:8px} h2{margin-top:0;color:#06b6d4} .notes{background:#f5f5f5;padding:10px;border-radius:6px;margin-top:15px} .resource-link{display:inline-block;background:#e3f2fd;padding:5px 10px;border-radius:4px;margin:5px;text-decoration:none;color:#06b6d4} .ethical-card{background:#d1fae5;padding:15px;border-radius:8px;margin:10px 0} .methodology-card{background:#dbeafe;padding:15px;border-radius:8px;margin:10px 0} .tool-card{background:#fed7aa;padding:15px;border-radius:8px;margin:10px 0} .lab-card{background:#fef3c7;padding:15px;border-radius:8px;margin:10px 0} .activity-card{background:#fecaca;padding:15px;border-radius:8px;margin:10px 0} .code-block{background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;margin:10px 0}</style></head><body>${slidesData.map(s=>`<div class="slide"><h2>${escapeHtml(s.title)}</h2><div>${s.subtitle?'<em>'+escapeHtml(s.subtitle)+'</em>':''}</div><div style="margin-top:12px">${s.body}</div><div class="notes"><strong>ملاحظة المدرب:</strong><div>${escapeHtml(s.notes)}</div></div></div>`).join('')}</body></html>`;
    }

    // Utility
    function escapeHtml(str){ 
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;"); 
    }

    // Persist edits back to slides array
    function applyEdits(){
      const s = slides[currentIndex];
      s.title = slideTitle.innerText.trim();
      s.subtitle = slideSubtitle.innerText.trim();
      s.body = slideBody.innerHTML;
      s.notes = trainerNotes.innerText.trim();
      saveSlides(); 
      renderList();
    }

    // Detect blur events to save edits
    [slideTitle, slideSubtitle, slideBody, trainerNotes].forEach(el=> {
      el.addEventListener('blur', applyEdits);
      el.addEventListener('input', applyEdits);
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowRight' && currentIndex > 0) {
        currentIndex--;
        render();
      } else if(e.key === 'ArrowLeft' && currentIndex < slides.length - 1) {
        currentIndex++;
        render();
      }
    });

    // init
    render();
  </script>
