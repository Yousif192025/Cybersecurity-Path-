<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CyberPath</title>

    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h2 { text-align: center; margin-bottom: 25px; color: #38bdf8; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #38bdf8;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #0ea5e9; transform: translateY(-2px); }

        .google-btn {
            background: white;
            color: #444;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover { background: #e2e8f0; }

        .divider {
            margin: 20px 0;
            text-align: center;
            border-bottom: 1px solid #334155;
            line-height: 0.1em;
        }
        .divider span { background: #1e293b; padding: 0 10px; color: #64748b; font-size: 12px; }

        .auth-links { margin-top: 20px; text-align: center; font-size: 14px; }
        .auth-links a { color: #94a3b8; text-decoration: none; display: block; margin-top: 10px; }
        .auth-links a:hover { color: #38bdf8; }

        #message { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
        .error-msg { color: #f87171; }
        .success-msg { color: #4ade80; }

        .loader { display: none; text-align: center; margin-top: 10px; color: #38bdf8; font-size: 14px; }
    </style>
</head>

<body>

<div class="login-box">
    <h2>CyberPath Login</h2>
    
    <input id="email" type="text" placeholder="رقم الهوية أو البريد الإلكتروني">
    <input id="password" type="password" placeholder="Password">
    
    <button onclick="login()">Sign In</button>

    <div class="divider"><span>OR</span></div>

    <button class="google-btn" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google Logo">
        Sign in with Google
    </button>
    
    <div class="loader" id="loader">🔄 Authenticating...</div>
    <p id="message"></p>

    <div class="auth-links">
        <a href="javascript:void(0)" onclick="forgotPassword()">Forgot Password?</a>
        <a href="javascript:void(0)" onclick="createAccount()">Don't have an account? <b>Create One</b></a>
    </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// تهيئة المشروع بالروابط والمفاتيح الحقيقية الخاصة بك
const supabase = createClient(
    "https://suvpaunulhqfoclepwoz.supabase.co",
    "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
)

const message = document.getElementById("message")
const loader = document.getElementById("loader")

// متغير أمان فريد لمنع تصادم أو تكرار التوجيه في نفس اللحظة
let isRedirecting = false;

// --- 🔐 مراقب حالة تسجيل الدخول الذكي (منع تداخل الدخول العادي وجوجل) ---
supabase.auth.onAuthStateChange(async (event, session) => {
    if (session && (event === 'SIGNED_IN' || event === 'USER_UPDATED')) {
        if (isRedirecting) return; // تجاهل الحدث إذا كان محرك التوجيه يعمل بالفعل
        
        console.log("🎯 تم التقاط الجلسة بنجاح، نوع الحدث الأمني:", event);
        
        // التحقق من طريقة الدخول: إذا كان الدخول عبر جوجل نترك التوجيه التلقائي يعمل
        // أما إذا كان دخول عادي بكلمة مرور، ندع دالة login() تتصرف بشكل مستقل لمنع الأخطاء
        const authMethod = session.provider; 
        if (authMethod === 'google') {
            console.log("الدخول المكتشف عبر جوجل.. جاري فحص الملف الأكاديمي..");
            await redirectUserToUnifiedDashboard(session.user);
        }
    }
});

// --- 🗺️ محرك التوجيه الموحد والأمين (توجيه الجميع للوحة الموحدة والمركزية) ---
async function redirectUserToUnifiedDashboard(user) {
    if (isRedirecting) return;
    isRedirecting = true; // إغلاق البوابة لمنع التداخل البرمجي أثناء النقل
    
    loader.style.display = "block";
    message.innerText = "جاري تأمين ممرات العبور وتحديث السجلات...";
    message.className = "success-msg";

    try {
        // فحص سريع للتحقق من سلامة وجود الحساب بجدول البروفايل قبل العبور لزيادة الأمان
        const { data: profile, error } = await supabase
            .from("user_profile")
            .select("role, full_name")
            .eq("user_id", user.id)
            .maybeSingle();

        loader.style.display = "none";

        if (error) {
            console.error("❌ حدث خطأ أثناء فحص سجل الحساب:", error);
        }

        if (profile) {
            console.log(`✅ تم التحقق بنجاح! مرحباً بك: ${profile.full_name} | الدور: ${profile.role}`);
        } else {
            console.log("⚠️ لم يتم العثور على بروفايل مسبق، سيتم توليد لوحة افتراضية فور الوصول.");
        }

        // 🚀 النقل الاحترافي الموحد: الجميع يسافر إلى نفس المحطة المركبة، واللوحة تتكفل بالفرز
        window.location.href = "./undashboard.html";

    } catch (catchedError) {
        console.error("حدث خطأ مفاجئ في محرك التوجيه الموحد:", catchedError);
        window.location.href = "./undashboard.html";
    }
}

// --- 📧 دالة تسجيل الدخول المطورة الذكية (تدعم الهوية الوطنية أو الإيميل الكامل) ---
window.login = async function() {
    if (isRedirecting) return;
    
    let emailInput = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    
    message.innerText = "";
    if (!emailInput || !password) {
        message.innerText = "Please enter both credentials and password";
        message.className = "error-msg";
        return;
    }

    // 🔍 الفحص الذكي والآلي: إذا كان النص أرقاماً فقط (رقم هوية)، نقوم بتركيب النطاق الجامعي خلف الكواليس
    if (/^\d+$/.test(emailInput)) {
        emailInput = `${emailInput}@cyberpath.edu`;
        console.log("تمت معالجة المدخل وتجهيزه كنطاق طالب حاملي الهوية:", emailInput);
    }

    loader.style.display = "block";
    
    const { data, error } = await supabase.auth.signInWithPassword({ 
        email: emailInput, 
        password: password 
    });
    
    if (error) {
        loader.style.display = "none";
        message.innerText = error.message;
        message.className = "error-msg";
        return;
    }

    console.log("🚀 نجح التحقق من كلمة المرور، جاري تشغيل التوجيه الموحد..");
    await redirectUserToUnifiedDashboard(data.user);
}

// --- 🌐 دالة تسجيل الدخول السريع عبر خدمات جوجل ---
window.loginWithGoogle = async function() {
    message.innerText = "";
    loader.style.display = "block";
    
    const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
            redirectTo: window.location.origin + window.location.pathname,
            queryParams: {
                access_type: 'offline',
                prompt: 'select_account',
            }
        }
    });

    if (error) {
        loader.style.display = "none";
        message.innerText = error.message;
        message.className = "error-msg";
    }
}

// --- ➕ دالة إنشاء الحساب المطور للطلاب والمسؤولين ---
window.createAccount = async function() {
    let emailInput = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.innerText = "";
    if (!emailInput || !password) {
        message.innerText = "ID/Email and password are required";
        message.className = "error-msg";
        return;
    }

    if (/^\d+$/.test(emailInput)) {
        emailInput = `${emailInput}@cyberpath.edu`;
    }

    loader.style.display = "block";
    const { error } = await supabase.auth.signUp({ email: emailInput, password: password });
    loader.style.display = "none";

    if (error) {
        message.innerText = error.message;
        message.className = "error-msg";
    } else {
        message.className = "success-msg";
        message.innerText = "Account created! Check your email if confirmation is enabled.";
    }
}

// --- 🔑 دالة استعادة كلمة المرور المحدثة ---
window.forgotPassword = async function() {
    let emailInput = document.getElementById("email").value.trim();
    if (!emailInput) {
        message.innerText = "Please enter your ID or email address";
        message.className = "error-msg";
        return;
    }

    if (/^\d+$/.test(emailInput)) {
        emailInput = `${emailInput}@cyberpath.edu`;
    }

    loader.style.display = "block";
    const { error } = await supabase.auth.resetPasswordForEmail(emailInput, {
        redirectTo: window.location.origin + '/update-password.html', 
    });
    loader.style.display = "none";

    if (error) {
        message.innerText = error.message;
        message.className = "error-msg";
    } else {
        message.className = "success-msg";
        message.innerText = "Reset link sent to your email!";
    }
}
</script>

</body>
</html>
