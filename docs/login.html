<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CyberPath</title>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.login-box{
    background:#1e293b;
    padding:40px;
    border-radius:10px;
    width:320px;
    box-shadow:0 0 15px rgba(0,0,0,0.5);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:5px;
    box-sizing: border-box; /* لضمان عدم خروج الإدخال عن الصندوق */
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#38bdf8;
    border:none;
    color:black;
    font-weight:bold;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

.auth-links {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
}

.auth-links a {
    color: #94a3b8;
    text-decoration: none;
    display: block;
    margin-top: 10px;
}

.auth-links a:hover {
    color: #38bdf8;
}

#message{
    margin-top:15px;
    text-align:center;
    color:#f87171; /* للخطأ */
}

.success-msg {
    color: #4ade80 !important;
}

.loader{
    display:none;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>CyberPath Login</h2>
    
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    
    <button onclick="login()">Login</button>
    
    <div class="loader" id="loader">Processing...</div>
    <p id="message"></p>

    <div class="auth-links">
        <a href="javascript:void(0)" onclick="forgotPassword()">Forgot Password?</a>
        <a href="javascript:void(0)" onclick="createAccount()">Don't have an account? <b>Create One</b></a>
    </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
    "https://suvpaunulhqfoclepwoz.supabase.co",
    "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
)

// التحقق من الجلسة
const { data } = await supabase.auth.getSession()
if(data.session){
    window.location.href="dashboard.html"
}

const message = document.getElementById("message")
const loader = document.getElementById("loader")

// --- وظيفة تسجيل الدخول ---
window.login = async function(){
    const email = document.getElementById("email").value
    const password = document.getElementById("password").value
    
    message.innerText=""
    message.className = ""

    if(!email || !password){
        message.innerText="Please enter email and password"
        return
    }

    loader.style.display="block"
    const { error } = await supabase.auth.signInWithPassword({ email, password })
    loader.style.display="none"

    if(error){
        message.innerText=error.message
        return
    }
    window.location.href="dashboard.html"
}

// --- وظيفة إنشاء حساب ---
window.createAccount = async function(){
    const email = document.getElementById("email").value
    const password = document.getElementById("password").value

    message.innerText=""
    if(!email || !password) {
        message.innerText="Please enter email and password to register";
        return;
    }

    loader.style.display="block"
    const { error } = await supabase.auth.signUp({ email, password })
    loader.style.display="none"

    if(error){
        message.innerText=error.message
    } else {
        message.className = "success-msg"
        message.innerText="Account created! Please check your email."
    }
}

// --- وظيفة استعادة كلمة المرور ---
window.forgotPassword = async function(){
    const email = document.getElementById("email").value
    message.innerText=""

    if(!email) {
        message.innerText="Please enter your email address";
        return;
    }

    loader.style.display="block"
    const { error } = await supabase.auth.resetPasswordForEmail(email)
    loader.style.display="none"

    if(error){
        message.innerText=error.message
    } else {
        message.className = "success-msg"
        message.innerText="Reset link sent to your email!"
    }
}
</script>

</body>
</html>
