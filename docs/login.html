<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CyberPath</title>

    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h2 { text-align: center; margin-bottom: 25px; color: #38bdf8; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #38bdf8;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #0ea5e9; transform: translateY(-2px); }

        .auth-links { margin-top: 20px; text-align: center; font-size: 14px; }
        .auth-links a { color: #94a3b8; text-decoration: none; display: block; margin-top: 10px; }
        .auth-links a:hover { color: #38bdf8; }

        #message { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
        .error-msg { color: #f87171; }
        .success-msg { color: #4ade80; }

        .loader { display: none; text-align: center; margin-top: 10px; color: #38bdf8; font-size: 14px; }
    </style>
</head>

<body>

<div class="login-box">
    <h2>CyberPath Login</h2>
    
    <input id="email" type="email" placeholder="Email Address">
    <input id="password" type="password" placeholder="Password">
    
    <button onclick="login()">Sign In</button>
    
    <div class="loader" id="loader">🔄 Authenticating...</div>
    <p id="message"></p>

    <div class="auth-links">
        <a href="javascript:void(0)" onclick="forgotPassword()">Forgot Password?</a>
        <a href="javascript:void(0)" onclick="createAccount()">Don't have an account? <b>Create One</b></a>
    </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase = createClient(
    "https://suvpaunulhqfoclepwoz.supabase.co",
    "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
)

const message = document.getElementById("message")
const loader = document.getElementById("loader")

// دالة التوجيه الذكي حسب الدور
async function redirectUserByRole(user) {
    const { data: profile, error } = await supabase
        .from("user_profile")
        .select("role")
        .eq("user_id", user.id)
        .single();

    if (error || !profile) {
        // في حال لم يوجد بروفايل، نفترض أنه متدرب جديد
        window.location.href = "./app/dashboard.html";
        return;
    }

    // التحقق من المسارات المطلوبة
    if (profile.role === "admin") {
        window.location.href = "../../admin.html";
    } else if (profile.role === "instructor") {
        window.location.href = "./app/instdashboard.html"; 
    } else {
        window.location.href = "./app/stddashboard.html";
    }
}

// --- وظيفة تسجيل الدخول ---
window.login = async function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    
    message.innerText = "";
    message.className = "";

    if (!email || !password) {
        message.innerText = "Please enter both email and password";
        message.className = "error-msg";
        return;
    }

    loader.style.display = "block";
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
        loader.style.display = "none";
        message.innerText = error.message;
        message.className = "error-msg";
        return;
    }

    // استدعاء دالة التوجيه
    await redirectUserByRole(data.user);
}

// --- وظيفة إنشاء حساب ---
window.createAccount = async function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    message.innerText = "";
    if (!email || !password) {
        message.innerText = "Email and password are required for registration";
        message.className = "error-msg";
        return;
    }

    loader.style.display = "block";
    const { error } = await supabase.auth.signUp({ email, password });
    loader.style.display = "none";

    if (error) {
        message.innerText = error.message;
        message.className = "error-msg";
    } else {
        message.className = "success-msg";
        message.innerText = "Registration successful! Please check your email.";
    }
}

// --- استعادة كلمة المرور ---
window.forgotPassword = async function() {
    const email = document.getElementById("email").value;
    if (!email) {
        message.innerText = "Please enter your email address";
        message.className = "error-msg";
        return;
    }

    loader.style.display = "block";
    const { error } = await supabase.auth.resetPasswordForEmail(email);
    loader.style.display = "none";

    if (error) {
        message.innerText = error.message;
        message.className = "error-msg";
    } else {
        message.className = "success-msg";
        message.innerText = "Reset link sent to your email!";
    }
}
</script>

</body>
</html>
