<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CyberPath</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 5px rgba(56, 189, 248, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #38bdf8;
            border: none;
            color: #0f172a;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
            transform: translateY(-1px);
        }

        .links-container {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .links-container a {
            color: #94a3b8;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .links-container a:hover {
            color: #38bdf8;
        }

        .divider {
            height: 1px;
            background: #334155;
            margin: 15px 0;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            min-height: 20px;
        }

        .error { color: #f87171; }
        .success { color: #4ade80; }

        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>CyberPath Login</h2>

    <div class="input-group">
        <input id="email" type="email" placeholder="Email Address">
    </div>

    <div class="input-group">
        <input id="password" type="password" placeholder="Password">
    </div>

    <button onclick="login()">Login</button>
    
    <div class="loader" id="loader">Processing...</div>
    <p id="message"></p>

    <div class="divider"></div>

    <div class="links-container">
        <a href="#" onclick="forgotPassword()">Forgot Password?</a>
        <a href="#" onclick="createAccount()">Don't have an account? <b>Create One</b></a>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    )

    // التحقق من الجلسة الحالية
    const checkSession = async () => {
        const { data } = await supabase.auth.getSession()
        if(data.session) window.location.href="dashboard.html"
    }
    checkSession();

    // وظيفة تسجيل الدخول
    window.login = async function() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");
        const loader = document.getElementById("loader");

        if(!email || !password) {
            message.className = "error";
            message.innerText = "Please fill in all fields";
            return;
        }

        loader.style.display = "block";
        message.innerText = "";

        const { error } = await supabase.auth.signInWithPassword({ email, password });

        loader.style.display = "none";

        if(error) {
            message.className = "error";
            message.innerText = error.message;
        } else {
            window.location.href = "dashboard.html";
        }
    }

    // وظيفة إنشاء حساب جديد
    window.createAccount = async function() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        if(!email || !password) {
            message.className = "error";
            message.innerText = "Enter email and password for your new account";
            return;
        }

        const { data, error } = await supabase.auth.signUp({ email, password });

        if(error) {
            message.className = "error";
            message.innerText = error.message;
        } else {
            message.className = "success";
            message.innerText = "Registration successful! Check your email for verification.";
        }
    }

    // وظيفة استعادة كلمة المرور
    window.forgotPassword = async function() {
        const email = document.getElementById("email").value;
        const message = document.getElementById("message");

        if(!email) {
            message.className = "error";
            message.innerText = "Please enter your email address first";
            return;
        }

        const { error } = await supabase.auth.resetPasswordForEmail(email);

        if(error) {
            message.className = "error";
            message.innerText = error.message;
        } else {
            message.className = "success";
            message.innerText = "Password reset link sent to your email!";
        }
    }
</script>

</body>
</html>
