<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الرؤية</title>
    <style>
        /* أنماط قسرية لتوضيح العناصر */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000 !important;
            color: #fff !important;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            padding: 20px;
        }
        header, nav, section, div, footer, a, button, h1, h2, h3, p, i {
            border: 2px solid red !important;  /* حدود حمراء لرؤية كل عنصر */
            margin: 10px !important;
            padding: 10px !important;
            background-color: #111 !important;  /* خلفية رمادية غامقة لتمييز الكتل */
            color: #fff !important;
        }
        a, button {
            color: #0ff !important;  /* روابط بلون سماوي */
        }
        .service-card, .stat-item, .why-card {
            background: #222 !important;
            border-color: cyan !important;
        }
        /* إزالة أي تأثيرات تخفي العناصر */
        [style*="display: none"], [style*="visibility: hidden"] {
            display: block !important;
            visibility: visible !important;
        }
    </style>
</head>
<body>
    <header>هيدر التجربة</header>
    <nav>قائمة التجربة</nav>
    <main>
        <section class="hero">
            <h1>عنوان تجريبي</h1>
            <p>نص تجريبي للتأكد من ظهور العناصر.</p>
            <button>زر تجريبي</button>
        </section>
        <div class="services-grid">
            <div class="service-card">بطاقة خدمة 1</div>
            <div class="service-card">بطاقة خدمة 2</div>
        </div>
    </main>
    <footer>تذييل التجربة</footer>
</body>
</html>
