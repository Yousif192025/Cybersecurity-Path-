<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الاختبارات العامة - الأمن السيبراني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 15px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
        }
        .stat i { color: #1a73e8; font-size: 20px; }
        .timer { font-weight: bold; font-size: 24px; color: #dc3545; }
        .exam-area { padding: 30px; }
        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option:hover { border-color: #1a73e8; background: #f0f7ff; }
        .option input { width: 20px; height: 20px; cursor: pointer; }
        .option label { flex: 1; cursor: pointer; font-size: 16px; }
        .option.selected { border-color: #1a73e8; background: #e8f0fe; }
        .correct-answer { border-color: #28a745; background: #e6f4ea; }
        .wrong-answer { border-color: #dc3545; background: #fce8e6; }
        .explanation {
            margin-top: 15px;
            padding: 12px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 14px;
            color: #856404;
            display: none;
        }
        .explanation.show { display: block; }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', sans-serif;
        }
        .btn-primary {
            background: #1a73e8;
            color: white;
        }
        .btn-primary:hover { background: #0d47a1; transform: translateY(-2px); }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: #28a745; color: white; }
        .results {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #e8f0fe, #d4e4fc);
            border-radius: 15px;
            margin-top: 20px;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .score-number { font-size: 48px; font-weight: bold; color: #1a73e8; }
        .mistakes-list {
            text-align: right;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .mistake-item {
            background: white;
            border-right: 4px solid #dc3545;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        .subject-select {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .subject-btn {
            padding: 8px 16px;
            background: #e9ecef;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .subject-btn.active {
            background: #1a73e8;
            color: white;
        }
        @media (max-width: 600px) {
            .stats-bar { flex-direction: column; }
            .nav-buttons { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> اختبارات الأمن السيبراني</h1>
            <p>اختبر معلوماتك في مختلف مجالات الأمن السيبراني</p>
        </div>

        <div class="stats-bar">
            <div class="stat"><i class="fas fa-layer-group"></i> <span id="subject-name">اختر المادة</span></div>
            <div class="stat"><i class="fas fa-question-circle"></i> السؤال <span id="current-q">0</span> / <span id="total-q">0</span></div>
            <div class="stat"><i class="fas fa-check-circle"></i> الإجابات: <span id="answered-count">0</span></div>
            <div class="timer" id="timer">01:00:00</div>
        </div>

        <div class="exam-area">
            <div class="subject-select" id="subject-select">
                <!-- سيتم تعبئتها ديناميكياً -->
            </div>

            <div id="question-container"></div>

            <div class="nav-buttons">
                <button class="btn-secondary" onclick="previousQuestion()"><i class="fas fa-arrow-right"></i> السابق</button>
                <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">التالي <i class="fas fa-arrow-left"></i></button>
                <button class="btn-success" id="submitBtn" style="display:none;" onclick="submitExam()"><i class="fas fa-check"></i> إنهاء الاختبار</button>
            </div>
        </div>
    </div>

    <script>
        // ======================== البيانات المستخرجة من ملفك ========================
        const QUESTIONS_DB = {
            "NetworkDefense": {
                name: "🛡️ الدفاع عن الشبكات",
                level: 3,
                questions: [
                    {
                        text: "IP addresses that start with ______ are used for testing purposes",
                        options: ["127", "10", "168", "192"],
                        correct: 0,
                        explanation: "127.x.x.x addresses are reserved for loopback testing."
                    },
                    {
                        text: "How many layers are there in the OSI networking model?",
                        options: ["4", "5", "6", "7"],
                        correct: 3,
                        explanation: "The OSI model consists of 7 layers."
                    },
                    {
                        text: "Network Address Translation (NAT) is when?",
                        options: [
                            "A router encrypts all traffic entering the network",
                            "A router removes all unwanted data",
                            "A router replaces public IP with private IP",
                            "A router replaces private IP with public IP"
                        ],
                        correct: 3,
                        explanation: "NAT translates private IPs to public ones so they can access the internet."
                    }
                ]
            },
            "EthicalHacking": {
                name: "🔓 الاختراق الأخلاقي",
                level: 3,
                questions: [
                    {
                        text: "Linux files have permissions to",
                        options: ["Read", "Write", "Execute", "All of the above"],
                        correct: 3,
                        explanation: "Linux files can have read, write, and execute permissions."
                    },
                    {
                        text: "Khaled is a pen tester, the company informed him about IP addresses and OS info. What approach is this?",
                        options: ["Grey Box", "Black Box", "White Box", "None"],
                        correct: 2,
                        explanation: "White box testing provides full knowledge of the target environment."
                    }
                ]
            },
            "Cryptography": {
                name: "🔐 أساسيات التشفير",
                level: 2,
                questions: [
                    {
                        text: "What is the primary objective of computer security according to NIST?",
                        options: [
                            "Prevent all cyber attacks",
                            "Preserve integrity, availability, and confidentiality",
                            "Ensure physical security",
                            "Eliminate data storage"
                        ],
                        correct: 1,
                        explanation: "The CIA triad is the foundation of information security."
                    }
                ]
            },
            "CyberThreats": {
                name: "⚠️ التهديدات السيبرانية",
                level: 4,
                questions: [
                    {
                        text: "Interception is an attack on:",
                        options: ["Integrity", "Confidentiality", "Availability", "Authenticity"],
                        correct: 1,
                        explanation: "Interception attacks target confidentiality by unauthorized access to data."
                    }
                ]
            },
            "DigitalForensics": {
                name: "🔍 التحقيق الجنائي الرقمي",
                level: 4,
                questions: [
                    {
                        text: "What is the main function of write-blockers in digital forensics?",
                        options: [
                            "Boost forensic tools efficiency",
                            "Stop unauthorized network access",
                            "Preserve original data by preventing modifications",
                            "Obstruct malware operations"
                        ],
                        correct: 2,
                        explanation: "Write-blockers prevent modifications to storage devices during analysis."
                    }
                ]
            }
        };

        // ======================== إعدادات الاختبار ========================
        let currentSubject = null;
        let questions = [];
        let userAnswers = [];
        let currentIndex = 0;
        let timer;
        let timeSeconds = 3600; // ساعة واحدة
        let learningMode = false;

        // عرض قائمة المواد
        function displaySubjects() {
            const container = document.getElementById('subject-select');
            container.innerHTML = '';
            for (const [key, subject] of Object.entries(QUESTIONS_DB)) {
                const btn = document.createElement('button');
                btn.className = 'subject-btn';
                btn.innerHTML = subject.name;
                btn.onclick = () => selectSubject(key);
                container.appendChild(btn);
            }
        }

        // اختيار المادة
        function selectSubject(subjectKey) {
            currentSubject = subjectKey;
            questions = [...QUESTIONS_DB[subjectKey].questions];
            userAnswers = new Array(questions.length).fill(null);
            currentIndex = 0;
            
            document.getElementById('subject-name').innerHTML = QUESTIONS_DB[subjectKey].name;
            document.getElementById('total-q').textContent = questions.length;
            
            // إظهار/إخفاء أزرار الملاحة
            document.querySelectorAll('.subject-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            startTimer();
            renderQuestion();
        }

        // عرض السؤال الحالي
        function renderQuestion() {
            const q = questions[currentIndex];
            const container = document.getElementById('question-container');
            const savedAnswer = userAnswers[currentIndex];
            
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-text">
                        <strong>السؤال ${currentIndex + 1}:</strong> ${q.text}
                    </div>
                    <div class="options" id="options-list">
                        ${q.options.map((opt, idx) => `
                            <div class="option ${savedAnswer === idx ? 'selected' : ''}" data-value="${idx}" onclick="selectAnswer(${idx})">
                                <input type="radio" name="answer" value="${idx}" ${savedAnswer === idx ? 'checked' : ''}>
                                <label>${String.fromCharCode(65+idx)}. ${opt}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div id="explanation-${currentIndex}" class="explanation"></div>
                </div>
            `;
            
            document.getElementById('current-q').textContent = currentIndex + 1;
            document.getElementById('answered-count').textContent = userAnswers.filter(a => a !== null).length;
            
            // تحديث الأزرار
            document.getElementById('nextBtn').style.display = currentIndex === questions.length - 1 ? 'none' : 'inline-block';
            document.getElementById('submitBtn').style.display = currentIndex === questions.length - 1 ? 'inline-block' : 'none';
        }

        // اختيار إجابة
        function selectAnswer(value) {
            userAnswers[currentIndex] = parseInt(value);
            
            // تحديث واجهة الخيارات
            document.querySelectorAll('.option').forEach((opt, idx) => {
                opt.classList.toggle('selected', idx === value);
            });
            
            document.getElementById('answered-count').textContent = userAnswers.filter(a => a !== null).length;
            
            // في الوضع التعليمي، عرض التصحيح فوراً
            if (learningMode) {
                showCorrection(currentIndex);
            }
        }

        // عرض التصحيح
        function showCorrection(index) {
            const q = questions[index];
            const isCorrect = userAnswers[index] === q.correct;
            const explanationDiv = document.getElementById(`explanation-${index}`);
            
            if (explanationDiv) {
                explanationDiv.innerHTML = `
                    <i class="fas ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                    <strong>${isCorrect ? '✅ إجابة صحيحة!' : '❌ إجابة خاطئة!'}</strong>
                    <br>الإجابة الصحيحة: ${q.options[q.correct]}
                    <br><strong>التوضيح:</strong> ${q.explanation}
                `;
                explanationDiv.classList.add('show');
                
                // تمييز الإجابة الصحيحة/الخاطئة بالألوان
                const options = document.querySelectorAll('.option');
                options[q.correct].classList.add('correct-answer');
                if (!isCorrect && userAnswers[index] !== null) {
                    options[userAnswers[index]].classList.add('wrong-answer');
                }
            }
        }

        // السؤال التالي
        function nextQuestion() {
            if (userAnswers[currentIndex] === null) {
                alert('الرجاء اختيار إجابة قبل المتابعة');
                return;
            }
            
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        // السؤال السابق
        function previousQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // إنهاء الاختبار وعرض النتيجة
        function submitExam() {
            clearInterval(timer);
            
            let score = 0;
            const mistakes = [];
            
            for (let i = 0; i < questions.length; i++) {
                if (userAnswers[i] === questions[i].correct) {
                    score++;
                } else {
                    mistakes.push({
                        question: questions[i].text,
                        userAnswer: userAnswers[i] !== null ? questions[i].options[userAnswers[i]] : 'لم يتم الإجابة',
                        correctAnswer: questions[i].options[questions[i].correct],
                        explanation: questions[i].explanation
                    });
                }
            }
            
            const percentage = (score / questions.length) * 100;
            const resultHTML = `
                <div class="results">
                    <div class="score-circle">
                        <div class="score-number">${Math.round(percentage)}%</div>
                    </div>
                    <h2>النتيجة النهائية</h2>
                    <p>أجبت بشكل صحيح على <strong>${score}</strong> من <strong>${questions.length}</strong> أسئلة</p>
                    <div class="${percentage >= 70 ? 'pass' : 'fail'}">
                        ${percentage >= 70 ? '🎉 تهانينا! لقد اجتزت الاختبار 🎉' : '📚 تحتاج إلى مراجعة المواد ثم إعادة المحاولة'}
                    </div>
                    ${mistakes.length > 0 ? `
                        <div class="mistakes-list">
                            <h3><i class="fas fa-exclamation-triangle"></i> الأخطاء:</h3>
                            ${mistakes.map(m => `
                                <div class="mistake-item">
                                    <strong>${m.question}</strong><br>
                                    <span style="color:#dc3545">✗ إجابتك: ${m.userAnswer}</span><br>
                                    <span style="color:#28a745">✓ الإجابة الصحيحة: ${m.correctAnswer}</span><br>
                                    <small>📖 ${m.explanation}</small>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div class="perfect">🏆 ممتاز! لا توجد أخطاء 🏆</div>'}
                    <button class="btn-primary" onclick="location.reload()" style="margin-top:20px;">
                        <i class="fas fa-redo-alt"></i> اختبار جديد
                    </button>
                </div>
            `;
            
            document.getElementById('question-container').innerHTML = resultHTML;
            document.querySelector('.nav-buttons').style.display = 'none';
        }

        // المؤقت
        function startTimer() {
            if (timer) clearInterval(timer);
            timeSeconds = 3600;
            
            timer = setInterval(() => {
                if (timeSeconds <= 0) {
                    clearInterval(timer);
                    alert('انتهى الوقت!');
                    submitExam();
                } else {
                    timeSeconds--;
                    const hours = Math.floor(timeSeconds / 3600);
                    const minutes = Math.floor((timeSeconds % 3600) / 60);
                    const seconds = timeSeconds % 60;
                    document.getElementById('timer').textContent = 
                        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }
            }, 1000);
        }

        // التهيئة
        function init() {
            displaySubjects();
        }
        
        init();
    </script>
</body>
</html>
