<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | منصة مسار الأمن السيبراني</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(56, 189, 248, 0.2);
            transition: transform 0.3s ease;
        }

        .signup-container:hover {
            transform: translateY(-5px);
        }

        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            color: #f1f5f9;
            font-size: 16px;
            transition: all 0.2s ease;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            border: none;
            border-radius: 14px;
            color: #0f172a;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: inherit;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #38bdf8;
            font-size: 14px;
            font-weight: 500;
        }

        .loader::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #38bdf8;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
        }

        .success-msg {
            color: #4ade80 !important;
            background: rgba(74, 222, 128, 0.1) !important;
            border: 1px solid #4ade8033;
        }

        .error-msg {
            color: #f87171 !important;
            background: rgba(248, 113, 113, 0.1) !important;
            border: 1px solid #f8717133;
        }

        .auth-links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }

        .auth-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-links a:hover {
            color: #38bdf8;
        }

        .info-note {
            margin-top: 20px;
            font-size: 12px;
            text-align: center;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 16px;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h2>🏫 إنشاء حساب جديد</h2>
    
    <div class="input-group">
        <label>📧 البريد الإلكتروني (جامعي أو شخصي)</label>
        <input type="email" id="email" placeholder="example@university.edu.sa" dir="ltr">
    </div>
    
    <div class="input-group">
        <label>🔒 كلمة المرور (6 أحرف على الأقل)</label>
        <input type="password" id="password" placeholder="********" dir="ltr">
    </div>
    
    <div class="input-group">
        <label>🆔 رقم الهوية الوطنية (10 أرقام)</label>
        <input type="text" id="nationalId" placeholder="مثال: 1234567890" maxlength="10" dir="ltr">
    </div>
    
    <button id="signupBtn">إنشاء الحساب والربط</button>
    
    <div class="loader" id="loader">جاري معالجة البيانات والربط...</div>
    <p id="message"></p>

    <div class="auth-links">
        <a href="login.html">✅ لديك حساب بالفعل؟ <strong>تسجيل الدخول</strong></a>
    </div>
    <div class="info-note">
        ⚡ إذا كنت من طلاب المؤسسة (البيانات المرفوعة مسبقاً)، سيتم ربط حسابك تلقائياً ببياناتك الأكاديمية.
    </div>
</div>

<!-- jQuery لضمان توافق main.js إذا تم تحميله -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

    // تهيئة Supabase
    const supabase = createClient(
        "https://suvpaunulhqfoclepwoz.supabase.co",
        "sb_publishable_owtViRnQVEiBN3J3yQtpbw_cq-vwR7b"
    )
    window.supabaseClient = supabase; // للاستخدام العام

    // عناصر DOM
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const nationalIdInput = document.getElementById("nationalId");
    const signupBtn = document.getElementById("signupBtn");
    const loaderDiv = document.getElementById("loader");
    const messageP = document.getElementById("message");

    function showMessage(msg, type = "error") {
        messageP.innerText = msg;
        messageP.className = type === "success" ? "success-msg" : "error-msg";
    }

    window.signup = async function() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const nationalId = nationalIdInput.value.trim();

        // التحقق من صحة الحقول
        if (!email || !password || !nationalId) {
            showMessage("⚠️ يرجى تعبئة جميع الحقول: البريد الإلكتروني، كلمة المرور، ورقم الهوية.");
            return;
        }
        if (password.length < 6) {
            showMessage("🔐 كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
            return;
        }
        if (nationalId.length !== 10 || !/^\d+$/.test(nationalId)) {
            showMessage("🆔 رقم الهوية يجب أن يكون 10 أرقام صحيحة.");
            return;
        }

        signupBtn.disabled = true;
        loaderDiv.style.display = "block";
        messageP.innerText = "";
        messageP.className = "";

        try {
            // 1. إنشاء الحساب في Supabase Auth (البريد الإلكتروني فقط)
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + "/login.html"
                }
            });

            if (authError) throw new Error(authError.message);
            const newUserId = authData.user.id;

            // 2. البحث عن ملف شخصي مرفوع مسبقاً بنفس رقم الهوية (البيانات الأكاديمية الـ 397)
            const { data: existingProfile, error: fetchError } = await supabase
                .from('user_profile')
                .select('*')
                .eq('national_id', nationalId)
                .maybeSingle();

            if (fetchError && fetchError.code !== 'PGRST116') {
                console.warn("خطأ في البحث:", fetchError);
            }

            let welcomeName = "";

            if (existingProfile) {
                // ✅ حالة الربط: الطالب موجود في البيانات المرفوعة
                // نربط user_id بهذا السجل (لا نرسل email لأنه غير موجود في الجدول)
                const { error: updateError } = await supabase
                    .from('user_profile')
                    .update({ user_id: newUserId })
                    .eq('national_id', nationalId);

                if (updateError) {
                    console.error("فشل الربط:", updateError);
                    throw new Error("حدث خطأ أثناء ربط حسابك بالبيانات الأكاديمية. يرجى التواصل مع الدعم.");
                }

                welcomeName = existingProfile.full_name || existingProfile.name || "الطالب";
                showMessage(`🎉 مرحباً ${welcomeName}! تم التعرف عليك بنجاح وربط حسابك ببياناتك الأكاديمية.`, "success");
            } else {
                // ❌ حالة الضيف: إنشاء ملف شخصي جديد بدون عمود email
                const { error: insertError } = await supabase
                    .from('user_profile')
                    .insert([{
                        user_id: newUserId,
                        national_id: nationalId,
                        role: 'guest',
                        status: 'نشط',
                        full_name: 'مستخدم جديد',
                        track: 'general',
                        student_type: 'skill_dev'
                        // لا يوجد عمود email هنا - تم حذفه
                    }]);

                if (insertError) {
                    console.error("فشل إنشاء ملف الضيف:", insertError);
                    throw new Error("تم إنشاء الحساب ولكن حدث خطأ في إعداد ملفك الشخصي. يمكنك إكمال البيانات لاحقاً.");
                }

                showMessage("✅ تم إنشاء حسابك كضيف. يمكنك تسجيل الدخول وإكمال بياناتك الشخصية لاحقاً.", "success");
            }

            // تسجيل الخروج لتجنب البقاء مسجلاً دخولاً
            await supabase.auth.signOut();

            // التوجيه إلى صفحة تسجيل الدخول بعد 2.5 ثانية
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2500);

        } catch (err) {
            console.error("Signup Error:", err);
            showMessage(`❌ ${err.message || "حدث خطأ غير متوقع. يرجى المحاولة لاحقاً."}`, "error");
            signupBtn.disabled = false;
            loaderDiv.style.display = "none";
        }
    };

    signupBtn.addEventListener("click", (e) => {
        e.preventDefault();
        window.signup();
    });

    // دعم الضغط على Enter
    [emailInput, passwordInput, nationalIdInput].forEach(inp => {
        inp.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                window.signup();
            }
        });
    });

    // تحقق فوري من رقم الهوية (أرقام فقط وحد أقصى 10)
    nationalIdInput.addEventListener("input", function(e) {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0,10);
    });
</script>

<!-- يمكن إضافة main.js إذا كان موجوداً ولا يعتمد على jQuery بشكل إلزامي -->
</body>
</html>
