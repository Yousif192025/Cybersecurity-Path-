<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتهى وقت الاختبار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .closed-wrapper {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 8px solid #1a6ea8;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #0a2f44;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #557085;
            font-size: 18px;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #1a6ea8;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #0e4b73;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="closed-wrapper">
    <div class="icon">⚠️</div>
    <h1>انتهى الوقت المخصص للاختبار القصير الأول</h1>
    <p>نأمل المتابعة والتقييم في الاختبارات القصيرة اللاحقة.</p>
    
    <a href="https://cyberpath.vercel.app/" class="back-btn">العودة للرئيسية</a>
</div>

</body>
</html>
