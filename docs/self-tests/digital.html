<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
            direction: rtl;
            text-align: right;
            padding-top: 50px;
        }
        .container {
            max-width: 800px;
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #1a73e8;
            font-weight: 700;
        }
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        .quiz-container, .start-quiz-container, .quiz-results-container {
            display: none;
        }
        .start-quiz-container {
            display: block;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            background-color: #1a73e8;
            border-color: #1a73e8;
        }
        .btn-primary:hover {
            background-color: #165cb4;
            border-color: #165cb4;
        }
        .question-counter {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .question-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: right;
            padding: 15px 20px;
            margin-bottom: 15px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option-btn:hover {
            background-color: #e2e6ea;
        }
        .option-btn.selected {
            background-color: #d1e7dd;
            border-color: #198754;
            color: #198754;
            font-weight: bold;
        }
        .timer-container {
            font-size: 1.4em;
            font-weight: bold;
            color: #dc3545;
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid #dc3545;
            border-radius: 10px;
            padding: 10px;
        }
        .time-warning {
            color: #ffc107 !important;
            border-color: #ffc107 !important;
        }
        .result-info {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .result-info span {
            font-weight: bold;
            color: #1a73e8;
        }
        .progress {
            height: 30px;
            background-color: #e9ecef;
        }
        .progress-bar {
            background-color: #1a73e8;
            transition: width 0.5s ease;
        }
        .alert {
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
        .review-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .review-item.correct {
            border-color: #198754;
            background-color: #d1e7dd;
        }
        .review-item.incorrect {
            border-color: #dc3545;
            background-color: #f8d7da;
        }
        .review-question {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
        }
        .review-answer {
            padding: 8px 15px;
            margin-bottom: 5px;
            border-radius: 5px;
            position: relative;
        }
        .review-correct {
            background-color: #198754;
            color: #fff;
        }
        .review-incorrect {
            background-color: #dc3545;
            color: #fff;
        }
        .status-icon {
            margin-right: 8px;
        }
        .questions-review {
            display: none;
            margin-top: 30px;
        }
        .pdf-loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            text-align: center;
            padding-top: 20%;
            font-size: 1.5em;
            color: #1a73e8;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            .pdf-content, .pdf-content * {
                visibility: visible;
            }
            .pdf-content {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="mb-2">اختبار 🛡️</h1>
            <p>منصة مسار الأمن السيبراني</p>
        </div>

        <div class="start-quiz-container" id="start-quiz-container">
            <h3 class="mb-4 text-center">إعدادات الاختبار</h3>
            <form id="startQuizForm">
                <div class="mb-3">
                    <label for="student-name" class="form-label">الاسم الكامل</label>
                    <input type="text" class="form-control" id="student-name" required>
                </div>
                <div class="mb-3">
                    <label for="course-name" class="form-label">اسم المادة</label>
                    <input type="text" class="form-control" id="course-name" required>
                </div>
                <div class="mb-3">
                    <label for="num-questions" class="form-label">عدد الأسئلة</label>
                    <input type="number" class="form-control" id="num-questions" value="10" min="1" max="10" required>
                    <small class="form-text text-muted">اختر عدداً من 1 إلى 10.</small>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">بدء الاختبار</button>
                </div>
            </form>
        </div>
        
        <div class="quiz-container" id="quiz-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="question-counter" id="question-counter"></div>
                <div class="timer-container">
                    <i class="fas fa-clock"></i>
                    <span id="time-left">01:30</span>
                </div>
            </div>
            
            <h2 class="question-text" id="question-text"></h2>
            
            <div class="options-container" id="options-container">
                </div>

            <div class="d-grid gap-2 mt-4">
                <button class="btn btn-primary btn-lg" id="next-btn">التالي</button>
            </div>
        </div>

        <div class="quiz-results-container" id="quiz-results-container">
            <h2 class="text-center mb-4">نتائج الاختبار 🏆</h2>
            <div class="card p-4 mb-4">
                <h4 class="mb-3">معلومات الطالب:</h4>
                <p><strong>الاسم:</strong> <span id="result-student-name"></span></p>
                <p><strong>المادة:</strong> <span id="result-course-name"></span></p>
                <p><strong>تاريخ الاختبار:</strong> <span id="test-date"></span></p>
            </div>

            <div class="text-center mb-4">
                <div class="result-info">
                    لقد أجبت على <span id="score-display">0</span> من <span id="total-questions-display">0</span> سؤال بشكل صحيح.
                </div>
                <div class="progress mb-3">
                    <div class="progress-bar" role="progressbar" id="progress-bar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <div class="h3" id="percentage-display"></div>
                <div class="alert" id="result-message"></div>
            </div>
            
            <div class="d-grid gap-2 mb-4">
                <button class="btn btn-primary" id="view-results-btn">
                    <i class="fas fa-eye"></i> عرض المراجعة
                </button>
            </div>
            
            <div class="questions-review" id="questions-review">
                </div>
            
            <div class="d-flex justify-content-center gap-2 mt-4">
                <button class="btn btn-success" id="retake-quiz-btn"><i class="fas fa-redo"></i> إعادة الاختبار</button>
                <button class="btn btn-secondary" id="print-results-btn"><i class="fas fa-print"></i> طباعة النتائج (PDF)</button>
            </div>
        </div>
    </div>
    
    <div class="pdf-loading" id="pdf-loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p>جاري إنشاء ملف PDF، يرجى الانتظار...</p>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // قاعدة بيانات الأسئلة
            const allQuestions = [
                {
                    question: "ما هو الهدف الرئيسي من الأمن السيبراني؟",
                    options: ["حماية الأجهزة من التلف", "حماية الأنظمة والشبكات والبيانات من الهجمات الرقمية", "زيادة سرعة الإنترنت", "تشفير جميع الملفات"],
                    correctAnswer: 1
                },
                {
                    question: "ما هو هجوم 'التصيد الاحتيالي' (Phishing)?",
                    options: ["إرسال رسائل بريد إلكتروني للحصول على معلومات حساسة", "تثبيت برامج ضارة على جهاز الضحية", "إيقاف تشغيل خادم الويب", "الاستيلاء على حسابات وسائل التواصل الاجتماعي"],
                    correctAnswer: 0
                },
                {
                    question: "ما هو أفضل ممارسة لإنشاء كلمة مرور قوية؟",
                    options: ["استخدام تاريخ الميلاد", "استخدام كلمات شائعة مثل 'password123'", "استخدام مزيج من الأحرف الكبيرة والصغيرة والأرقام والرموز", "استخدام كلمة مرور قصيرة وسهلة التذكر"],
                    correctAnswer: 2
                },
                {
                    question: "ما هو 'جدار الحماية' (Firewall)?",
                    options: ["برنامج يمنع الفيروسات", "جهاز أو برنامج يراقب ويتحكم في حركة مرور الشبكة", "أداة لتسريع تحميل صفحات الويب", "قاعدة بيانات للمعلومات الحساسة"],
                    correctAnswer: 1
                },
                {
                    question: "ما هو 'البرنامج الضار' (Malware)?",
                    options: ["برنامج لتحرير الصور", "برنامج يهدف إلى إحداث ضرر أو الوصول غير المصرح به إلى نظام حاسوبي", "برنامج لتنظيم الملفات", "برنامج لمكافحة الفيروسات"],
                    correctAnswer: 1
                },
                {
                    question: "ما هو 'هجوم حجب الخدمة' (DoS)?",
                    options: ["هجوم يجعل نظامًا أو شبكة غير متاحة للمستخدمين الشرعيين", "هجوم لسرقة البيانات من قاعدة البيانات", "هجوم لتغيير محتوى موقع ويب", "هجوم للحصول على كلمات مرور المستخدمين"],
                    correctAnswer: 0
                },
                {
                    question: "ما هو 'التشفير' (Encryption)?",
                    options: ["تحويل البيانات إلى صيغة يمكن قراءتها بسهولة", "عملية لإخفاء الملفات على القرص الصلب", "تحويل البيانات إلى صيغة غير قابلة للقراءة إلا من خلال مفتاح فك التشفير", "برنامج لمكافحة الفيروسات"],
                    correctAnswer: 2
                },
                {
                    question: "ما هو 'الهندسة الاجتماعية' (Social Engineering)?",
                    options: ["تطوير برامج التواصل الاجتماعي", "التلاعب بالأفراد نفسياً لإفشاء معلومات سرية", "بناء شبكات حاسوبية معقدة", "تصميم واجهات مستخدم جذابة"],
                    correctAnswer: 1
                },
                {
                    question: "ما هو 'النسخ الاحتياطي' (Backup)?",
                    options: ["تثبيت نظام تشغيل جديد", "حفظ نسخة إضافية من البيانات لاستعادتها في حالة فقدان البيانات الأصلية", "حذف الملفات القديمة من القرص الصلب", "تحديث برامج الكمبيوتر"],
                    correctAnswer: 1
                },
                {
                    question: "ماذا تعني 'التحقق بخطوتين' (Two-Factor Authentication)?",
                    options: ["استخدام كلمتي مرور مختلفتين", "استخدام طريقتين مختلفتين للتحقق من هوية المستخدم", "تسجيل الدخول من جهازين في نفس الوقت", "تغيير كلمة المرور كل شهرين"],
                    correctAnswer: 1
                }
            ];

            // العناصر
            const startQuizForm = document.getElementById('startQuizForm');
            const startQuizContainer = document.getElementById('start-quiz-container');
            const quizContainer = document.getElementById('quiz-container');
            const quizResultsContainer = document.getElementById('quiz-results-container');
            const questionCounter = document.getElementById('question-counter');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const nextBtn = document.getElementById('next-btn');
            const timeLeftElement = document.getElementById('time-left');
            const scoreDisplay = document.getElementById('score-display');
            const totalQuestionsDisplay = document.getElementById('total-questions-display');
            const percentageDisplay = document.getElementById('percentage-display');
            const resultStudentName = document.getElementById('result-student-name');
            const resultCourseName = document.getElementById('result-course-name');
            const testDate = document.getElementById('test-date');
            const progressBar = document.getElementById('progress-bar');
            const resultMessage = document.getElementById('result-message');
            const retakeQuizBtn = document.getElementById('retake-quiz-btn');
            const printResultsBtn = document.getElementById('print-results-btn');
            const viewResultsBtn = document.getElementById('view-results-btn');
            const questionsReview = document.getElementById('questions-review');
            const pdfLoading = document.getElementById('pdf-loading');

            // المتغيرات
            let quizData = [];
            let currentQuestion = 0;
            let score = 0;
            let userAnswers = [];
            let timer;
            let timeLeft = 90; // 90 ثانية لكل سؤال
            let studentName = '';
            let courseName = '';
            let showReview = false;

            // بدء الاختبار عند تقديم النموذج
            startQuizForm.addEventListener('submit', function(e) {
                e.preventDefault();
                studentName = document.getElementById('student-name').value;
                courseName = document.getElementById('course-name').value;
                const numQuestions = parseInt(document.getElementById('num-questions').value, 10);
                
                if (numQuestions > allQuestions.length) {
                    alert(`الحد الأقصى للأسئلة هو ${allQuestions.length}.`);
                    return;
                }
                
                // اختيار الأسئلة بشكل عشوائي
                quizData = shuffle(allQuestions).slice(0, numQuestions);
                
                startQuizContainer.style.display = 'none';
                quizContainer.style.display = 'block';
                startQuiz();
            });

            // دالة لخلط المصفوفة
            function shuffle(array) {
                let currentIndex = array.length, randomIndex;
                while (currentIndex !== 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            }

            // بدء الاختبار
            function startQuiz() {
                userAnswers = new Array(quizData.length).fill(null);
                loadQuestion();
                startTimer();
            }

            // تحميل السؤال الحالي
            function loadQuestion() {
                clearOptions();
                
                const question = quizData[currentQuestion];
                questionCounter.textContent = `السؤال ${currentQuestion + 1} من ${quizData.length}`;
                questionText.textContent = question.question;
                
                question.options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.classList.add('option-btn');
                    optionElement.textContent = option;
                    
                    if (userAnswers[currentQuestion] === index) {
                        optionElement.classList.add('selected');
                    }
                    
                    optionElement.addEventListener('click', () => selectOption(index));
                    optionsContainer.appendChild(optionElement);
                });
                
                nextBtn.textContent = currentQuestion === quizData.length - 1 ? 'إنهاء الاختبار' : 'التالي';
            }

            // مسح الخيارات السابقة
            function clearOptions() {
                while (optionsContainer.firstChild) {
                    optionsContainer.removeChild(optionsContainer.firstChild);
                }
            }

            // اختيار إجابة
            function selectOption(optionIndex) {
                const options = document.querySelectorAll('.option-btn');
                options.forEach(option => option.classList.remove('selected'));
                options[optionIndex].classList.add('selected');
                userAnswers[currentQuestion] = optionIndex;
            }

            // الانتقال إلى السؤال التالي
            nextBtn.addEventListener('click', function() {
                if (userAnswers[currentQuestion] === null) {
                    alert('يرجى اختيار إجابة قبل المتابعة');
                    return;
                }
                
                if (userAnswers[currentQuestion] === quizData[currentQuestion].correctAnswer) {
                    score++;
                }
                
                if (currentQuestion < quizData.length - 1) {
                    currentQuestion++;
                    loadQuestion();
                    clearInterval(timer);
                    startTimer();
                } else {
                    finishQuiz();
                }
            });

            // بدء المؤقت
            function startTimer() {
                clearInterval(timer);
                timeLeft = 90;
                updateTimerDisplay();
                
                timer = setInterval(function() {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        if (currentQuestion < quizData.length - 1) {
                            currentQuestion++;
                            loadQuestion();
                            startTimer();
                        } else {
                            finishQuiz();
                        }
                    }
                }, 1000);
            }

            // تحديث عرض المؤقت
            function updateTimerDisplay() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timeLeftElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 10) {
                    timeLeftElement.classList.add('time-warning');
                } else {
                    timeLeftElement.classList.remove('time-warning');
                }
            }

            // إنهاء الاختبار وعرض النتائج
            function finishQuiz() {
                clearInterval(timer);
                quizContainer.style.display = 'none';
                quizResultsContainer.style.display = 'block';
                
                const percentage = Math.round((score / quizData.length) * 100);
                
                scoreDisplay.textContent = score;
                totalQuestionsDisplay.textContent = quizData.length;
                percentageDisplay.textContent = `نسبة النجاح: ${percentage}%`;
                resultStudentName.textContent = studentName;
                resultCourseName.textContent = courseName;
                testDate.textContent = new Date().toLocaleDateString('ar-SA');
                
                progressBar.style.width = `${percentage}%`;
                
                if (percentage >= 80) {
                    resultMessage.textContent = 'ممتاز! لديك معرفة قوية في هذه المادة. 👏';
                    resultMessage.className = 'alert alert-success';
                } else if (percentage >= 60) {
                    resultMessage.textContent = 'جيد! لكن تحتاج إلى تحسين معرفتك في بعض المجالات. 👍';
                    resultMessage.className = 'alert alert-info';
                } else if (percentage >= 40) {
                    resultMessage.textContent = 'مقبول! ننصحك بمراجعة المواد الأساسية. 🤔';
                    resultMessage.className = 'alert alert-warning';
                } else {
                    resultMessage.textContent = 'ضعيف! تحتاج إلى دراسة المادة بشكل أعمق. 😔';
                    resultMessage.className = 'alert alert-danger';
                }
                
                showQuestionsReview();
            }

            // عرض مراجعة الأسئلة
            function showQuestionsReview() {
                questionsReview.innerHTML = '';
                
                quizData.forEach((question, index) => {
                    const userAnswer = userAnswers[index];
                    const isCorrect = userAnswer === question.correctAnswer;
                    
                    const reviewItem = document.createElement('div');
                    reviewItem.classList.add('review-item');
                    if (isCorrect) {
                        reviewItem.classList.add('correct');
                    } else {
                        reviewItem.classList.add('incorrect');
                    }
                    
                    let reviewHTML = `
                        <div class="review-question">${index + 1}. ${question.question}</div>
                    `;
                    
                    question.options.forEach((option, optIndex) => {
                        let optionClass = '';
                        let icon = '';
                        if (optIndex === question.correctAnswer) {
                            optionClass = 'review-correct';
                            icon = '<i class="fas fa-check-circle status-icon"></i>';
                        }
                        if (optIndex === userAnswer && !isCorrect) {
                            optionClass = 'review-incorrect';
                            icon = '<i class="fas fa-times-circle status-icon"></i>';
                        }
                        
                        reviewHTML += `
                            <div class="review-answer ${optionClass}">
                                ${icon}
                                ${option}
                            </div>
                        `;
                    });
                    
                    reviewItem.innerHTML = reviewHTML;
                    questionsReview.appendChild(reviewItem);
                });
            }

            // إعادة الاختبار
            retakeQuizBtn.addEventListener('click', function() {
                currentQuestion = 0;
                score = 0;
                userAnswers = [];
                quizData = [];
                quizResultsContainer.style.display = 'none';
                startQuizContainer.style.display = 'block';
                questionsReview.style.display = 'none';
                showReview = false;
                viewResultsBtn.innerHTML = '<i class="fas fa-eye"></i> عرض المراجعة';
            });

            // تبديل عرض/إخفاء مراجعة الأسئلة
            viewResultsBtn.addEventListener('click', function() {
                showReview = !showReview;
                questionsReview.style.display = showReview ? 'block' : 'none';
                viewResultsBtn.innerHTML = showReview ? 
                    '<i class="fas fa-eye-slash"></i> إخفاء المراجعة' : 
                    '<i class="fas fa-eye"></i> عرض المراجعة';
            });

            // طباعة النتائج كPDF - الطريقة المبسطة والموثوقة
            printResultsBtn.addEventListener('click', function() {
                pdfLoading.style.display = 'block';
                
                setTimeout(function() {
                    generatePDF();
                }, 500);
            });

            // دمج مكتبات html2canvas و jspdf
            function generatePDF() {
                try {
                    const tempDiv = document.createElement('div');
                    tempDiv.classList.add('pdf-content');
                    tempDiv.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        background: white;
                        color: #333;
                        font-family: 'Tajawal', sans-serif;
                        direction: rtl;
                        text-align: right;
                        font-size: 16px;
                        line-height: 1.8;
                        z-index: 10000;
                        overflow: auto;
                        padding: 20px;
                        box-sizing: border-box;
                    `;
                    
                    tempDiv.innerHTML = generatePDFContent();
                    document.body.appendChild(tempDiv);
                    
                    html2canvas(tempDiv, {
                        scale: 2,
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff'
                    }).then(canvas => {
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('p', 'mm', 'a4');
                        
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = pdf.internal.pageSize.getHeight();
                        
                        const imgData = canvas.toDataURL('image/png', 1.0);
                        const imgWidth = canvas.width;
                        const imgHeight = canvas.height;
                        const ratio = imgHeight / imgWidth;
                        let pdfImageHeight = pdfWidth * ratio;
                        
                        let yPosition = 0;
                        
                        while (yPosition < pdfImageHeight) {
                            pdf.addImage(imgData, 'PNG', 0, -yPosition, pdfWidth, pdfImageHeight);
                            yPosition += pdfHeight;
                            if (yPosition < pdfImageHeight) {
                                pdf.addPage();
                            }
                        }
                        
                        const fileName = `نتيجة_اختبار_${courseName}_${studentName}.pdf`;
                        pdf.save(fileName);
                        
                        document.body.removeChild(tempDiv);
                        pdfLoading.style.display = 'none';
                        
                    }).catch(error => {
                        console.error('Error with html2canvas:', error);
                        document.body.removeChild(tempDiv);
                        pdfLoading.style.display = 'none';
                        fallbackPDFGeneration();
                    });
                    
                } catch (error) {
                    console.error('Error in PDF generation:', error);
                    pdfLoading.style.display = 'none';
                    alert('حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.');
                }
            }

            function fallbackPDFGeneration() {
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const margin = 20;
                    let yPosition = margin;
                    
                    pdf.setFontSize(16);
                    pdf.text(`نتيجة اختبار: ${courseName}`, pageWidth / 2, yPosition, { align: 'center' });
                    yPosition += 20;
                    
                    pdf.setFontSize(12);
                    pdf.text(`الاسم: ${studentName}`, margin, yPosition);
                    yPosition += 10;
                    pdf.text(`تاريخ الاختبار: ${new Date().toLocaleDateString('ar-SA')}`, margin, yPosition);
                    yPosition += 20;
                    
                    const percentage = Math.round((score / quizData.length) * 100);
                    pdf.text(`النتيجة: ${score} من ${quizData.length} (${percentage}%)`, margin, yPosition);
                    yPosition += 20;
                    
                    pdf.text('لتفاصيل كاملة يرجى مراجعة المنصة', margin, yPosition);
                    
                    pdf.save(`نتيجة_${studentName}.pdf`);
                    pdfLoading.style.display = 'none';
                    
                } catch (error) {
                    console.error('Error in fallback PDF:', error);
                    pdfLoading.style.display = 'none';
                    alert('تعذر إنشاء ملف PDF. يرجى استخدام خاصية الطباعة في المتصفح.');
                }
            }

            function generatePDFContent() {
                const percentage = Math.round((score / quizData.length) * 100);
                const testDateFormatted = new Date().toLocaleDateString('ar-SA', {
                    year: 'numeric',
                    month: 'long', 
                    day: 'numeric'
                });
                
                let questionsHTML = '';
                
                quizData.forEach((question, index) => {
                    const userAnswer = userAnswers[index];
                    const isCorrect = userAnswer === question.correctAnswer;
                    const userAnswerText = userAnswer !== null ? question.options[userAnswer] : 'لم يتم الإجابة';
                    
                    questionsHTML += `
                        <div style="margin-bottom: 30px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 10px; page-break-inside: avoid;">
                            <h4 style="color: #1a73e8; margin-bottom: 15px;">السؤال ${index + 1}: ${question.question}</h4>
                            
                            <div style="background: ${isCorrect ? '#e8f5e9' : '#ffebee'}; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                                <strong>الإجابة المختارة:</strong> ${userAnswerText}
                            </div>
                            
                            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                                <strong>الإجابة الصحيحة:</strong> ${question.options[question.correctAnswer]}
                            </div>
                            
                            <div style="color: ${isCorrect ? '#4caf50' : '#f44336'}; font-weight: bold;">
                                ${isCorrect ? '✓ صحيحة' : '✗ خاطئة'}
                            </div>
                        </div>
                    `;
                });
                
                return `
                    <div style="text-align: center; margin-bottom: 40px; padding-bottom: 30px; border-bottom: 3px solid #1a73e8;">
                        <h1 style="color: #1a73e8; font-size: 32px; margin-bottom: 20px;">تقرير نتائج الاختبار</h1>
                        <h2 style="color: #333; font-size: 24px; margin-bottom: 10px;">مادة: ${courseName}</h2>
                        <p style="color: #666; font-size: 18px;">منصة مسار الأمن السيبراني</p>
                    </div>
                    
                    <div style="margin-bottom: 30px; padding: 25px; background: #f0f7ff; border-radius: 12px;">
                        <h3 style="color: #1a73e8; margin-bottom: 20px;">معلومات المتدرب</h3>
                        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px; font-size: 17px;">
                            <div style="font-weight: bold; color: #555;">
                                <div style="margin: 10px 0;">الاسم الكامل:</div>
                                <div style="margin: 10px 0;">تاريخ الاختبار:</div>
                            </div>
                            <div style="color: #333;">
                                <div style="margin: 10px 0;">${studentName}</div>
                                <div style="margin: 10px 0;">${testDateFormatted}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 40px; padding: 30px; background: linear-gradient(135deg, #fff3e0, #ffecb3); border-radius: 15px; text-align: center;">
                        <h3 style="color: #e65100; margin-bottom: 25px; font-size: 26px;">النتيجة النهائية</h3>
                        <div style="font-size: 72px; font-weight: bold; color: #1a73e8; margin: 20px 0;">${percentage}%</div>
                        <div style="font-size: 22px; color: #555; margin: 15px 0;">${score} إجابة صحيحة من ${quizData.length} سؤال</div>
                    </div>
                    
                    <div style="margin-top: 40px;">
                        <h3 style="color: #1a73e8; text-align: center; font-size: 28px; margin-bottom: 30px;">مراجعة الأسئلة</h3>
                        ${questionsHTML}
                    </div>
                    
                    <div style="margin-top: 50px; padding-top: 25px; border-top: 2px solid #ddd; text-align: center; color: #666;">
                        <p>تم إنشاء هذا التقرير تلقائياً من قبل منصة مسار الأمن السيبراني</p>
                        <p>© 2025 جميع الحقوق محفوظة</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
